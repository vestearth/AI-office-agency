office:
  name: AI Dev Office
  version: "2.0"
  # Multi-user git mode: per-user task namespace so concurrent intakes on
  # different machines never allocate the same id. Set this in your
  # gitignored office.config.local.yaml (NOT here), e.g.:
  #   office:
  #     task_prefix: EA   # -> intake allocates TASK-EA-001, TASK-EA-002, ...
  # Uppercase letters/digits, starts with a letter. PKG is reserved.
  # Env override: OFFICE_TASK_PREFIX. Empty = legacy shared TASK-NNN pool
  # (single-machine only — it races across machines).
  # task_prefix: ""

agents:
  - id: pm
    prompt: agents/pm.md
    description: Creates tasks, plans work, and assigns work to Dev or Dev-2
  - id: dev
    prompt: agents/dev.md
    description: Focused implementation for scoped work
  - id: dev-2
    prompt: agents/dev-2.md
    description: Senior implementation for complex or cross-cutting work
  - id: reviewer
    prompt: agents/reviewer.md
    description: Reviews code quality and verifies builds and tests
  - id: debugger
    prompt: agents/debugger.md
    description: Investigates failures and applies minimal scoped fixes
  - id: devops
    prompt: agents/devops.md
    description: Handles Docker, CI/CD, deployment, and infra concerns
  - id: free-roam
    prompt: agents/free-roam.md
    description: Handles ambiguity, escalation, and stuck workflows

default_workflow: workflows/hybrid-default.yaml

runner_selector:
  priority:
    - codex
    - cursor-agent
    - cursor
  config_dir: runners/
  auto_switch: true
  trigger_patterns:
    - insufficient_quota
    - quota exceeded
    - rate limit
    - unauthorized
    - invalid api key
    - token expired
  retry_before_switch: 2
  log_switch_reason: true

handoff_contract:
  required_fields:
    - summary
    - artifacts
    - next_action
    - blockers
  state_files:
    task: task.md
    status: status.yaml
    meta: meta.yaml

state_model:
  source_of_truth: status.yaml
  audit_log: meta.yaml
  phase_state_must_match: true
  phases:
    - pending
    - blocked
    - assigned
    - assigned_parallel
    - review
    - in_review
    - debugging
    - debugging_complete
    - devops_needed
    - devops_complete
    - escalated
    - free_roam_complete
    - validation_failed
    - done
    - aborted
  reviewer_queue_phase: in_review

dependency_policy:
  machine_readable_fields:
    blocked_on: status.yaml
    waiting_for: status.yaml
    ready: status.yaml
  blocked_dispatch_guard: true
  enforce_current_agent_route: true
  auto_reconcile_before_dispatch: true
  unblock_when_upstream_phase: done
  on_unblock:
    clear_waiting_for: true
    set_ready: true
    route_from_assignment_primary: true

dependency_guard:
  enabled: false
  script: scripts/check-service-dependencies.sh

context_provider:
  enabled: true
  provider: socraticode
  mode: optional
  policy: recorded
  fallback: repo_search
  project_paths:
    primary: "${SOCRATICODE_PRIMARY_PROJECT}"
    fallback: "${SOCRATICODE_FALLBACK_PROJECT}"
  roles:
    - pm
    - dev
    - dev-2
    - reviewer
    - debugger
    - free-roam

external_repos:
  ai_skills_path: "${AI_SKILLS_PATH}"
  knowledge_base_path: "${KNOWLEDGE_BASE_PATH}"

knowledge:
  mode: suggest_only
  capture_on:
    - task_done
    - reviewer_approved
    - incident_closed
    - architecture_decision

loop_guard:
  max_iterations: 8
  escalate_to: free-roam

# Policy preflight (docs/policy-preflight.md). A deterministic gate that resolves
# repository policy BEFORE externally-sourced work can trigger a privileged
# dispatch. Free-form external text is CONTEXT, never AUTHORITY: nothing written
# inside an issue, a comment, or a webhook body can raise its own trust, lower a
# sensitivity, grant an approval, or reach any key below. The gate is opt-in — it
# engages only when a caller declares an external source (env
# AI_DEV_OFFICE_INPUT_SOURCE), so an operator-created task is unaffected.
preflight:
  enabled: true
  # Trust attaches to the ORIGIN of an input, never to its content. Any source
  # not listed here — including one this file has never heard of — is untrusted.
  trusted_sources:
    - operator
    - local
  # Role -> the capability a dispatch of that role may exercise. The caller
  # declares the role; a role with no entry here has no known capability and is
  # denied. `auto` is deliberately absent: an external caller must name a
  # concrete role rather than hand the whole pipeline to unreviewed input.
  role_actions:
    pm: comment
    reviewer: read
    dev: mutate_repo
    dev-2: mutate_repo
    debugger: mutate_repo
    devops: deploy
    free-roam: mutate_repo
  default_sensitivity: normal
  # Untrusted work that declares no path scope has an unbounded blast radius, so
  # it is rated at the top of the scale instead of at the default.
  undeclared_scope_sensitivity: critical
  # Same trigger shape as reviewer.risk_rules (#12): glob patterns -> a level,
  # highest level among the matches wins, no match -> default_sensitivity. Kept
  # under its own key so the two rule sets stay separable until they are
  # reconciled onto one classifier (docs/policy-preflight.md, "Convergence").
  sensitivity_rules:
    - level: critical
      description: CI/CD execution surface
      paths:
        - ".github/workflows/**"
    - level: critical
      description: agent and system instructions
      paths:
        - "agents/**"
        - "workflows/**"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - ".claude/**"
        - ".cursor/**"
    - level: critical
      description: MCP and plugin configuration
      paths:
        - "**/.mcp.json"
        - "**/mcp*.json"
        - "**/plugins/**"
    - level: critical
      description: secret and credential handling
      paths:
        - "**/.env"
        - "**/.env.*"
        - "**/secrets/**"
        - "**/*.pem"
        - "**/*.key"
    - level: critical
      description: migrations and destructive database operations
      paths:
        - "**/migrations/**"
        - "**/migrate/**"
        - "**/*.sql"
    - level: critical
      description: auth, payment, and security-sensitive code
      paths:
        - "**/auth/**"
        - "**/authz/**"
        - "**/payment/**"
        - "**/payments/**"
        - "**/wallet/**"
        - "**/security/**"
    - level: sensitive
      description: Docker, build, and release configuration
      paths:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/docker-compose*.yml"
        - "**/docker-compose*.yaml"
        - "**/Makefile"
        - ".github/**"
        - "**/go.mod"
        - "**/go.sum"
        - "**/package.json"
        - "**/*.lock"
    - level: sensitive
      description: office policy and harness surface
      paths:
        - "office.config*.yaml"
        - "office.team.yaml"
        - "run-agent.sh"
        - "validate-yaml.rb"
        - "scripts/**"
        - "schemas/**"
    - level: sensitive
      description: public API contract
      paths:
        - "**/*.proto"
        - "**/openapi*.yaml"
        - "**/openapi*.json"
        - "**/swagger*.yaml"
        - "**/swagger*.json"
  # (input trust x sensitivity x action) -> outcome. This table IS the policy:
  # every cell is written down and reviewable rather than inferred at runtime.
  # A lookup that misses at any level — unknown trust, unknown action, unknown
  # sensitivity, or an absent cell — resolves to `deny`, never to allow.
  decision_matrix:
    untrusted:
      read:        {normal: allow,                   sensitive: allow,                   critical: allow}
      comment:     {normal: allow,                   sensitive: allow,                   critical: allow_with_deep_review}
      mutate_repo: {normal: allow_with_deep_review,  sensitive: require_human_approval,  critical: deny}
      execute:     {normal: require_human_approval,  sensitive: deny,                    critical: deny}
      deploy:      {normal: deny,                    sensitive: deny,                    critical: deny}
    trusted:
      read:        {normal: allow,                   sensitive: allow,                   critical: allow}
      comment:     {normal: allow,                   sensitive: allow,                   critical: allow}
      mutate_repo: {normal: allow,                   sensitive: allow_with_deep_review,  critical: require_human_approval}
      execute:     {normal: allow,                   sensitive: allow_with_deep_review,  critical: require_human_approval}
      deploy:      {normal: allow_with_deep_review,  sensitive: require_human_approval,  critical: require_human_approval}

# Multi-user git mode (docs/multi-user-git.md). When enabled, run-agent.sh
# pulls --rebase before intake/dispatch and commits+pushes runs/<TASK-ID>
# (plus office.team.yaml) after every agent step — replacing the manual sync
# ritual. Both hooks soft-fail offline. Flip per-machine in
# office.config.local.yaml or via env OFFICE_GIT_SYNC=1/0.
git_sync:
  enabled: false

# Multi-user git mode (docs/multi-user-git.md). When enabled, run-agent.sh
# pulls --rebase before intake/dispatch and commits+pushes runs/<TASK-ID>
# (plus office.team.yaml) after every agent step — replacing the manual sync
# ritual. Both hooks soft-fail offline. Flip per-machine in
# office.config.local.yaml or via env OFFICE_GIT_SYNC=1/0.
git_sync:
  enabled: false
