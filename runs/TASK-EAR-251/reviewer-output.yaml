summary: |
  Authenticated staging acceptance now closes the remaining TASK-EAR-251 gate.
  The prior source review stays approved: shared-lib, Games-Labs-Order, and
  api-gateway remain merged in sequence, and current staging images still
  contain those merges.

  Live against api-test-gateway.gameslabs.app as QA player f737e6f3-…:
  unauthenticated GET /api/v1/redemptions is 401; Primary emits availability
  plus redemptionEligibility; a one-time redeem with a mismatched body user_id
  still attributes the voucher to the token player, removes the item from
  Primary (9→8), and retains it on Favorites as PLAYER_TOTAL_LIMIT_REACHED with
  no nextEligibleAt. An already fully_redeemed favorite stays on Favorites with
  empty reasonCode. Hitting an item-daily cap leaves the row visible on Primary
  and Favorites with ITEM_DAILY_LIMIT_REACHED and nextEligibleAt at the next
  Bangkok midnight (2026-09-10T17:00:00Z). POST returns 5032 then 5034; the
  original redeem key replays the same owned row.

  PLAYER_DAILY_LIMIT_REACHED was not present on this caller's live catalog.
  Focused contract tests were re-run this pass (ev-008..ev-010). Production
  was not touched.

