summary: |
  Cross-repo source review verdict is approved. shared-lib, Games-Labs-Order,
  and api-gateway changes are merged in the required sequence and consumer
  modules pin the exact published contract without replace directives.

  Order source proves global availability remains separate from caller
  eligibility, lifetime filtering occurs in list/count SQL before pagination,
  Favorites retain unavailable items, Point balance is excluded, and GET/POST
  use trusted caller identity. Quota POST failures use stable errors 5032-5034.

  The final replay state machine closes the original free-voucher path:
  quota denial and compensating state commit together; voucher creation and
  succeeded state commit together; deterministic Wallet refund plus CAS/reload
  makes concurrent/crash retries safe. The removed advisory-lock callback no
  longer risks exhausting the PostgreSQL pool. MaxConns=2 live tests cover
  same-key success, concurrent compensation, and distinct-key stress.

  Gateway scope is limited to the dependency bump and focused tests proving
  both REST routes emit nested camelCase redemptionEligibility, explicit false,
  reasonCode, RFC3339 nextEligibleAt, and sibling availability.

review_verdict: approved

