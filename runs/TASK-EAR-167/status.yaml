      to the fuzzy path than rule-level categories — every pool entry is
      containment-tested against every turnover event. So TASK-EAR-168's
      condition A2 is the more dangerous half of the gate, not hygiene.
      Consequence recorded: A2 cannot be made durable by any existing fix,
      since the save path will accept a new bad entry_ref tomorrow. A code
      guard is required first. Recommended it (reusing TASK-EAR-166's
      resolveCategoryScope so pool and rule surfaces stop drifting) but
      did NOT open the task without operator direction, and flagged the
      cleanup trap: deleting a sole-remaining pool entry leaves an empty
      pool, which makes the mission unachievable mid-week AND 400s the
      next Backoffice save.
