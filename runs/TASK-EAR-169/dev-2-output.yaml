summary: |
  Implemented Player Edit Missions as a read-progress/admin-completion surface.
  The visible action remains Update, while selected Daily or Monthly missions
  are force-completed and their configured rewards are credited automatically.

  Missions now requires admin/superadmin for the route, keeps completion-only
  compatibility when claim_reward is omitted, returns separate completion and
  payout results, and derives Wallet idempotency keys on the server. Daily
  retries release only transient reservation state. Monthly completion loads
  persisted state before mutation so a previously claimed reward cannot be
  reopened after a restart; Wallet and persistence failures remain retryable.

  Backoffice removes the non-functional progress +/- controls, sends
  claim_reward=true, reports credited counts and partial failures, then reloads
  the real mission overview. The source comment records that Update means mark
  selected missions complete and auto-credit rewards.

  Verification passed: all Games-Labs-Missions Go tests, focused race tests,
  readonly Go build, go vet, all 160 Backoffice tests, focused UI regressions,
  production Nuxt build, Postman JSON/copy consistency, and git diff checks.
  Nuxt emitted only existing duplicate-route and large-chunk warnings.
