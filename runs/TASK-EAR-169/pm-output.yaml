description: |
  Complete selected Daily or Monthly missions from Player Edit and credit each
  configured reward exactly once. Preserve the existing endpoint and Update
  label while removing misleading incremental-progress controls.
acceptance_criteria:
  - criterion: Daily and Monthly force-complete are admin-only.
  - criterion: claim_reward=true credits configured rewards exactly once.
  - criterion: Omitted claim_reward preserves completion-only compatibility.
  - criterion: Progress cards are read-only and the action label remains Update.
  - criterion: Backend and frontend regression tests plus builds pass.
plan:
  approach: |
    Extend the Struct-backed route additively, reuse canonical claim services,
    add stable Wallet idempotency for Monthly, and make the smallest UI changes.
  subtasks:
    - order: 1
      id: missions-safe-auto-credit
      description: Implement admin-only completion and idempotent reward credit.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/models/models.go
        - Games-Labs-Missions/internal/handlers/adminmission/http/handler.go
        - Games-Labs-Missions/internal/services/mission_service.go
      parallel_safe: false
    - order: 2
      id: backoffice-read-progress
      description: Remove steppers, retain Update, and consume payout results.
      agent: dev-2
      owned_files:
        - Games-Labs-backoffice/app/components/CompleteMissionPanel.vue
        - Games-Labs-backoffice/app/components/MissionProgressCard.vue
        - Games-Labs-backoffice/app/composables/useAdminPlayerMissionApi.ts
      parallel_safe: false
  risks:
    - risk: Duplicate money movement on retry.
      mitigation: Stable Wallet idempotency keys and focused replay tests.
    - risk: Existing callers depend on completion-only behavior.
      mitigation: Auto-credit is opt-in through claim_reward=true.
  estimated_complexity: high
