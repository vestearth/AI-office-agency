follow_up:
  - Option 2 (recommended): Games-Labs-Wallet Credit/Debit handlers should use errormsg.HTTPStatusFromError(err) so insufficient balance returns 402/409 at source; then the Missions client can rely on status code instead of the "insufficient" body-text heuristic.
