summary: |
  Independent completion audit plus source review: approved. Close as office
  done. Games-Labs-backoffice#98 is merged to main (0cdab1b, merge 1f41506)
  and Build and Deploy succeeded
  (https://github.com/SparqLab/Games-Labs-backoffice/actions/runs/31713913089).
  Merging main in this repo is a real k3s deploy (deploy.yml on push to main).

  The re-scoped job was an audit first: none of contact extras / device /
  coin aggregates had a remaining deployed admin API to wire data-source-only.
  Phone/email were already wired via GET /api/v1/admin/user/{user_id}. The
  shipped change blanks the six coin aggregates from hardcoded 1564 to "—"
  via blankBackedFields, which is the right call for fabricated money-looking
  numbers on a real player. Layout is untouched. Redeem Diamond stays mock;
  Top Performance was later backed by TASK-EAR-193 (out of this run, already
  documented on the page). Follow-ups TASK-EAR-255 (device serial read path)
  and TASK-EAR-256 (session IP capture) exist as pending runs.

  npm test on current backoffice checkout: 430 pass, 1 fail. The failure is
  pre-existing and unrelated (tests/adminFreeCoinManage.test.mjs expects a
  monitoring/reports/free-coins pageConfig key). This PR did not touch that
  file. Visual eyeball of the two coin cards was not done (admin login).

