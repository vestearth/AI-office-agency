summary: |
  Implemented TASK-EAR-342 D1–D5 and opened PRs. shared-lib adds additive
  `WinAmount *float64` and `round.outcome_updated`, and makes
  `GameplayLogDetail.win_loss_amount` proto3 optional (field 6 unchanged).
  Game publishes `WinAmount` on round.settled/reversed, emits
  `round.outcome_updated` after existing turnover/round publishes when a
  duplicate settle has a stored win, and ships a CLI/env backfill.
  Logs writes `monitoring_round_outcomes` ReplacingMergeTree and overlays
  W/L. Missions is a regression test only. Downstream go.mod pins
  v0.0.0-20260909095648-f40cb0566cdd. Staging acceptance and backfill are
  not run. Merge order: shared-lib #73 → Logs #26 → api-gateway #69 →
  Game #38. Missions #129 and backoffice #120 can merge after shared-lib.
