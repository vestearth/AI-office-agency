      out-of-band, so nothing was ever visibly broken — but Auth could not
      build a working database from its own migrations, which breaks a new
      staging, a disaster-recovery restore and every local dev database with
      SQLSTATE 42703 on every user query. Repaired as Auth PR 12,
      migrations/013_users_soft_deleted_at.sql.
      The class is invisible until someone builds a fresh database, and several
      services here replay their whole embedded migrations directory on every
      boot, so this audit covers the sibling services. The read-only Android
      reference repository is out of scope. Backend PRs target staging and the
      operator merges — merging is the deploy.
