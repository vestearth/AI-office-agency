      TWO REAL FINDINGS, neither of them the Auth defect:
      1. PROVIDER — api_keys is created by apiKeyRepo.ensureTable at
      construction, and appeared in NO migration. Nothing breaks at runtime,
      but migrations/ did not describe Provider's schema. Migration 002 now
      carries that DDL copied VERBATIM from ensureTable, so no type was
      inferred and it is a no-op everywhere; a double apply was checked and
      both statements skip. ensureTable was deliberately left in place —
      idempotent, and removing it is a behaviour change that is the operator's
      call. Proven load-bearing: delete 002 and the test fails 42P01.
      2. USER — the two admin queries LEFT JOIN auth_devices, which
      Games-Labs-Auth creates in ITS migration 001 across the same physical
      database. User's migrations alone therefore cannot serve those two
      queries. NOT repaired, on purpose: two services owning one table's DDL is
      how definitions drift apart, so User creating its own auth_devices would
      be a worse defect than the one being fixed. Exempted in the test with the
      reasoning at the exemption, and raised for the operator — the Auth-first
      boot order is currently implicit and recorded nowhere but code comments.
      THE REGRESSION TEST IS NOT A COLUMN LIST, and that was the main design
      call. A hand-written list only ever proves the columns someone remembered
      to add to it, so the next column written into code but not into a
      migration is exactly the one the list would omit — the drift returns
      silently and the suite stays green. Instead each schema_drift_test.go
      reads its own repository's source, extracts every statement (resolving
      the consts queries are assembled from), and prepares each against the
      fresh schema, so it covers code written long after today. It refuses a
      database that already has tables, fails if it finds fewer than 10
      statements (a refactor must not quietly turn it into a no-op), and fails
      loudly on an unparsable file rather than letting its queries vanish from
      the audit.
      Every one of the six was watched FAILING first, against a planted query
      naming a column no migration creates — a green run of a test like this is
      not self-certifying. go build ./... and go vet clean in all six.
