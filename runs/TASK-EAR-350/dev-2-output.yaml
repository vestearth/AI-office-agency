summary: >-
  Restored Gift redemption snapshot fields in the Order admin response and
  made Backoffice display the immutable contactEmail used by tracking mail.
  Regression tests failed before the fixes and passed afterward; both complete
  suites and builds passed. The two scoped PRs were merged and deployed, and an
  authenticated UI smoke confirmed populated versus legacy-row rendering.
artifacts:
