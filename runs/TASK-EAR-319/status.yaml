next_action:
  agent: dev
  description: >-
    GET /api/v1/admin/user/summary (AdminUserService.PlayerSummary) and
    GET /api/v1/admin/user/wallets (ListUserWallets) are dead at the gateway:
    both answer GetUser's shape {"status":{"code":1000,"description":"user
    not found"},"user":null} on live staging (api-test-gateway, TASK-EAR-318
    ev-007/ev-010 and a direct probe of /user/wallets on 2026-09-04). The
    backoffice player page really calls /admin/user/summary
    (Games-Labs-backoffice app/pages/admin/manage/player/index.vue:265) and
    on a non-200 status sets summary to null, so the player summary cards
    are silently empty on staging; the wallets tab is in the same state.
    ROOT CAUSE, PROVEN NOT ASSUMED: grpc-gateway v2.27.7 (api-gateway
    go.mod) runtime.ServeMux.Handle PREPENDS each handler
    (runtime/mux.go:362 `s.handlers[meth] = append([]handler{{...}},
    s.handlers[meth]...)`) and ServeHTTP takes the first match, so the
    LAST-registered pattern wins. Generated Register* code registers RPCs in
    proto declaration order, and adminuser.proto declares GetUser
    (/api/v1/admin/user/{user_id}, line 53) AFTER PlayerSummary (46) and
    ListUserWallets (42), so the wildcard is registered last and captures
    both literal siblings as user_id="summary" / "wallets". Reproduced
    offline with the exact generated patterns:
    artifacts/grpc_gateway_match_order_proof_test.go -> GET
    /api/v1/admin/user/summary resolves to GetUser user_id=summary.
    Live swagger doc.json lists /admin/user/summary, so "route exists" is
    true and useless here - the shadowing happens at match time.
    THIS INVERTS THE WORKSPACE RULE from TASK-EAR-130 (memory
    grpc-gateway-route-order-trap said first-declared wins and to declare
    wildcards LAST). That rule is wrong for this runtime version and is the
    reason the order in adminuser.proto looks "correct" while the routes are
    dead. Memory corrected 2026-09-04; ai-skills rule text, if any, must be
    corrected in the same change.
    SWEEP DONE (defect-class): a script over every shared-lib proto service
    flagging a literal GET declared before a same-method wildcard sibling in
    the same service found exactly these two routes and nothing else. Re-run
    the sweep after the fix and keep the script in this run.
    FIX: in shared-lib proto/admin/adminuserpb/adminuser.proto move the
    GetUser rpc ABOVE ListUserWallets and PlayerSummary (wildcard first, so
    the literal siblings register later and win). Regenerate; verify in
    adminuser.pb.gw.go that mux.Handle for GetUser precedes the two literal
    Handle calls. Field numbers and paths do not change, so no client
    contract change; the swagger stays identical. Then bump api-gateway's
    shared-lib pin (it owns the wire format - a shared-lib merge alone
    changes nothing live) and deploy the gateway on staging. Games-Labs-User
    needs no change.
    Do NOT rename the paths or add a distinct prefix; the backoffice is
    already coded to these paths.
    VERIFY: RED first = the proof test above, or a test in api-gateway that
    registers the generated handlers and asserts the literal paths resolve
    to their own RPCs. Then live through the gateway with a staff bearer:
    GET /api/v1/admin/user/summary must return totalUsers/lifetimeValue (and
    lifetimeValue must equal Wallet's all-players lifetime top-up from
    TASK-EAR-318), GET /api/v1/admin/user/wallets?user_id=<devtest> must
    return wallets, and GET /api/v1/admin/user/<devtest uuid> must still
    return the user - grep the raw bodies. Prod is presumably in the same
    state; check the prod gateway before assuming, and note that a fix
    reaches prod only with a prod gateway deploy.
