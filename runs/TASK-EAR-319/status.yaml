  description: >-
    Closed on staging 2026-09-04. ROOT CAUSE (proven, not assumed):
    grpc-gateway v2.27.7 runtime.ServeMux.Handle prepends (runtime/mux.go
    :362) so the LAST-registered pattern wins; generated code registers in
    proto declaration order; adminuser.proto declared GetUser
    (/api/v1/admin/user/{user_id}) after PlayerSummary (/summary) and
    ListUserWallets (/wallets), so both literals were dead at the edge and
    answered GetUser's "user not found". The backoffice player page calls
    /summary for real, so its summary cards were silently empty. This
    inverted the TASK-EAR-130 rule ("declare wildcards last"); the memory
    and the in-proto comment are corrected. A proto-wide sweep
    (artifacts/route_shadow_sweep.py) found only these two routes.
    FIX SHIPPED: shared-lib PR 65 (merge 19237a7, module
    v0.0.0-20260904163302-19237a753318) moves GetUser above its literal
    siblings; regenerated; paths/field numbers/swagger unchanged; buf
    breaking passes. api-gateway PR 62 (merge f5eae23, go.mod/go.sum only)
    bumps the pin; Deploy STAGING 33895838343 success, ECS
    api-gateway-staging image staging-sha-f5eae23 COMPLETED (ev-006).
    EVIDENCE: regression test through the real generated registration
    (adminuser_route_order_test.go) RED first (ev-001), GREEN (ev-002);
    shared-lib buf breaking + build/vet/test (ev-004); api-gateway
    build/vet/test on the new pin and the pinned module's pb.gw.go
    registering GetUser first (ev-005). LIVE ACCEPTANCE (ev-007), staff
    bearer, raw bodies: GET /api/v1/admin/user/summary -> code 200,
    totalUsers 76, lifetimeValue 27345 (the Wallet all-players total from
    TASK-EAR-318, so the dashboard number and the list definition agree);
    GET /api/v1/admin/user/wallets?user_id=<devtest> -> code 200 OK from
    ListUserWallets; GET /api/v1/admin/user/<devtest uuid> -> code 200 with
    the user, so the wildcard still works.
    NOT verified: production - the prod gateway host is not recorded in
    the workspace and the guessed hosts answered 503/timeout, which proves
    nothing; prod presumably still has both routes shadowed until a prod
    api-gateway deploy with a shared-lib pin >= 19237a7. Also the wallets
    body was checked for status only, not for wallet rows.
