summary: |
  VIP one-time rewards can now sit pending until the player claims them.
  Switch VIP_REWARD_CLAIM_ENABLED is a STRING defaulting to "false", so
  today's pay-immediately path stays: grant still pays Wallet with the
  existing vip_level_reward keys and also writes a claimed ledger row.
  Flip ON only after mobile's Claim screen is minimum supported (D7).
  Gameplay Buy/turnover insert one pending row per level (VIP1 skipped);
  admin SetUserVipLevel grants avatars only and never creates a reward.
  Amounts and currency are snapshotted at grant. Identity for list/claim
  is the gateway JWT userid metadata, never the body. int64 amounts are
  JSON strings on the wire. shared-lib is unpublished — User compiles
  via a gitignored go.work; do not commit replace.
