next_action:
  agent: done
  description: >-
    Forward the caller's x-correlation-id through api-gateway's grpc-gateway
    lane. Found while closing TASK-EAR-323 (Wallet now logs cancellation
    failures with correlation_id read off gRPC metadata): the gateway's
    interceptor.MapMetadataInterceptor puts only userid / role / access /
    authorization / x-forwarded-* on the outgoing metadata, has no
    correlation handling, and grpc-gateway's default header matcher drops
    non-permanent headers such as x-correlation-id - so every backend
    would log correlation_id=- today (TASK-EAR-323 ev-006). Scope: add
    x-correlation-id pass-through to MapMetadataInterceptor with a unit
    test seen RED first; no new id generation, no behaviour change for
    requests that do not send the header.
    IMPLEMENTED as api-gateway PR 64 (commit on
    task/TASK-EAR-324-forward-correlation-id off origin/staging f5eae23),
    NOT merged, NOT deployed - merging deploys the gateway to staging.
    Change is one pass-through in interceptor/metadata.go keyed by
    constants.CorrelationID ("x-correlation-id"), trimmed, skipped when
    blank. Test RED (ev-001: got [], want [corr-ear324]) then GREEN
    (ev-002); go build / vet / full suite pass (ev-003). Pairs with Wallet
    PR 46 (TASK-EAR-323); order does not matter, Wallet tolerates a
    missing id. After both deploy, prove it on staging by cancelling a
    Stripe checkout with a forced failure and grepping the Wallet log for
    correlation_id=<the header sent>.
    CLOSED ON STAGING 2026-09-05. Merged as db46535 (Deploy STAGING
    33923825840 success, image staging-sha-db46535, single COMPLETED ECS
    deployment) and proven end to end during the TASK-EAR-323 fault
    injection: a cancel sent with header x-correlation-id:
    ear323-proof-222500 produced the Wallet line
    "... stage=release_checkout_order transaction_id=6ac08bf8-... 
    correlation_id=ear323-proof-222500 ..." in
    /ecs/games-labs-wallet-staging - the id could only have arrived over
    gRPC metadata, which is what this change added (TASK-EAR-323 ev-010).
    PROD: not touched; rides along with the TASK-EAR-322 prod patch.
