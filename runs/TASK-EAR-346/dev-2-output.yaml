summary: |
  Shared-lib #76 is on main (bd4b49e5aa05). Wave 1 consumers now pin
  v0.0.0-20260910074254-bd4b49e5aa05 with no replace. Order stamps Package
  currency, Custom/Default, assets, coupon snapshots, and pointer money, and
  leaves Payment Gateway empty. Missions publishes a deterministic
  store.purchase.settled after completed Pass/Avatar ops (DIAMOND, N/A gateway)
  and skips that event from the matcher. Logs maps additive Store fields from
  the stamped payload, prefers event.Currency for the ClickHouse currency
  column, and searches package_name without a new column. Gateway pins the
  contract. Backoffice sends storeTypes per tab and renders presence-aware
  values. PRs are open; merge Logs+gateway first, then producers, then UI.
artifacts:
  - path: Games-Labs-Order/internal/core/services/ordersvc/service.go
    action: modified
    description: Stamp Package store.purchase.settled snapshots without inferring payment_reference.
  - path: Games-Labs-Order/internal/core/services/ordersvc/service_test.go
    action: modified
    description: Normal, discount, complimentary, and zero-paid Package event tests.
  - path: Games-Labs-Order/go.mod
    action: modified
    description: Pin published shared-lib bd4b49e5aa05.
  - path: Games-Labs-Missions/internal/services/store_service.go
    action: modified
    description: Publish Pass/Avatar store.purchase.settled on first success and replay.
  - path: Games-Labs-Missions/internal/services/player_activity.go
    action: modified
    description: Deterministic store event id and matcher skip for store.purchase.settled.
  - path: Games-Labs-Missions/internal/services/player_activity_test.go
    action: modified
    description: Idempotent EventID and matcher-skip coverage.
  - path: Games-Labs-Logs/internal/core/handlers/monitoringhdl/grpc.go
    action: modified
    description: Map additive StoreLogDetail; do not infer store currency from spend/balance.
  - path: Games-Labs-Logs/infrastructures/monitoring_clickhouse.go
    action: modified
    description: Prefer stamped Currency on ingest; search JSON package_name.
  - path: api-gateway/go.mod
    action: modified
    description: Pin published shared-lib Store contract.
  - path: Games-Labs-backoffice/app/pages/admin/monitoring/player-log/store.vue
    action: modified
    description: Tab storeTypes plus presence-aware Package Type, money, assets, and gateway.
  - path: Games-Labs-backoffice/app/utils/playerLogs.ts
    action: modified
    description: Additive Store types and tab/gateway/asset mapping helpers.
