  - phase: assigned -> in_review
    agent: dev-2
    at: '2026-07-30'
    reason: >-
      Implemented across all 4 repos, nothing committed. Decided the one
      real design call myself before dispatching: response type is
      google.protobuf.Struct, NOT a typed message — every sibling RPC in
      adminmissionpb uses Struct, and Struct passthrough preserves
      snake_case, which is what this service's admin FE already expects. A
      typed message would have emitted camelCase and reintroduced exactly
      the mismatch that shipped a bug in TASK-EAR-076.
      Verified independently rather than on the implementers' reports:
      (1) confirmed the new list query really filters state='completed'
      (so in-flight reserved/debited rows can never render as purchases),
      has the optional item_type filter, orders created_at DESC, and uses
      a separate COUNT — chosen because that is the only counting
      convention that exists in this repo; there is genuinely no
      LIMIT/OFFSET precedent anywhere in internal/repositories/ (every
      existing LIMIT is LIMIT 1);
      (2) checked the risk of adding CreatedAt to StorePurchaseOperation —
      the pre-existing GetStorePurchase SELECT/Scan is unchanged and still
      13-for-13 aligned, so the new field is additive and safe;
      (3) confirmed the route binding is real by reading it out of the
      generated swagger (/api/v1/admin/store/purchases) rather than
      trusting the proto — the TASK-EAR-072 404 trap;
      (4) confirmed the generated gateway mux registers it (19 refs) and
      that no /admin/store/* path can collide: passes/config,
      golden-pass/config, give-pass, purchases all have distinct literals;
      (5) grepped the new FE composable for camelCase field reads — the 4
      hits are local TypeScript parameter names (item_type: itemType), not
      response reads, so there is no casing bug;
      (6) rebuilt and re-ran tests in Missions, shared-lib and api-gateway
      myself; backoffice build clean and typecheck byte-for-byte identical
      to the stashed baseline (25 pre-existing, zero new).
      Amount renders "N Diamond", matching how the Package sub-tab embeds
      THB in the formatted string and matching the prior mock values
      exactly — so the change is genuinely invisible to the UI, which is
      what preserve-ux-design-wire-data-only asks for.
