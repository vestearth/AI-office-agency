      I re-verified the decisive points myself rather than accepting the
      report: the OrderPackageID branch is present in the callback source,
      and the whole flow is STAGING-ONLY — the stripe files are absent
      from origin/main and origin/prod.
      Consequence for this task: Missions' /api/v1/webhooks/store-payment
      is a parallel LEGACY path that no PSP calls. A workspace-wide grep
      for "store-payment"/"StorePaymentWebhook" finds only generated proto
      scaffolding (shared-lib missions.proto:271-273 and the .pb files),
      the route registration (Missions internal/routes/apiv1.go:71), and
      this task's own new config comment — no producer anywhere. Its body
      shape {order_id, payment_reference, status} is caller-asserted
      "trust me, it's paid" with no PSP identity, which is exactly why it
      was exploitable. RECOMMENDATION: remove its public gateway binding
      (a shared-lib + gateway change) rather than adding PSP signing to
      it, which would duplicate Wallet's already-correct implementation.
      The shipped containment stays valid either way as the interim gate.
      OPEN RISK, must be checked before removing the binding or merging
      the containment to prod: no mobile repo exists in this workspace, so
      "no caller" is proven only for the services here. If the mobile app
      currently POSTs to this webhook as part of its purchase flow, the
      containment header would break it. The operator's own relay ("mobile
      still has to wire up package payment") suggests mobile has NOT
      adopted it, but that is inference, not evidence — ask the mobile
      team directly. Also unverified: whether STRIPE_* secrets exist in
      prod, and whether ConfirmOrderPayment has any remaining internal
      caller.
