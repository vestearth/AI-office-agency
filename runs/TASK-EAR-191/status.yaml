    reason: >-
      COURSE CORRECTION — containment replaced by removal. PR #105 was
      merged to staging at 11:01 (operator, after creating both GH Actions
      secrets at 10:04), then a review rejected the containment shape and
      the operator agreed. Replacement PR:
      https://github.com/SparqLab/Games-Labs-Missions/pull/106, branch
      feature/TASK-EAR-191-remove-legacy-store-payment-webhook, commits
      e2c400e + 97aa751, targeting staging. #105 could not be closed
      (already merged), so #106 both removes the endpoint and reverts the
      containment machinery.
      TWO REASONS THE CONTAINMENT WAS THE WRONG SHAPE, one of which is my
      own defect and is recorded here deliberately:
      (1) The endpoint has no legitimate caller, so the shared secret was
      standing up secret management — and a mandatory GH Actions secret on
      every staging/prod deploy — for something scheduled for deletion.
      The mobile team confirmed in writing they neither call it nor want
      to, and proposed exactly the Wallet Stripe checkout flow that already
      exists. QA evidence settled the last doubt: a BlueStacks run of the
      29 THB First Timer purchase showed no Stripe checkout, instant
      success and +2,400 Coin — that is Wallet's is_demo shortcut
      (TASK-EAR-254), not this webhook. So removal breaks no current QA
      flow.
      (2) MY DEFECT: the PR body claimed testers could keep working by
      adding the header. That is false for the gateway route — the exact
      path that was exploited. httpx.HeadersFromGRPC (bridge.go:44-65)
      forwards only Authorization, X-User-ID and role, so
      X-Store-Webhook-Secret can never reach the handler through the
      grpc-gateway bridge; those callers would have been rejected
      regardless of the header. Caught by review, not by me. The lesson is
      narrow and worth keeping: when adding a header-based check to a
      handler that is also reached through the gRPC bridge, verify the
      bridge forwards that header before describing the behaviour.
      The earlier "testers POST directly to this webhook" answer in this
      run's history was wrong and is superseded. The accurate statement is:
      used by the operator for manual verification on 2026-07-31, with no
      producer and no mobile flow using it.
      WHAT #106 REMOVES: the REST route (routes/apiv1.go), the gRPC bridge
      method (the embedded UnimplementedMissionsServiceServer answers with
      codes.Unimplemented until the RPC leaves shared-lib), the
      PaymentCallback handler, StoreService.ConfirmOrderPayment, the
      now-dead order client ConfirmPayment, the README entry, and the whole
      containment layer from #105.
      VERIFICATION: regression test seen RED first —
      TestLegacyStorePaymentWebhookIsNotRegistered asserts the route 404s;
      before the change it matched and reached the handler. GREEN after.
      Full go test ./... green on the merged tree with the testcache
      cleared; go build and go vet clean.
      TEST INTEGRITY NOTE:
      TestStoreServiceConfirmOrderPaymentRecordsHistory was deleted because
      the method it covered no longer exists. Its real assertion — that a
      fulfilled package purchase lands in purchase history — is now covered
      on the surviving path by the new
      TestRecordPurchaseHistoryRecordsWalletFulfilledPackage plus a
      nil-service guard test. That path (the RecordPurchaseHistory RPC
      Wallet calls) had NO coverage before, so net coverage is up.
      STILL OPEN: (a) remove the StorePaymentWebhook RPC and its HTTP
      annotation from shared-lib, regenerate/publish, bump the dependency
      in Missions AND api-gateway — until then the gateway still routes the
      path to an Unimplemented method; (b) delete the now-unused
      STORE_WEBHOOK_SECRET / STORE_WEBHOOK_SECRET_STAGING GH Actions
      secrets once #106 lands; (c) Order's ConfirmPaymentHTTP existed to
      serve Missions and now has no caller — worth a look, out of scope
      here; (d) TASK-EAR-254 must give QA a staff-gated replacement before
      the is_demo path is closed, since that is what testers actually use.
