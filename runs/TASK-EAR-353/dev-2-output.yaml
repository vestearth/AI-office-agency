summary: |
  Implemented Order-owned responsive multipart redemption emails for:
  - E-voucher redemption success.
  - First physical-gift tracking notification.
  - Corrected tracking notification, including the last SMTP-submitted tracking number.

  The renderer uses the current User adapter to look up username with a bounded
  best-effort fallback to Customer, defaults carrier/timezone to Thailand Post
  and Asia/Bangkok, and omits optional brand/support/social footer links unless
  configured with safe public HTTP(S) URLs. SMTP now sends text/plain and
  text/html alternatives in one multipart message.

  Tracking claim state is separated from tracking_email_sent_for: the latter is
  written only after SMTP submission succeeds. SMTP failures release the
  in-flight claim for retry; a post-submission database-completion failure is
  logged and deliberately not retried automatically to avoid duplicate mail.

