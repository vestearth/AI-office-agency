      tightening left as an operator follow-up once the secret is
      confirmed. Also found that staging.yml and prod.yml read the SAME
      ecs/env.names, so this PR's change reaches the prod render too.
      IMPORTANT GENERAL FINDING, verified independently by the coordinator
      in envconfig v1.4.0 source (envconfig.go:199, `if def != "" && !ok`):
      a `default:` struct tag fires only when a var is UNSET, never when it
      is set-but-empty. Since build-env-json.sh renders every name listed
      in env.names — exported or not — as at least "", the widely-assumed
      "empty-tolerant default" protection DOES NOT EXIST; only an explicit
      `if x == ""` guard in the accessor provides it. This is the precise
      mechanism behind the 2026-07-31 non-string boot crash and validates
      the mitigation already recorded for it. The agent acted on it by
      exporting the queue name explicitly rather than trusting the struct
      tag. Config default deliberately NOT added, argued four ways, chiefly
      that any default can only point at a broker absent from the task's
      network, turning a silent no-op into timeout-and-retry noise that
      still produces no audit row. Live verification and the outstanding
      code-leak check remain impossible until the workflow leg lands.
