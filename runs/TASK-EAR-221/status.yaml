    reason: >-
      PR #32 open on staging, one file: ecs/env.names gains RABBITMQ_URL
      and RABBITMQ_QUEUE_ADMIN_ACTIONS. Workflow diffs for BOTH staging.yml
      and prod.yml are pasted verbatim in the PR body for the operator;
