history:
  - phase: created -> pending
    agent: pm
    at: '2026-07-31'
    reason: >-
      Opened at operator request, found during the post-merge smoke of
      TASK-EAR-144 rather than from a report — nobody was looking for it.
      Prioritised high rather than medium deliberately: this is in production
      as of b758b6d, and the failure mode is confidently wrong data on a page
      operators use to make decisions about a real player's account. An empty
      table is a gap; a plausible fake transaction ledger under a red warning
      is worse than either showing nothing or showing an error.
      Scope was drawn to be finishable: all seven history sub-tabs are
      API-backed, so none of this is blocked on a missing backend, and the
      correct pattern already exists a few lines away in the same file. The
      one judgment call left to the implementer is whether to delete the mock
      fallback outright or return empty columns, and they are asked to state
      which and why rather than have it dictated.
      Deliberately NOT folded in: fields that are mock because no backend
      exists at all (Device/IP, Lifetime GGR, Top Performance win stats,
      referral code) — same symptom, different cause, and mixing them would
      make the diff unreviewable. Also noted for whoever picks this up: the
      pagination fix that shipped alongside 144 was never confirmed at
      runtime for the same reason this page is hard to populate without a real
      admin token, so populating it properly here may close that out as a side
      effect.
  - phase: pending -> in_review
    agent: dev
    at: '2026-07-31'
    reason: >-
      Implemented in the Claude advisory lane on operator instruction, same day
      the run was opened. Commit e838f38, PR #64.
      Two judgment calls worth a reviewer's attention. First, the brief said
      not to just copy TASK-EAR-144's `[]` to the other five loaders, and that
      held up in practice — an empty table still asserts "no transactions"
      when the truth is "we could not find out", so the fix carries an
      explicit error state and error-red copy rather than a silent empty
      table. Package was brought up to the same standard rather than left at
      144's narrower treatment.
      Second, the Summary sidebar did NOT turn out to be one thing. Two of its
      values are loader-owned and were fixed; three have no backend at all and
      were deliberately left, because that is the class both TASK-EAR-174 and
      this run's own brief deferred. Reporting that split rather than quietly
      dashing everything is the point — dashing them would have looked tidier
      and hidden a real backend gap.
      On verification honesty: the six tabs cannot be populated without a real
      admin token, so only the failure path was exercised live. Rather than
      claim more, the coverage went into a source-level regression test that
      CI can keep honest, and that test was mutation-checked so it is not
      passing vacuously. This was only possible because TASK-EAR-176 landed
      the test runner earlier the same day.
  - phase: in_review -> done
    agent: reviewer
    at: '2026-07-31'
