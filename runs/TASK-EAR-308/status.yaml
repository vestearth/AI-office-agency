      prod.yml. What is missing is not support but a decision: there is no
      CLICKHOUSE_ADDR variable in the production GitHub environment, so
      prod.yml:87 falls back to the literal 84.247.150.206:9000, which is the
      same host the staging environment variable points at. Deploying
      Monitoring to prod today would write production rows into the same
      ClickHouse instance and the same default gameslabs database as QA.
      Two further facts came out of the same check and are recorded in
      task.md. The address is a bare public IP on port 9000, ClickHouse's
      native PLAINTEXT protocol port rather than the 9440 TLS port, and the
      pattern matches the legacy Contabo estate that the ECS migration was
      meant to supersede — the same unanswered question as D3 in
      docs/PROD-ISSUES-2026-08-15.md. And neither the staging nor the
      production environment holds any ClickHouse secret; both carry only
      POSTGRES_ entries, so CLICKHOUSE_USERNAME falls back to `default` and
      CLICKHOUSE_PASSWORD to empty.
      STATED HONESTLY: that last point is read from configuration only. No
      request was sent to that host, and establishing what it actually accepts
      is part of this task rather than a finding of it. A related concern was
      raised once before as the ClickHouse public-read chip during the
      win-capture epic.
      A correction to my own method is worth recording, because it nearly
      produced the opposite report twice: the first branch-comparison loops
      used origin/$b:ecs/env.names, and zsh applies the :e history modifier to
      $b there, silently yielding a bad ref that 2>/dev/null then hid. Every
      number above comes from the corrected runs using ${b}.
      SCOPED DELIBERATELY NARROW: this task must not gate TASK-EAR-285, 286,
      291 or 292, which are staging-side and unaffected. It also carries one
      change that is right regardless of which way Q1-Q3 are answered —
