      Opened at operator request while assessing whether the Admin Monitoring
      epic could reach production. THE PREMISE THAT PROMPTED IT WAS THE
      OPPOSITE OF WHAT THE CONFIG SAYS, which is why it is worth a task rather
      than a note: the concern raised was that prod does not support
