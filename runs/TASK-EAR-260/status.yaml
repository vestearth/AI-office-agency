next_action:
  agent: dev
  description: >-
    CRITICAL — underpayment. The Stripe checkout amount is taken from the
    CLIENT REQUEST and is never checked against the package price, so a
    player can pay 1 THB and receive a 29 THB package's full rewards.
    FOURTH instance of the same class as TASK-EAR-180/182, 191 and 254: a
    money path trusting a client-controlled field.
    TRACE (Games-Labs-Wallet):
    paymentsvc/stripe_deposit.go:44 rejects only `in.Amount <= 0`, then
    :73 sets `Amount: in.Amount` into the Stripe checkout — `in.Amount`
    comes straight from CreateTransactionRequest.amount. Nothing compares
    it to the package. On the callback,
    stripe_callback.go:80-81 deliberately keeps the STORED amount
    ("do not overwrite with Stripe charge currency total"), then :107
    loads the package by id and :111
    CompletePaymentWithPackageRewards grants the package's FULL
    coin/diamonds regardless of what was actually paid.
    The authoritative price is already available:
    orderadt/adapter.go:62 maps cp.GetPriceAmount() into
    models.OrderPackage.PriceTHB, and loadActivePurchasePackage
    (package_fulfillment.go:138) already fetches it — the fix does not need
    new plumbing.
    FIX: when order_package_id is present, DERIVE the amount from
    pkg.PriceTHB rather than trusting the request. Decide and write down
    whether a client-supplied amount that disagrees is a hard rejection or
    is silently overridden — a rejection is easier to debug and makes
    tampering visible, so prefer it unless there is a reason not to.
    Coupons/discounts: mobile asked whether the backend applies discounts.
    Establish whether a discounted price exists for the Stripe path at all
    (Order owns coupons — see the coupon epic) and make the server the only
    thing that decides the final amount either way.
    ALSO IN SCOPE, same handler, found in the same pass:
    (1) repositories/payment.go:76-86 — the insert is
    `ON CONFLICT (idempotency_id) DO UPDATE` and overwrites amount, status,
    currency and metadata from the incoming request. A replay can therefore
    mutate an EXISTING transaction, including one already completed, and
    `status` is client-supplied (handler passes req.GetStatus() straight
    through). Guard the terminal states and stop taking status from the
    client.
    (2) An idempotent replay currently creates a NEW Stripe Checkout
    Session rather than returning the existing one, so the same
    idempotency_id yields a different cashier_url. Mobile's retry design
    (persist idempotency_id, retry on timeout) expects the same session
    back — see runs/TASK-EAR-260/mobile-contract.md.
    Reproduce each before fixing, regression test seen RED first.
