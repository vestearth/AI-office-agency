      ALL THREE ITEMS FIXED, each reproduced RED first:
      (1) Underpayment — the exploit line is literal: "charged 1.00 THB for
      a 29.00 THB package and granted 2400 coin", driven end to end through
      create -> paid webhook -> reward grant. Fixed by
      applyStripePackagePriceAuthority (stripe_deposit.go:19-90), which
      derives the amount from pkg.PriceTHB and compares in Stripe MINOR
      UNITS so float representation of the same satang cannot read as a
      mismatch.
      (2) Replay mutation — the ON CONFLICT DO UPDATE is narrowed to
      identifier columns with a terminal-status WHERE guard
      (repositories/payment.go), and Stripe deposit status is now forced to
      "pending" instead of being taken from the client
      (paymentsvc/service.go:113-119).
      (3) Replay now returns the Stripe session the idempotency_id already
      owns (stripeCheckoutReplay) instead of minting a new one — the
      behaviour mobile's retry design expects.
      DECISION, recorded in the code: a disagreeing client amount is HARD
      REJECTED, not silently overridden. A silent override is equally safe
      for the money but makes tampering invisible — an attacker's probe and
      an honest client bug would both look like a normal checkout. A refusal
      is greppable and tells an honest client its price is stale rather than
      charging an amount its UI never showed. An OMITTED amount is not a
      disagreement: it is the preferred client behaviour and is filled from
      the catalog, so mobile can stop sending the field.
      DISCOUNTS: not reachable on this path at all today —
      CreateTransactionRequest has no coupon field, Order owns coupons via
      ValidateCoupon/CreateOrder which this flow never touches, and
      GetOrderPackage takes only an id (no user, no coupon) so Order could
      not compute a personalised price even in principle. Wallet's
      StripeCheckoutInput has discount fields that nothing populates — dead
      code.
      OPEN PRODUCT QUESTION, deliberately not decided by the dev lane:
      OrderPackageCatalog carries a catalog-level discount_percent that
      Wallet's orderadt adapter silently drops. Order's COUPON path treats it
      as a real reduction off price_amount (ordersvc/coupon.go:416-441,
      locked by tests) while Order's own NO-COUPON path charges the
      undiscounted price_amount (ordersvc/service.go:162). This fix charges
      undiscounted, matching the no-coupon path, because applying it in
      Wallet would make the two services disagree and would be a unilateral
      pricing change smuggled in via a security fix. If discount_percent is
      meant to reduce a direct top-up, players are overpaying on BOTH paths
      today — needs a product answer.
      MY OWN VERIFICATION, not taken on report: branch base confirmed —
      origin/staging IS an ancestor and origin/prod is NOT, so the
      prod-checkout situation the agent flagged did not contaminate the
