    remains: a duplicate/retried player-activity event delivered AFTER the active plan
    for that week changes (A->B) maps to B's activities; since weekly idempotency is per
    (event_id, activity_id), the (event_id, B-activity) pair is new and accrues, so B
    inherits pre-activation progress. There is also a select/apply TOCTOU: the active
    plan can change between ListActiveWeeklyActivityRules and ApplyWeeklyActivityForward.
    Options: (a) window scoring by the plan active AT evt.OccurredAt via a plan-activation
    history/effective-from column (proper fix); (b) event-level idempotency guard so a
    re-delivered event never re-applies to newly-eligible activities (closes the
    matched-first case only); (c) a consistency lock around select+apply. Decide + spec.
    Requires understanding whether mid-week plan swaps are even a supported operation.
