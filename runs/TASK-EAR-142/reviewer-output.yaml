artifacts:
  - path: Games-Labs-Missions/internal/services/weekly_service.go
    issues:
      - line: 549-568
        severity: warning
        description: >-
          Side effect on quest overview Weekly tab: after Title is
          humanized, isRawGeneratedMissionLabel(mission.Title) becomes
          false, so overview weekly items stop emitting display_name and
          put the human string in label instead. Clients using
          display_name || label remain correct; clients that required
          display_name presence for weekly generated rows will see a
          shape change. Acceptable for this fix; document if Mobile
          still keys off display_name only.
      - line: 559-562
        severity: suggestion
        description: >-
          Category fallback uses definition.GameType only; activity
          GameCategory is not plumbed into weeklyMissionDefinition.
          Generator usually sets both and templates usually supply
          gameCategory, so this is low risk — prefer GameCategory when
          GameType is empty if a future path stores only the canonical
          code.
  - path: Games-Labs-Missions/internal/services/weekly_service_test.go
    issues:
      - line: 395-436
        severity: suggestion
        description: >-
          Regression covers game_turnover, category_turnover, and manual
          pass-through, but not any_game_turnover or spend_prop. Optional
          follow-up to lock the other two generator slugs.
  - path: Games-Labs-Missions/internal/repositories/mission_repo.go
    issues:
      - line: 3543-3549
        severity: suggestion
        description: >-
          Per-activity pool hydration is N+1 queries. Fine for typical
          weekly plan size (a few activities); batch later only if this
          path grows.
  - path: Games-Labs-Missions/internal/repositories/mission_repo_test.go
    issues: []
