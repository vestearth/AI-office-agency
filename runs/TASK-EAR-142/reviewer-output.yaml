summary: |
  Approved. ListWeeklyMissions now resolves only raw schedule-generator slugs
  through the existing weekly display-name templates (game/category/any/spend),
  while manually named activities pass through unchanged. Active-plan reads
  hydrate pool entries so game_turnover titles use the selected-game count.
  Focused regressions and full package tests pass; no replace in go.mod.
  Commit d10cd4d is on origin/staging and Deploy STAGING run 30609189587
  completed successfully (build-push + deploy-ecs). Live mobile UI smoke was
  not re-run here.
review_verdict: approved
