summary: |
  Player Detail Game/History table card was content-sized while Summary kept
  its full stacked height. Fixed in Detail/[id].vue: outer lg grid for the
  two columns; History/Game use grid-rows with a 1fr table slot; ResizeObserver
  + window resize sync table card height so its bottom aligns with Summary
  bottom on lg+ (1024px). Inner table body keeps overflow-auto for long lists.
  Mobile stacked layout clears the forced height.
