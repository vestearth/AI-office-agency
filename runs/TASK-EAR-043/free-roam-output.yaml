---
summary: |
  Make Quest "Current Streak" the daily LOGIN check-in streak (month-scoped),
  replacing the turnover streak that was shown before.

  Root cause of QA's current_streak=0: a wiring mismatch, not corrupted data. The
  FE daily check-in button calls POST /api/v1/missions/check-in
  (MissionService.CheckIn -> RecordCheckInLedger + OnDailyCheckIn) and "Keep My
  Streak" calls restore; neither touches user_streaks.current_streak. Only the
  turnover-gated POST /api/v1/missions/streak/check-in advances user_streaks - but
  Quest "Current Streak" read user_streaks, so it stayed 0 no matter how many
  times the user tapped check-in / restore.

  Product decision: "Current Streak" = consecutive daily check-in (login) streak,
  counting completed or restored days, month-scoped (resets to 0 on the 1st, no
  cross-month carry - confirmed via AskUserQuestion). 3 days -> miss -> restore
  reads as 4.

  Implementation: pure helper checkInLoginStreak(checkedDates, now) counts the
  consecutive run ending at today (or yesterday when today is not yet checked in)
  with a same-month guard that yields the 1st-of-month reset; restored days count
  because restore writes a check_in_day_ledger (source=restore). Service
  checkInLoginStreakForCurrentMonth loads the current month's ledgers (fail-soft
  to 0). A new field check_in_current_streak is exposed on CheckInCalendarResponse,
  RestoreStreakResult, and MissionProgress - added ALONGSIDE the existing turnover
  current_streak (kept for backward compat; meaning unchanged, deprecate later).
  Quest overview now reads progress.CheckInCurrentStreak via a new loginStreakStatus
  helper (the old streakStatus became dead code and was removed). /missions/check-in
  needs no response-shape change: calendar and overview compute the streak live, so
  the new value appears on the next fetch; restore returns the recomputed login
  streak. user_streaks and /streak/check-in stay as the turnover streak.

  TDD: RED->GREEN check_in_login_streak_test.go (7 cases: empty, 3 consecutive,
  today-not-yet-checked, gap, restored middle day, 1st-of-month before/after) and
  an augmented quest_overview test asserting the streak item shows the login streak
  (4) not the turnover streak (3). go build ./..., go vet, go test ./... all green.
decision:
  action: fix
  details: >-
    Add a month-scoped login check-in streak (completed/restored days) and make
    Quest overview + the check-in calendar + restore responses surface it via a new
    check_in_current_streak field, leaving the turnover streak (user_streaks,
    /streak/check-in) intact for backward compatibility.
