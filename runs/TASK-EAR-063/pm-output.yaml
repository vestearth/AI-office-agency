description: |
  Update /admin/manage/vip so each row reflects the saved VIP UI Setting
  thumbnail presentation. Build the row background from
  uiSetting.thumbnail.background and center uiSetting.thumbnail.thumbnailUrl
  above it. Preserve /vip1.png as the empty-URL fallback and degrade malformed
  backgrounds to transparent. Do not use badge-progress assets and do not
  change backend, API, upload, or persistence behavior.
acceptance_criteria:
  - criterion: Each VIP table row renders a 40x40 background from uiSetting.thumbnail.background with uiSetting.thumbnail.thumbnailUrl centered above it.
  - criterion: Persisted linear and radial enum types and color, opacity, and position stop fields follow the approved design spec.
  - criterion: Empty or missing thumbnailUrl falls back to /vip1.png.
  - criterion: Missing or invalid thumbnail background returns transparent without throwing.
  - criterion: badgeProgress.badgeUrl and badgeProgress.endIconUrl are not used by the table thumbnail.
  - criterion: No backend, API, upload, or persistence changes are introduced.
  - criterion: A focused regression test covers valid composition, image fallback, and missing or invalid background behavior.
  - criterion: npm run build passes in Games-Labs-backoffice.
  - criterion: ruby ai-dev-office/validate-yaml.rb TASK-EAR-063 passes.
plan:
  approach: |
    Follow the approved design at
    Games-Labs-backoffice/docs/superpowers/specs/2026-07-02-vip-table-thumbnail-composition-design.md.
    First add a focused regression test, then implement the smallest adapter for
    the persisted gradient shape and layer the current table image over that
    background. Verify the test and full Nuxt build before review.
  subtasks:
    - order: 1
      id: lock-thumbnail-contract
      description: Add focused failing coverage for valid composition, /vip1.png fallback, and invalid background handling.
      agent: dev
      owned_files:
        - Games-Labs-backoffice/tests/vipLevelThumbnail.test.mjs
      parallel_safe: false
    - order: 2
      id: implement-persisted-gradient-adapter
      description: Add the smallest safe CSS adapter for persisted VIP thumbnail background enums and stops.
      agent: dev
      owned_files:
        - Games-Labs-backoffice/app/utils/vipLevelApi.ts
      parallel_safe: false
    - order: 3
      id: compose-vip-table-thumbnail
      description: Layer the configured image over the persisted background in the VIP table without using badge-progress assets.
      agent: dev
      owned_files:
        - Games-Labs-backoffice/app/pages/admin/manage/vip/index.vue
      parallel_safe: false
    - order: 4
      id: verify-and-handoff
      description: Run the focused test, Nuxt build, and YAML validator; record evidence for review.
      agent: dev
      owned_files:
        - ai-dev-office/runs/TASK-EAR-063/task.md
        - ai-dev-office/runs/TASK-EAR-063/status.yaml
      parallel_safe: false
  risks:
    - risk: Persisted gradient stops use color while existing UI helpers may expect hex.
      mitigation: Adapt the persisted shape explicitly and test the exact saved enum and stop representation.
    - risk: Malformed saved UI Setting data could break a whole table row.
      mitigation: Return transparent for invalid or incomplete backgrounds and keep the image fallback independent.
    - risk: Badge-progress images could be mistaken for the table thumbnail.
      mitigation: Read only uiSetting.thumbnail and assert that boundary in regression coverage.
  estimated_complexity: low
assignment:
  primary: dev
  parallel: false
  reason: Focused frontend change whose test, helper, and table wiring should be implemented sequentially by one owner.
