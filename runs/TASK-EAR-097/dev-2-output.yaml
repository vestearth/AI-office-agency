summary: |
  Published the approved Store Items shared contract on shared-lib branch
  `feature/TASK-EAR-097-store-items-contract` at commit
  `c8244878a0145f45f33330942fd296c89bc0985c`. The remote commit resolves as
  pseudo-version `v0.0.0-20260712220804-c8244878a014`; PR 14 is open for review.

  AdminOrder now exposes backward-compatible GET
  `/api/v1/admin/special-items/{id}` and adds `item_type`, presence-aware
  `active`, `limit`, and `offset` to the existing list request. Existing routes
  and field numbers are unchanged.

  Create, Update, and `orderpb.SpecialItem` add only the locked Store Items
  fields: `localized_description`, `pass_type`, `detail_from`, `detail_to`, and
  `game_ids`. Existing `level_id` remains the VIP UUID field and existing
  `collection_id` remains the collection reference. The legacy plain
  `description` remains for old clients; the additive locale map uses the
  established Games Labs map pattern and supports th/en/zh/fr/es. Pass-only
  fields default empty for Avatar items.

  Because response round-trip is owned by `orderpb.SpecialItem`, the source and
  generated `orderpb` files were necessarily updated in addition to the PM's
  AdminOrder file list. No consumer repo or local replace directive was changed.

  Verification passed: deterministic targeted generation, focused contract
  round-trip/descriptor tests, `buf breaking --against .git#branch=main`,
  `GOWORK=off go test ./...`, `GOWORK=off go build -mod=readonly ./...`, Swagger
  route/schema checks, and `git diff --check`. Repo-wide `buf lint` remains
  unusable as a gate because of pre-existing lint violations across unrelated
  protos; no new breaking violation was introduced.
