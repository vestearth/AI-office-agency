summary: |
  Bound packaged non-demo Stripe deposits to Order's PrepareCheckoutOrder quote.
  Wallet forwards normalized coupon_code with the authenticated user and idempotency key,
  persists the Order/quote/reward snapshot in transaction metadata, charges Order's final
  minor-unit amount, returns order_id, and fails the unpaid Order when persistence or
  Stripe session creation fails. Plain deposits and UBIT/OneDay flows retain their prior path.
  The shared-lib dependency is updated to v0.0.0-20260824045720-a2181ce77371 without a replace directive.
