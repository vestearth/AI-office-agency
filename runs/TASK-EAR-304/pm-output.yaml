description: |
  Deliver the operator-approved contract: guaranteed expiresAt for Stripe
  package create, same-key replay, independent new-key checkout creation, and
  explicit optional pending-only cancellation that expires Stripe and releases
  the unpaid Order/reservation.
  Preserve non-package/non-Stripe compatibility and never auto-cancel during
  create. Android is read-only; production is not authorized.
acceptance_criteria:
  - criterion: Stripe package create always returns server-authoritative expiresAt; other transaction types remain compatible.
  - criterion: Same-key replay returns the identical transaction, Order, Stripe Session, cashier URL, and expiry.
  - criterion: A new idempotency key may create Package B while Package A remains pending or processing, without changing A.
  - criterion: Owner cancellation is authenticated and idempotent; an owned provider-expired winner can resume only missing Order cleanup and returns CHECKOUT_CANCELLED while preserving payment_status=expired.
  - criterion: Cross-user and unknown ids are indistinguishable; processing, paid, and fulfilled states cannot regress through cancellation.
  - criterion: Shared-lib, Wallet, and Gateway verification passes, followed by authenticated staging acceptance; production remains untouched.
plan:
  approach: |
    Execute sequentially because the shared contract is a publication gate.
    Implement and publish shared-lib first; then implement Wallet lifecycle and
    independent-create behavior; then bump Gateway and verify HTTP serialization;
    finally deploy in order to staging and run the acceptance matrix. Reuse
    existing payment rows, status mapping, Stripe adapter, and internal Order
    FailCheckoutOrder path rather than creating a parallel checkout system.
  subtasks:
    - order: 1
      id: shared-contract
      description: Add and verify additive create expiry and cancel RPC/HTTP/error contracts; stop for publication.
      agent: dev-2
      owned_files:
        - shared-lib/proto/paymentpb/
      parallel_safe: false
    - order: 2
      id: wallet-lifecycle
      description: Preserve independent new-key creates; implement guaranteed expiry mapping, pending-only cancellation, provider-expired recovery, Order cleanup, and race tests.
      agent: dev-2
      owned_files:
        - Games-Labs-Wallet/internal/
        - Games-Labs-Wallet/migrations/
        - Games-Labs-Wallet/go.mod
        - Games-Labs-Wallet/go.sum
      parallel_safe: false
    - order: 3
      id: gateway-contract
      description: Bump published shared-lib and verify cancel/auth/create HTTP contracts.
      agent: dev
      owned_files:
        - api-gateway/gateway/
        - api-gateway/go.mod
        - api-gateway/go.sum
      parallel_safe: false
    - order: 4
      id: staging-acceptance
      description: Deploy in order and verify authenticated replay, Package B while A is pending, optional cancel, expiry, and race behavior; publish Mobile handoff.
      agent: devops
      owned_files: []
      parallel_safe: false
  risks:
    - risk: Cancellation loses to a provider-expiry webhook after the Stripe session is terminal but before Order cleanup is durable.
      mitigation: Re-fetch the owned expired row, resume only its missing idempotent cleanup checkpoint, and retain payment_status=expired; paid/processing/fulfillment winners remain non-cancellable.
    - risk: Partial rollout exposes new fields/routes against old consumers.
      mitigation: Publish shared-lib first, deploy Wallet before Gateway acceptance, and keep changes additive.
  estimated_complexity: high
assignment:
  primary: dev-2
  parallel: false
  reason: Money-sensitive cross-repository API and lifecycle work with a hard shared-contract gate requires sequential senior ownership.
