  agent: done
  description: >-
    Found during the TASK-EAR-322 pre-merge check: TASK-EAR-321's migration
    017 drops user_profiles.lifetime_topup / lifetime_ggr while 009/010 keep
    re-adding them, and Games-Labs-User replays every migration on every
    boot, so each boot burned two pg_attribute slots against the hard
    1600-attribute limit - the same defect class Order (TASK-EAR-331) and
    Missions (TASK-EAR-332) fixed on staging on 2026-09-05. Proven RED with
    a replay test copied from Missions: user_profiles dropped 2->4, total
    13->15 across two Run passes (ev-001).
    FIX (same pattern as 331/332, which edits applied migration files by
    accepted precedent): 009 creates schema_markers(key) and both 009 and
    010 wrap their ADD in a DO block that skips when the marker
    'user_profiles.lifetime_columns_dropped' exists; 017 keeps its DROP IF
    EXISTS and inserts the marker. Net: first boot after this change churns
    once (adds, drops, records), every later boot is a no-op. Proven GREEN
    on a fresh database and on a staging-like database that had already
    replayed the old sequence (ev-002 and the follow-up run); full User
    suite passes. Rollback: delete the marker row and remove 017 from
    run.go.
    SHIPPED: User PR 31 (merge 3fa0c37) deployed on staging, ECS single
    COMPLETED deployment, image staging-sha-3fa0c37; boot log shows 009,
    010 and the 017 drop line with no errors (ev-003) - this first boot
    churns once by design and records the marker; the replay test proves
    the next boot is a no-op. Live surfaces unchanged (/users/me 1063/0,
    admin list+detail 1063/3133391). The TASK-EAR-322 User release branch
    (PR 28, head a90145f) now carries this fix, so prod never runs the
    churning sequence. NOT verified: pg_attribute counts on the staging DB
    directly (no DB access) - the replay test on a staging-like fixture is
    the proof.
