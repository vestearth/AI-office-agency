d behavior.\n+\n | Outcome | Row | Quota |\n |---|---|---|\n-| verified / receiver mismatch | `verified` | charged |\n+| verified / receiver mismatch | `verified` | charged, except zero within a charged 8404 Rule C window |\n | rejected (8404 under rule C) | `rejected` | 1, or rule C |\n | 404 / 4040 | `not_found` | free |\n | duplicate before the bank call | `duplicate` (written even after the client disconnects, VS-044) | free |\n@@ -188,11 +193,77 @@\n   in the 7 days before this deploy. Do not read one of these in a post-deploy window as a\n   regression without checking the task.\n \n-## Still open (2026-11-09)\n-\n-- Production acceptance after a full ICT day.\n-- The merchant notice, which Earth sends.\n-- `refund_decision`.\n+## Full-day ledger verification (checked 2026-11-12 ICT)\n+\n+Acceptance window: 2026-11-10 00:00–24:00 ICT, equivalently\n+`[2026-11-09T17:00:00Z, 2026-11-10T17:00:00Z)`. This is a historical traffic\n+measurement, not a claim about the deployment currently serving production.\n+\n+| Cohort | Rows | Ledger result |\n+|---|---:|---|\n+| 8404 logged charged | 6,824 | Exactly one debit entry and one quota per row |\n+| 8404 logged free | 248 | Zero debit entries and zero quota per row |\n+| Verified within 24 h after a charged 8404 | 522 | Zero debit entries and zero quota per row |\n+\n+The verified cohort was discovered independently from persisted 8404 rows with an actual\n+negative `quota_history` entry, using the same branch, channel, `lower(sending_bank)` and\n+`lower(trans_ref)`. It was not selected from the free-result log. The read includes 9 Nov\n+as prior-day context, then selects verified results on 10 Nov with a strictly positive gap\n+less than 24 hours (the deployed lookup uses `charged_at > now - 24h`). Multiple anchors\n+would be deduplicated by verification identity. The observed 522 anchor/result pairs were\n+also 522 distinct verified rows and matched all 522 free-result logs.\n+\n+8404 decisions were joined individually from CloudWatch to database rows through request\n+correlation; all 6,824 charged and 248 free decisions matched their ledger entries. No\n+missing or ambiguous match, debit discrepancy, unlogged acceptance-day 8404 row, or unmatched\n+free-result log was found. Ledger lookups include `reference_type=verification`, verification\n+ID, branch and package channel; aggregate each ledger lookup before counting rows.\n+\n+The SQL covered both `api` and `line` stored channels, but all observed 8404 rows and all\n+522 verified matches were `api`: LINE had no samples. This establishes the persisted\n+same-identity cohorts and does not establish LINE behavior, the batch public `quota_used`\n+field, alternate bank/reference spellings without a stored identity match, or other dates.\n+No new live verify request or bank call was made.\n+\n+Safety and completeness: AWS profile `vestearth`; PostgreSQL 18.3, database `slip`;\n+`REPEATABLE READ READ ONLY`; 48 serial hourly statements; 5 s statement timeout, 1 s lock\n+timeout, no parallel query workers, 8 MB work_mem; completed ROLLBACK. Maximum statement\n+582.391 ms; entire log/DB audit 54.14 s. CloudWatch pagination completed: 11 pages,\n+7,594 unique events, zero parse errors and zero duplicated events. Join tokens were retained\n+in process memory only; the evidence artifact contains counts, not customer/slip identifiers.\n+\n+The earlier unchanged-outcome audit found API verify duplicate 409: 8,556 before versus\n+10,775 on acceptance day, all zero quota. Other rejected 422: before, 60 code-6501 rows and\n+two adapter-code rows, each one quota; acceptance day, 64 code-6501 rows, each one quota.\n+These rows each matched one outbound HTTP verify log. No additional rejected code had an\n+acceptance-day sample. The HTTP-only audit excludes unrelated paths, LINE and batch outcomes.\n+\n+The October refund-sizing query did not complete: the original task query canceled at\n+5,000.821 ms under the deliberately tighter 5 s cap (task example allows 60 s). This is\n+**no result**, not zero refunds. It reads a month of rejected rows before filtering 8404;\n+no longer scan has been established safe. The approximate query also misses cross-month\n+initial anchors and restarted 24 h windows. No November or additional refund-sizing query\n+has run; wait for Earth to choose a sizing approach or decide against refunds.\n+\n+`merchant_notice` is recorded pass from Earth’s 9 Nov chat confirmation; there is no\n+saved merchant-message artifact. `production_acceptance` was recorded pass on 12 Nov ICT\n+after Michael’s independent review, with the scope limits above in the gate reason. Jason\n+authorized applying this reviewed knowledge update and task-bound closeout. The governed\n+closeout record and `status.yaml` are authoritative for that gate; `refund_decision` remains\n+pending Earth. Neither acceptance nor knowledge publication authorizes a refund or another\n+refund-sizing query.\n+\n+Sources: `ai-dev-office/runs/TASK-VS-063/evidence/ev-005.log`, `ev-013.log`, `ev-014.log`,\n+`ev-017.log`, `ev-018.log`, `ev-019.log`, `ev-020.log` (all in that task evidence directory);\n+`bank8404-ledger-hourly.sql`, `bank8404-ledger-audit.py` in the same directory;\n+`ai-dev-office/runs/TASK-VS-063/status.yaml`. The scripts and counts were checked on\n+2026-11-12 ICT; deployment-era source was inspected at slip-api `d567be9` as well as the\n+original deployment references. Task evidence is local and gitignored; do not imply these\n+files are public GitHub links.\n+\n+## Still open (2026-11-12 ICT)\n+\n+- Earth’s `refund_decision`; no valid refund total is available and no further sizing is authorized yet.\n - Whether `verification_not_found_slips` needs retention (it grows by about one row per 8404\n   slip).\n - The never-verified share.\n",
