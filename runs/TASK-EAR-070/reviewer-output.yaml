summary: |
  Reviewer lane (Claude advisory) for TASK-EAR-070 — Backoffice Event Mission
  Figma UI alignment on feature/TASK-EAR-070-event-mission-figma-ui (commit
  7e75573, Games-Labs-backoffice). Walked all seven acceptance criteria against
  the Figma references (create-step1, create-step2-a) and the authenticated
  smoke evidence, and reviewed the full main...HEAD diff across the five
  touched files. Result: APPROVED.

  All five reworked surfaces (event list, Create steps 1-3, Edit) render
  correctly with live data at the reviewed 1280px viewport and match the Figma
  intent closely: step-1 white pill rows with black-dot radios + blue type /
  yellow condition pills, step-2 locked type pill + right condition pill +
  centered derived Total Game, the "Game Selected" panel with order badges /
  Manage-row red trash / Select dropdown / Clear all, and the combined
  datetime-local Start–End schedule with the "Times are Asia/Bangkok." helper.

  Shared components are safe: SegmentedTabs.vue and RewardBadge.vue source files
  are NOT in the diff, and their ~7 and ~7 other usages (daily/weekly/monthly,
  news-promote, InvitePlanCard, EventPlanCard) are untouched. EventPlanCard
  still consumes both correctly. EventGameSelector honors modelValue ordering,
  keeps ids consistent on add/remove, has index-safe splice-based drag-drop, and
  cleans up both global document listeners (click + keydown) in onBeforeUnmount.
  The datetime-local bridge round-trips with and without seconds through
  toRfc3339Bangkok (which appends :00 only when seconds are absent), and the
  end-after-start validation is preserved on both create and edit. Removing the
  step-2 type tabs left no stranded imports or computeds (tabOptions removed in
  create.vue and edit; dailyDefaultMissionOrder import dropped in edit); the
  Create payload and Edit update payload are unchanged (Edit still sends the
  loaded type via conditionTypeToApi(selectedType.value)). No new bare native
  <select> was introduced; all pre-existing selects retain appearance-none +
  lucide:chevron-down overlays. npm run build passes. No unit-test suite is
  wired (package.json has build/dev/generate/preview/postinstall only), so tests
  are skipped. Three documented deviations (locked type on Edit, retained Active
  column on the list, Clear-all-clears-checkboxes semantics, step-3 Figma
  reference gap) were judged reasonable and are accepted.
