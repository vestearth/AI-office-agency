      event could stamp expired onto a genuinely captured payment. Fix is one
      field - add PaymentStatus: models.PublicPaymentPaid to that input, and do
      NOT set internal Status=success because ClaimPaymentFulfillment requires
      status NOT IN terminal for the retry path to work. This whole branch has
      zero test coverage; FulfillmentFailed appears in no test file.
