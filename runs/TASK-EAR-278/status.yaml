      writes only FulfillmentStatus=failed, leaving payment_status at
      pending/processing and internal status at pending after Stripe already
      captured the money. Reachable from four call sites (lines 125, 128, 132,
      138), the realistic one being loadActivePurchasePackage failing when an
      admin deactivates the package between checkout creation and payment. The
      player is charged while the status API reports payment_status=pending,
      which contradicts the published proto documentation for that value and
      misleads support triage on "I paid and got nothing". It also leaves the
