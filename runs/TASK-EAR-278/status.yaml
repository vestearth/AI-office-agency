      migration 017 backfills historical internal cancelled to public failed so
      pre-existing expired sessions read failed rather than expired (harmless,
      both terminal for clients); the not-found contract returns HTTP 200 with
      status.code 404 in the body, consistent with adminwallethdl precedent but
      it must be called out to Mobile so they read status.code, not the HTTP
