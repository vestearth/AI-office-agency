summary: |
  Phase 2 Wallet work for TASK-EAR-278 is implemented on
  feat/TASK-EAR-278-wallet-checkout-status, branched from origin/staging.

  Shared-lib PR #51 is merged as 13f9f1541f39cd7b6f72ad543283adac5e38b240 and
  published as v0.0.0-20260818102427-13f9f1541f39. Wallet go.mod/go.sum pin
  that exact version with no replace directive.

  Wallet now persists client-facing payment_status and fulfillment_status,
  granted Coin/Diamond snapshots, and Stripe Checkout expires_at on the
  existing payment_transactions aggregate (migration 017). Create starts
  pending/not_started. payment_intent.processing maps to processing.
  checkout.session.expired maps to expired rather than only cancelled.
  A signed paid event claims fulfillment (processing) before granting
  rewards, then stores paid/fulfilled with the exact package amounts.
  Duplicate/reordered failure and expiry events cannot regress a
  paid/fulfilled row or duplicate rewards.

  GetTransactionStatus is ownership-scoped: lookup is WHERE id AND user_id
  from trusted gateway metadata in one query. Unknown and cross-user ids
  return the same 404 Not found body. Existing CreateTransaction behavior
  is unchanged.

