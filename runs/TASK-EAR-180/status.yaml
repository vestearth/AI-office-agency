      full-table-dump case; all green after. Fix scopes both endpoints to
      the gateway-set `userid` metadata; proto field kept on the wire so
      well-behaved clients are unaffected; fails closed on missing
      identity. Games-Labs-Order#19 -> staging (ca4ebf8), go build/vet/test
      ./... green.
      Verified rather than assumed that admin flows survive: Player Detail
      purchase history rides the staff-gated
      AdminOrderService.ListOrdersForUser, and a sweep of the Backoffice
      plus all eight sibling Go services found no other caller of either
      endpoint.
