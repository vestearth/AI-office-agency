    with no *http.Request — identity is metadata), and writeServiceError
    does not apply (HTTP-mux only; gRPC returns basepb.StatusResponse,
    which preserves codes natively). Admin flows verified safe — Player
    Detail purchase history uses the staff-gated
    AdminOrderService.ListOrdersForUser with its own repo query.
