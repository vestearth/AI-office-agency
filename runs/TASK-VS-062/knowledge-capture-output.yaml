note_patch: |
  Proposed addition only: local v3 is tested but awaits independent re-review;
  it is not committed, merged or deployed. Supersedes the earlier v1/v2 proposal.

  ## Receiver-mask policy and parser boundary — TASK-VS-062

  Earth chose full-length bank masks to use positional-only matching, requiring
  at least four visible digits. Valid shortened masks and unmasked numbers retain
  legacy rules. Invalid characters and overlong masked strings must be rejected
  before the shortened-mask suffix path; otherwise a conflicting full mask can
  regain acceptance by adding an unknown character. Reviewer reproducer and
  fake-repository Confirm tests failed before the local fix and pass after it.
  PromptPay/type/AND/bankCode/priority and first-match semantics remain unchanged.

  At the readonly prod snapshot2026-11-05T18:35:50Z, all33 stored credited live
  payments are assessable and accepted by v3 (28 sendingBank006,5 sendingBank004).
  Zero old-suffix/v2-accepted rows become rejected. Five older004 rows already
  fail the suffix-only rule but pass positional matching. Only aggregate counts
  were exported; this compares stored number fields with current linked settings,
  not full payment flows or original provider responses. Earth's later supplied
  aggregates agree; no DB query followed the no-repeat instruction.

  Local full tests/build/vet and Linux/amd64 build pass; Docker Desktop is paused,
  so container-image build and CI/runtime recovery are unverified. Existing DB
  integration tests require test DSNs. Partial-mask identity and first-match
  ambiguity remain; positive history does not prove receiver ownership. No actual
  credit operation, Git commit, publication, deployment or vault write occurred.

