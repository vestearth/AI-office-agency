summary: >-
  Implemented slip-api blog creator/editor attribution and best-effort activity
  history on f31fd458bdfe5b8fad33b5617e6ba2963a6903ae. PR 133 targets main.
  Admin-only actors, secondary-write attribution, compact snapshots and
  actor_name are covered by PostgreSQL integration and full race tests.
artifacts:
  - path: slip-api/migrations/082_blog_actor.sql
    action: created
    description: Four nullable actor FKs, widened NOT VALID activity CHECK, bounded DDL lock wait; Down retains history.
  - path: slip-api/internal/blog/activity.go
    action: created
    description: Explicit admin post shape, actor context and compact committed activity snapshots.
  - path: slip-api/internal/blog/repository.go
    action: modified
    description: Actor reads/writes and locked snapshots including unfeature, cover and delete.
  - path: slip-api/internal/blog/category_repository.go
    action: modified
    description: Category actors and activity, rename count and per-post delete-with-move history.
  - path: slip-api/internal/blog/handler.go
    action: modified
    description: Supply the activity logger to writes; serialize actors only on admin post routes.
  - path: slip-api/internal/blog/category_handler.go
    action: modified
    description: Carry the activity logger through every category write.
  - path: slip-api/internal/models/admin.go
    action: modified
    description: Blog entity types and additive actor_name field.
  - path: slip-api/internal/repositories/activity_log.go
    action: modified
    description: Current actor name joined from users without changing history pagination/filter shape.
  - path: slip-api/internal/core/service/admin.go
    action: modified
    description: Allow both blog entity filters on the existing history endpoint.
  - path: slip-api/internal/blog/activity_test.go
    action: created
    description: Compact snapshot privacy, explicit admin serialization and empty changed lists.
  - path: slip-api/internal/blog/actor_integration_test.go
    action: created
    description: Two editors, write coverage, null/deleted users, history HTTP/paging, public keys and migration lifecycle.
  - path: slip-api/internal/handler/router/router_test.go
    action: modified
    description: Real AdminAuth rejects unauthenticated blog and history requests with 401.
  - path: slip-api/migrations/run_test.go
    action: modified
    description: Inventory assertion expects all 82 SQL files; main already had 081 while its old count was 79.
  - path: slip-api/README.md
    action: modified
    description: Frontend handoff contract, deployment order, best-effort limit and rollback behavior.
