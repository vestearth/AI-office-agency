claims:
  - claim: Initial attribution test fails on the unimplemented behavior and passes with the change.
    evidence_refs: [ev-002, ev-017]
    result: Missing created_by on original admin create; final commit passes.
  - claim: The final commit passes the full race suite with local PostgreSQL integration enabled.
    evidence_refs: [ev-017]
    result: >-
      go test -race -json ./... -count=1 passed on clean f31fd458;
      585 test/subtest pass events, zero skipped or failed tests. Blog,
      repository and migration test DSN environments were all enabled on
      disposable localhost PostgreSQL 16 databases.
  - claim: The final commit passes vet and a readonly standalone build.
    evidence_refs: [ev-015, ev-016]
    result: go vet ./... and GOWORK=off go build -mod=readonly ./... both exit 0.
  - claim: Migration 082 passes Up/Down/Up, direct replay, FK enforcement and retention checks.
    evidence_refs: [ev-009, ev-013, ev-017]
    result: >-
      Focused goose lifecycle starts with legacy blog rows on a fresh isolated
      schema; Down drops only actor columns and preserves blog history and the
      widened CHECK. Full repository integration also uses the real boot runner
      in a disposable public-schema database. NOT VALID still rejects unknown
      new entity types; no existing rows are attributed by backfill.
  - claim: Public blog keys and article content privacy remain covered.
    evidence_refs: [ev-013, ev-017]
    result: >-
      All three public blog list/detail/category responses retain exact keys
      with populated admin actors; no actor fields/emails are serialized.
      Activity records contain compact snapshots and changed field names,
      excluding long article content. Every admin blog route and activity
      endpoint rejects missing authorization with 401.
  - claim: Independent review and environment acceptance have not occurred.
    result: >-
      Implementation PR only. No merge, staging/prod deploy, live acceptance,
      production activity row-count preflight, or rollout log observation was performed.
