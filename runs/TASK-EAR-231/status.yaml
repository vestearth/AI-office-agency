next_action:
  agent: reviewer
  description: >-
    Games-Labs-Auth#4 open on staging, not merged — three clean commits
    (shared-lib bump, publisher infra + guarded accessor, handler wiring
    + tests). This is the SIXTH and last audit-modal scope to get a
    publisher.
    The agent went beyond the spec in two places and both are right.
    First, LEAK HARDENING the spec did not ask for: the reference
    handlers put err.Error() into the failed Reason, but here an internal
    error can wrap the player's email — an SMTP 550 bounce — so
    failureReason() keeps only static invalid-request messages and
    collapses everything else to "internal error". Coordinator verified
    invalidRequestCode is derived (errormsg.ErrorInvalidRequest("").Code)
    rather than a hardcoded 1002.
    Second, it deliberately did NOT use RequireStaffMetadata even though
    that is the obvious helper, because it discards td on failure — which
    would make the denied event unattributable, and "who was refused" is
    exactly what an unthrottled endpoint needs recorded. It used
    ConvertMetaDataToUserData + StaffAccessAllowed instead, one metadata
    read, and coordinator confirmed the MetaDataNotFound and
    InsufficientStaffAccess responses are preserved byte-for-byte.
    The code-leak test scans the WHOLE marshalled event for five secrets
    at once (email, OTP, reset token, bcrypt hash, 64-hex bearer) by
    feeding the service an error embedding all of them.
    NOT staging-verified — impossible before merge+deploy, and the agent
    said so rather than fabricating. After deploy: trigger a reset for the
    QA player, read /api/v1/admin/audit-events, and grep the RAW body for
    the OTP and the player's email. Repeated actions= params, never
    comma-joined.
history:
  - phase: assigned -> in_review
    agent: dev
    at: '2026-08-08'
    reason: >-
      Delivered as Games-Labs-Auth#4. Coordinator verified the two
      judgement calls that went past the spec rather than taking them on
      trust: failureReason's derived invalid-request code, and the
      identity swap preserving the exact prior status responses. Both
      hold. The RequireStaffMetadata reasoning is the more interesting of
      the two — the obvious helper would have been the wrong choice
      precisely because it throws the actor away on refusal, and this run
      needs refusals attributable since the endpoint has no rate limiting.
      That is the kind of thing a spec cannot anticipate and an
      implementer has to notice. Sixth and final publisher; the epic's
      publisher work is complete pending merge.
  - phase: pending -> assigned
    agent: pm
    at: '2026-08-07'
    reason: >-
      Scoped read-only first, which again changed the shape of the work.
      The scope name pointed at Auth but that was worth proving rather
      than assuming — Games-Labs-User has zero password-reset matches and
      the whole chain from the backoffice button to the service was traced
      instead. Staff identity turned out to be present and, unlike Wallet
      where a sibling helper had to be reused, here the very call the
      handler already makes returns the TokenData it then throws away.
      That is now three consecutive scopes where a "large prerequisite"
      dissolved on inspection. The security shape is unusually favourable
      and worth protecting deliberately: the OTP, reset token and resolved
      email all live in the service, so the handler physically cannot leak
      them — the spec therefore forbids enriching the event by plumbing
      them up, because the obvious "improvement" is the dangerous one.
      Also recorded two real gaps found in passing that are NOT this run's
      to fix: the reset endpoint has no rate limiting at all, and
      api-gateway's ratelimit middleware exists but is never wired.
      Claude advisory lane.
