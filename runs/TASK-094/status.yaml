- phase: in_progress (date-picker fixes)
  agent: dev
  reason: >
    Two UI bugs found during user smoke test of the create modal, both fixed.
    (1) Sale Start/End date-picker popup was clipped inside the modal's
    overflow-y-auto — passed `centered` to both pickers (renders the menu
    centered above the overlay, the component's documented modal mode).
    (2) "Invalid Sale Start date" on Create — root-caused via browser+source:
    StoreSaleDatePicker's `format` prop wasn't reaching the inner VueDatePicker
    (confirmed by props inspection), so it used the library default
    `MM/dd/yyyy, HH:mm`, which the dd/MM parser rejected; worse, MM/dd vs dd/MM
    is ambiguous. Fix at the source: added an opt-in `iso` prop to
    StoreSaleDatePicker that switches model-type to "iso" (locale-proof ISO
    8601, since vue-datepicker emits Date.toISOString()); packages create+edit
    now use `iso` and a trivial normalizeIso() instead of fragile format
    parsing (removed isoToPicker/pickerToIso). Default behavior unchanged for
    the other mock pages (pass/avatar/items/coupon). Verified end-to-end on a
    dummy token: picking a date no longer shows "Invalid Sale Start date" — the
    flow proceeds to the real POST, which returns the gateway 401 (token), i.e.
    date validation passes and create wiring fires. nuxi typecheck still 18
    pre-existing errors, none in touched files. Note: display still shows
    MM/dd/yyyy (the format prop not applying is a pre-existing cosmetic issue
    across all StoreSaleDatePicker usages, out of scope for this bug).
