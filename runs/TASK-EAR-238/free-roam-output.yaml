summary: |
  Operator approved building Manage Payment Gateway. Discovery found no admin
  PSP/catalog contract: shared-lib adminwalletpb has balance/history/rate-catalog
  only; Order has no PaymentGateway RPCs; api-gateway only proxies player
  `/payments/stripe-webhook` and `/payments/ubit-deposit-callback`. Wallet
  Stripe/Ubit remain player runtime — out of this admin catalog scope.

  Product decision recorded: dedicated Manage Payment Gateway page (not hide
  menu). Implemented BO surface with honest contract-pending empty state,
  runtime boundary note, disabled Create/Manage until contract lands, removed
  catch-all mock registration for manage/payment-gateway. No localStorage fake
  catalog. Figma MCP rate-limited; UI mirrors Provider Manage list patterns.
  admin.vue touched only for Payment Gateway title/breadcrumb (nav left intact;
  Free Coin / Tracking / Game pages untouched).

  Focused tests: adminPaymentGatewayApi + adminPageDataMockCleanup — 6/6 pass.

decision:
  action: fix
  details: |
    No admin API to wire list/create/update yet. Fix = dedicated page + honest
    contract-pending UX superseding silent mock. Proto follow-up is a blocker
    for Connected CRUD. Route to reviewer.
  sub_tasks: []

