    description: Removed manage/payment-gateway catch-all mock registration
  - path: Games-Labs-backoffice/app/layouts/admin.vue
    action: modified
    description: Payment Gateway pageTitle + breadcrumb only (nav unchanged)
  - path: Games-Labs-backoffice/tests/adminPaymentGatewayApi.test.mjs
