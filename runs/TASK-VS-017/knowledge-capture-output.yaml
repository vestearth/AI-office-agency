note_patch: |
  ## TASK-VS-017 — client idempotency keys (2026-10-05)

  The live `POST /v1/slips/verify` and `/v1/slips/verify/qr-code` handlers accept
  requests without `Idempotency-Key`, warn, and return a per-request
  request-ID fallback in the response header. This avoids requiring every
  caller to send a key but does not make an uncertain retry idempotent: the
  next HTTP attempt receives a different request ID. A caller must retain and
  reuse a stable key across attempts. Deriving the key only from payload can
  replay an intentional later verification. The API keeps `not_found`
  retryable after its cooldown.

  TASK-VS-017 makes the first-party manual QR UI send a UUID key and reuse it
  for the same branch and file content after a failed or timed-out attempt. It
  also adds `Idempotency-Key` to allowed-origin CORS preflight headers and
  clarifies the live endpoint guidance in the developer page. The API CORS
  addition was deployed before the new frontend. Frontend PR #8 deployed as
  production ECS task definition :40 (1/1, COMPLETED), and a production
  preflight from the configured app origin returned 204 with
  `Idempotency-Key` allowed. The attached warning is for
  `/v1/slips/verify`, while the first-party UI uses
  `/v1/slips/verify/qr-code`. After the UI deployment, production logs still
  recorded 444 missing-key warnings on the payload route from 15:00-15:04 Thai
  time. An
  AWS CLI comparison across all 17 enabled regions found no match between that
  caller IP and this account's EIPs, network interfaces, or NAT gateways; the Node caller's owning
  repository remains unidentified. The UI fix does not establish that those
  warnings ended.

