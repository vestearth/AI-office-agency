summary: |
  Replaced Store Items seed/local persistence with the DB-backed AdminOrder
  vertical slices. The list and collection modal now load/create canonical UUID
  records; Avatar and Pass create/edit use real VIP and game lookup UUIDs,
  upload selected files only on explicit confirmation, and re-fetch from the API
  after every write.

  Commit `cf530bd` was pushed as Backoffice PR 31:
  https://github.com/SparqLab/Games-Labs-backoffice/pull/31

  The central composable preserves the additive TASK-EAR-096 contract, including
  localized descriptions and every Pass-only field (pass type, detail from/to,
  and game IDs). Pass keeps collection optional while Avatar sends a required
  collection UUID. No dependency, backend, gateway, proto, or generated-code
  change was needed.

  Verification: all 98 repository Node tests pass with the repo alias loader,
  the production Nuxt build passes, focused Store Items tests pass 6/6, and
  git diff --check passes. Repo-wide typecheck remains blocked by pre-existing
  errors outside this task's files. Browser/runtime and Website visibility smoke
  could not complete because no browser backend was available, Nuxt dev hit
  EMFILE watcher limits, and both dev Website endpoints returned HTTP 502.
