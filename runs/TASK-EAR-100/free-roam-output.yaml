blockers:
  - "A published additive shared-lib contract is required before either service implementation can consume generated types."
  - "Order must deploy complete non-admin catalog lookup plus special_item_aliases migration, resolver, and legacy backfill."
  - "User and Order must share a stable VIP identity or an authoritative eligibility decision compatible with the approved VIP UUID semantics."
  - "Missions must wait for both provider implementations before removing duplicate catalog authority and enabling server-authoritative idempotent buys."
