blockers:
  - "No non-admin Order lookup/list contract returns complete canonical SpecialItem data needed for price, item type, pass type, VIP, and stable-ID validation."
  - "The approved Order-owned special_item_aliases table/resolver and legacy backfill are absent, so legacy Missions IDs cannot be resolved without a duplicate local mapping."
  - "The current User service profile response does not expose user VIP level or an eligibility decision, so Missions cannot enforce level_id eligibility server-side."
  - "Per workspace policy, the required shared-lib contract must be published before downstream Missions implementation; using AdminOrder or inventing local DTO/authority is not an acceptable workaround."
