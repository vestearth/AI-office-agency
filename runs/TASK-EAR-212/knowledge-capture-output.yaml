note_patch: |
  ## Proposed patch (insert after the "Idempotent is not the same as one-shot (TASK-EAR-157...)" section, before "The second lane has its own contract")

  ### Seed / catalog resurrection is the same trap (Missions store_packages, 2026-08-05)

  Idempotent seed SQL can resurrect deleted catalog rows (or even recreate a
  dropped table) on every boot. In Games-Labs-Missions, `001_baseline_compacted.sql`
  historically did `CREATE TABLE IF NOT EXISTS store_packages` and
  `INSERT ... ON CONFLICT (id) DO UPDATE SET` for `first_timer`, `pkg_i`..`pkg_vi`,
  `pass_golden`, and `pass_bonus`. Because `migrations/run.go` replays every
  file each startup, a manual `DROP TABLE` / `DELETE` did not stick across
  restart. `046_canonical_store_item_operations.sql` only removed pass-category
  rows after that seed, so non-pass packages always returned; pass rows were
  reseeded then deleted again each boot.

  Treat seed upserts the same way as value-clobbering backfills: if operators
  or later ownership moves are allowed to remove local rows, either one-shot
  the seed with a marker, stop seeding mutable catalog data, or accept that
  replay will reinstate the baseline forever.

  Retirement landed in TASK-EAR-212 / `migrations/052_drop_store_packages.sql`
  (`DROP TABLE IF EXISTS`), with baseline CREATE/seed removed and 010/046
  guarded for a missing table. Deployed catalog is Order `order_packages`
  when `USE_ORDERS_CATALOG=true`; StoreService fail-closes on Order errors
  (no local DB package fallback). Local `USE_ORDERS_CATALOG=false` keeps
  in-memory seed only.

