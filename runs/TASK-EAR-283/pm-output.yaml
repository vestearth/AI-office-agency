        - Games-Labs-backoffice/app/composables/useAdminPlayerPurchaseHistory.ts
        - Games-Labs-backoffice/app/composables/useAdminPlayerPointHistory.ts
        - Games-Labs-backoffice/app/composables/useAdminPlayerSendCoinHistory.ts
        - Games-Labs-backoffice/app/composables/useAdminPlayerStorePurchases.ts
      parallel_safe: false
    - order: 3
      id: wire-approved-report-sections
      description: Pass the canonical route UUID into report components and replace approved Game/History mocks with typed API state; apply the documented Provider, Promotion, and Summary disposition.
      agent: dev-2
      owned_files:
        - Games-Labs-backoffice/app/pages/admin/monitoring/report/player/[id].vue
        - Games-Labs-backoffice/app/components/PlayerReportGameTab.vue
        - Games-Labs-backoffice/app/components/PlayerReportHistoryTab.vue
        - Games-Labs-backoffice/app/components/PlayerReportProviderTab.vue
        - Games-Labs-backoffice/app/components/PlayerReportPromotionTab.vue
        - Games-Labs-backoffice/app/components/PlayerReportSummaryPanel.vue
      parallel_safe: false
    - order: 4
      id: verify-report-wiring
      description: Add focused API-wiring tests, then run npm test and npm run build from Games-Labs-backoffice.
      agent: dev-2
      owned_files:
        - Games-Labs-backoffice/tests/playerReportApiWiring.test.mjs
      parallel_safe: false
  risks:
    - risk: The requested no-mock route includes Provider, Promotion, and Summary data not returned by the four specified existing API families.
      mitigation: Require the documented decision gate; split a new backend projection into a separately authorized task instead of deriving semantics in the frontend.
    - risk: Existing composables turn response-envelope failures into empty arrays and page internally with capped fetch-all loops.
      mitigation: Return typed page results and error state directly to the table layer before enabling server pagination.
    - risk: Nullable win/counter fields can be mistaken for zero values.
      mitigation: Preserve established null-to-dash semantics and cover them in focused tests.
  estimated_complexity: high
assignment:
  primary: dev-2
  parallel: false
  reason: The route spans a page, six presentation components, five shared API composables, state/error/pagination behavior, and a product/API coverage decision; the shared composable changes must be sequential.
