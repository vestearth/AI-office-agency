description: |
  Replace mock data only on admin/monitoring/report/player/:id using the
  canonical UUID in route.params.id. Current source verifies that the existing
  game-activity, point/wallet-history, orders-for-user, and store-purchases
  APIs can supply Game and most History Transaction content. It does not verify
  an existing per-player data source for Provider turnover, Promotion
  redemptions/grants, or all Summary cards. This is a mandatory decision gate:
  do not fabricate values, treat an envelope failure as an empty result, or
  silently replace unsupported sections with zeroes.
acceptance_criteria:
  - criterion: Approved API-backed sections call APIs with route.params.id as the canonical UUID; the display Player ID/name is never used as the API identity.
  - criterion: Approved Game and History Transaction tables show API data with deliberate loading, empty, HTTP-error, envelope-error, nullable, and server-paginated states.
  - criterion: Each selected page sends limit/offset to the API and uses its returned total; no arbitrary fetch-all cap is used to simulate table pagination.
  - criterion: A non-success API envelope is rendered as an error state distinct from a successful empty response.
  - criterion: Provider, Promotion, and Summary render no mock, fabricated, guessed, or zero-valued data; each has an approved API contract or an explicit unavailable-state disposition.
  - criterion: Existing screens outside admin/monitoring/report/player/:id are unchanged.
  - criterion: Focused frontend tests pass, followed by npm test and npm run build in Games-Labs-backoffice.
plan:
  approach: |
    Resolve the unsupported-section contract before coding. Then extend existing
    composables rather than duplicating API clients so each call returns page
    rows, total, and a distinguishable envelope/API failure. Thread the route
    UUID and typed outcomes through the report page into the approved tab
    components. Keep unavailable semantics explicit where no approved endpoint
    exists, and verify the route with focused tests plus the production build.
  subtasks:
    - order: 1
      id: resolve-report-coverage
      description: "Record the product/API disposition for Provider, Promotion, and Summary: approved existing endpoint and fields, or an explicit unavailable state and narrowed scope."
