summary: |
  Wave 2 of the Store Player Log (TASK-EAR-346) on staging. Item C: no defect -
  the "SuperAdmin" username on order f2df1830 is player f737e6f3's own User
  profile displayName (the devtest staff account is that player); Store rows
  resolve the player's profile, actor_name is bound only on admin-action rows.
  Item A: no-op - Logs decodes payload at query time and shared-lib #76 kept
  the JSON keys, so pre-cutoff Package rows already show promo/original/paid
  and non-zero discount; never-emitted fields stay dashes (caveat: pre-Wave-1
  omitempty dropped real zero discounts, recoverable only via an Order ledger
  join, parked). Item B: Missions #131 (staging e2bd1b7, ECS task-def :147)
  adds `./main backfill-store-events --before <RFC3339> [--apply]`; the event
  builder is shared with the live producer (byte-identical event proven by
  test). Run as one-off ECS tasks: dry-run 74 candidates (58 pass / 16 avatar,
  9 users); --apply published 74, Store tabs Pass 1->59, Avatar 1->17,
  Package 50->50; the 9 wallets are byte-identical before/after; a second
  --apply republished 74 and totals stayed 59/17/50 (Logs admission dedupe).
  Item D stays parked pending product input. Prod untouched.
artifacts:
  - path: Games-Labs-Missions/cmd/backfill_store_events.go
    action: created
    description: backfill-store-events subcommand; --before required, dry-run default, --apply publishes via the live RabbitMQ publisher, no migrations, no Wallet call.
  - path: Games-Labs-Missions/cmd/backfill_store_events_test.go
    action: created
    description: Arg parsing - RFC3339 cutoff required, apply default false, bad inputs rejected.
  - path: Games-Labs-Missions/cmd/main.go
    action: modified
    description: Dispatch the subcommand before server boot.
  - path: Games-Labs-Missions/internal/services/store_backfill.go
    action: created
    description: BackfillStorePurchaseSettled over the durable ledger with a JSON report (deterministic event ids, user ids, counts).
  - path: Games-Labs-Missions/internal/services/store_backfill_test.go
    action: created
    description: Live-vs-backfill byte-identical event, dry-run publishes nothing, per-event failure counting, nil publisher fails closed, missing keys skipped.
  - path: Games-Labs-Missions/internal/services/player_activity.go
    action: modified
    description: Extract newStorePurchaseSettledEvent so the live producer and the backfill share one snapshot builder.
  - path: Games-Labs-Missions/internal/repositories/store_repo.go
    action: modified
    description: ListCompletedStorePurchasesBefore - global, completed-only, updated_at < cutoff, oldest first.
  - path: Games-Labs-Missions/internal/repositories/store_backfill_repo_test.go
    action: created
    description: sqlmock coverage for the lister SQL shape and updated_at scan.
  - path: Games-Labs-Missions/internal/models/models.go
    action: modified
    description: StorePurchaseOperation.UpdatedAt (completion time stamped as occurred_at).
  - path: ai-dev-office/runs/TASK-EAR-351/evidence/
    action: created
    description: ev-A-01, ev-C-01, dry-run/apply-1/apply-2 reports, wallet before/after, test and build logs.
