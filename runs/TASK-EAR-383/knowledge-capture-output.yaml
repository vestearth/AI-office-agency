note_patch: |
  Append a dated follow-up to the existing Mission report subsection. The
  operator requested three Weekly Report header figures: distinct Completed /
  Participants, actual Reward Claimed, and actual Bonus Claimed. The new
  shared-lib contract merged in PR #85 (target main) and its Go pseudo-version
  resolves as v0.0.0-20261001035032-8868d5e35cff. Missions PR #134 and
  gateway PR #81 adopt it on staging branches; Backoffice PR #163 binds the
  three cards on its main branch. Missions counts distinct people across the
  selected plans and returns claim snapshots by currency with separate
  completeness flags. Migration 056 adds nullable plan attribution to new
  claims. Historical claims stay unattributed because plan edits make a
  backfill ambiguous; incomplete amounts render as a dash. All three PRs are
  open, and staging runtime and claim-ledger acceptance remain unverified.
