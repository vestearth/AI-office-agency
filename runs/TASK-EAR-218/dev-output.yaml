summary: |
  Stopped the player audit-log modal header rendering a mock identity over a
  real player's audit rows. PlayerAuditLogModal no longer takes a player
  object at all — it takes resolved display strings (username /
  displayUserId / referralCode / status), so no caller can hand it a
  mockPlayerDetail record. The edit page feeds it the API-backed computeds
  it already had (displayEditUserName / displayEditUserId /
  displayEditReferral), plus a new displayEditStatus. No new fetch.

  On status: a real source DOES exist (profileSummary.playerStatus, mapped
  from the admin user API status field), so the chip is now real-backed
  rather than left on mock. displayEditStatus resolves real profile ->
  matched mock row -> null, and the chip renders an em dash for null using
  the badge's existing neutral classes. The page's own editPlayerStatus ref
  was deliberately NOT reused: it is an editable draft that defaults to
  'active' before any profile loads, and defaulting a badge beside a real
  audit trail would restate the same defect.

  Data source only — no markup, classes or layout changed. TASK-EAR-208's
  :user-id table wiring untouched. Authenticated staging smoke on the named
  player passed with real data on both header and row. PR #77 opened, NOT
  merged (backoffice main = real k3s/ArgoCD deploy).

