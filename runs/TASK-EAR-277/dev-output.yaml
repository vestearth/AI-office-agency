summary: |
  Removed the leftover CreateWalletForUser 1000 seed so new wallets start at 0.
  First-time coins now come only from GrantFreeCoinToNewUser on user.registered
  (idempotent RewardPackage, key free_coin:<user_id>). Amount 0 still means the
  promotion is off. The Free Coin amount is not folded into the INSERT, so the
  ledger and exactly-once key stay on the grant path.

  Regression TestCreateWalletForUserInsertsZeroCoins failed while
  defaultUserCoinBalance existed, then passed after the delete. Full Wallet
  GOWORK=off go test ./... and go build -mod=readonly ./... passed (ev-002,
  ev-003). ev-001 is a sandbox module-unzip failure of the same test command,
  not a product failure.

  Missions ClaimFirstRegister comment and knowledge-base notes now match:
  Field Lineage, Free Coin disposition, Gap Inventory, Manage queue, and the
  Admin CRUD lesson. Existing wallets are not retroactively debited. Android
  registration copy may still say +1000 (read-only; not edited). No commit or PR.
