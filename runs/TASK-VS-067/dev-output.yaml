  - claim: Metric label follows revised spec 863690b9.
    evidence_refs: [ev-014, ev-020]
    result: >-
      RED on previous PR commit for unlisted numeric codes. GREEN on current
      commit: request-only NormalizeBankCode plus numeric-code membership in the
      existing lineBankNames table. Known codes retained, empty/malformed/alias/
      unlisted codes unknown. Provider bank cannot select the label. Warn metadata
      is not folded by the metric allowlist.
  - claim: Privacy test runs against real implementation and first proves an emitted rejection with safe fields before checking exclusion.
    evidence_refs: [ev-020]
    result: 'PASS: Warn/message, request_id, reason, masked account, hash and other safe fields asserted before negative checks for names, accounts and full reference.'
  - claim: Full default race suite, readonly build and go vet pass on exact PR commit 0c5b3476.
    evidence_refs: [ev-020, ev-021, ev-022]
    result: 'PASS. Optional infrastructure-dependent integration tests retain their existing environment gates; no live database/provider test is claimed.'
  - claim: Production acceptance remains unverified.
    evidence_refs: [ev-009, ev-010]
    result: >-
      Earlier read-only check at 2026-11-09 07:50 UTC verified AWS identity
      as vestearth/account 122991883560. That check found production task
