summary: >-
  Implemented slip-api top-up rejection observability on 0c5b3476, draft PR
  https://github.com/SparqLab/slip-api/pull/131 into main. All 19 inspect error
  scenarios emit a single Warn with stable reason and request_id, bounded-label
  counter increments using normalized request bank codes from the existing known-bank table, sanitized receiver shape and truncated SHA-256 reference.
  Access/stored error extraction reads rejection_reason after existing fields.
  API response, schema, dependencies, frontend and runtime deployment are unchanged.
artifacts:
  - path: slip-api/internal/core/service/payment.go
    action: modified
    description: Instrument all inspect error exits; shared by Submit and Confirm.
  - path: slip-api/internal/core/service/payment_observability.go
    action: created
    description: Stable reasons, allowlisted log fields, receiver mask and bounded bank labels.
  - path: slip-api/internal/core/service/payment_observability_test.go
    action: created
    description: Every error exit, shared entry points, PII exclusion, masking and counter deltas.
  - path: slip-api/internal/models/reports.go
    action: modified
    description: Extract rejection_reason while preserving existing message/outcome precedence.
  - path: slip-api/internal/models/reports_test.go
    action: modified
    description: ErrorReason regression and precedence cases.
  - path: slip-api/internal/handler/middleware/audit_test.go
    action: modified
    description: A rejected payment logs its reason without echoing slip data.
  - path: slip-api/internal/observability/metrics.go
    action: modified
    description: Register slip_api_payment_rejections_total with reason and sending_bank.
