---
summary: |
  The monitoring Event tab now reads GET /api/v1/admin/event/report, a new
  typed read (ListMissionEventReport) beside the free-form ListMissionEvents.
  The CRUD list stays a Struct because the Event Plan board binds it and
  typing it would turn its int64 fields into JSON strings. The Struct could
  not be report rows: it has no players, completed, or claimed fields and
  cannot tell an absent count from a zero.
  Each row is one admin event. players and completed_players are proto3
  optional and set only for join-gated events (selected games, or SPEND_PROP
  with a spend target for completed). They stay unset for a legacy
  progress-source event, and for an event with reward claims from people
  who never joined (SPEND_PROP claimed before the join gate a66b37c,
  2026-08-05). That second rule came from the first staging read, which
  showed "Spend withdfghfg" with 0 players next to 600 COIN claimed. It was
  fixed in Missions PR 138.
  shared-lib PR 92 is on main at v0.0.0-20261009144157-9336cd444c72.
  Missions PRs 137 and 138 and api-gateway PR 88 merged to staging.
  Backoffice PR 169 merged to main (no staging branch) and deployed as
  sha-3188603.
  Authenticated admin-dev read on 2026-10-10: 14 API rows matched 14 table
  rows with 0 mismatches. The header was -/- with both reasons, and the
  total was 800 COIN + 200 POINT. Staging has no empty list, so the empty
  case was read by swapping the real response for the server's empty shape:
  "No mission report entries found.", 0/0, reward 0. The unavailable copy is
  gone.
