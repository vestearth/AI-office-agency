description: |
  See task.md. Design decided by the operator on 2026-10-23 (all four
  recommended options): implement here end to end; Sigma rounds stay blank;
  Game persists currency on round_lifecycles with an idempotent migration;
  no historical backfill.

  Evidence at Provider 9049261 / Game 609217f (origin/staging):
  - AFB payout sends COIN to Wallet for every leg (afb/service.go).
  - OneUp bets/result debits and credits oneUpDefaultCurrency = COIN.
  - VP betNSettle sends vpSeamlessWalletCurrency = "coin".
  - IDG bet and win always send idgWalletCurrency = COIN (the passed currency
    is ignored in idgDoWalletTransaction).
  - GGSoft sends ggsoftWalletCurrency(req.Currency): THB maps to COIN, other
    values pass through, empty request currency defaults to "idr".
  - Sigma walletOp returns a zero balance and never calls Wallet, so a Sigma
    round has no provable currency.
  Game normalizes with TrimSpace + ToUpper so Logs' exact `currency = 'COIN'`
  match holds for VP's lowercase value.
acceptance_criteria:
- criterion: A Provider test per path (AFB, OneUp, VP, IDG bet and win, GGSoft THB
    and non-THB) proves SettleRoundInput.Currency equals the currency sent to Wallet;
    a Sigma test proves it is blank.
- criterion: A Game test proves round.settled, round.outcome_updated and round.reversed
    carry the stored upper-cased currency, and a request without currency publishes
    a blank one.
- criterion: The migration replays twice on a fresh database without error, and the
    schema drift test resolves the new repository SQL.
- criterion: After deploy to staging, a new COIN round's monitoring_round_outcomes
    row has currency COIN; Sigma rounds stay blank.
plan:
  approach: |
    Proto field first, published to shared-lib main. Game and Provider pin that
    commit with no replace. Proto3 makes either deploy order safe (an old Game
    ignores the field, an old Provider leaves it blank); deploy Game first so
    the column exists before currency arrives.
  subtasks:
  - order: 1
    id: shared-lib-contract
    description: Add SettleRoundRequest.currency and regenerate.
    agent: dev
    owned_files:
    - shared-lib/proto/gamepb/*
    - shared-lib/events/player_activity.go
    parallel_safe: false
  - order: 2
    id: game-persist-and-stamp
    description: Migration 034, model, handler, service, repository, events, tests.
    agent: dev
    owned_files:
    - Games-Labs-Game/**
    parallel_safe: true
  - order: 3
    id: provider-send-currency
    description: Pass the wallet currency on every SettleRound call; tests per path.
    agent: dev
    owned_files:
    - Games-Labs-Provider/**
    parallel_safe: true
  risks:
  - risk: Logs shows the game report Coin totals only when no blank-currency round
      is in range, so historical rows and Sigma rounds keep those totals absent.
    mitigation: Report it at handoff; changing that Logs rule is a separate operator
      decision.
  - risk: Provider pins shared-lib bf1fcf4 (2026-10-05); the bump pulls every later
      contract change.
    mitigation: Build, vet and full Provider tests after the bump.
  - risk: A retry that carries a different currency than the stored one.
    mitigation: Stored non-blank currency is immutable, like game_id.
  estimated_complexity: medium
assignment:
