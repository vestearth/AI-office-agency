  ## 1) §3 Read path table — extend Mobile fields + Source for owned list / redeem

  Current `ListMyRedemptionItems` / `RedeemRedemptionItem` rows list
  `itemName, brandName` but not images. Update both rows so Mobile fields
  include `thumbnailUrl, logoUrl`, and Source notes that images come from
  Item Basic (`ri.thumbnail_url` / `ri.logo_url`), copied at redeem time.

  Suggested replacement rows:

  | RPC | Mobile fields | Source |
  | --- | --- | --- |
  | `RedeemRedemptionItem` `(userId, redemptionItemId, idempotencyKey)` | `UserRedemptionItem` including `itemName`, `brandName`, `thumbnailUrl`, `logoUrl` | inserts `user_redemption_items`; assigns a code; deducts points via Wallet; display names + Item Basic images set at redeem time from locked item + parent brand lookup |
  | `ListMyRedemptionItems` (`GET /api/v1/my-redemption-items`) | `id, userId, redemptionItemId, redemptionCodeId, code, categoryIds, pointSpent, validUntil, createdAt, updatedAt, isFavorite, itemName, brandName, thumbnailUrl, logoUrl` | `user_redemption_items` JOIN `redemption_items ri` LEFT JOIN `redemptions r`; `categoryIds` ← `ri.tag_ids` (collection tags, **not** brand); `validUntil` ← `ri.end_date`; `itemName` ← `ri.name`; `brandName` ← `r.name` (empty string if parent missing); `thumbnailUrl`/`logoUrl` ← `ri.thumbnail_url`/`ri.logo_url` (Item Basic; empty when unset) |

