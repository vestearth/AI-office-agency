summary: |-
  Local implementation: Diamond-to-Coin exchange no longer publishes turnover
  forward/reversal events. Settlement, amounts, refund metadata and idempotency
  are preserved. Missions skips legacy Order turnover at the shared guard before
  MQ EXP and direct daily/weekly writes; no historical data cleanup or clawback.
  Mission Boost configuration, owned-pass benefits and claim flow remain unchanged.
  Direct AddTurnover API is explicitly out of scope. Staging deployment was
  subsequently authorized; see deployment below for current release evidence.
