summary: |
  Implemented the event-contract phase only, as directed by the approved
  blueprint. shared-lib/events/player_activity.go now extends the existing v1
  PlayerActivityEvent additively with monitoring event types, Auth/User/Missions
  source-service constants, correlation operation_id, and typed optional
  gameplay, wallet, store/redemption, and mission dimensions. The existing
  AdminActionEvent remains the sole actor-bearing stream; PlayerActivityEvent
  does not carry actor_id or credentials. balance_after is a *float64 so an
  authoritative zero balance is distinct from an absent snapshot.

  The read protobuf contracts, generated gateway/Swagger artifacts, api-gateway
  bump, publisher changes, and TASK-EAR-285 were intentionally not started.
artifacts:
