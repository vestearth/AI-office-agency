      the identical capability two days ago and this endpoint has a weaker
      claim still (it is not even gateway-routed).
      It also skipped the shared-secret containment detour outright, as
      instructed — EAR-191 tried that first and had to revert it.
      MY OWN VERIFICATION: both handlers absent from the committed trees and
      from the pushed remote; the route gone from cmd/main.go; the EAR-185
      ownership guard and EAR-182 staff gate still present (7 guard
      references intact); go build, go vet and a cache-cleared go test ./...
      clean across 7 packages.
      THE ANSWER TO "WHY DID THE SWEEPS STOP AT ITS EDGES" is the most
      transferable thing this run produced, and the third reason generalises
      beyond Order:
      (1) EAR-182 and EAR-185 were scoped by defect SIGNATURE, not by
      capability — one hunted body-supplied identity fields, the other
      missing ownership checks. This handler has neither an identity field to
      distrust nor an owner to compare against; it takes an order_id and
      nothing else, so it was invisible to both while sitting between their
      two targets.
      (2) The Postman collections assert an X-API-Key guard that has NEVER
      existed in the code. Anyone triaging from the documented API surface
      would have scored this endpoint as already handled.
      (3) "Webhook" reads as infrastructure rather than as a money path — the
      name and the /webhooks/ prefix put it in the external-callback mental
      bucket instead of wallet-crediting business logic.
      This run is the strongest single piece of evidence behind the
      defect-class-sweep skill proposed from this session: scoping by
      capability rather than by the named line number surfaced a second
      unauthenticated copy of the same money path one file away.
      FOLLOW-UPS FLAGGED, NOT DONE: shared-lib orderpb still declares the RPC
      and its binding so the gateway keeps a dead route (low urgency — it now
      answers Unimplemented; could ship in one bump with EAR-191's identical
      missionspb follow-up); the Postman collections still document the
      endpoint as API-key protected; and ConfirmPaymentHTTP has no producer
      either since Missions' client method was deleted — it is now the last
      confirm-by-request path in Order.
