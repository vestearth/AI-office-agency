next_action:
  agent: dev
  description: >-
    Order's PaymentCallback asserts that a payment happened, on an order_id
    alone — no signature, no caller check — and goes straight to
    ConfirmPayment, which credits the wallet.
    Games-Labs-Order/internal/core/handlers/orderhdl/grpc.go:331-352.
    THIS IS THE EAR-191 SHAPE, SURVIVING IN A SIBLING SERVICE. Read
    runs/TASK-EAR-191/ before deciding anything here: that task faced the
    identical defect in Missions, established the endpoint had no legitimate
    producer, and REMOVED it rather than authenticating it — after first
    shipping a shared-secret containment that turned out to be the wrong
    shape and had to be reverted. Do not repeat the containment detour.
    START BY ESTABLISHING WHO CALLS IT. Search the whole workspace, not just
    Order — EAR-191's lesson is that a per-repo search misses cross-service
    callers, and its counter-lesson is that the mobile team had to be asked
    directly before "nobody calls it" could be trusted. If the answer is
    nobody: remove it, which is cleaner than adding auth to something dead.
    If a real internal caller exists: it needs proper service-to-service
    authentication, not a body field.
    REACHABILITY, and why it is ranked internal rather than critical: its
    binding pattern is `webhooks/payment-callback`
    (orderpb/*.gw.go:1113), which sits OUTSIDE the `/api/v1/*` catch-all, and
    no gin route exists for it — so it is not gateway-routed today. That is
    the same "not reachable through the gateway" status FINDING-5/6 have, and
    it rests on the same unverified assumption about container port exposure
    that TASK-EAR-265 is answering. Re-check that before concluding this is
    low-urgency.
    WHAT MAKES IT UNCOMFORTABLE: its two immediate neighbours were BOTH
    hardened today — ConfirmPayment was owner-scoped by TASK-EAR-185 and
    UpdateOrderStatus was staff-gated by TASK-EAR-182 — and this handler,
    between them in the same file, was not touched by either. Whoever fixes
    it should ask why the sweeps stopped at its edges, because that answer
    probably applies elsewhere.
    Reproduce before fixing. Regression test seen RED first. Do not weaken
    the two neighbouring guards while working in that file.
