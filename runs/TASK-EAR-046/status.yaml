  agent: free-roam
  description: >-
    Fix the admin by-id GET/PUT/activate/deactivate endpoints reached through the
    gateway (gRPC). The gRPC->HTTP bridge (internal/httpx DispatchHandler) invokes
    the handler WITHOUT a ServeMux, so r.PathValue("plan_id"/"activity_id"/"group_id")
    is always empty -> handlers return "<id> required" and the Backoffice editor
    never loads the real plan (falls back to mock, then a weekly save sends a
    fallback week_start and 409s on the one-active-per-week index). Fix: a bridge
    variant that sets r.SetPathValue(name, id) before serving, applied to the 21
    by-id gRPC wrappers (daily/weekly plans = plan_id, activities = activity_id,
    weekly activity-groups = group_id). Missions-only, NO proto/shared-lib change.
