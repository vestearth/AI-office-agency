  - criterion: Mission types from the Figma slice are represented using existing/local mock data.
  - criterion: Edit/cancel/update behavior remains local/mock-only.
  - criterion: Schedule tab remains explicitly out of scope or placeholder.
  - criterion: No backend/API persistence claims are introduced.
  - criterion: npm run build passes in Games-Labs-backoffice.
  - criterion: Screenshot of the Setting Default Mission tab is attached for PM review.
