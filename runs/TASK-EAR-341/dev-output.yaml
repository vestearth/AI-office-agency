summary: |
  Daily player-activity scoring now loads only rules that belong to the active
  plan for the Bangkok day derived from evt.OccurredAt. A real-PostgreSQL
  regression seeds a current-day rule, another-day rule, and an orphan; it
  proves only the current-day rule receives progress and mission.progressed,
  then proves reverse returns that progress to zero. Opened PR 127 to staging.
