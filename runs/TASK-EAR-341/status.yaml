  agent: dev
  description: >-
    REPO: /Users/earth/Documents/GitHub/Games-Labs-Missions. Branch from
    origin/staging, PR to staging. Scope the Daily player-activity matcher to
    the rules that belong to the active plan of the event's Bangkok day.
    Today ListActiveDailyActivityRules (internal/repositories/mission_repo.go
    ~L2293) returns EVERY daily_activities row with active=TRUE and a
    condition_type, and HandlePlayerActivityEvent (internal/services/
    mission_service.go ~L2442) applies the event to all of them; on staging
    the EAR-301 smoke event ear301-smoke-20260909T052027Z wrote 168
    daily_activity_progress rows for one player while only 2 rules were on
    that day's plan. Reuse the EXISTS scope that ListDailyActivityProgress
    (~L1665) already uses: daily_activity_group_members -> active
    daily_activity_groups -> active daily_plans with plan_date = the event's
    Bangkok day (derive the day the same way ApplyDailyActivityForward keys
    daily_activity_progress.bangkok_day, i.e. from evt.OccurredAt, never from
    time.Now). Weekly already does this — ListActiveWeeklyActivityRules
    (~L2642) takes weekStart and joins the group/plan — so mirror that
    signature: ListActiveDailyActivityRules(ctx, bangkokDay). Keep
    resolveSpendPropRuleItemTypes and mapPlayerActivityEventToDailyProgress
    unchanged; only the rule set shrinks. Reverse events must still find the
    rows they reverse (ApplyDailyActivityReverse works off the ledger, confirm
    with a test rather than by inspection). No schema change expected; if one
    is needed it ships as an idempotent migration (boot replay). Tests: a
    focused test seen RED first that feeds one event to a repo fixture with
    one current-plan rule, one other-day plan rule, one orphaned active rule,
    and asserts only the current-plan rule receives progress and only it
    publishes mission.progressed; keep the EAR-301 loop-guard tests green.
    Then GOWORK=off go test ./..., vet, readonly build, git diff --check.
    Hand to reviewer before deploy; after staging deploy, re-run the EAR-301
    style smoke and prove the progress-row count for a fresh event equals the
    number of rules on that day's plan (2 on the current staging schedule),
    not 168. Also apply the librarian patch to the TASK-EAR-213 orphan-row
    note (ai-dev-office/knowledge-reviews/20260909T052643Z-games-labs-
    missions-monitoring-daily-progress.yaml) once the behaviour matches it.
