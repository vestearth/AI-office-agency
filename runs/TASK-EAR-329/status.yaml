    reason: >-
      Gate 1 delivered as shared-lib commit 27bf858 on
      task/TASK-EAR-329-diamond-redemption-contract, PR 67 against main.
      Operator confirmed the client scope as Backend plus Backoffice with a
      mobile handoff, so the assumption recorded at open is now settled.
      Additive fields only: RedemptionItem 37/38, UserRedemptionItem 22/23,
      admin Create 28/29 and Update 29/30, plus the RefundDiamond RPC on
      POST /api/v1/wallet/refund-diamond mirroring RefundPoints field for
      field. price_currency is a STRING, not an enum, matching the existing
      repo convention (OrderPackage and SpecialItem already carry a string
      price_currency, and type_items/availability/status are documented
      strings) and avoiding the unknown-enum-value fallback problem for JSON
      clients. price_amount is int64, deliberately NOT the double that
      SpecialItem.price_amount uses, so it crosses grpc-gateway as a JSON
      string — asserted by a round-trip test rather than left to a client to
      discover.
      Two operator rules are encoded as tests rather than prose: the redeem
      request must carry no price field at all (a test fails if one is added,
      because price is server-derived), and Update omitting price_currency
      preserves the stored currency so a legacy admin client cannot silently
      reprice a DIAMOND item into points. A third test asserts RefundDiamond
      does not reuse CreditDiamondRequest, so the staff adjustment and the
      money-path refund cannot quietly collapse into one operation later.
      Test-first: RED in all three packages before the proto edits (unknown
      field PriceCurrency, WalletService.RefundDiamond is missing,
      price_currency is missing), green after. make buf regenerated the
      artifacts; an UNRELATED pre-existing swagger drift in admingamepb and
      adminuserpb — stale comments from EAR-319/320 that were never
      regenerated — surfaced in the same run and was reverted, not shipped.
      Same call TASK-EAR-314 made; worth its own cleanup task since it will
      resurface on every future buf run. GOWORK=off go build and go test pass,
      buf breaking against main is clean, and the generated surface was proven
      by grepping the artifacts rather than trusting the build: RefundDiamond
      16 times in wallet.pb.gw.go and 17 in wallet_grpc.pb.go, the route in
      wallet.swagger.json, priceCurrency and priceAmount 3 times each in
      order.swagger.json.
      STOPPED for operator publication as the gate requires. No Order, Wallet,
      gateway or Backoffice code touched.
