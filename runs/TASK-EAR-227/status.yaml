  agent: dev
  description: >-
    STAGE 1 DELIVERED: shared-lib#43, open and publish-gated. Coordinator
    verified Coin/Points/Diamonds became *int64 with proto3,oneof tags,
    field numbers still 2/3/4, user_id untouched, and the regenerated
    diff confined to adminwalletpb despite the Makefile doing a full
    clean-and-regenerate.
    ⚠️ THE api-gateway BUMP IS LOAD-BEARING FOR THIS FIX, not hygiene.
    Reasoning worth keeping: proto3 implicit presence omits a zero from
    the wire entirely. So an UNBUMPED gateway that receives JSON
    coin:"0" decodes it into its old non-optional struct as 0, then
    re-encodes to Wallet with the field OMITTED — Wallet sees absent,
    treats it as unchanged, and the fix silently does nothing. All three
    repos must land before zeroing works at all. The same property is
    what makes the change safe during a rolling deploy: an old client
    sending 0 still omits it, so it still reads as "unchanged".
    REMAINING: stage 2 (Wallet — bump, then swap the == 0 guards for
    presence checks, REBASED on Wallet#12 which changes the same
    function's signature) and stage 3 (api-gateway bump). Before either
    ships, prove no caller path can serialise a blank field as 0 — after
    this change that would zero a balance rather than leave it.
