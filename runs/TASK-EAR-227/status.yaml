next_action:
  agent: dev
  description: >-
    Make UpdateWalletBalance able to set a balance to zero. The service's
    `if coin == 0 { coin = current }` guards are the symptom; the cause is
    that the proto uses plain proto3 scalars with no field presence, so
    `coin: 0` and "coin never set" are byte-identical on the wire and the
    service genuinely cannot tell them apart. Fix is `optional` on the
    three fields in shared-lib (same field numbers, wire-compatible),
    behind the publish gate, then presence checks in Wallet, then the
    api-gateway bump — which has been forgotten six times now and is what
    let TASK-EAR-225 ship five green PRs with a retired field still on
    the wire. The one real risk is frontend-side: the panel already sends
    all three fields every save, so after the fix a blank field that
    serialises as 0 would ZERO a balance rather than leave it. Prove that
    cannot happen before shipping.
