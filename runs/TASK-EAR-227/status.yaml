  description: >-
    COMPLETE AND LIVE-VERIFIED — all four points PASS on staging across
    three merged, deployed repos (shared-lib c048249, Wallet 49a5ac4,
    api-gateway 5798dd2).
    1) Setting DIAMOND to "0" genuinely zeroed it, confirmed by an
    independent GET — which also proves all three deploys took effect,
    since an unbumped gateway would have dropped the explicit 0 from the
    wire and silently no-op'd. 2) A body containing ONLY {"diamonds"}
    left coin and points untouched at their large non-zero values, so
    absence did not become zero — the regression the optional change was
    most likely to cause. 3) The zeroing produced exactly ONE audit row
    (before 4900 -> after 0), with COIN and POINT emitting nothing
    because they did not move; occurredAt correlated to the wallet's
    updatedAt within 2ms. TASK-EAR-226's per-currency semantics hold
    against a real zeroing. 4) "-1" rejected with code 1002 and all
    balances unchanged.
    Balances restored and re-verified on a FRESH login session,
    byte-identical to baseline on every field including pointTurnover.
    NOT verified on staging and unchanged from before: the partial-failure
    path, where the three currencies commit as separate transactions.
    Nothing failed mid-way during this check, so that branch remains
    unit-test-only.
    Minor observation, not a defect: a negative value is audited as
    outcome "failed" rather than "denied". That matches the handler's
    logic (failed when nothing moved) and is a validation failure rather
    than an authorization one, but "denied" may read as more intuitive if
    anyone revisits the outcome taxonomy.
