    reason: >-
      Claude advisory lane. Root cause re-verified in source before any edit -
      all three links (the mux registered with no incoming header matcher, the
      middleware deleting only the bare header spellings, AnnotateContext
      joining the trusted annotator values AFTER the header-derived ones)
      confirmed by reading api-gateway and the grpc-gateway runtime, not taken
      on report.
      Every regression test was seen RED first against the untouched base
      commit in a throwaway worktree, so the RED records carry real
      provenance: ev-001 reproduces the exact vulnerability shape
      (userid = [victim, attacker]) and shows the middleware passing all seven
      forged spellings through; ev-002 and ev-003 show Wallet and Order
      returning the victim. GREEN in ev-004/006/008; build + vet + full suite
      in ev-005/007/009; all exit 0.
      The gateway change is the one that closes the hole - a
      WithIncomingHeaderMatcher refusing the identity metadata keys. It cannot
      be bypassed by header spelling because it matches the MAPPED metadata
      key, after canonicalisation and prefix stripping, and it covers every
      service at once. The middleware additionally strips the Grpc-Metadata-*
      identity spellings so the raw-header SimpleProxy lanes are clean and a
      future mux built without the matcher cannot silently reopen this. Wallet
      and Order make their own identity readers fail closed when two metadata
      values disagree, so neither depends on the gateway being correct.
      Change-impact sweep (ev-010) covered every repo under the workspace root
      and found no legitimate sender of any Grpc-Metadata-* identity header -
      only this task's own tests and comments - so refusing those keys has no
      blast radius. Non-identity headers keep DefaultHeaderMatcher behaviour,
      and the TASK-EAR-324 x-correlation-id pass-through is held by its own
      assertion in TestNonIdentityMetadataStillForwarded.
      One alias gap the original report did not name was found during the
      sweep and closed: Wallet's resolveUserID also accepts `user-id`, which
      the first draft of the matcher did not refuse.
      Nothing merged, nothing deployed - merging a Games-Labs PR IS the
      staging deploy and that is the operator's call.
