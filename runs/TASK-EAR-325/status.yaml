next_action:
  agent: reviewer
  description: >-
    SECURITY (cross-user IDOR, gateway-wide). Any authenticated player can act
    as any other player on every user-scoped /api/v1 route by sending
    `Grpc-Metadata-Userid: <victim>` alongside their OWN valid JWT. Confirmed
    live on staging as TASK-EAR-304 ev-014: attacker guest 0bb4fed7 cancelled
    victim 8c08614c's pending Stripe checkout (HTTP 200 CHECKOUT_CANCELLED;
    the victim's own status then read back failed).
    Root cause chain, all three links verified in source: (1)
    api-gateway gateway/grpc.go builds the grpc-gateway mux with only
    runtime.WithMetadata and no incoming header matcher, so
    DefaultHeaderMatcher forwards any Grpc-Metadata-* header to the backend as
    gRPC metadata with the prefix stripped; (2) middleware
    InjectTrustedIdentityHeaders deletes the bare userid / X-User-ID / role /
    permissions / access headers and re-sets them from the JWT, but never
    touches the Grpc-Metadata-* spelling; (3) runtime.AnnotateContext builds
    header-derived metadata FIRST and metadata.Join()s the annotator's trusted
    values AFTER, so outgoing metadata is userid=[<forged>, <jwt>] and every
    backend that takes vals[0] (Wallet paymenthdl metadataFirst,
    Games-Labs-Order orderhdl callerUserID) reads the forged value.
    Scope: one gateway change - register the mux with a
    runtime.WithIncomingHeaderMatcher that refuses the identity keys the
    trusted-identity layer owns, so the forged header can never reach a
    backend, plus strip the Grpc-Metadata-* identity spellings in
    InjectTrustedIdentityHeaders as defence in depth. Regression test must be
    seen RED first: a forged Grpc-Metadata-Userid alongside a valid JWT, then
    assert the backend context sees ONLY the JWT subject.
    Optional belt-and-suspenders (separate repos, separate deploys): make
    metadataFirst / callerUserID reject a userid carrying more than one
    distinct value.
    VERIFY after deploy: re-run the TASK-EAR-304 repro against
    api-test-gateway.gameslabs.app and confirm the forged-header cancel
    returns 404/denied, not CHECKOUT_CANCELLED.
    BLOCKS production promotion of TASK-EAR-304, which stays escalated until
    this lands.
