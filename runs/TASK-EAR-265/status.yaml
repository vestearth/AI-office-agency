    at: '2026-08-14'
    reason: >-
      ANSWERED. findings.md written. Verdict: Wallet 8084 and Order 8087 are
      NOT reachable from outside the VPC, in either environment. FINDING-5
      stays Tier D/HIGH and FINDING-6 stays Tier D/MEDIUM — do not promote.
      TASK-EAR-266 is therefore unblocked as urgent hardening rather than as
      an incident.
      Decisive evidence is an absence proof, which is why it holds despite
      the source being stale: the infrastructure report contains a CLOSED
      target-group inventory (declared count 5) with no Wallet/Order entry
      and nothing on 8084/8087/50054/50051. A listener rule cannot forward to
      a target group that does not exist. Supported by private-subnet
      placement, SG ingress that is entirely SG-referenced with no
      0.0.0.0/0, and consumption only over VPC-scoped Cloud Map DNS.
      HONEST LIMITS, and they are real: no AWS CLI and no credentials were
      available, so every AWS fact comes from a 7.5-week-old snapshot plus
      live gh reads — not live state. The single highest-value follow-up is
      one read-only `aws ecs describe-services` call, which closes live LB
      attachment, subnets and assignPublicIp for all four services at once.
      TWO THINGS THE VERDICT SHOULD NOT BE ALLOWED TO HIDE:
      (a) the network control is one console action thin — `8080-8087 <- ALB
      SG` is already permitted in both environments, so a future target-group
      attachment would expose /wallets/credit with NO security-group diff for
      a reviewer to catch; and (b) the legacy k3s NodePort lane is dormant,
      not demonstrably decommissioned — Wallet's k3s/service.yaml still
      declares NodePort 30400 -> 8084 with ArgoCD selfHeal, last deployed
      2026-06-17. If that cluster still runs, a June-vintage Wallet with the
      same unauthenticated mux is still serving. That is the one gap this
      task could not close.
      🔴 THE FINDING THAT MATTERS MOST WAS THE SIDE QUESTION. Asked to check
      whether AFB is active on prod, the answer inverts TASK-EAR-261's
      triage: AFB is compiled-in and unconditionally route-registered, but
      the production GitHub environment contains NO AFB_* secrets at all
      (staging has all seven) — re-verified independently via gh. prod.yml
      references them, build-env-json.sh renders unset vars as "", and there
      is no AFB validation gate, so the deploy succeeds with empty keys. With
      empty keys the guard short-circuits on its FIRST term, so the signature
      check never runs for ANY request — worse than staging, where a caller
      at least has to omit the header. And provider-alb-prod is the only
      internet-facing ALB in the account.
      TASK-EAR-261 assumed "unconfigured on prod" was the safer answer. It is
      the worse one. The question that would actually downgrade it is whether
      the prod Provider service is publicly reachable — and the snapshot
      CONTRADICTS ITSELF on that (internet-facing in two places, Internal in
      a third). One live `aws elbv2 describe-load-balancers` settles it and
      should be run before anything else.
      Also found in passing: WIN_CAPTURE_PROVIDERS is in Provider's
      ecs/env.names but is never exported by origin/prod's prod.yml, so win
      capture is OFF on production regardless of what EAR-192/194 shipped.
      Not actioned here.
      Scope respected: TASK-EAR-266/267 were NOT edited — they keep their
      "SEVERITY IS PROVISIONAL" wording until someone applies §4.
