  description: >-
    ANSWER ONE INFRASTRUCTURE QUESTION, then re-rank two findings. Small
    task, but it gates the severity of TASK-EAR-266 and TASK-EAR-267, so do
    it before either of those is scheduled.
    THE QUESTION: are Games-Labs-Wallet's and Games-Labs-Order's container
    HTTP ports reachable from outside the VPC?
    TASK-EAR-257's audit established only that the api-gateway does not
    route them — a 404 probe proves the gateway has no route, and proves
    nothing about an ALB listener, a security-group rule, a public subnet, or
    a service exposed directly. That is an infra fact the repos cannot
    answer, and the audit said so explicitly rather than guessing.
    WHY IT MATTERS: FINDING-5 (Wallet OneDay deposit-callback, no signature
    verification, settles a deposit plus package rewards) and FINDING-6
    (Wallet's bare http.ServeMux exposing /wallets/credit, /debit, /redeem,
    /refund-points, /reward-package, /transfer-coin, /add-diamond,
    /exchange-diamonds-to-coins with NO authorization at all, cmd/main.go
    :117-137) are currently ranked "cluster-internal only" ON THAT
    ASSUMPTION. If the assumption is wrong, both jump straight to Tier A —
    anonymous, unauthenticated wallet credit from the public internet, which
    is the same severity as TASK-EAR-261.
    WHAT TO CHECK, for BOTH staging and prod: ECS service/task definition
    port mappings, the ALB/target-group listener rules, security-group
    ingress on the container ports, and whether the tasks sit in a public or
    private subnet. Check Order as well as Wallet — the audit found Order's
    PaymentCallback in the same "not gateway-routed" bucket (TASK-EAR-267).
    DELIVERABLE: write the answer into runs/TASK-EAR-265/findings.md with
    the evidence (console output, aws cli output, or manifest references) —
    not just a yes/no — and then update the ranking note in TASK-EAR-266 and
    TASK-EAR-267 to match what you found.
    ALSO WORTH ANSWERING while you are in there, from TASK-EAR-257 §4:
    whether AFB is an active provider on PRODUCTION (keys were confirmed
    configured on staging only). That feeds TASK-EAR-261's incident-vs-urgent
    call.
    Do not change any application code in this task.
