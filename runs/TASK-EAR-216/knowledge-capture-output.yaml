  # Secondary recommended updates (same capture; apply separately)

  Schema allows one primary `target_note`. Human should also update these:

  ## A) `Knowledge Base/40 Lessons/Gateway Proto Bindings Need a Staging-Lane Bump — a Green main PR Ships Nothing.md`

  Add a sibling subsection after the TASK-EAR-210 confirming instance:

  ### Sibling trap — service feature PRs default to `main` (TASK-EAR-216, 2026-08-06)

  Gateway bumps must PR into `staging` (lesson above). **Service repos have the
  same deploy asymmetry and a different failure mode:** `gh pr create` defaults
  to `main`, and `Games-Labs-Order` `staging.yml` fires **only** on push to
  `staging`. Merging a correct feature PR to `main` (Order #28) ships nothing
  to ECS until a separate **`main`→`staging` promotion PR** lands (Order #29).
  Same pattern as TASK-EAR-210’s gateway checklist, applied to Order:

  1. Prefer `gh pr create --base staging` for Order (and other ECS service)
     feature work when the goal is a staging deploy.
  2. If the feature already merged to `main`, open an explicit promotion PR
     `main`→`staging` rather than waiting for an undefined sync.
  3. Confirm `Deploy STAGING` on the promotion merge SHA
     (`gh run list --branch staging`), not merely `gh pr view … MERGED` on the
     `main` PR.

  Sources to append:
  - `ai-dev-office/runs/TASK-EAR-216/status.yaml` (history: PR #28 on main,
    promotion PR #29, Order deploy run `31080471439`, gateway #37 run
    `31079295336`)
  - `Games-Labs-Order/.github/workflows/staging.yml` (`on.push.branches: [staging]`)

  Related already points at Deploy Topology Map — keep that link.

  ## B) Optional one-liner on `Knowledge Base/20 Flows/Deploy Topology Map.md`

  Under Branch Routing / working flow: note that opening service PRs without
  `--base staging` leaves them on `main` only (no ECS deploy), and promotion
  is a separate PR — cite TASK-EAR-216 Order #28→#29. Skip if human prefers
  the lesson-only update in (A).

  ## C) Do **not** create a new note

  Concept already lives in Field Lineage + staging-lane / deploy-topology
  lessons. Prefer update over create.
