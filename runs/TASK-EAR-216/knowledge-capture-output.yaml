note_patch: |
  # Patch plan — Field Lineage — Store Packages & Redemption (primary)

  Apply the following edits to
  `Knowledge Base/10 Projects/Games Labs Order/Field Lineage — Store Packages & Redemption.md`.
  Do not replace the whole note; splice into existing sections.

  ## 1) §3 Read path table — replace the `ListMyRedemptionItems` row

  Current (stale / incorrect):

  | `ListMyRedemptionItems` | `id, redemption_item_id, redemption_code_id, code, category_ids, point_spent, valid_until, status` | `user_redemption_items` (+ item window) |

  Replace with:

  | RPC | Mobile fields | Source |
  | --- | --- | --- |
  | `RedeemRedemptionItem` `(userId, redemptionItemId, idempotencyKey)` | `UserRedemptionItem` including `itemName`, `brandName` | inserts `user_redemption_items`; assigns a code; deducts points via Wallet; display names set at redeem time from locked item + parent brand lookup |
  | `ListMyRedemptionItems` (`GET /api/v1/my-redemption-items`) | `id, userId, redemptionItemId, redemptionCodeId, code, categoryIds, pointSpent, validUntil, createdAt, updatedAt, isFavorite, itemName, brandName` | `user_redemption_items` JOIN `redemption_items ri` LEFT JOIN `redemptions r`; `categoryIds` ← `ri.tag_ids` (collection tags, **not** brand); `validUntil` ← `ri.end_date`; `itemName` ← `ri.name`; `brandName` ← `r.name` (empty string if parent missing) |

  **Corrections locked by TASK-EAR-216 evidence:**

  - Public `orderpb.UserRedemptionItem` has **no** `status` field. Do not list
    `status` among Mobile fields. (UI status pills remain client-derived;
    exposing server status is still deferred.)
  - `isFavorite` already exists (TASK-EAR-210); keep it on the owned-list row.
  - `item_name = 12` / `brand_name = 13` are additive on
    `shared-lib` PR #40 (`b39ad646f97b`,
    `v0.0.0-20260806064256-b39ad646f97b`).

  ## 2) New gotcha under §6 Gotchas (after Public ≠ admin)

  - **Owned list ≠ browse catalog (TASK-EAR-216):** My E-Vouchers must not
    resolve display labels by joining `GET /api/v1/my-redemption-items` ids
    against `GET /api/v1/redemptions`. Public `ListRedemptions` hard-filters
    `Status=active`, `OnlyWithinWindow=true`, `ExcludeFullyRedeemed=true`, so
    owned / expired / sold-out vouchers disappear from the catalog while still
    appearing on the owned list — Mobile then falls back to placeholder
    `"Redeemed E-Voucher"` and raw UUIDs. After TASK-EAR-216 the owned list
    (and redeem response) carry `itemName` / `brandName` server-side; drop the
    client catalog join for labels. Also: `categoryIds` on owned rows are
    `ri.tag_ids`, not brand ids — do not treat them as brand.

