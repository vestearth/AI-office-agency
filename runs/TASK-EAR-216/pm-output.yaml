task:
  id: TASK-EAR-216
  title: My E-Vouchers — return itemName and brandName on owned list
  short_name: my-redemption-display-names
  type: feature
  workstream: backend
  priority: low
  created_at: '2026-08-06'

scope:
  target_services:
    - service: shared-lib
      reason: Owns orderpb.UserRedemptionItem contract and generated gateway/Swagger artifacts.
    - service: Games-Labs-Order
      reason: Owns ListUserRedemptionItems SQL join, model, and UserRedemptionItem mapper.
    - service: api-gateway
      reason: Bumps published shared-lib so existing my-redemption-items route exposes new JSON fields / Swagger.
  affected_files:
    - path: shared-lib/proto/orderpb/order.proto
      action: modify
      description: Add additive item_name and brand_name on UserRedemptionItem.
    - path: shared-lib/proto/orderpb/
      action: modify
      description: Regenerate pb/gw/swagger via make buf; never hand-edit.
    - path: Games-Labs-Order/internal/models/redemption.go
      action: modify
      description: Add ItemName and BrandName on UserRedemptionItem model.
    - path: Games-Labs-Order/internal/core/repositories/redemption.go
      action: modify
      description: Extend select/scan with ri.name and parent redemptions.name join.
    - path: Games-Labs-Order/internal/core/handlers/orderhdl/grpc.go
      action: modify
      description: Map item_name/brand_name in modelUserRedemptionItemToPB.
    - path: Games-Labs-Order/internal/core/handlers/orderhdl/*_test.go
      action: modify
      description: Focused tests for owned-list display enrichment.
    - path: Games-Labs-Order/go.mod
      action: modify
      description: Adopt operator-published shared-lib after Gate 1.
    - path: Games-Labs-Order/go.sum
      action: modify
      description: Keep checksums aligned; no replace.
    - path: api-gateway/go.mod
      action: modify
      description: Adopt the same published shared-lib version.
    - path: api-gateway/go.sum
      action: modify
      description: Keep checksums aligned; no replace.

description: |
  Mobile QA on Redeem > My E-Vouchers shows placeholder titles and raw UUIDs
  because GET /api/v1/my-redemption-items returns ownership ids without
  itemName/brandName. Client join against GET /api/v1/redemptions fails for
  owned rows filtered out of the active/in-window catalog. Add additive proto
  fields, enrich via existing redemption_items join (+ parent redemptions for
  brand), publish shared-lib, then bump Order and api-gateway. Priority low
  (Mobile: not urgent). thumbnailUrl and public status exposure stay deferred.

acceptance_criteria:
  - criterion: UserRedemptionItem has additive item_name and brand_name; generated artifacts updated via buf/make.
  - criterion: Authenticated GET /api/v1/my-redemption-items returns itemName and brandName on every items[] entry from joined sources.
  - criterion: Redeem response item carries the same two fields when returning UserRedemptionItem.
  - criterion: Auth scoping, pagination, codes, points, validUntil, categoryIds, isFavorite unchanged; no committed replace.
  - criterion: Focused Order tests + Order/api-gateway go build -mod=readonly pass after published bump.
  - criterion: Mobile handoff notes that catalog join for My E-Vouchers labels can be dropped after staging serves the fields.

plan:
  approach: |
    Sequential publication gates (same pattern as TASK-EAR-210). Gate 1 is
    shared-lib contract only. Gate 2 enriches Order SQL/model/mapper after
    publish. Gate 3 bumps api-gateway for Swagger/types on the existing route.
    Staging smoke is later operator evidence.
  subtasks:
    - order: 1
      id: shared-lib-display-name-contract
      description: >-
        Add item_name and brand_name on UserRedemptionItem, regenerate
        artifacts, verify, stop for operator publish.
      agent: dev-2
      owned_files:
        - shared-lib/proto/orderpb/order.proto
        - shared-lib/proto/orderpb/
      parallel_safe: false
    - order: 2
      id: order-owned-list-enrichment
      description: >-
        After publish, bump shared-lib, join/select item + brand names, map in
        modelUserRedemptionItemToPB, add focused tests, verify -mod=readonly.
      agent: dev-2
      owned_files:
        - Games-Labs-Order/
      parallel_safe: false
    - order: 3
      id: gateway-shared-lib-bump
      description: Bump the same published shared-lib version; verify build/Swagger refresh for existing route.
      agent: dev-2
      owned_files:
        - api-gateway/
      parallel_safe: false
    - order: 4
      id: staging-smoke-my-redemption-items
      description: Authenticated staging GET /api/v1/my-redemption-items shows itemName and brandName on owned rows.
      agent: devops
      owned_files: []
      parallel_safe: false
  risks:
    - risk: Consumer work starts before shared-lib publish and uses local replace.
      mitigation: Hard stop after Gate 1; AGENTS.md forbids committed replace.
    - risk: Brand sourced from categoryIds/tag_ids instead of redemptions.name.
      mitigation: Task semantics table locks brand = parent redemptions.name.
    - risk: Missing parent redemption row fails the whole owned list.
      mitigation: LEFT JOIN redemptions; empty brandName if absent.
  estimated_complexity: medium

assignment:
  primary: dev-2
  parallel: false
  reason: Cross-repo protobuf + sequential publish/bump gates; shared files must stay sequential.

summary: |
  TASK-EAR-216 is ready for Gate 1 only: additive item_name/brand_name on
  UserRedemptionItem in shared-lib. Do not start Order or api-gateway until the
  operator publishes shared-lib and supplies the version. Priority low per
  Mobile (not urgent).

