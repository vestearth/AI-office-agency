next_action:
  agent: devops
  description: >-
    Consolidate the production RabbitMQ broker and separate it from staging.
    Multi-repo (7 services) and production-infra, so it is a formal run by the
    AGENTS.md tripwire rather than a config edit done in passing.
    DO THIS BEFORE PRODUCTION IS SCALED UP. Every prod service is at
    desiredCount 0, so there are no running consumers, no in-flight messages
    and nothing to drain — repointing the broker today is an edit and a
    redeploy. After launch the same change needs a drain window, a
    dual-consume period, and a plan for messages already queued on the old
    broker.
    RECOMMENDED SHAPE, one change for two problems: move every production
    service onto Amazon MQ where Missions-prod already points, and leave
    staging on Contabo. Consolidation and environment separation become the
    same edit, and staging — the only running environment — is not disturbed.
    VERIFY THE BROKER FIRST. The vestearth credentials have no mq:*
    permission, so the Amazon MQ broker's state, credentials and reachability
    from the production VPC are unverified.
    Do not widen this into queue topology, DLQ policy, or the Missions
    consumer's requeue loop. Those are real and separate.
history:
  - phase: pending -> pending
    agent: devops
    at: '2026-09-02'
    reason: >-
      DIRECTION DECIDED BY DEVOPS, 2026-09-02: keep RabbitMQ on Contabo, and
      give production its own separate from staging. Amazon MQ is off the table.
      That is consistent with this run's own verification — the Amazon MQ
      endpoint in Missions' production config names a broker that does not
      resolve and has no ENI in either VPC, so it was never a viable target
      anyway. THE ONE THING THAT MUST BE PINNED BEFORE ANY EDIT is what separate
      for prod means, because three readings are possible and they are not
      equivalent. (A) A separate VHOST plus separate credentials: queues,
      exchanges and bindings are scoped per vhost, so this is real isolation,
      and — the part that makes it cheap — queue names can stay exactly as they
      are, meaning the change is the connection string and nothing else. (B) A
      separate broker instance or port: strongest, also a separate failure
      domain, more work. (C) Same vhost with different credentials only: NO
      isolation at all, and this is the trap. Queue names default identically
      across both environments (user.registered, events.provider.logs,
      player.activity.missions), so different credentials on the same vhost
      leaves both environments consuming the SAME queues, and RabbitMQ round-
      robins consumers on a queue — staging would still take production
      messages. Credentials control access, not namespace. Recorded A as the
      recommended default and C as explicitly not acceptable. MISSIONS STOPS
      BEING A SPECIAL CASE under this decision: its Amazon MQ endpoint is
      replaced along with every other service and it joins the same production
      vhost as its publishers, which is exactly what closes the split brain. THE
      ACCEPTANCE CRITERION NEEDED SHARPENING as a result. Requiring that every
      production task definition renders the same fingerprint and that it
      differs from staging is necessary but NOT SUFFICIENT under option A: a
      differing fingerprint would also be produced by nothing more than a
      changed password on the same vhost, which is exactly case C. Added the
      requirement to confirm the VHOST PATH differs, not just the credential.
      ONE RISK THE DECISION DOES NOT ADDRESS, raised once and not relitigated:
      staying on Contabo means production keeps talking to 84.247.150.206:5672,
      a public IP on RabbitMQ's PLAINTEXT port. It carries QA traffic today;
      after launch it carries production credentials and message bodies across
      the internet in the clear, including player.activity, which is wallet and
      turnover data. Two ways to close it without revisiting the broker choice —
      enable TLS on 5671 on the Contabo RabbitMQ, or move the traffic onto a
      private path via VPN or VPC peering so 5672 is not internet-exposed. Noted
      as a decision worth making, explicitly NOT a blocker for this task. Also
      worth noting for TASK-EAR-308: this decision keeps the Contabo host load-
      bearing for production, which sets a precedent that may or may not extend
      to the ClickHouse on the same box. It should be decided on its own merits
      rather than inherited.
  - phase: pending -> pending
    agent: devops
    at: '2026-09-02'
    reason: >-
      🔴 BROKER VERIFICATION DONE, 2026-09-02, AND IT SHARPENS THE FINDING: the
      Amazon MQ broker that games-labs-missions-prod points at APPEARS NOT TO
      EXIST. This task was written assuming Missions-prod was merely on a
      DIFFERENT broker from its publishers. The evidence says it is on NO
      broker. THREE INDEPENDENT CHECKS, none of which needed mq:* permission.
      (1) DNS: the endpoint b-e177fb2b-f00b-4021-8366-5cbb82d2a3ad.mq.ap-
      southeast-1.on.aws does not resolve. dig returns empty and getaddrinfo
      raises NXDOMAIN. A PUBLIC Amazon MQ broker has publicly resolvable DNS, so
      this rules out a public broker. (2) ENIs: a PRIVATE, VPC-deployed Amazon
      MQ broker creates network interfaces in the VPC it is deployed into.
      Enumerating every ENI across both VPCs returns only APIGateway, RDS, ELB
      and ECS task attachments — no Amazon MQ interface in either
      vpc-0f5f8b4202e646cae (prod) or vpc-01b1d37d17ff4c903 (staging). That
      rules out a private broker in these VPCs. (3) The three ENIs with a blank
      description are all in the STAGING VPC, are plain interface type with no
      RequesterId, and do not have the shape of an AWS-managed broker interface.
      WHAT THIS CHANGES: the consequence is no longer that Missions-prod would
      silently miss player.activity events published to the Contabo broker. It
      is that Missions-prod would fail to reach RabbitMQ AT ALL on its first
      boot. Whether that surfaces as a crash or as a degraded start depends on
      the service's connection handling and should be checked — but either way,
      missions do not function. WHAT THIS DOES NOT CHANGE: the recommended
      direction still stands, and the reasoning behind it is unaffected.
      Consolidating every production service onto ONE broker and leaving staging
      on Contabo remains correct; the only difference is that the Amazon MQ
      endpoint currently in Missions' production configuration cannot be the
      target, because there is nothing behind it. Either a broker must be
      created, or production consolidates onto a broker that exists. THE OPEN
      QUESTION IS NOW A DIFFERENT ONE, and it is worth asking before building
      anything: how did a hostname for a broker that does not exist end up in a
      production task definition? Two readings fit — a broker was created,
      configured, and later deleted; or the endpoint was written into config in
      anticipation and the broker was never provisioned. The second would mean
      this configuration has never worked, which the desiredCount 0 state makes
      entirely possible. Whoever picks this up should establish which, because
      it determines whether there is a deletion to explain or simply a step that
      was never finished. STATED AS A LIMIT, since three negative results are
      not the same as one positive one: I could not query Amazon MQ directly
      (AccessDenied on mq:ListBrokers, and also on cloudwatch:ListMetrics, which
      would have been the other indirect route). The conclusion rests on DNS
      non-resolution plus the absence of any MQ ENI in either VPC. It would be
      falsified by a broker deployed into a third VPC, or by an endpoint
      reachable only through a private hosted zone I cannot see. Granting
      mq:DescribeBroker or mq:ListBrokers to the vestearth user would settle it
      in one command and is the cheapest next step.
