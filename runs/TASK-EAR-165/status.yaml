      Fix itself: settled the shared-DB question from source rather than
      needing deployed-env access — Auth migration 009 adds an FK from
      auth_devices.user_id to public.users(id), and Postgres cannot create
      an FK across databases, so a LEFT JOIN is provably valid (and
      migration 010's UNIQUE(user_id) makes it strictly 1:1, no fan-out,
      no N+1). Verified beyond the implementer's report: both handler
      sites guarded on non-nil, zero device_id/device identifier exposure
      (TASK-EAR-161 deferred that pending privacy sign-off), and — since
      the tests use stubs and never execute SQL — statically checked the
      dynamic ListPlayers WHERE builder and ORDER BY for columns made
      ambiguous by the new join (auth_devices also has id/created_at);
      every clause is already qualified u./p., so no runtime-only
      ambiguity error was introduced. build/vet/test all clean.
