      grouped daily/weekly/monthly/event structure, SpecialItemReportSummary
      has no artwork, collection, secret type, duration, VIP level, detail or
      game-support fields, PromotionReportSummary has no reward, pass or
      avatar lists, and RedemptionReportSummary has no unit price or artwork
      (spent_point is a total, not a price). Also recorded: validateReportSort
      allows only created_at for every non-game report type, so any sortable
      column added to those pages needs a matching server allowlist entry in
