summary: |
  Player Win/Loss is now summed from captured rounds by user id in Logs PR
  #53. Reversed rounds and rounds with an unknown payout are excluded.
  Backoffice PR #165 joins that figure onto the player roster. Lifetime GGR
  in THB, Whitelabel and Company stay blank because the projection has no
  split and round outcomes do not store a reliable THB figure.
  The provider report lists the provider catalog. Round, turnover and
  win/loss stay blank because settled rounds have no provider id. Logs was
  not given a catalog client.
