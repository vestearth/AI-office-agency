next_action:
  agent: reviewer
  description: >-
    Games-Labs-Wallet#12 open on staging, not merged. One
    wallet.balance.update event per currency that actually moved, with
    the currency in before/after. Service now returns per-currency
    changes accumulated from read-backs it ALREADY performed — no new
    reads, no race on the money path — and returns them even when err is
    non-nil, which is what makes partial-failure auditing work.
    TWO FINDINGS THAT CORRECT THIS RUN'S OWN SPEC. First, no workflow
    diff is needed at all: Games-Labs-User lists
    RABBITMQ_QUEUE_ADMIN_ACTIONS in ecs/env.names and exports it in
    NEITHER workflow, relying entirely on the accessor guard for the
    default — coordinator verified both facts directly. The spec's
    instruction to prepare workflow diffs was over-cautious; a plain
    redeploy suffices, and the operator is spared a sixth manual apply.
    Second, the spec was internally inconsistent — "publish denied and
    failed attempts too" versus "partial failure yields exactly one
    event" cannot both hold. The agent flagged the conflict rather than
    silently choosing, and resolved it by emitting a failed row only when
    ZERO currencies moved.
    ACCEPTED LIMITATION, recorded so nobody later assumes otherwise: on a
    partial failure the individual currency that failed gets no row, so
    the audit cannot distinguish "admin only changed COIN" from "admin
    tried COIN and DIAMOND, DIAMOND failed". This is the safer side of
    the trade — the zero-means-unchanged defect makes "unchanged" and
    "failed" indistinguishable at the service boundary, so emitting a
    failed row per non-moving currency would risk labelling untouched
    currencies as failures. The caller still receives the error, and
    wallet_transactions still records real movements.
    STILL OPEN: staging verification, impossible until this merges and
    redeploys. Also unresolved and operator-only — RabbitMQURL() defaults
    to amqp://guest:guest@localhost:5672/, so it is never empty and no
    guard can detect an empty RABBITMQ_URL secret; the publisher would
    silently dial localhost. Worth confirming at the AWS level.
