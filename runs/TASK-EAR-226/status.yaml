history:
  - phase: in_review -> done
    agent: pm
    at: '2026-08-07'
    reason: >-
      Operator merged; deploy 7466418 green; live verification passed all
      four points. The verification was designed around two traps that
      would otherwise have produced a false negative, and both mattered:
      it avoided 0 as a target value (the TASK-EAR-227 defect would have
      silently no-op'd and looked like a broken publisher), and it
      sanity-checked the read path with an unfiltered query first so a
      zero result would have meant "no wallet rows" rather than "endpoint
      broken". It also captured a baseline of exactly 0 before acting,
      which is what makes the correlation airtight rather than
      circumstantial. Balances were recorded, changed, and restored, with
      the restore independently re-confirming the same properties in
      mirror. Fifth of six audit scopes now has a live publisher.
  - phase: assigned -> in_review
    agent: dev
    at: '2026-08-07'
    reason: >-
      Delivered as Games-Labs-Wallet#12. The before/after plumbing took
      the preferred service-level route and did it better than the spec
      asked: rather than adding reads, it returns changes accumulated
      from the read-backs AdminSetWalletBalances already performed, and
      returns them alongside a non-nil error, which is what makes
      partial-failure auditing possible at all. Publish loop was
      mutation-checked — disabling it turns two tests red — so the tests
      are load-bearing rather than vacuous. Two spec corrections came back
      from the agent and both are right: no workflow diff is needed
      (Games-Labs-User relies purely on the accessor guard and exports the
      queue var nowhere; coordinator confirmed 0 occurrences in both User
      workflows and read the guard), and the acceptance criteria
      contradicted themselves on partial-failure outcomes. The agent
      surfaced that conflict instead of quietly picking a side, which is
      the behaviour worth reinforcing. Its resolution is accepted with the
      limitation written down rather than glossed. Claude advisory lane.
  - phase: pending -> assigned
    agent: pm
    at: '2026-08-07'
    reason: >-
      Scoped read-only before writing this spec, which paid off twice.
      First, it overturned a blocker this epic had been repeating for
      days: Wallet was said to capture no staff identity, but
      adminwallethdl/grpc.go:262 already reads it from metadata and two
      sibling RPCs use it — UpdateWalletBalance just never calls it, so
      the prerequisite is small rather than large. Second, it surfaced a
      pre-existing defect worth its own ticket: service.go:335-343 treats
      0 as "unchanged", so an admin cannot set any balance to zero, which
      also means the audit can only honestly report per-currency changes
      the service actually made. The per-currency contract was the
      operator's call, taken against the alternative of one combined
      event, on the grounds that the modal has a per-row currency column
      and the mutations are non-atomic. Claude advisory lane.
