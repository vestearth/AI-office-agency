    the restore independently re-confirmed the same properties in mirror.
    RabbitMQ reached the real broker, so the never-empty-localhost-default
    concern is not in play on staging.
    FOLLOW-UP worth its own ticket, found here, not a contract violation:
    requestId and traceId come back empty on every row. The publisher
    reads x-request-id / x-trace-id from incoming gRPC metadata but the
    gateway does not appear to propagate them on this path, so audit rows
    cannot currently be correlated with anything upstream.
    NOT exercised live and covered only by unit tests: the denied and
    failed branches — user_id is a URL path segment so omitting it changes
    routing rather than reaching the handler, and forcing a partial
