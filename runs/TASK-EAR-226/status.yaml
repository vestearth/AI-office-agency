      0 as "unchanged", so an admin cannot set any balance to zero, which
      also means the audit can only honestly report per-currency changes
      the service actually made. The per-currency contract was the
      operator's call, taken against the alternative of one combined
      event, on the grounds that the modal has a per-row currency column
      and the mutations are non-atomic. Claude advisory lane.
