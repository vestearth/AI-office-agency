next_action:
  agent: dev
  description: >-
    PRODUCTION IS RUNNING A CONFIGURATION NOBODY INTENDED, and has been for
    an unknown length of time. Games-Labs-Missions' prod.yml renders its task
    environment from `ecs/env.prod.names` (9 names) instead of
    `ecs/env.names`. It EXPORTS eight variables that file never lists, so
    build-env-json.sh never emits them and they never reach the task.
    THE ONE THAT MATTERS MOST: prod.yml:105 literally says
    `export USE_ORDERS_CATALOG="true"`, and it has never taken effect.
    config.UseOrdersCatalog() returns false when unset, so the store has been
    running the LEGACY DIRECT-WALLET PATH on production — the path the
    orders-catalog contract exists to replace, and which the recorded rule
    calls a no-ship for any new store money path.
    ALSO DROPPED, all silently:
    ORDER_SERVICE_ADDR -> falls back to localhost:50051
    USER_SERVICE_ADDR  -> localhost:50055
    GAME_SERVICE_ADDR  -> localhost:50053
    USER_HTTP_URL, USE_WALLET_RATE_CATALOG,
    STORE_PROVIDER_TIMEOUT_SECONDS,
    RABBITMQ_QUEUE_PLAYER_ACTIVITY_MISSIONS -> defaults / off
    The three localhost fallbacks mean those gRPC clients point at the task's
    own loopback in production. Establish what that actually breaks before
    assuming it is harmless — it may be why some cross-service behaviour has
    looked flaky.
    ESTABLISH FIRST, BEFORE CHANGING ANYTHING: why env.prod.names exists at
    all. It may be deliberate — a smaller surface for a period when prod ran
    a reduced configuration — or it may be a fork that was never
    reconciled. `git log --follow ecs/env.prod.names` and the commits that
    introduced it are the place to start. Do not delete it on the assumption
    it is a mistake.
    THEN DECIDE AND WRITE DOWN: whether prod adopts ecs/env.names (the same
    file staging uses), or env.prod.names is extended to cover what prod.yml
    exports. Adopting env.names is the cleaner end state but changes what
    reaches the task in production, including turning the orders-catalog
    path ON — that is a money-path behaviour change and needs to be treated
    as one, not as a config tidy-up.
    ⚠️ TURNING USE_ORDERS_CATALOG ON IS THE RISKY PART. Production has been
    running the legacy path; switching it means the store starts delegating
    to Orders for real. Verify on staging first with the same configuration,
    and plan the rollback (unset the variable) before deploying.
    Verify by reading the RENDERED task definition after deploying, not by
    reading the workflow — the whole defect is that the workflow says one
    thing and the task gets another.
