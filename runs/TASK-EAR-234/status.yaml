next_action:
  agent: dev
  description: >-
    Configure gin's proxy trust so c.ClientIP() cannot be overridden by a
    client-supplied X-Forwarded-For, and then either repair or delete the
    unwired rate-limit middleware and its dead config knob. The middleware
    as written cannot express per-route limits: a package-level sync.Once
    singleton means the first caller's config wins forever, while the
    response headers report the caller's own config — so a second route
    would enforce the first route's limit while advertising its own.
