      Recording the irony deliberately, because it is the lesson: this
      session spent the day closing money paths that trusted the wrong
      thing, and the strongest control shipped today — a fail-closed
      signature gate — rests on a key that has been readable in git the
      whole time. A control is only as good as the secrecy of what it
      verifies, and nobody had checked that assumption either.
      Note the partial mitigation, so severity is not overstated: the HMAC
      key (`secretKey`) is NOT part of the signing string — only
      `signatureKey` is. An attacker with repo access gets half the material,
      not a working forgery. That lowers the ceiling; it does not make a
      tracked credential acceptable. Claude advisory lane.
