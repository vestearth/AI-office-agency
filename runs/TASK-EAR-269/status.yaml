next_action:
  agent: dev
  description: >-
    SECRET IN THE REPO — violates the no-secrets-in-repo hard guardrail, and
    it undermines the fix shipped in TASK-EAR-261.
    `server.log` is a TRACKED file in Games-Labs-Provider, present on main,
    staging AND prod. It contains a `ResponseStringToSign` entry, and per
    utils/signature.go:126 that string is composed as
    `platformURL + payload + xTime + signatureKey` — so AFB_SIGNATURE_KEY is
    sitting in plaintext in the repository, readable by anyone with repo
    access.
    Verified without printing the value: the file is tracked on all three
    branches, one ResponseStringToSign occurrence, and .gitignore has NO
    `.log` pattern at all.
    WHY IT MATTERS RIGHT NOW: TASK-EAR-261 just hardened the AFB signature
    check to fail closed. That control assumes the signing material is
    secret. Half of it is not. Hardening the gate while the key is in git is
    theatre.
    WHAT TO DO — and the ORDER matters:
    1. Establish the blast radius BEFORE deciding: how long has it been
       tracked, which commits contain it, and is the repo private-only or
       has it ever been forked/mirrored. `git log --follow --oneline --
       server.log` and check every branch.
    2. Remove it from the working tree and add a `.log` (and `*.log`)
       pattern to .gitignore. This alone does NOT remove it from history.
    3. DECIDE AND WRITE DOWN whether history rewriting is warranted
       (git-filter-repo / BFG) or whether rotation alone suffices. Rewriting
       shared history is disruptive and needs the operator's call — do not
       do it unilaterally.
    4. Check whether the debug logging that produced it still runs, and
       whether it now writes the same string into CloudWatch. Removing the
       file while the logger keeps emitting the key to log aggregation moves
       the problem rather than closing it.
    5. ROTATION IS AN OPERATOR + AFB DECISION, not a code change. Surface it
       with what you found in step 1; do not attempt to rotate anything.
    Do not print the secret value into any report, PR, commit message or
    task file — including this run's own artifacts.
