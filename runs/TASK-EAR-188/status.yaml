next_action:
  agent: dev
  description: >-
    Apply an established, already-verified pattern to more call sites — this
    is not design work. TASK-EAR-181 shipped the contract
    (events.AdminActionEvent, shared-lib 1a39df5), the sink (Logs migration
    003 admin_actions + AdminActionsConsumer on events.admin.actions), and
    Games-Labs-User as the first publisher, then proved the whole chain on
    staging with real rows covering the succeeded and failed paths.
    READ Games-Labs-User FIRST as the reference:
    infrastructures/admin_action_publisher.go,
    internal/core/handlers/adminuserhdl/audit.go and audit_test.go.
    BUILD: (1) Order e-voucher grant — GrantRedemptionItem in adminorderhdl,
    named in TASK-EAR-181's acceptance criteria and carried here rather than
    dropped; (2) Missions admin panels — enumerate the adminmission player
    write paths, instrument the meaningful ones, and LIST what you skipped
    and why.
    NON-NEGOTIABLE, all carried from 181: publishing must never block or
    fail the admin write (async, fire-and-forget, errors to a log line);
    actor from gateway-validated metadata, never the request body; fresh
    uuid per attempt because the sink dedupes on UNIQUE(event_id); publish
    denied and failed attempts too; before-state must be the STORED value,
    not a display value — in User that meant GetProfile rather than the
    masking GetLevelStats, so look for each service's equivalent trap; and
    NEVER put voucher codes, credentials or tokens in before/after, since
    this store is long-lived and read by humans.
    DEPLOY TRAPS that each bit this epic once: a non-string env var in
    ecs/env.names kills the container (build-env-json.sh injects "" for
    anything the workflow does not set, and envconfig cannot parse it) —
    keep new config as strings parsed in accessors; the queue name must
    match events.admin.actions on both sides with the same empty-tolerant
    default; pin the MERGED main SHA of shared-lib, never a branch commit.
    Verify on staging by performing each action and reading admin_actions,
    not by unit tests alone.
