inventory:
  - surface: 'Group edit (mode=highlight, non-Top): Cover Image dropzone'
    decision: wired
    detail: |
      Upload via POST /admin/uploads/banners (PERM_GAME_MANAGEMENT — same gate
      as UpdateCategory), persisted with PUT /api/v1/admin/category/:id
      {imageUrl} inside the Update flow; hydrated from GET /admin/category via
      new util extractCategoryImageUrl (camelCase + snake_case tolerant).
      Verified in source: UpdateCategoryRequest.image_url field 5 →
      gameRepo.UpdateCategory → categories.image_url; Category.imageUrl in
      list via categoryToProto/responseImageURL. Gateway already on shared-lib
      c048249 → field passes; no shared-lib or gateway bump needed.
  - surface: 'Group edit: Remove button for a PERSISTED cover'
    decision: honest-read-only
    detail: |
      UpdateCategory handler ignores empty image_url (proto3 string, no
      presence) — clearing a saved cover is impossible without a backend
      change. Remove now only discards an unsaved local selection; disabled
      otherwise with an explanatory tooltip. If clearing is wanted, it needs
      an optional/string-presence proto change (fold into TASK-EAR-242 or a
      new task).
  - surface: >-
      Group edit: no-mode fallback (mock Game AA rows, 3:1 banner dropzones,
