    CloudWatch /ecs/*-prod boot logs for "Migrations applied" lines and no
    42703 / panic within 5 minutes of each rollout.
    VERIFY BEFORE CALLING IT DONE: every service's Deploy PROD run success
    AND ECS single COMPLETED deployment AND the smoke list above; a green
    workflow is rollout evidence, not business evidence.
    OUT OF SCOPE unless widened: Provider, Auth, Logs, backoffice.
