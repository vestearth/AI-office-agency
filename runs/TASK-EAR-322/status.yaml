    and expiry cleanup, monitoring credit events, coupon/turnover fixes;
    Missions weekly per-game turnover (mig 055), daily-bonus double-pay
    fix (#115), EAR-263 money-path binding, monitoring events; Game
    player.activity bet/win publishing, ListPlayerGameActivity pagination;
    User SPAR-20 activity events, EAR-271 mux money calls; gateway
    redemption/coupon/monitoring/password-reset routes and ten shared-lib
    bumps. Each prod branch also carries prod-ONLY infra commits (RDS
    secret ARN, prod image tags, prod service addresses, Game SMTP env,
    User GEMINI env) that a merge must preserve - never force-push staging
    over prod. A merge-tree dry run predicts conflicts in Missions
    (.github/workflows/prod.yml, config/config.go), User
    (configs/config.go), api-gateway (gateway/http.go) and Order
    (configs/config.go, ecs/env.names); Wallet and Game merge clean.
    HARD ORDER (each step waits for the previous service's ECS rollout to
    reach a single COMPLETED deployment, and each merge = deploy because
    push to prod triggers Deploy PROD with no PR checks):
    0. Preconditions: CHANGE WINDOW SET by the operator on 2026-09-05:
       Monday 2026-09-07 11:30 Asia/Bangkok (prod is up 09:00-20:00 on
       weekdays), to be RE-CONFIRMED by the operator on the day before the
       first push. Smoke account: the same devtest login that exists on
       staging also exists on prod - use it for login, /users/me, admin
       reads and the forged-amount topup-bonus probe; a real small deposit
       on prod is a separate explicit go from the operator, not implied.
       Optional prep that deploys nothing and can be done before Monday:
       open the six staging->prod merge PRs with conflicts resolved and
       the Missions env fix included, but DO NOT merge - merge is deploy; record the current
       prod image tags per service (prod-sha-*) as the rollback set; verify
       AWS profile vestearth; re-check TASK-EAR-191 (unauthenticated
       /webhooks/store-payment on prod) - if its fix is not in this diff it
       stays open and must be said so, not assumed closed.
    1. Order (+26) FIRST: Wallet staging settles Stripe checkouts through
       Order's internal checkout RPCs (EAR-296/297/298); Order prod has no
       PrepareCheckoutOrder handler (0 hits vs 6 on staging), so shipping
