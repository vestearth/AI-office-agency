       WALLET_GRPC_ADDR/WALLET_HTTP_ADDR/GAME_API_URL (TASK-EAR-271).
       Admin list now hard-depends on Wallet and Game being up.
    6. api-gateway (+29) LAST: pin 2ab2518 -> 19237a7 carries every wire
       change above (it owns the wire format) plus the EAR-319 route order.
       Resolve gateway/http.go against prod's Swagger toggle commit.
