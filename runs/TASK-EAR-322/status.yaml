       defaults 10/10, same as staging.
    4. Game (+9): no migration; WIN_CAPTURE_PROVIDERS is not exported on
       prod as far as the workflow shows - confirm on the live task
       definition; if unset, ListPlayerGGR returns nothing and admin GGR
       stays 0 on prod (honest, not broken). Provides ListPlayerGGR that
       User step 5 calls.
    5. User (+20) in TWO deploys, exactly as on staging: 5a merge staging up
       to c4a2769 (EAR-321 deploy A, stop reading the columns) and roll
       out to a single COMPLETED deployment; 5b merge the rest (migration
       017 drops the columns). One combined deploy would make the still-
       running old prod task fail GetProfile with "column does not exist"
