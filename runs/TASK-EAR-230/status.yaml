  description: >-
    MERGED (5864232) AND DEPLOYED — k3s/ArgoCD pipeline completed
    success. The Manual Wallet panel can no longer send a spurious 0 for
    an untouched currency. This was the sole blocker on TASK-EAR-227;
    Games-Labs-Wallet#13 and api-gateway#40 are now safe to merge. All three guards implemented, with
    parsing and input rules extracted to app/utils/adminWalletBalance.ts
    so each is directly testable rather than buried in the SFC.
    THE CRITICAL REQUIREMENT HOLDS — coordinator traced a typed "0"
    through the whole chain independently: walletInputValue("0") -> 0,
    isWalletValuesComplete -> true, serializeWalletPatchBody ->
    {"coin":"0",...}, while "" -> null -> Save blocked. The blank
    sentinel is null and never 0, so zero stays a first-class value.
    That was the single thing most likely to be broken by an over-eager
    guard, and it is not.
    Evidence quality worth noting: the agent proved the tests meaningful
    by running origin/main's ORIGINAL parser against the new fixtures —
    pre-fix it returned coin:0 for a dropped key and three zeroes for
    {data:{}}, exactly the values the new tests now assert are null. It
    also ran an A/B smoke against a build of untouched main, showing
    cleared-Coin "0" -> "" and Save enabled -> disabled, without ever
    clicking Save on the staging player.
    DEPLOY ORDER IS THE LOAD-BEARING PART: this must be merged AND
    DEPLOYED before Games-Labs-Wallet#13 and api-gateway#40 merge.
    Merging those first, or merging this without deploying, leaves the
    balance-wipe window open.
