next_action:
  agent: dev
  description: >-
    Two Wallet findings that share one root cause: money routes served on a
    bare http.ServeMux with no authorization, outside everything the gateway
    gates.
    ⚠️ SEVERITY IS PROVISIONAL. Both are ranked "cluster-internal only" on
    an UNVERIFIED assumption that Wallet's container port is not reachable
    from outside the VPC. TASK-EAR-265 is answering that. If the answer is
    that it IS reachable, both of these become anonymous unauthenticated
    wallet credit from the public internet — the same severity as
    TASK-EAR-261 — and this task should be re-prioritised accordingly rather
    than treated as hardening.
    FINDING-6 · the surface: cmd/main.go:117-137 exposes /wallets/credit,
    /debit, /redeem, /refund-points, /reward-package, /transfer-coin,
    /add-diamond, /exchange-diamonds-to-coins, plus two
    /admin/wallets/rate-catalog/* routes, on a bare mux with NO auth at all.
    Its security today rests entirely on network isolation. task.md for
    TASK-EAR-257 anticipated this and the audit confirmed it is still true.
    Note it is the LESSER problem now: TASK-EAR-262 (walletpb) exposes the
    same capabilities through the front door, so fix that first regardless.
    FINDING-5 · the specific one: paymentsvc/callback.go:14-44, the OneDay
    deposit-callback, has NO signature verification and accepts
    confirmStatus, amount and amountNet from the payload, then settles the
    deposit AND package rewards. Its two siblings both verify —
    ubit_callback.go:25-27 and http.go:263-266 — so the correct pattern is
    already in the same package, twice.
    Probed 404 at the gateway, so not externally reachable through it today.
    But OneDay being currently disabled is a configuration state, not a
    guarantee: if it is ever re-enabled it needs a public route, and that
    route would arrive unauthenticated. Fix it now or delete it — a dormant
    unverified money callback is a trap for whoever re-enables the provider.
    DECIDE AND WRITE DOWN: whether the internal mux should be authenticated
    at all (a service-to-service secret or mTLS), or whether the answer is to
    stop relying on network isolation as the only control. That is an
    architecture call, not a code tweak — say what you chose and why. The
    same residual was accepted deliberately in TASK-EAR-254 for the same mux,
    so this task is where that debt gets settled.
    Regression test seen RED first for whatever you change.
history:
  - phase: blocked -> pending
    agent: dev
    at: '2026-08-15'
    reason: >-
      UNBLOCKED, AND DELIBERATELY NOT ESCALATED. TASK-EAR-265 was answered by
      the operator on 2026-08-15: Wallet's and Order's container HTTP ports are
      not reachable from outside the VPC, on staging or prod. The Tier A
      scenario this task was hedged against — anonymous wallet credit from the
      public internet — does not apply. Severity stays internal-only hardening.
      WHY IT IS STILL WORTH DOING, stated plainly so the ranking is not mistaken
      for a dismissal: network isolation is now the ONLY control in front of
      eight unauthenticated money endpoints on Wallet's bare http.ServeMux
      (cmd/main.go:117-137) — /wallets/credit, /debit, /redeem, /refund-points,
      /reward-package, /transfer-coin, /add-diamond, /exchange-diamonds-to-coins
      — plus the OneDay deposit callback, which settles a deposit and its
      package rewards without verifying any signature. One security-group edit,
      one ALB listener, or one compromised pod inside the VPC turns all nine
      into the Tier A case with nothing else in the way. The audit's own lesson
      applies here: 'internal-only is not a security boundary' is exactly how
      the earlier incident reached a service through another service's public
      binding. SCOPE WHEN SCHEDULED: authenticate the mux endpoints (service
      identity, not a body field) and verify the OneDay callback's signature.
      Reproduce first, regression test RED first. Do NOT weaken the guards TASK-
      EAR-262 added to the gRPC surface while working in the same service.
