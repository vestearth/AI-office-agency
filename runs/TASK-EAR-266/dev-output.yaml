summary: |
  Wallet's internal HTTP mux now checks X-Internal-Token with a
  constant-time compare against WALLET_INTERNAL_TOKEN. Phase A
  (WALLET_INTERNAL_TOKEN_ENFORCE anything but "true") logs missing/bad
  tokens and still serves; Phase B ("true") returns 401. Exempt:
  /health, /payments/stripe-webhook, /payments/ubit-deposit-callback.
  OneDay /payments/deposit-callback is not exempt. Empty configured
  token never matches. Order, Provider, Missions, and User attach the
  same header on every Wallet HTTP call. No secret value is in git.
  Deploy order: Wallet (A, ENFORCE=false) -> Order/Provider/Missions/User
  -> Wallet (B, ENFORCE=true) after 24h of zero unauthenticated hits.
  Rollback: flip ENFORCE back to "false". Staging only; prod is the
  next patch train. Branches exist as task/TASK-EAR-266; PRs not opened.
