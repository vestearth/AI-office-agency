history:
  - phase: created -> assigned
    agent: pm
    reason: >-
      User reported a layout bug on the Store Avatar edit page: in edit mode the
      Cancel/Update footer overlaps the Sale date-picker rows. Root cause confirmed
      via systematic debugging — the scroll body is a <fieldset> used as the
      flex-1/min-h-0/overflow-y-auto child, and fieldset ignores min-height:0 /
      flex-shrink (Chromium), so it does not scroll; edit mode's extra rows overflow
      under the sticky footer. Working scroll bodies elsewhere (redemption, VIP) use
      a <div>. Phase 1 of the user's request (bug fix first, translate UI later).
  - phase: assigned -> in_review
    agent: dev
    reason: >-
      Fixed in items/.../avatar/edit/[id].vue (Claude-advisory lane). Replaced the
      <fieldset> scroll container with a <div class="min-h-0 flex-1 overflow-y-auto
      p-4 sm:p-5"> and nested a borderless <fieldset class="m-0 min-w-0 border-0 p-0"
      :disabled="isEditLocked"> inside it so the scroll/flex sizing is reliable while
      group-disable is preserved. Also fixed the tab label "Infomation" -> "Info &
      Condition" (matches Figma). `npm run build` passes. Visual smoke is login-gated
      (per TASK-104) so the user confirms the overlap is gone; the fix mirrors the
      proven working scroll bodies (redemption, VIP). No logic/state changes.
      Follow-up in same review: replaced the 3 native <select> arrows on this page
      (Collection, Level VIP Available, Currency) with the custom chevron pattern
      (appearance-none + lucide:chevron-down overlay), per repeated user feedback;
      captured as a standing preference in memory so it is applied proactively going
      forward. `npm run build` still passes.
