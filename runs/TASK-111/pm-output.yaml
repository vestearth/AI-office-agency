description: |
  Mobile/QA reported HTTP 500 from POST /api/v1/store/exchange on ECS staging.
  Source inspection shows no intended mobile request-contract change: mobile
  still sends user_id, rate_id, and optional idempotency key. The likely backend
  issue is that Missions wraps non-2xx Order exchange responses as plain errors,
  which can be mapped to HTTP 500 instead of stable client-safe statuses.

  The task is to implement the smallest backend/staging fix: preserve or map
  downstream Order exchange errors in Missions, add focused regression coverage,
  and align ECS staging env so USE_WALLET_RATE_CATALOG=true is rendered along
  with USE_ORDERS_CATALOG=true. Avoid shared-lib or mobile contract changes
  unless fresh evidence proves they are required.
acceptance_criteria:
  - criterion: POST /api/v1/store/exchange keeps the existing mobile request contract with user_id, rate_id, and optional idempotency_key or Idempotency-Key.
  - criterion: Known downstream Order exchange non-2xx responses no longer surface to mobile as generic HTTP 500.
  - criterion: Focused Missions tests cover at least one downstream Order non-2xx exchange response and prove the response is client-safe.
  - criterion: ECS staging render path includes USE_WALLET_RATE_CATALOG=true in both .github/workflows/staging.yml and ecs/env.names.
  - criterion: Targeted Games-Labs-Missions tests pass with GOWORK=off and a writable GOCACHE.
  - criterion: Targeted Games-Labs-Order exchange tests pass or are documented unchanged when no Order code is edited.
  - criterion: Final mobile handoff states that no mobile contract change is required and that rate_id should come from fresh GET /api/v1/store/rates data.
plan:
  approach: |
    Keep the fix in Games-Labs-Missions unless source evidence proves Order or
    shared-lib must change. First lock the failing behavior with a focused test,
    then map or preserve downstream Order status/error payloads in the smallest
    layer. Separately align ECS staging env for the Wallet rate catalog flag.
    Verify with targeted service tests and prepare a short mobile retest note.
  subtasks:
    - order: 1
      id: inspect-current-error-contract
      description: Inspect Order exchange HTTP error bodies/statuses and Missions httperr/shared-lib status mapping before editing.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/clients/order/client.go
        - Games-Labs-Missions/internal/handlers/httperr/httperr.go
        - Games-Labs-Order/internal/core/handlers/orderhdl/http.go
      parallel_safe: false
    - order: 2
      id: add-missions-exchange-error-coverage
      description: Add a focused regression test proving an Order non-2xx exchange response does not become generic HTTP 500.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/clients/order/client.go
        - Games-Labs-Missions/internal/services/store_service.go
        - Games-Labs-Missions/internal/handlers/mission/http/store.go
      parallel_safe: false
    - order: 3
      id: implement-client-safe-error-mapping
      description: Implement the narrow Missions-side error preservation or mapping needed for client-safe exchange responses.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/clients/order/client.go
        - Games-Labs-Missions/internal/services/store_service.go
        - Games-Labs-Missions/internal/handlers/mission/http/store.go
      parallel_safe: false
    - order: 4
      id: align-ecs-wallet-rate-env
      description: Add USE_WALLET_RATE_CATALOG=true to the Games-Labs-Missions ECS staging render path.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/.github/workflows/staging.yml
        - Games-Labs-Missions/ecs/env.names
      parallel_safe: false
    - order: 5
      id: verify-and-handoff
      description: Run targeted tests, validate TASK-111 YAML, and prepare the mobile/QA retest note.
      agent: dev-2
      owned_files:
        - ai-dev-office/runs/TASK-111/task.md
        - ai-dev-office/runs/TASK-111/status.yaml
      parallel_safe: false
  risks:
    - risk: Order HTTP errors may be plain strings, so exact meta-code preservation may not be possible without broader contract work.
      mitigation: Map by HTTP status first and only escalate to shared-lib/API contract changes if tests prove status-level mapping is insufficient.
    - risk: The live 500 may include a runtime-only Wallet/Order failure not reproducible locally without a valid token and CloudWatch logs.
      mitigation: Keep the code fix narrow, improve status surfacing, and request request_id/timestamp/rate_id for post-deploy verification.
    - risk: Mobile may be using stale hardcoded rate_id values.
      mitigation: Handoff must explicitly tell mobile to fetch rate_id from GET /api/v1/store/rates before POST exchange.
  estimated_complexity: medium
assignment:
  primary: dev-2
  parallel: false
  reason: This is a tightly coupled backend and staging-env fix; one sequential owner should avoid split-brain behavior across error mapping and deploy config.
summary: |
