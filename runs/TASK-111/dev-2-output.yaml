---
summary: |
  Implemented the TASK-111 backend/staging fix in Games-Labs-Missions.

  The mobile-facing request contract for POST /api/v1/store/exchange is unchanged:
  mobile still sends user_id, rate_id, and optional idempotency_key or
  Idempotency-Key. The change is in the Missions Order client bridge: non-2xx
  Order exchange responses are now mapped into shared-lib meta errors instead of
  plain fmt.Errorf values, so expected downstream failures no longer become
  generic HTTP 500 responses when the Store handler writes them.

  Added focused Store handler regression coverage proving that a downstream
  Order package miss maps to HTTP 404 and a downstream Order server failure maps
  to HTTP 503. Also aligned ECS staging env rendering by exporting
  USE_WALLET_RATE_CATALOG=true and adding it to ecs/env.names, matching the
  intended rate-catalog runtime path.

  Compatibility note: no shared-lib/proto/gateway/mobile contract changes were
  made. A live token-authenticated staging smoke still needs to happen after
  deploy; mobile should retest using a fresh rate_id from GET /api/v1/store/rates.
