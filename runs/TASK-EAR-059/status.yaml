      corrected after the game catalog loads (the catalog re-seed updated gameIds
      but not totalGame). Fix (option B, user-chosen): extracted a pure helper
      app/utils/missionGameCount.ts poolGameIds() (catalog-matched game refs),
      TDD tests/missionGameCount.test.mjs (4 cases, RED->GREEN); seedGameIds now
      uses it, Total Game seeds from the real game count with pool.length only as
      a pre-catalog placeholder, and the onMounted catalog re-seed corrects the
      placeholder to the actual game count (guarded so it never clobbers a user
      edit). Verified: 11/11 focused tests pass, `npm run build` green. Same
      editor is shared by the Weekly edit page, so both are fixed. Browser smoke
      of the exact banner/value is auth-gated (login-only) and not run here.
