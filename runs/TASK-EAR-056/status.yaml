    (daily_activity_groups / daily_activity_group_members / daily_activities,
    migrations 001, 020, 034) and Weekly (weekly_activity_groups /
    weekly_activity_group_members / weekly_activities, migrations 027, 028,
    029) plans.

    For each plan/group, compute the derived total the Backoffice plan intends
    to persist (SUM of each VISIBLE task's reward, single currency) and
    compare it to the stored group.reward (daily_activity_groups.reward /
    weekly_activity_groups.reward). Output two lists: (a) single-currency
    plans where stored != derived, with old value, derived value, and delta;
    (b) plans with mixed currency across their visible tasks (must not be
    backfilled — reported for manual admin correction instead).

    CRITICAL correctness trap (do not naively SUM every group_member row):
    condition_type = 'TURNOVER_GAME' activities are per-game children of ONE
    visible Backoffice task and carry a cosmetic (non-summed) reward that
    mirrors the task's reward on every child row — see the anti-overpay
    comment at Games-Labs-backoffice/app/pages/admin/manage/missions/daily/edit/[id].vue:182-186
    and TASK-EAR-045. Summing all TURNOVER_GAME sibling rows verbatim
    multiplies the reward by the number of games and will produce a wrong
    (inflated) audit number. Collapse TURNOVER_GAME siblings the same way
    Backoffice does before summing: group members whose id matches
    `<prefix>-g<N>` by stripping the `-g<N>` suffix (see gIndexOf /
    gameGroupKey / collapseGameChildren in
    Games-Labs-backoffice/app/utils/dailyPlanBoardMap.ts:71-99) and count that
    group once, using any one child's reward (they're identical by
    construction). All non-TURNOVER_GAME rows count individually as today.

    Also record, per plan, whether it is currently "live" (Daily: plan_date =
    current Bangkok day; Weekly: week_start is the current Bangkok week) —
    needed for the freeze decision in gate 3, not to backfill those live now.

    Deliverable: a report (counts, affected plan ids, old/derived/delta,
    mixed-currency list, live-plan flag) handed to product/backend for gate 2
    sign-off. Do NOT write/backfill any group.reward value in this task — that
    is gate 3, blocked on sign-off. Do NOT touch daily_plans / weekly_plans
    scheduling rows.

    BLOCKED: see runs/TASK-EAR-056/audit-output.yaml. The only database
