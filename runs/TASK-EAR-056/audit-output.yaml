queries_prepared_not_run:
  daily: >-
    WITH collapsed AS (
      SELECT
        g.id AS group_id, g.reward AS stored_reward, g.currency AS stored_currency,
        COALESCE(
          CASE WHEN a.condition_type = 'TURNOVER_GAME'
            THEN regexp_replace(a.id, '-g[0-9]+$', '')
            ELSE a.id END, a.id
        ) AS collapse_key,
        a.reward, a.currency
      FROM daily_activity_groups g
      JOIN daily_activity_group_members m ON m.group_id = g.id
      JOIN daily_activities a ON a.id = m.activity_id
    ), per_task AS (
      SELECT group_id, stored_reward, stored_currency, collapse_key,
             (array_agg(reward))[1] AS task_reward,
             (array_agg(currency))[1] AS task_currency,
             count(DISTINCT currency) AS distinct_currencies
      FROM collapsed
      GROUP BY group_id, stored_reward, stored_currency, collapse_key
    )
    SELECT group_id, stored_reward, stored_currency,
           SUM(task_reward) AS derived_reward,
           SUM(task_reward) - MAX(stored_reward) AS delta,
           bool_or(distinct_currencies > 1) AS mixed_within_task,
           count(DISTINCT task_currency) AS distinct_plan_currencies
    FROM per_task
    GROUP BY group_id, stored_reward, stored_currency;
    -- then join daily_plans (plan_date) once that table/data exists, and
    -- compare plan_date = (now() AT TIME ZONE 'Asia/Bangkok')::date for the
    -- live flag.
  weekly: >-
    Same shape as daily, substituting weekly_activity_groups /
    weekly_activity_group_members / weekly_activities, and joining
    weekly_plans.week_start against the current Bangkok Monday-based week
    for the live flag.
