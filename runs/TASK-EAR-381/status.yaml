history:
  - phase: assigned
    agent: dev
    at: '2026-09-23'
    reason: >-
      Verified on admin-dev before opening: coupon TEST112 (10% off) on
      Package I (49.00, itself 10% off) published -19% as its offer because
      Order emits one discount line holding the whole 9.31. The order row says
      discountAmountMinorUnits 441, so the coupon took 4.41 (10% of 44.10) and
      the package 4.90; coupon 112233 on First Timer says 290, all of the 2.90.
      The design constraint that shapes the backfill: Logs dedupes by event id
      (Postgres admission ON CONFLICT plus a ClickHouse HasProjectedEvent
      check), and store.purchase.settled ids are deterministic per order, so
      re-emitting corrected purchase events is silently skipped. A second
      store.purchase.settled with a new id would instead double every package
      purchase count. A distinct correction event type is the only shape that
      both lands and leaves the purchase aggregates alone - the same rule the
      gameplay outcome correction followed.
