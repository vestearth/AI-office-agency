history:
  - phase: assigned
    agent: dev
    at: '2026-09-23'
    reason: >-
      Verified on admin-dev before opening: coupon TEST112 (10% off) on
      Package I (49.00, itself 10% off) published -19% as its offer because
      Order emits one discount line holding the whole 9.31. The order row says
      discountAmountMinorUnits 441, so the coupon took 4.41 (10% of 44.10) and
      the package 4.90; coupon 112233 on First Timer says 290, all of the 2.90.
      The design constraint that shapes the backfill: Logs dedupes by event id
      (Postgres admission ON CONFLICT plus a ClickHouse HasProjectedEvent
      check), and store.purchase.settled ids are deterministic per order, so
      re-emitting corrected purchase events is silently skipped. A second
      store.purchase.settled with a new id would instead double every package
      purchase count. A distinct correction event type is the only shape that
      both lands and leaves the purchase aggregates alone - the same rule the
      gameplay outcome correction followed.
  - phase: assigned
    agent: dev
    at: '2026-09-23'
    reason: >-
      Order work written and tested. Forward (Order #76): storePurchaseDiscountLines
      now emits a package line and a coupon line using the order's own
      discount_amount_minor_units, with the usage row standing in and the old
      combined line kept when neither records the share; RED proof shows the
      three changing cases fail on staging's producer while the four unchanged
      ones pass both ways. Backfill (Order #78, draft): a
      backfill-discount-split subcommand, dry-run by default, that reads
      fulfilled and refunded coupon orders settled before a cutoff and emits
      store.purchase.discount_split only where the lines actually change. The
      live producer and the backfill now share one builder. The new query was
      run against real Postgres 16 after migrations, not only a stub. Two
      consumer checks before choosing the event shape: Logs projects any
      player.activity event verbatim but every report and Player Log query
      filters store.purchase.settled, so the correction cannot enter a purchase
      aggregate; Missions rejects any type outside its supported set before
      counting, as it already does for redemption.claimed. shared-lib #83 adds
      the constant; #78 is pinned to that PR's commit until it merges.
  - phase: assigned
    agent: dev
    at: '2026-09-23'
    reason: >-
      shared-lib #83 and Order #76 merged; #76's Deploy STAGING finished
      2026-09-23T05:35:18Z. Order #78 rebased on staging, re-pinned to
      shared-lib main (a forward move from staging's pin with #83 the only
      change), taken out of draft, and extended so the dry-run reports
      purchases whose order row records no coupon share - the one case no
      reader can split. Logs #49 (draft) looks up corrections once per page and
      applies them in the package and promotion drill-downs and the store
      Player Log, and publishes the coupon's share of the price it applied to;
      a real ClickHouse test proves a correction leaves the package and
      promotion counts at one. Backoffice #159 (draft) switches the Offer
      column to that per-purchase share. Process slip worth keeping: a script
      edit that rewrote a test's doc comment sliced out the two new handler
      tests that had been inserted beside it, and the suite stayed green; the
      named RED run is what exposed it. Verify by test name, not by a count of
      passes.
