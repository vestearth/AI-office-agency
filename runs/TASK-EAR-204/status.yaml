      value (10) permanently shadows the generated plan's real threshold (400).
      The operator's first hypothesis - that editing the default template should
      have rewritten today's plan - was checked and explicitly ruled out as
      correct behavior: RegenerateDailyDue never touches today, an invariant
      locked by schedule_regenerate_test.go:18 under TASK-EAR-079. This run
      therefore fixes the display side only and must not alter generation.
      Scope was widened past the one reported line after reading the
      surrounding code: the same inverted precedence exists on the daily group
      parent, on both weekly surfaces, and for `category` as well as
      `spendingDiamonds`. Fixing only the reported line would leave a parent and
      child rendering different names for the same mission. `totalGame` is
      already plan-wins at all three of its sites and is left alone - it is the
      internal precedent this fix follows, not an additional target.
