      the weekly card, before touching any production code.
      Fix is a single new helper, missionDisplayNameValues.applyPlan, replacing
      the five inverted `<= 0` / `== ""` fallbacks. The template still supplies
      the name pattern and remains the fallback for values the plan does not
      carry; the plan now wins whenever it carries one.
      Two constraints found while implementing, both narrowing the change rather
      than widening it:
      Threshold is applied for spend_prop ONLY. On every other mission type the
      plan's Threshold column is a turnover amount, not a diamond count, and the
      old code applied it unconditionally - harmless in practice because no
      non-spend template carries a {xxx Diamonds} token, but wrong in principle
      and not worth carrying forward into the new helper.
      Category is NOT a straight plan-wins. A pre-existing test,
      TestListWeeklyMissions_ResolvesGeneratedDisplayNames, asserts the
      template's "Slot" is rendered over the plan's raw "SLOT" - the template
      holds the display casing an admin typed. That test failed on the first
      implementation and was treated as a real design intent to preserve, not as
      an obstacle to edit: the rule is now that the template keeps the casing
      when both name the same category (EqualFold), and the plan wins only on a
      genuine mismatch. That existing test was left untouched and a new case
      pins the casing rule explicitly.
