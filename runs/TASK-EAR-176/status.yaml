next_action:
  agent: reviewer
  description: >-
    IMPLEMENTED 2026-07-31. Review commit 78110b1 on branch
    feature/TASK-EAR-176-test-alias-resolver, PR OPEN:
    SparqLab/Games-Labs-backoffice#63 -> main, MERGEABLE. Not merged.
    THE NUMBER THAT MATTERS: the suite was 114 tests / 107 pass / 7 fail; it
    is now 166 / 166 / 0. The 7 dead files contained 59 real tests that had
    never executed once, and a whole-file failure was being counted as a
    single failing test, which is how 59 missing tests stayed invisible.
    All 59 pass — nothing broken was hiding in there, the coverage simply was
    not running. The task anticipated genuine failures; there were none.
    Change: tests/nuxt-alias-hooks.mjs (resolve hook, `~/x` -> app/x, probes
    extensions the way a bundler does since the imports are extensionless, and
    throws with what it tried instead of failing opaquely);
    tests/register-hooks.mjs (the --import entry point — hooks run on their
    own thread so registration must be a separate file); `npm test` in
    package.json; README gets the command plus a warning NOT to run
    `node --test` directly, because the failure mode is tests vanishing from
    the total rather than complaining.
    No dependency added — this repo has no test dependency at all, so a
    Nuxt-aware runner was rejected as too heavy. No app source touched; the
    diff outside tests/ is package.json +1 and README +6.
    Control check worth repeating in review: running WITHOUT the hook still
    gives 107/7, which is what proves the hook caused the change rather than
    something else drifting. `npm run build` clean, same two pre-existing
    warnings, no new "Duplicated imports".
    RECOMMEND ONLY, deliberately not in the PR: wire `npm test` into CI.
    deploy.yml runs no tests at all — which is exactly why this hid
    indefinitely — but it is also the live k3s/ArgoCD deploy path, so adding a
    gate there is an operator decision.
history:
  - phase: created -> pending
    agent: pm
    at: '2026-07-31'
    reason: >-
      Opened at operator request out of the TASK-EAR-169 verification smoke.
      The 7 failures were found by running the suite by hand, not by any
      pipeline: .github/workflows/deploy.yml is build-and-push only, so CI has
      never run these tests and nothing has ever gone red on this.
      Root cause was verified in source rather than guessed. The suite has two
      shapes of test: the 107 that pass mostly read app files as TEXT and
      assert on their contents (e.g. playerMissionComplete.test.mjs:5 reads
      CompleteMissionPanel.vue with readFile), so they never resolve an alias
      at all; the 7 that fail genuinely import app modules (e.g.
      missionName.test.mjs:5 imports ../app/utils/missionName.ts, which in
      turn imports ~/composables/useAdminMissionApi, ~/data/mock and
      ~/utils/gameCategory at missionName.ts:1-3).
      The uncomfortable implication is recorded deliberately: a green "107
      pass" is not evidence that app behaviour is covered, because most of
      that number never executes app code. That is worth its own discussion
      but was deliberately kept OUT of this task's scope so the fix stays
      reviewable.
      Immediate provenance: the TASK-EAR-169 dev-2 handoff reported "all 160
      Backoffice tests" passing while these 7 were not executing — a different
      invocation that was never written down. Hence the requirement here to
      land a single blessed `npm test`.
  - phase: pending -> in_review
    agent: dev
    at: '2026-07-31'
    reason: >-
      Implemented in the Claude advisory lane on operator instruction, same
      day the run was opened. Commit 78110b1, PR #63.
      Both dead ends recorded in the brief held up and cost nothing to skip.
      The fix went the minimal route — a resolve hook rather than adopting a
      test framework — because the repo has no test dependency at all and
      importing one to solve a path-mapping problem would have been the
      largest change in the diff by far.
      Scale of what was hidden turned out worse than the brief assumed: not 7
      files' worth of unknown risk, but 59 individual tests, because
      node --test counts an unloadable file as ONE failing test. A suite
      reporting "107 pass" was running 107 of 166.
      The brief's warning about not editing assertions to force green never
      had to be used — all 59 pass as written.
