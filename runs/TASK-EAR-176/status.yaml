next_action:
  agent: pm
  description: >-
    Unassigned — needs an owner. Games-Labs-backoffice only, test
    infrastructure; no app behaviour change.
    7 of the 114 test files never execute: they import app modules, those
    modules import through the Nuxt `~` alias, and plain Node cannot resolve
    it (ERR_MODULE_NOT_FOUND "Cannot find package '~'"). Affected:
    adminCouponApi, adminStoreItemsApi, missionBoardGameNames, missionName,
    missionPointCurrency, passGameSupport, weeklyPlanBoardBonus.
    Two dead ends already ruled out so the implementer does not re-walk them:
    --experimental-strip-types does NOT fix it (verified, identical error —
    type stripping was never the blocker), and package.json "imports" cannot
    fix it because Node only matches specifiers starting with "#".
    Minimal fix is a Node module customization hook rewriting `~/x` to the
    app/x file URL, loaded via `node --import`. A Nuxt-aware runner is the
    heavier alternative and would add the repo's first test dependency.
    Do NOT rewrite app-source `~/` imports to relative paths to satisfy the
    runner — that is the codebase idiom and is correct under Nuxt.
    Expect some of the 7 to genuinely FAIL once they run; they have not
    executed in an unknown number of weeks while the code they cover kept
    moving. A real failure is the deliverable, not an obstacle to be edited
    away.
    Also add a `test` script to package.json — there is none today (only
    build/dev/generate/preview/postinstall), which is precisely how every
    prior run invented its own invocation.
    CI gate is RECOMMEND-ONLY: deploy.yml deploys backoffice main to the live
    k3s/ArgoCD lane, so adding a test gate there changes the deploy path and
    is an operator decision.
history:
  - phase: created -> pending
    agent: pm
    at: '2026-07-31'
    reason: >-
      Opened at operator request out of the TASK-EAR-169 verification smoke.
      The 7 failures were found by running the suite by hand, not by any
      pipeline: .github/workflows/deploy.yml is build-and-push only, so CI has
      never run these tests and nothing has ever gone red on this.
      Root cause was verified in source rather than guessed. The suite has two
      shapes of test: the 107 that pass mostly read app files as TEXT and
      assert on their contents (e.g. playerMissionComplete.test.mjs:5 reads
      CompleteMissionPanel.vue with readFile), so they never resolve an alias
      at all; the 7 that fail genuinely import app modules (e.g.
      missionName.test.mjs:5 imports ../app/utils/missionName.ts, which in
      turn imports ~/composables/useAdminMissionApi, ~/data/mock and
      ~/utils/gameCategory at missionName.ts:1-3).
      The uncomfortable implication is recorded deliberately: a green "107
      pass" is not evidence that app behaviour is covered, because most of
      that number never executes app code. That is worth its own discussion
      but was deliberately kept OUT of this task's scope so the fix stays
      reviewable.
      Immediate provenance: the TASK-EAR-169 dev-2 handoff reported "all 160
      Backoffice tests" passing while these 7 were not executing — a different
      invocation that was never written down. Hence the requirement here to
      land a single blessed `npm test`.
