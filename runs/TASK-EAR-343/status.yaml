notes: >-
  Root cause confirmed in source and on staging. Missions
  missionProgressEventID nests the full source event id, producing ~159-char
  ids; Logs monitoring_event_admissions.event_id was VARCHAR(128) and the
  consumer nacked oversized ids without requeue, so Monitoring Daily progress
  rows were silently lost. Decision: widen the Logs admission column to
  VARCHAR(512) rather than hash the Missions id. ClickHouse
  monitoring_player_events.event_id is an unbounded String, so PostgreSQL was
  the only limit and no contract or shared-lib change is needed; hashing would
  re-key an in-flight dedupe key and risk duplicate projections. Implemented on
  branch fix/TASK-EAR-343-admission-event-id-width off origin/staging, RED
  first. Local proof is complete: unit RED then GREEN, and migration 006 was
  replayed 4x against a real PostgreSQL 15 with the column at VARCHAR(512),
  zero pg_attribute slot growth, and the verbatim 159-char staging id stored
  through PostgresAdmissionStore. PR #27 is now merged and deployed: Logs
  staging runs task definition :39 and migration 006 is in the boot log.
  Acceptance is still open because staging has had no player.activity traffic
  since that boot, so nothing has exercised the widened key at runtime.
