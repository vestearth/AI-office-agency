next_action:
  agent: dev
  description: >-
    CRITICAL / INCIDENT-GRADE. Treat this ahead of every other open task.
    The AFB signature check in Games-Labs-Provider is FAIL-OPEN: omitting the
    `Signature` header skips verification entirely, and the request falls
    through to a wallet credit. NO ACCOUNT IS NEEDED — Provider's HTTP server
    has no auth middleware at all (cmd/main.go:327, CORS only) and is
    published at api-dev.gameslabs.app. Every other hole found in this sweep
    needed at least a player token; this one needs nothing.
    THE DEFECT (providerhdl/provider.go):
    `if secretKey != "" && sigKey != "" && signature != "" {` — the third
    term is the bug. A caller who simply does not send the header never
    enters the block, so CheckSignatureAFB never runs.
    FOUR handlers carry the identical guard, not two — confirm each:
    :678 GetBalance, :767 Payout, :859 Adjustment, :954 RoundCheck.
    The audit reported payout and adjustment; the other two were found while
    verifying it, so do not scope to the two named in findings.md.
    REACH: Payout -> svc.Payout -> POST /wallets/credit with UserID =
    req.Username and Amount from transactions_list[].amount
    (core/services/afb/service.go:451-470). Arbitrary unauthenticated credit
    of any player's balance from the public internet.
    ON PROD, NOT JUST STAGING: `git show origin/prod:...provider.go | grep -c
    'signature != ""'` returns 4 on main, prod AND staging. Everything else
    this sweep found was staging-only. NOT yet confirmed is whether the prod
    deployment runs this build and whether Provider is publicly reachable in
    the prod environment — establish that FIRST, because it decides whether
    this is an incident or an urgent fix, and it is the one question the
    audit could not answer.
    FIX: invert to fail-closed — a missing signature is a 401, not a skip.
    The correct shape already exists in the same repo at
    providerhdl/idghdl/idg_callback.go:30-40, which refuses to serve at all
    when the expected key is unset in staging/prod
    (`isStagingOrProductionEnv() && expectedKey == ""` -> 503) and only then
    compares. Mirror that: config missing in a real environment must fail
    closed too, or the same hole reopens through an unset env var.
    VERIFY BY EXECUTION, as the audit did but one step further: the audit
    stopped at the body-decode error on purpose without moving money. Prove
    the fix by replaying the exact no-signature request and seeing a 401
    BEFORE the decode, and confirm a correctly-signed AFB callback still
    settles. Regression test seen RED first, covering all four handlers.
    DO NOT probe prod without explicit operator authorisation.
