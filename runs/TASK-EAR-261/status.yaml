  - phase: pending -> in_review
    agent: dev
    at: '2026-08-14'
    reason: >-
      FIXED. Branch feature/TASK-EAR-261-afb-signature-fail-closed, commit
      4876a60, based on origin/main. LOCAL ONLY — not pushed, no PR.
      provider.go is byte-identical across main/staging/prod, so the patch
      applies cleanly to all three.
      ALL FOUR handlers reproduced RED first, with the exact message the
      audit saw on staging — an unsigned request reaching the service layer.
      A second RED axis covered misconfiguration: 24 subtests across 2 envs x
      3 key states x 4 handlers, e.g. "FAIL-OPEN ON MISCONFIG: request
      reached svc.Payout in production with both-unset". The two
      must-not-regress tests (valid signature settles; bogus signature ->
      ER4010/401) passed before the fix as well, which is the correct TDD
      baseline for a hardening change.
      THE GATE, requireAFBSignature, has three branches rather than the
      obvious one: keys unset AND staging/prod -> 503 refuse to serve; keys
      unset in dev/test -> allow, preserving the local curl workflow; keys
      set and signature absent OR wrong -> ER4010/401 BEFORE the body
      decode. Keeping `secretKey != "" && sigKey != ""` as a precondition to
      verifying would have reopened the identical hole through one unset env
      var — reachable, not hypothetical, since build-env-json.sh renders an
      unset name as an empty value rather than failing the deploy. APP_ENV
      defaults to "staging", so an environment that forgets to set it gets
      the CLOSED behaviour. Mirrors idghdl/idg_callback.go:30-34.
      MY OWN VERIFICATION, not taken on report: confirmed the commit has 5
      requireAFBSignature references and that the only surviving
      `signature != ""` is inside the doc comment quoting the old guard.
      Built, vetted and ran the package tests myself, then neutered the gate
      to prove the test is not vacuous — it failed with "SIGNATURE BYPASS:
      unsigned request reached svc.GetBalance ... handler body entered
      without any credential" across the handlers, and the tree was restored
      clean.
      REVIEW POINT THE AGENT RAISED AND I AGREE IS WORTH ATTENTION: the gate
      applies to every caller of these handlers, and cmd/main.go also mounts
      them under /1up/*. With keys set, a signed /1up/... request already had
      to satisfy the AFB check, so only the UNSIGNED path changes — but if
      any live 1UP traffic is currently unsigned on those routes, it was
      relying on the hole and will now 401. Worth confirming before merge.
      PROD EXPOSURE — STILL NOT FULLY ANSWERED, and the polarity flipped.
      Proven from the repo: prod.yml is push-triggered (automatic, not
      manual), the ECS deploy step is live, origin/prod moved to c3fe653
      today, and the four fail-open guards were present and unmitigated
      there. NOT proven: whether the prod ECS service is internet-facing —
      the only on-disk evidence is a 2026-06-24 snapshot outside this repo
      that CONTRADICTS ITSELF (internet-facing in two places, Internal in a
      third).
      TASK-EAR-265 then inverted this task's own triage assumption: this run
      was written expecting "AFB unconfigured on prod" to be the safer
      answer. It is the WORSE one. Production has no AFB_* secrets at all
      while staging has all seven, and empty keys make the OLD guard
      short-circuit on its FIRST term — meaning the signature check never ran
      for any request on prod, signed or not. See runs/TASK-EAR-265/
      findings.md section 5. This fix closes that too, because the new gate
      refuses to serve when keys are unset in a real environment.
      One live `aws elbv2 describe-load-balancers` remains the cheapest thing
      that settles incident-vs-urgent. No production host was probed, per the
      task's own instruction.
      SPUN OUT: TASK-EAR-269 — server.log is TRACKED on main, staging and
      prod and contains a ResponseStringToSign entry, which per
      utils/signature.go:126 embeds AFB_SIGNATURE_KEY in plaintext. Verified
      without reading the value. A fail-closed signature gate is only as good
      as the secrecy of what it verifies.
      ALSO FLAGGED, not actioned: the working tree's prod.yml is not the file
      that runs on push to prod (the staging-branch copy targets the DEV
      cluster with no environment gate) — the drift trap the project context
      warns about.
