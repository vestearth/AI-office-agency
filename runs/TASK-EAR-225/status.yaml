    reason: >-
      STAGE 1 delivered as Games-Labs-Logs PR #9 (base staging, open).
      actor_access removed from the INSERT, the SELECT and the model; the
      column deliberately left in place. The placeholder renumbering was
      the real risk here — an off-by-one compiles, passes every fake, and
      silently writes action into target_user_id — and the agent handled
      it properly: it proved the renumbering against a real Postgres 16
      with all three migrations applied, then MUTATION-CHECKED it by
      swapping $5/$6, which failed with the exact column-crossing symptom
      before being restored. Coordinator independently re-counted the
      final statement: 16 columns, $1-$16 sequential, 16 args in matching
      order, no drift. Also confirmed Stage 1 leaves ZERO live references
      to the shared-lib ActorAccess field in Logs, which means Stage 2's
      contract removal cannot break this branch and the two can run in
      parallel. Docker was paused on the operator's machine so the agent
      used a local brew postgresql@16 on port 55432 instead of unpausing
      it — a good call, and it left the instance stopped afterwards.
      Integration tests skip cleanly with no database, so CI stays green.
  - phase: pending -> assigned
    agent: pm
    at: '2026-08-07'
    reason: >-
      The cleanup TASK-EAR-217 deliberately deferred so the urgent
      mitigation would not be blocked behind a multi-repo contract change.
      Sequenced ahead of the Wallet publisher at the operator's direction
      once it emerged that prod has none of this epic — retiring the field
      now means the eventual prod rollout never receives the column that
      held tokens, instead of inheriting it and needing a second cleanup.
      The ordering constraint was found by reading the consumer rather
      than assuming: admin_actions.go:46 names actor_access in the INSERT,
      so a single combined deploy would drop the column out from under
      still-running containers and silently lose audit rows. Split into
      three stages for that reason alone. Claude advisory lane.
