next_action:
  agent: dev
  description: >-
    Retire actor_access completely — the column, the shared-lib contract
    field, the proto field, and the doc comment that made it look benign.
    THREE STAGES, and the order is the point: the consumer's INSERT names
    the column explicitly, and ECS deploys roll, so dropping the column
    while old containers still run that INSERT loses audit rows for the
    length of the rollout. Stage 1 stops referencing the column in Logs
    and deploys. Stage 2 removes the field from shared-lib behind the
    AGENTS.md:275 publish gate, then bumps the four consumers, rewriting
    rather than deleting their SECURITY comments — the reasoning stays
    true and is what stops reintroduction. Stage 3 adds an idempotent
    DROP COLUMN IF EXISTS migration, deployed only after stage 1 is live;
    Logs replays every embedded .sql on every boot with no version table,
    so idempotency is mandatory. Doing this before the prod rollout means
    prod is never given the column at all.
