    reason: >-
      The cleanup TASK-EAR-217 deliberately deferred so the urgent
      mitigation would not be blocked behind a multi-repo contract change.
      Sequenced ahead of the Wallet publisher at the operator's direction
      once it emerged that prod has none of this epic — retiring the field
