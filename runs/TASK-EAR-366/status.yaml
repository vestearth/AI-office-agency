notes: >-
  Opened by the Claude advisory lane at operator request on 2026-09-18.
  The Summary "Total Redeem" box shows two figures computed under different
  refund rules, and a count that covers only one of them.
  Diamond nets refunds - refund_redemption_item subtracts both the count and
  the amount (useAdminPlayerSendCoinHistory.ts:175, TASK-EAR-329). Point does
  not: totalPoints sums abs(pointsDelta) over the redeem reasons with no
  subtraction (useAdminPlayerPointHistory.ts:170). "Time" (totalRedeem) is set
  only from the Point fetch (Detail/[id].vue:530); the Diamond fetch returns
  its own count that is never merged, so a player who only ever redeemed with
  Diamonds reads as 0 Time next to a non-zero Diamond figure.
  This is NOT a new product decision overriding a deliberate one. TASK-EAR-159
  already ruled that reversal reasons stay out of EarnedReasons/RedeemReasons
  because "they should render as a status/delta on the original row, not a new
  Redeem line item" and that "that reconciliation is a caller/FE-layer
  decision" (wallet_history_reasons.go:14-17). The Diamond side implemented
  that reconciliation; the Point side never did. This run finishes it.
  The earlier hesitation recorded in EAR-329's own comment - "altering a live
  figure is not this task's call" - was that task declining to touch a
  neighbouring figure, not a ruling that the figure is correct.
  Frontend-only. The repository query layer accepts an arbitrary caller-supplied
  reason list by design, so no backend, proto or gateway change is needed.
  Operator was told before approving that admin-visible Point totals will drop
  where refunds exist, and approved on that basis (2026-09-18).
