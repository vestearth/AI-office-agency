    at: '2026-08-06'
    reason: >-
      Found during TASK-EAR-215's live re-verification: the verifying agent
      noticed the audit API's actorAccess field looked exactly like the
      bearer token it had just authenticated with, and flagged it without
      confirming — it declined to replay the token when the permission
      classifier blocked it, which was the right call. Coordinator then
      traced the chain through source rather than trusting the observation:
      api-gateway/interceptor/metadata.go:38 puts the RAW token into gRPC
      metadata (proven by the adjacent line rebuilding "Bearer " + token
      from the same value), shared-lib's ConvertMetaDataToUserData carries
      it to TokenData.Access, the User publisher copies it onto the event,
      Logs persists it plaintext in a long-retention table, and
      TASK-EAR-207's read handler maps it straight into the API response.
      Confirmed the actor_access VARCHAR(64) width is the same as a sha256
      hex digest and therefore proves nothing on its own — recorded that
      explicitly in task.md so a future reader does not dismiss the finding
      on the length argument. Severity is privilege escalation: the audit
      log is readable by a broader staff set than the actions it records,
      so a read-only auditor can harvest a superadmin token. Note this
      epic's own TASK-EAR-207 is what turned a since-July storage problem
      into a live exposure. Not dispatched pending operator go-ahead, but
      recommended for immediate action. Claude advisory lane.
