    read API stopped mapping actor_access as part of this very fix, so a
    purged row and an unpurged one are indistinguishable over the API —
    both return "". Confirming it needs direct DB access. Recording the
    distinction rather than implying proof.
    Still outstanding and NOT closed by this run: rotation of any staff
