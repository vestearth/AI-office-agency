summary: |
  Fixed Games-Labs-Game silently dropping the resolved game_category before
  publishing turnover.settled/round.settled, which left Missions' exact
  category matcher fail-closed and Category Turnover Daily/Weekly missions
  stuck at 0 despite real gameplay turnover. SettleRound now re-attaches the
  pre-upsert category (guarded against a round_id collision pairing the
  wrong game's category), GetRoundLifecycle LEFT JOINs games so
  RepublishTurnoverSettled and ReverseRound get it too, and a category-hydrate
  failure on the conflict path now fails the settle instead of silently
  publishing empty. No API/proto/schema change; historical backfill for
  affected weeks is out of scope pending a separate operator decision.
  Verified end-to-end on staging: after merging PR #19 and the automatic
  ECS deploy (GitHub Actions run 30788448289, both jobs green), the operator
  played 5 real non-promotional Slots rounds (10,000 turnover each) as the
  devtest QA identity (f737e6f3-466b-4db5-b86e-70ac4772b660). Direct
  read-only staging DB queries confirm all 5 rounds produced a
  weekly_activity_event_applications row against
  weekly-sched-2026-08-03-category_turnover (the currently active weekly
  plan, game_category=SLOTS, threshold=5,000) with delta_value=10,000 each,
  and weekly_activity_progress for that activity/week now shows
  progress_value=1,520,000 with last_event_id/last_occurred_at/updated_at
  all pointing at the newest of the 5 rounds — before this fix, the same
  identity's Category Turnover applications for this activity were
  confirmed at 0 rows across 2026-07-27..08-03 in the original
  evidence-gathering pass.

changes:
  - service: Games-Labs-Game
    files:
      - internal/core/services/gamesvc/service.go
      - internal/core/repositories/game.go
      - internal/core/services/gamesvc/settle_round_test.go
      - internal/core/repositories/round_game_category_db_test.go
    details:
      - SettleRound captures the pre-upsert GameID/GameCategory and
        re-attaches the category after UpsertRoundSettlement returns
        (whose RETURNING clause has no game_category column).
      - On a round_id conflict where the stored game_id differs from the
        settling request's input game_id, hydrates the category from the
        STORED game instead of pairing the wrong game's category; if that
        hydration itself errors, fails the settle call rather than
        publishing with an empty category (review-blocker fix).
      - GetRoundLifecycle LEFT JOINs games for game_category (COALESCE to
        empty string), fixing RepublishTurnoverSettled and ReverseRound in
        the same change since both read through GetRoundLifecycle.
      - Added stub-based regression tests (fresh insert, duplicate retry,
        conflicting round_id, conflicting round_id with a failing category
        lookup, republish-after-catalog-edit) and real-Postgres repository
        tests gated on GAME_TEST_DATABASE_URL (RETURNING omission, JOIN
        hydration, live catalog-edit reflection, NULL-category fail-open).
        All confirmed red-before-green against the pre-fix code.

