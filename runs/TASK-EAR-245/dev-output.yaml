summary: |
  Fixed redemption item Start/End Date create/edit gaps and Code-step residual
  (TASK-EAR-245) in Games-Labs-backoffice only.

  Create modal (RedemptionItemCreateModal.vue):
  - Start/End StoreSaleDatePicker now use `iso` (same as edit).
  - Body sends form.startDate/endDate ISO strings directly; removed dmyToIso
    (which dropped ISO values as undefined → null dates in DB).
  - codeValid requires codes.length > 0 (file alone cannot unlock Import File).
  - Code-step copy no longer says demo dropzone / API import after Create.

  Edit (items/edit/[id].vue):
  - Update blocks with toast when Start Date empty.
  - When End Date checkbox is on, End Date is required too.

  Tests: redemptionItemCreateModal.test.mjs expanded; new
  redemptionItemEditDates.test.mjs. node --test 8/8 PASS (create+edit date/
  code tests including prior Code tab tests).
