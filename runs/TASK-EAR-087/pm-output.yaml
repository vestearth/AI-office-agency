task:
  id: TASK-EAR-087
  title: Redeem-time enforcement for E-Voucher player/per-day quota rules
  short_name: order-redeem-player-quota-enforcement
  parent: TASK-EAR-086
  epic: Redemption admin management
  type: bugfix
  workstream: backend
  priority: high
scope:
  target_services:
    - service: Games-Labs-Order
      reason: Owns RedeemRedemptionItem and the redemption item quota columns.
    - service: shared-lib
      reason: Source verification only unless a new error code/field must surface to mobile.
    - service: ai-dev-office
      reason: Tracks task state and verification artifacts.
  affected_files:
    - path: Games-Labs-Order/internal/core/repositories/redemption.go
      action: modify
      description: Enforce one-time / daily-limit / per-day item quota inside the redeem transaction.
description: >-
  Add redeem-time enforcement for the three user-level quota rules the Backoffice
  now configures. One-time use only caps a user at one redeemed row lifetime;
  Daily limit caps a user at limit_day_per_player redeems per day; the per-day
  item quota caps all-user redeems per day when is_quota_limit_per_day is set.
  All checks run inside the existing FOR UPDATE transaction and return distinct,
  documented errors instead of the generic total-quota message.
acceptance_criteria:
  - RedeemRedemptionItem rejects a second redeem under One-time use only.
  - RedeemRedemptionItem rejects redeems beyond limit_day_per_player per user per day under Daily limit.
  - Per-day item quota (quota_limit_per_day) is enforced when is_quota_limit_per_day is set.
  - Each rejection returns a distinct, documented error, not the generic total-quota message.
  - Day boundary and timezone for per-day counting are documented and match Order conventions.
  - Unit tests cover one-time, daily-limit boundary, per-day item-quota boundary, and Unlimited unaffected.
  - No regression to the total_quota guard or idempotency-key replay.
  - After ship, TASK-EAR-086 Backoffice copy drops the config-only framing.
plan:
  - step: Re-confirm no other layer enforces these rules before adding.
    owner: dev
  - step: Add per-user (one-time / daily) and per-day item-quota checks inside the FOR UPDATE tx.
    owner: dev
  - step: Map each failure to a distinct error code and document day-boundary semantics.
    owner: dev
  - step: Add table-driven repo tests incl. a concurrency race case.
    owner: dev
assignment:
  primary: dev
  parallel: false
  reason: >-
    Concentrated in the Order redeem repository and error mapping; shared-lib and
    gateway are verification-only unless a new surfaced error requires a change.
