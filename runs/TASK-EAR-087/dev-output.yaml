summary: |
  Implemented redeem-time enforcement of the E-Voucher player/per-day quota rules
  in Games-Labs-Order so the Backoffice controls (TASK-EAR-086) now actually gate
  POST /api/v1/redemptions/{id}/redeem. Repo-layer change + tests only; no proto,
  service-contract, or migration change.

  Where: RedeemRedemptionItem (internal/core/repositories/redemption.go), inside
  the existing FOR UPDATE transaction, immediately after the total_quota guard.
  The item row is locked FOR UPDATE, which serializes every redeem of that item,
  so each count-then-insert is race-safe (no separate advisory lock needed).

  Three checks (all read fields already scanned into the locked item):
  - "One-time use only" (player_quota_condition): reject if the user already holds
    any user_redemption_items row for this item (lifetime COUNT >= 1).
  - "Limited to one claim per day per player" (current label) / legacy
    "Daily limit": reject if the user's redeems today >= limit_day_per_player.
    limit_day_per_player <= 0 means no effective per-player daily cap.
  - Per-day item quota: when is_quota_limit_per_day is set and quota_limit_per_day
    > 0, reject if ALL-user redeems today >= quota_limit_per_day.

  Day boundary: 00:00 Asia/Bangkok, the product-wide daily reset (matches the
  Missions daily reset convention; there was no existing per-day counter in Order
  to mirror). startOfRedeemDay() computes midnight in that zone (UTC fallback if
  zoneinfo is missing); redeemed_at is TIMESTAMPTZ so the comparison is tz-correct.

  Errors: three distinct errormsg.ErrorInvalidRequest MetaErrors
  ("redemption item already claimed" / "... daily player limit exceeded" /
  "... daily quota exceeded"), NOT the generic "redemption item quota exceeded".
  Typed so the gRPC handler's statusFromErr surfaces a clean status to mobile
  (consistent with the service's existing not-started/expired/inactive
  rejections), instead of a raw internal error. On rejection the service's
  existing refund path returns the pre-debited points (RedeemPoints runs before
  the repo check; createErr triggers RefundPoints) — same shape as the current
  total_quota rejection.

  Condition-string matching (isOneTimeCondition / isDailyPlayerCondition) accepts
  both the current label the Backoffice now stores and the legacy "Daily limit"
  value normalized by the FE, so pre-existing items keep working.

  Tests:
  - Unit (runnable now, default suite): TestStartOfRedeemDay_BangkokBoundary
    (5 cases incl. the 17:00 UTC == 00:00 Bangkok rollover) and
    TestPlayerQuotaConditionMatchers (one-time + daily incl. legacy, negatives).
  - Integration (build tag integration; needs a live Postgres, skips without
    ORDER_TEST_DATABASE_URL): TestRedeemEnforcement_OneTimeUseOnly (2nd claim
    blocked, idempotent retry of the 1st still OK, other user OK),
    _DailyPlayerLimit (blocks beyond N/day, other user has own budget),
    _PerDayItemQuota (blocks all-user beyond N/day), _UnlimitedUnaffected.
    Added seedRedemptionItem / resetRedemptionTables helpers (Gift type so
    total_quota is set directly and there is no per-code assignment to manage).
