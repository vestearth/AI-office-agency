assumptions:
  - >-
    Day boundary is 00:00 Asia/Bangkok (product-wide daily reset; Order had no
    existing per-day counter to copy). Documented in code; change the one location
    constant if the product wants UTC or a per-item timezone later.
  - >-
    The item FOR UPDATE lock serializes all redeems of a given item, so the
    count-then-insert enforcement is race-safe within the existing transaction;
    no new index was added (counts are small under the lock — an index on
    (redemption_item_id, user_id, redeemed_at) can be added if load requires it).
  - >-
    "Daily limit" enforces limit_day_per_player redeems per user per day (the
    numeric the operator sets), matching the editable "Limit Day per Player"
    control; the condition label wording does not force 1.
  - >-
    A quota rejection deducts then refunds points (RedeemPoints precedes the repo
    check; createErr triggers the existing RefundPoints), identical in shape to the
    current total_quota rejection — no change to the debit/refund ordering.
  - >-
    The generic total_quota error was intentionally left as-is (plain error); only
    the three new user-level rejections are typed. TASK-EAR-086 FE keeps its
    config-only framing until this change is deployed to the redeem environments.
  - >-
    Changes are uncommitted on the Games-Labs-Order `staging` working tree (3
    files); branch/commit/merge and the live-DB integration run are the operator
    lane. Nothing pushed.
