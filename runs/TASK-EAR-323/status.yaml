next_action:
  agent: done
  description: >-
    Make a failed Stripe checkout cancellation observable in the Wallet
    service log. Follow-up of TASK-EAR-304, which could not be diagnosed:
    on 2026-08-28 the staging gateway logged four HTTP 500s, every one of
    them POST /api/v1/transactions/{id}/cancel, while the whole
    /ecs/games-labs-wallet-staging log group for that window held seven
    lines, all "[Wallet][RabbitMQ] Free Coin granted" and none about the
    failures (TASK-EAR-304 ev-012). Cause of the blind spot:
    paymenthdl/grpc.go CancelTransaction returns the service error
    verbatim and no layer logs it. Log each failing leg once, at the point
    of failure, with the transaction id and the incoming correlation id,
    using the package's existing log.Printf "[Wallet][Payment] ...
    stage=... cause=%v" idiom (no new logging dependency), and never the
    Stripe secret key, session tokens or the cashier URL. Legs:
    ensureStripeCheckoutExpired (retrieve / expire / unexpected state),
    finishStripeCheckoutCancellation (release checkout order via
    FailCheckoutOrder) and persistStripeCheckoutCancellationCheckpoint
    (persist cancellation checkpoint). Unit tests in
    internal/core/services/paymentsvc must assert the log line is actually
    emitted, seen RED before the change.
