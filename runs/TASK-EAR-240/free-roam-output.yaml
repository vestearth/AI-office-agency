summary: |
  Mapped mockLeaderboardListDetail ↔ adminmissionpb LeaderBoard and wired
  Manage → Leaderboard (Receive Coin + Turnover + edit) to real Admin Missions
  leaderboards API in the same session (action: fix).

  Field map (UI → proto):
  - id → id (YYYY-MM-{receive_coin|turnover})
  - monthLabel ← date_month (UTC first-of-month → "Month, YYYY")
  - monthSign ← status (history→passed, ongoing→active_now, upcoming→waiting)
  - first/second/third/total ← first/second/third_place_reward (+ sum)
  - reward type UI ← type_reward (diamond|coin|point)
  - Receive Coin / Turnover pages ← type receive_coin | turnover
  - History/Ongoing/Upcoming tabs ← status filter (client-side after year list)
  - year ← ListLeaderBoardsRequest.year (Bangkok current year)

  Gaps (honest UI, no fake persist):
  - Active/Inactive toggle: not on UpdateLeaderBoardRequest — disabled display-only
  - Waiting Time chip: decorative only
  - Ongoing month: Manage disabled; PUT rejected by Missions (PermissionDenied)

  Gateway: api-gateway registers AdminMissionsServiceHandlerFromEndpoint — HTTP
  annotations on List/Get/CreateYear/Update are exposed when Missions pin is current.

