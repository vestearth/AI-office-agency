summary: |
  Verified Gap Inventory VIP Level seed gaps against User/shared-lib/BO source,
  then implemented unambiguous BO-only closes.

  Gap verdict:
  1. Delete level RPC — CONFIRMED MISSING. adminuser.proto has List/Get/Create/
     Update only; no DeleteLevel. BO had no delete call. Honest deferred:
     disabled trash on list Manage with title naming the missing RPC. Follow-up
     contract work (shared-lib → User → api-gateway staging) needed if product
     wants real delete (cascading rules undecided).
  2. Avatar collection master — CONFIRMED GAP, WIRED. Order already exposes
     GET /api/v1/admin/collections (ListCollections). VipLevelWizard hardcode
     COLLECTIONS removed; loads via useAdminStoreItemsApi().listCollections();
     empty/error states honest; create no longer pre-selects fake name. Privilege
     field remains collection name string (userpb.AvatarPrevileges.collection).
  3. Column sort UI — CONFIRMED GAP, WIRED (page-local). ListLevelsRequest has
     no sort_by; icons were decorative. Client-side sort on current page for
     VIP Level + Create Date (helpers in vipLevelApi.ts). Server-wide sort
     would need a proto follow-up — not required for this Partial close.

  No shared-lib / User / api-gateway / admin.vue / Game edits. Leaderboard files
  left alone.

decision:
  action: fix
  details: |
    BO-only fixes clear two Partial gaps and honestly surface the delete
    contract blocker. No invent localStorage / fake delete. Route to reviewer.
  sub_tasks: []

