next_action:
  agent: reviewer
  description: >-
    IMPLEMENTED — Games-Labs-Order#20 (039e600) targets staging.
    The hard prerequisite was answered before any code and written up in
    runs/TASK-EAR-185/findings.md: Missions sends NO identity on this call
    (clients/order/client.go:355-390, single Content-Type header), but its
    call never reaches the vulnerable handler. Two independent paths exist —
    api-gateway terminates at the grpc-gateway mux
    (api-gateway/gateway/http.go:103), so external traffic hits the gRPC
    ConfirmPayment, while Missions posts directly to Order's own HTTP mux
    (cmd/main.go:103), which the gateway never proxies to.
    So the fix scopes the gRPC handler to the order's owner and leaves
    ConfirmPaymentHTTP functionally untouched. That is not a carve-out for
    one caller: the two handlers ARE the trust boundary, so the purchase
    flow survives by construction rather than by exception. Rejected the
    alternative of an optional CallerUserID enforced only when set — a
    future caller forgetting it would silently get no check.
    Ownership is read from stored state (h.os.GetOrder), never from the
    request; a missing order returns not-found before the ownership test;
    neither refusal reaches the money path.
    4 tests, 3 seen RED first. The 4th (owner allowed) passed beforehand on
    purpose — it proves the fix does not lock out legitimate use.
    STILL REQUIRED before done: the two live staging checks in waiting_for.
    RECORDED, NOT FIXED: ConfirmPaymentHTTP remains unauthenticated on the
    internal mux — not gateway-reachable so not an active exposure, but a
    defence-in-depth gap needing a service-to-service credential, which is a
    platform decision also covering PaymentCallback. Worth its own task.
