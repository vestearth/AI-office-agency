  # VerifySlip — Branch Quota History Is A Cursor Page (TASK-VS-049, 2026-10-26)

  `GET /v1/branch-packages/history` (slip-api) feeds the branch usage tab in
  slip-front-end. It used to return the whole quota ledger. It now returns one keyset
  page. Read this before you change the endpoint, or add a filter or a total to any
  `quota_history` read. `verified_at` is the UTC date of the prod log check (ev-011,
  2026-10-25T20:34Z = 2026-10-26 03:34 ICT). Recheck `origin/prod` before you repeat
  any number.

  ## Why it broke

  - `packages.ListHistory` called `BranchPackageRepository.ListQuotaDeductions`. That
    query selected every `quota_history` row with `quota_delta < 0` for the merchant
    or branch, `ORDER BY created_at DESC, id DESC`, with no LIMIT and no date range.
    The verify fast path writes one row per charged verification.
  - The task records branch `816d9bc9…` at about 590k rows a day. That figure was not
    measured in this task.
  - Prod `/ecs/slip-api-production` logged 10 × `list quota deductions: … context
    deadline exceeded` between 2026-10-25T08:07:50Z and 17:02:27Z (ev-005). That is the
    3 s repository timeout.
  - slip-front-end hid the failure. `useBranchUsage` did `.catch(() => [])`, so the tab
    showed "ไม่มีประวัติโควตาในช่วงที่เลือก" instead of an error.
  - `EXPLAIN ANALYZE`, run locally on 2M deductions for one branch (ev-004). These are
    local timings, not prod:

    | Query | Rows read | Time |
    |---|---|---|
    | Old (unbounded): Parallel Seq Scan + external merge sort, about 38 MB spilled per worker | 2,000,000 | 631 ms |
    | New first page (`quota_history_branch_created_idx`) | 51 | 12.9 ms |
    | Cursor page 1.5M rows deep | 51 | 0.03 ms |
    | Merchant-wide page (`quota_history_merchant_created_idx`) | 51 | 0.8 ms |

  ## Contract (slip-api#93; final, after the review amendment)

  ```
  GET /v1/branch-packages/history?merchant_id=&branch_id=
      &limit=50                      default 50, max 200; larger values are clamped
      &from=<RFC3339>&to=<RFC3339>   optional; from inclusive, to exclusive; a date-only `to` includes that day
      &cursor=<next_cursor>          optional, opaque

  200 {"items":[...row shape unchanged...],"has_more":bool,"next_cursor":"...","limit":50}
  400 bad `from`, `to` or `cursor`, or a negative `limit`
  ```

  - **No `total`.** A COUNT over millions of rows is the same slow query.
  - **`channel` is ignored.** It was dropped after review because no `quota_history`
    index covers it. The client filters the loaded rows instead. The first contract
    block in decision-memo.md still lists `channel`, but the amendment and PR #93 drop
    it.
  - **Sort order unchanged:** `created_at DESC`. At the same instant a deduction sorts
    before a grant, then `id DESC`. Id ties sort the same way in SQL and in the Go merge
    (`TestListQuotaDeductionsTiesSortLikeGoStrings`).
  - **Cursor** (decision memo): the last item's `(created_at, kind, id)`.
    - A non-canonical (upper-case) cursor id is rejected.
    - `from`/`to` are truncated to microseconds.
  - **Deductions:** at most `limit+1` rows, read through the branch or merchant
    `created_at` index.
  - **Grants:** these come from `branch_package_events`, a small table. They are
    filtered in memory by the same cursor and range, then merged.
  - **Edge cases locked by tests** (RED ev-001/ev-006, GREEN plus the full suite with the
    repository DSN on 47f1bc1, ev-007):
    - `PagesThroughLedgerWithoutGapsOrDuplicates`
    - `PagesZeroQuotaGrantLikeADeduction`
    - `DateOnlyToIncludesThatDay`
    - `TruncatesBoundsToMicroseconds`
    - `BoundsLimit`
    - `RejectsInvalidQuery`
    - `CursorBreaksTimestampTiesByID`

  ## Why this shape — options Earth rejected (2026-10-26)

  1. **Newest-N cap, keeping the bare array.** It needs no FE change. But a busy branch
     would see only the last few minutes, "เดือนก่อน" would be empty, and the CSV export
     would be cut short with nothing telling the user.
  2. **Group deductions per day.** This is the easiest for a person to read. But a
     GROUP BY over a month of this branch (about 17M rows, an unmeasured estimate) hits
     the same timeout. It would need a rollup table, a trigger and a backfill, as
     TASK-VS-048 needed for usage. That is too big for this fix.
  3. **Keep `channel` and add an index** (the amendment's other option). Migration 066
     would run `CREATE INDEX CONCURRENTLY (branch_id, channel, created_at DESC, id DESC)`,
     NO TRANSACTION. That means a large index build on the hot table at boot, plus one
     more index write per verification. Rejected. A channel-accurate ledger is a
     separate task with a planned deploy window.

  ## Client compatibility — either repo can deploy first

  This section is the PR #93 author's claim, plus a source read. It is not a
  measurement.

  - **BE first:** the deployed FE's `mapBranchPackageHistory` already reads
    `record.items`, as well as a bare array. New BE plus old FE shows only the first
    page (50 rows) and nothing breaks.
  - **FE first:** slip-front-end#11 works with either API version.
    - The source read agrees. `mapBranchPackageHistoryPage` treats a bare array as
      `has_more` absent, so the FE makes one request and reports `truncated: false`.
    - The pre-fix handler reads only `merchant_id`/`branch_id` and ignores
      `limit`/`cursor`/`from`/`to`.
    - The FE still filters month and channel on the client (`filteredLedger`).
    - Neither deploy order was exercised.
  - **Rule to reuse:** when a bare-array list becomes an envelope, ship a client
    mapper that accepts both shapes and stops paging when `has_more` is missing.
    Then the deploy order does not matter. Keep the client-side filters until the
    server filters are proven.

  ## FE adoption — slip-front-end #11 (`d378684`)

  - `collectQuotaLedgerPages` follows `next_cursor` for at most
    `branchQuotaLedgerMaxPages = 5` pages of `branchQuotaLedgerLimit = 200` rows.
  - It stops when `has_more` is false, or when `has_more` comes without a cursor. It
    reports `truncated` when it hits the cap.
  - Month → `quotaLedgerMonthRange`: the Bangkok month `YYYY-MM-01T00:00:00+07:00` up to
    the next month, exclusive.
  - When truncated, the count label reads "จาก N+ รายการ".
  - **Checks:**
    - ev-008: RED.
    - ev-009: the 4 ledger tests pass (plus 3 existing idempotency tests), and eslint
      passes.
    - ev-010: no new type errors. The one `AuthOtpInput` error exists on both sides.
    - FE CI on #11 passed (status.yaml).

  ## Prod result

  - **Running images:** `slip-api-production:111` runs `production-sha-32cd203`, and
    `slip-front-end-production:65` runs `production-sha-b3b5948`. Source: status.yaml
    history plus the orchestrator's AWS check on 2026-10-26, which has no ev record.
    Rollback targets are `:110` and `:64` (task.md).
  - **Prod check (ev-011):** 20 × `GET /v1/branch-packages/history` 200, in 5–26 ms,
    between 20:31:13Z and 20:33:59Z, while Earth opened merchant `84006774`'s branch
    pages. Before the fix it returned 500 after about 3 s. The history log lines carry
    no merchant id. They are tied to that merchant by time and client IP.
  - **Inference from ev-011:** the calls came in 4 bursts of 5, each about 73.9 KB. So
    the FE hit its 5-page cap every time, and this branch's ledger is always
    truncated.

  ## Rule — no index, no server filter on a busy table

  - **When a filter is safe:** `quota_history` gets one row per charged verify. An
    optional server filter on it is only safe if an index puts that column in the
    access path.
  - **Why an unindexed filter fails:** under `ORDER BY created_at DESC, id DESC LIMIT n`
    on the branch index, an unindexed `channel = $n` is only a row Filter.
    - When matches are dense, the scan stops after `n+1` rows.
    - When they are sparse, it walks the branch's whole history. The review predicted
      a timeout for `?channel=line` on a busy api branch (51 matches). This was not
      measured in this task.
    - A `from`/`to` window does not help when one month is millions of rows.
  - **Pick one of two fixes:**
    - Add a covering index. TASK-VS-040 did this on `verifications` (migration 063,
      built CONCURRENTLY in 68 s on prod).
    - Drop the server filter and filter the bounded page on the client. TASK-VS-049 did
      this, because on the hot table the index costs a boot-time build and an extra
      write per verify.
  - **Totals follow the same rule:** a COUNT over the filtered set is the same slow
    query, so omit `total` rather than compute it.
  - **Measure the sparse value.** ev-004's channel plan used `channel = 'api'`, which
    every fixture row matches. It finished in 0.023 ms and does not show the
    sparse-match scan.

  ## Known limits and open items

  - **Coverage:** the tab shows the newest 1000 rows of the selected month, not the
    whole month. At the unmeasured 590k rows a day, that is roughly 2–3 minutes of
    deductions (derived).
  - **CSV export:** `exportCsv` exports the same ≤1000 `filteredLedger` rows. The file
    has no truncation marker; only the count on screen shows "+".
  - **Channel filter:** the client channel filter sees only the loaded rows. On a busy
    api branch, LINE rows older than the newest 1000 in the range do not appear.
  - **Hidden errors:** the FE still turns a failed fetch into an empty ledger, via
    `.catch(() => ({ rows: [], truncated: false }))` in `useBranchQuotaLedger`. A
    future 500 would again look like "no history".
  - **Sibling endpoint, confirmed on `origin/prod` `32cd203`:** `ListQuotaHistory`
    still has the three shapes this task rejected. It accepts a `channel` filter, runs
    `SELECT COUNT(*) FROM quota_history`, and pages with LIMIT/OFFSET. Its runtime
    impact is unmeasured (Review Queue).
  - **Staging gaps:** staging never exercised the paged history with a merchant token,
    or the tab in a browser.

