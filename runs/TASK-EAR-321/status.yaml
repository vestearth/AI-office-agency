next_action:
  agent: dev
  description: >-
    Drop the two dead columns user_profiles.lifetime_topup (migration 010)
    and user_profiles.lifetime_ggr (migration 009). Both have had no writer
    since they were added; TASK-EAR-318 and TASK-EAR-320 moved every admin
    read to Wallet / Game. Verified 2026-09-05: the ONLY remaining reader is
    Games-Labs-User internal/core/repositories/profile.go:51 (GetByUserID
    selects COALESCE(lifetime_ggr,0), COALESCE(lifetime_topup,0)::float8
    into models.UserProfile). Everything else is comments. The struct
    fields models.UserProfile.LifetimeTopup / LifetimeGGR STAY: GetProfile
    fills LifetimeTopup from Wallet (EAR-307) and LifetimeGGR is the
    mobile-facing field that product has not decided on (stays 0).
    HOW USER MIGRATIONS RUN (read migrations/run.go before touching it):
    there is no version table - every embedded file is executed on every
    boot in the order listed in run.go, so 009/010 will keep re-adding the
    columns (ADD COLUMN IF NOT EXISTS) on each boot. Do NOT edit or remove
    009/010 (applied migrations are immutable, ai-skills rule
    schema-change-needs-migration). Add 017_drop_user_profiles_lifetime
    _columns.sql with ALTER TABLE user_profiles DROP COLUMN IF EXISTS
    lifetime_topup, DROP COLUMN IF EXISTS lifetime_ggr, wired after 016 in
    run.go. Net effect per boot is add-then-drop, which is idempotent and
    is the price of the replay design; write that down in the file header.
    ORDER MATTERS - this is a contract change on a live table, so it is
    two deploys, never one:
    1. Deploy A (code only): profile.go stops selecting the two columns;
       models keep the fields at their zero values. Tests: GetByUserID
       still returns LifetimeTopup 0 before the Wallet fill, and GetProfile
       still returns the Wallet number (existing EAR-307 coverage). Deploy
       and confirm the rollout is COMPLETED and the old task is gone.
    2. Deploy B (migration only): add 017 + run.go wiring. Only after A is
       fully rolled out - during an ECS rolling deploy the OLD task keeps
       serving while the NEW task boots and runs migrations, so shipping
       the drop together with the code change makes the old task's
       GetByUserID fail with "column does not exist" for the overlap window.
    PROD: the prod branch is 16 commits behind staging as of 2026-09-05 and
    does not have 318/320. Deploy B must never reach prod before 318, 320
    and Deploy A have; state this in both PR bodies.
    ROLLBACK: for A, revert. For B, revert 017 + run.go; the next boot's
    replay of 009/010 re-creates both columns with DEFAULT 0. No data is
    lost either way because the columns were never written - every row is
    0 - so no backfill or snapshot is needed; say so explicitly rather than
    skipping the rollback note.
    LOCKING: DROP COLUMN takes ACCESS EXCLUSIVE on user_profiles for the
    catalog update only (no rewrite); staging has ~76 users, negligible.
    Note it for prod anyway.
    VERIFY: RED first for A (a repository test that the SELECT no longer
    names the columns, or a real-Postgres test against a table without
    them); for B a real PostgreSQL run of migrations.Run twice (replay
    idempotency, as Game's harness does) proving the columns are absent
    afterwards. Live: after B, User CloudWatch boot log shows the 017 line
    and NO "column does not exist" errors; GET /api/v1/users/me (player
    bearer) still 200 with lifetimeTopup from Wallet; admin list/detail
    still 200 with the EAR-318/320 numbers - grep raw bodies.
    OUT OF SCOPE: the mobile lifetime_ggr product decision; the backoffice
    "Lifetime GGR" label; monitoringpb lifetime_topup_thb.
