summary: |
  Package Payment Gateway is live on staging at instrument level. Wallet
  resolves the instrument after the signed Stripe webhook (session.Get with
  payment_intent.latest_charge expanded), maps it once to the product
  vocabulary (Apple Pay / Google Pay / Credit/Debit Card / PromptPay, else
  empty), forwards it on ConfirmCheckoutOrder.payment_gateway and keeps a
  durable copy in payment_transactions.metadata.payment_gateway. Order
  persists it on orders.payment_gateway (migration 043) with the
  pending->payment_confirmed transition, exposes it on Order reads, and stamps
  it verbatim into store.purchase.settled; Logs/Backoffice render it via the
  Wave 1 field. Staging fixtures: card -> "Credit/Debit Card", PromptPay ->
  "PromptPay", each proven through transaction status, /orders/{id}, and the
  Store row; every pre-cutoff row still shows a dash. Apple Pay / Google Pay
  are unit-only (test-mode wallet payment not reproducible here). Ubit declared
  unused by the operator; maps to empty. Prod untouched.
artifacts:
  - path: shared-lib/proto/orderpb/order.proto
    action: modified
    description: ConfirmCheckoutOrderRequest.payment_gateway=3, Order.payment_gateway=16 (+ regenerated pb/gw/swagger, adminorderpb swagger); PR #77 merged main 2862b19.
  - path: shared-lib/proto/orderpb/order_contract_test.go
    action: modified
    description: TestPaymentGatewayContract pins numbers, protojson names, legacy round-trip.
  - path: Games-Labs-Order/migrations/043_add_orders_payment_gateway.sql
    action: created
    description: orders.payment_gateway VARCHAR(64) NOT NULL DEFAULT '' additive, idempotent, never dropped.
  - path: Games-Labs-Order/internal/core/repositories/order.go
    action: modified
    description: payment_gateway in every orders SELECT/RETURNING + scan; UpdatePaymentState stamps it with CASE WHEN so empty never overwrites.
  - path: Games-Labs-Order/internal/core/services/ordersvc/checkout.go
    action: modified
    description: ConfirmCheckoutOrder forwards PaymentGateway into ConfirmPayment.
  - path: Games-Labs-Order/internal/core/services/ordersvc/service.go
    action: modified
    description: UpdatePaymentState call carries the gateway; store.purchase.settled stamps order.PaymentGateway verbatim.
  - path: Games-Labs-Order/internal/core/handlers/orderhdl/grpc.go
    action: modified
    description: S2S request pass-through + modelOrderToPB exposes PaymentGateway. PR #68 merged staging db63d9f.
  - path: Games-Labs-Wallet/internal/adapters/stripeadt/adapter.go
    action: modified
    description: GetCheckoutPaymentInstrument with expand payment_intent.latest_charge; instrumentFromSession.
  - path: Games-Labs-Wallet/internal/core/services/paymentsvc/payment_gateway.go
    action: created
    description: PaymentGatewayDisplay vocabulary mapper + best-effort resolvePaymentGateway.
  - path: Games-Labs-Wallet/internal/core/services/paymentsvc/package_fulfillment.go
    action: modified
    description: Resolve after signed webhook, forward on ConfirmCheckoutOrder, merge metadata.payment_gateway. PR #53 merged staging 7b866f6.
  - path: Games-Labs-Wallet/internal/core/ports/adapters.go
    action: modified
    description: StripeAdapter.GetCheckoutPaymentInstrument; OrderAdapter.ConfirmCheckoutOrder(..., paymentGateway).
  - path: api-gateway/go.mod
    action: modified
    description: Pin shared-lib 2862b193ce03 so /orders/{id} carries paymentGateway. PR #72 merged staging 73faf7f.
  - path: ai-dev-office/runs/TASK-EAR-352/evidence/
    action: created
    description: ev-D-01..11 - fixture requests/status/order reads/Store rows, test logs.
