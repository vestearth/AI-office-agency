task: {id: TASK-EAR-106, title: 'VIP Level inactive status not honored on front-end + Manage VIP redesign', short_name: vip-inactive-enforcement, epic: VIP Level management, type: bugfix, workstream: general, priority: high, created_at: '2026-07-13'}
scope:
  target_services:
    - {service: Games-Labs-User, reason: 'Owns level_configs status truth; public read filter, GetVipLevel/GetLevelStats gating, and progression display-mask + privilege-skip all live here.'}
    - {service: Games-Labs-backoffice, reason: 'Remove Status toggle and omit status from save, remove Reset/VIP-list, lock Type, Default read-only; keep list status badge read-only.'}
    - {service: Games-Labs-Missions, reason: 'No change in shipping scope. Holds residual EXP and subtracts thresholds, so User must not clamp the stored level. Only touched if the optional hard-progression variant is chosen.'}
    - {service: api-gateway, reason: 'No change. optional bool status and string type already exist in the admin proto.'}
  affected_files:
    - {path: Games-Labs-User/internal/core/ports/repositories.go, action: modified, description: 'Add ActiveOnly bool to ListLevelConfigsFilter; add HighestActiveLevelAtMost to LevelConfigRepo (no-row floor returns 0).'}
    - {path: Games-Labs-User/internal/core/repositories/level_config.go, action: modified, description: 'levelConfigListWhere appends status <> inactive when ActiveOnly; implement HighestActiveLevelAtMost.'}
    - {path: Games-Labs-User/internal/core/services/usersvc/service.go, action: modified, description: 'ListVipLevels ActiveOnly:true; GetVipLevel blocks inactive except caller current level; GetLevelStats masks current to highest-active and never emits inactive nextCfg; UpdateLevelProgress stores (level,exp) verbatim but grant loop skips inactive levels; optional Type force/pin.'}
    - {path: Games-Labs-User/internal/core/services/usersvc/service_test.go, action: created, description: 'Progression display-mask/priv-skip, multi-call no-double-charge, list filter, GetLevelStats next-active, edit-does-not-reactivate.'}
    - {path: Games-Labs-User/internal/core/handlers/userhdl/level_config_handler.go, action: unchanged, description: 'Second /level-configs surface (GET all + PUT status) — documented as ops-only, not the mobile path; verify not publicly routed.'}
    - {path: Games-Labs-backoffice/app/components/VipLevelWizard.vue, action: modified, description: 'Remove Status toggle, Reset button, VIP list link; lock Type to read-only badge; Default edit read-only until Edit.'}
    - {path: Games-Labs-backoffice/app/composables/useVipLevelAdminList.ts, action: modified, description: 'Omit body.status entirely on save (proto presence false) so backend preserves DB-set status; guard against undefined-truthy send.'}
    - {path: Games-Labs-backoffice/app/pages/admin/manage/vip/index.vue, action: unchanged, description: 'Keep Status column as read-only badge so DBA-set inactive stays visible.'}
description: 'Fix inactive VIP levels leaking to the public app (shown + upgradeable). Rev 2 after Codex review: write path already persists status; the naive User-side level clamp is withdrawn because Missions holds residual EXP and reloads level from GetProfile (clamping desyncs/double-charges). Enforcement = read-side hiding (public list + detail + GetLevelStats) plus a display-mask + privilege-skip in progression that stores Missions (level,exp) verbatim. Combined with the Manage VIP redesign: no UI status write (inactive is out-of-band), Reset/VIP-list removed, Type locked, Default edit read-only.'
acceptance_criteria:
  - {criterion: 'Public ListVipLevels excludes inactive; admin ListLevelConfigs (and /level-configs GET) still return all.'}
  - {criterion: 'GetVipLevel returns not-found for inactive except the caller current level; current level still resolves when inactive.'}
  - {criterion: 'GetLevelStats never returns an inactive nextCfg; a user on a now-inactive level is masked to the highest active level below without changing stored progression or EXP.'}
  - {criterion: 'Turnover progression stores Missions (level,exp) verbatim with no EXP desync across events; inactive-level privileges are not granted; reactivation restores display/privileges.'}
  - {criterion: 'BuyVipLevel still blocks an inactive next level (unchanged).'}
  - {criterion: 'Back office sends no status on create or edit; editing a DB-set inactive level does not reactivate it.'}
  - {criterion: 'Reset button and VIP list link removed; Type read-only (new = Custom); Default edit read-only until Edit; list status badge read-only.'}
  - {criterion: 'Test matrix passes: multi-call progression through inactive (no double-charge), consecutive inactive, inactive current level, inactive first/last level, status flipped mid-progression, GetLevelStats next-active, priv-skip.'}
  - {criterion: 'Backoffice prod-preview smoke (:3010) and staging gateway smoke confirm inactive hidden from public VIP list/detail.'}
plan:
  approach: 'Read-side hiding first (User-only, deployable, closes the visible bug), then progression display-mask + privilege-skip (EXP-safe), then the backoffice redesign; verify each stage. The optional hard-progression variant (Missions active-only ladder) stays a separate decision.'
  subtasks:
    - {order: 1, id: backend-read-hiding, description: 'ActiveOnly filter + HighestActiveLevelAtMost; ListVipLevels filters; GetVipLevel gates (except own current); GetLevelStats masks current and next-active; unit tests.', agent: dev, owned_files: [Games-Labs-User/internal/core/ports/repositories.go, Games-Labs-User/internal/core/repositories/level_config.go, Games-Labs-User/internal/core/services/usersvc/service.go, Games-Labs-User/internal/core/services/usersvc/service_test.go], parallel_safe: false}
    - {order: 2, id: backend-progression-mask, description: 'UpdateLevelProgress stores Missions (level,exp) verbatim; grant loop skips inactive levels; GetProfile stays raw. Tests for multi-call no-double-charge and priv-skip.', agent: dev, owned_files: [Games-Labs-User/internal/core/services/usersvc/service.go, Games-Labs-User/internal/core/services/usersvc/service_test.go], parallel_safe: false}
    - {order: 3, id: fe-redesign, description: 'Omit status from save, remove Status toggle + Reset + VIP-list, lock Type badge, Default read-only + Edit; keep list status badge; smoke on :3010.', agent: dev, owned_files: [Games-Labs-backoffice/app/components/VipLevelWizard.vue, Games-Labs-backoffice/app/composables/useVipLevelAdminList.ts, Games-Labs-backoffice/app/pages/admin/manage/vip/index.vue], parallel_safe: false}
  risks:
    - {risk: 'A User-side level clamp desyncs Missions EXP (residual model), causing re-charge/double-count.', mitigation: 'Do not clamp the stored level; store Missions (level,exp) verbatim and mask only user-facing reads; keep GetProfile raw.'}
    - {risk: 'Store-but-mask means the internal stored level can be an inactive number while display shows the active level below (split-brain).', mitigation: 'Mask consistently across all user-facing reads; if product requires the stored level to never be inactive, adopt the optional Missions hard variant.'}
    - {risk: 'Omitting status wrong on FE (undefined) sends status:true and reactivates DB-set inactive on edit.', mitigation: 'Send no status field at all; add an edit-does-not-reactivate test.'}
    - {risk: 'Second /level-configs surface can GET-all and PUT status outside the back-office UI.', mitigation: 'Document as ops-only; verify it is not publicly routed; not the mobile read path so it does not reopen the bug.'}
    - {risk: 'Pre-existing read-then-write race / no snapshot in UpdateLevelProgress.', mitigation: 'Out of scope unless it bites the mask; noted for a follow-up hardening task.'}
  estimated_complexity: medium
assignment: {primary: dev, parallel: false, reason: 'Single owner across backend + FE; read-hiding, progression-mask, and FE stages are sequential and share the inactive-status contract.'}
summary: 'Enforce inactive VIP levels on the public read path (hide list/detail/stats) and via an EXP-safe progression display-mask + privilege-skip in Games-Labs-User, and redesign Manage VIP so status is never written from the UI (inactive is out-of-band), with Reset/VIP-list removed and Type locked.'
