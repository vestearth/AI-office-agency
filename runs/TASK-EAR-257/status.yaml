next_action:
  agent: reviewer
  description: >-
    Deliberate cross-service audit of every money path, because the same
    defect class has now surfaced in THREE services and every instance was
    found by accident while doing unrelated work — never by a sweep.
    THE CLASS, stated so the audit has one question to ask everywhere:
    a money path trusts a client-controlled field. Three shapes seen so
    far — (a) identity taken from the request body or path instead of
    gateway-set metadata (TASK-EAR-180/182, Order; also
    Wallet resolveUserID in TASK-EAR-254); (b) an endpoint that asserts
    "this was paid" with no PSP signature and no caller check
    (TASK-EAR-191, Missions store-payment webhook); (c) a client-settable
    flag that skips payment and still pays out (TASK-EAR-254, Wallet
    is_demo).
    SCOPE — every path that can move value, in Games-Labs-Wallet,
    Games-Labs-Order, Games-Labs-Missions, Games-Labs-Game and
    Games-Labs-Provider: wallet credit/debit/redeem/refund, order create
    and status transitions, payment/deposit/callback/webhook, package and
    coupon fulfillment, reward and bonus grants, VIP and point mutations,
    and provider balance callbacks. Include admin surfaces, not just
    player-facing ones.
    FOR EACH ENDPOINT record: transport (gRPC / HTTP mux / both), whether
    it is reachable through api-gateway (check the generated .pb.gw.go or
    the gin routes, NOT just the service mux — a mux-only path is a
    different risk profile), where identity comes from, what authorization
    it applies, and which client-controlled fields influence the payout.
    METHOD — read the source, do not trust prior notes. Two of the three
    known instances were missed by an earlier sweep precisely because it
    was scoped to one repo; and TASK-EAR-182 found one of its four listed
    holes had already been fixed by unrelated work, while TASK-EAR-179
    found a stale header comment. Assume every existing finding may be
    stale in either direction.
    DELIVERABLE: runs/TASK-EAR-257/findings.md — a table of every money
    path with a verdict, and each finding ranked by whether it is
    exploitable by an ordinary player today, by staff only, or only from
    inside the cluster. This run does NOT fix anything: each real finding
    becomes its own task with its own regression test, so that a broad
    audit does not turn into one unreviewable PR.
    Confirm exploitability by execution before reporting anything as
    critical — TASK-EAR-191's provenance note is explicit that executing
    the flow found what reading the neighbours missed, and TASK-EAR-254
    was source-traced first and only then reproduced.
    ALREADY-KNOWN LEAD, do not re-derive it, just confirm and rank it:
    Games-Labs-Wallet fulfillGameLabsStorePurchase triggers on a
    CLIENT-SUPPLIED status == "success". Spotted during TASK-EAR-260 and
    deliberately left unfixed there to keep that task's scope honest. That
    is a fifth instance of the class if it pays out — establish whether it
    does, and who can reach it.
    ALSO: TASK-EAR-260 hardened client-supplied status only on the Stripe
    deposit path. Check every other place a request-supplied `status` or
    equivalent state field is written straight to a money row.
