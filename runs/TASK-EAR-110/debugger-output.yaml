summary: |
  STORE_BUY_ENABLED was checked before the durable operation ledger, so disabling
  purchases also blocked completed replay and reserved/debited recovery. The gate
  now runs only after GetStorePurchase confirms no operation exists. Existing
  operations replay or recover from the persisted snapshot; new operations remain
  fail-closed before Order or Wallet calls.

  Regression coverage verifies disabled-gate behavior for new purchases,
  completed replay, reserved retry with the deterministic Wallet key and debited
  completion. Focused race tests, full tests, readonly build, vet, diff checks and
  task validation pass.
