summary: |
  Integrated Missions Pass/Avatar list and buy flows with Order's canonical
  WebOrder gRPC catalog and User's UUID-backed VIP identity. Mobile list/buy
  now fail closed without providers, validate canonical type/status/sale window,
  accept DIAMOND only, ignore legacy client price_diamonds, resolve Missions
  aliases, and store canonical UUIDs for new ownership and purchase history.

  Added a durable user-scoped operation ledger. Wallet debit keys are a
  deterministic hash of user plus operation key; reserved/debited/completed
  transitions allow ambiguous Wallet retries to reuse the same side effect,
  while grant, history, and the replay result commit in one database
  transaction. Concurrent workers can repeat the idempotent Wallet request but
  serialize completion on the operation row, so ownership/history complete once.

  Retired Missions Pass catalog writes and runtime reads, removed Pass/Avatar
  seeds, dropped store_passes in migration 046, and removed the admin HTTP PUT
  route. The existing go.mod already used the newer published shared-lib
  v0.0.0-20260713095201-deff7aee266b, so no dependency downgrade or go.sum
  churn was needed.

  Compatibility assumptions: existing avatar IDs are resolved through Order
  aliases on inventory reads; existing user_passes remain usable by pass_type.
  Historical pass rows cannot be deterministically backfilled to one SKU
  because the old table stored only pass_type (including the shared
  coin_booster entitlement for both 1-day and 7-day products), so only new
  Pass ownership records carry canonical_item_id. Permanent canonical passes
  use year 9999 in the existing expires_at representation.

  Verification passed: focused tests, race tests for service/repository, full
  go test ./..., go vet ./..., readonly build, tidy/diff/no-replace checks,
  shared-lib module resolution, and an executable PostgreSQL 16 migration smoke.
