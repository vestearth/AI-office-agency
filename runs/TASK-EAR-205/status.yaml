      independently for this exact (surface, activity_id, user_id) triple:
      sha256 first byte 150, 150 % 2 = 0, candidates[0] =
      'Special Item/Limited Avatar' = avatar. A pass purchase therefore cannot
      match, which activity_match_test.go:202 locks on purpose. The reported
      behavior is correct-per-code; the contract is what is wrong.
      The Wallet publish chain was verified intact and is explicitly out of
      scope, as is the Diamond-to-Coin exclusion, which must survive the change.
      Two operator hypotheses were checked and one was corrected: the dead-end
      scenario is real but inverted. Passes are always re-purchasable and extend
      expires_at (store_repo.go:427); avatars are hard-blocked once owned
      (store_service.go:933) and permanent avatars never free the slot. The user
      rolled onto avatar is the one who can be locked out, and the generator
      default puts everyone there. That asymmetry is what makes `any` a fix
      rather than a preference.
      Product direction agreed with the operator before opening: Spend Prop
      counts any purchasable Special Item on Daily and Weekly; the roll is
      retired on those two surfaces only. The Event surface keeps the sentinel,
      the selection ledger and the already-shipped resolved_special_item field -
      changing it would break a live mobile contract.
      Legacy mapping was decided deliberately, not by convenience: bare
      'Special Item' maps to any as the umbrella, but 'Special Item/Limited
      Avatar' stays avatar because it names Avatar explicitly and an admin who
      picked it chose a narrow scope. Widening it would silently rescope live
      Weekly plans. No migration follows from this - stored values are
      re-interpreted at match time.
      Also captured but explicitly not fixed here: the scope is resolved only on
      event ingestion and never on read, so today a player must spend correctly
      before the system records what was required. `any` makes that harmless on
      Daily/Weekly; it remains true on Event.
