next_action:
  agent: devops
  description: >-
    STAGING ONLY, in this order. (1) FIREWALL FIRST - it closes the exposure
    on its own and needs nothing else. ClickHouse staging is a docker compose
    stack on a VPS OUTSIDE AWS, so "restrict to the VPC" is not available:
    allowlist the ECS egress IPs instead. games-labs-logs-staging can launch
    in subnet-0c276d4a5705e0099 (NAT 13.228.43.188) and
    subnet-06dcdcf16e005f321 (NAT 54.169.24.29) - BOTH must be allowed or the
    service will fail intermittently when a task lands in the other subnet.
    TRAP: if the compose file publishes ports, docker's DNAT rules sit in the
    DOCKER chain and are evaluated BEFORE INPUT, so `ufw deny 8123` has no
    effect and the port stays open. Use the DOCKER-USER chain (RETURN for each
    allowed source, then a trailing DROP) and persist it, or use the VPS
    provider's own firewall, which docker cannot bypass.
    (2) Preserve the existing CLICKHOUSE_USERNAME and intentionally empty
    CLICKHOUSE_PASSWORD policy. Revise PR #35's guard and tests: the current
    branch rejects every remote username-only configuration, so staging would
    refuse to boot. Require an explicitly configured username for remote
    targets, but do not require a password.
    (3) Correct PR #35's README: it still repeats the superseded
    PostgreSQL-only / "ClickHouse has no unique data" claim, which is false for
    the Monitoring-only tables. Then take the PR out of draft and merge it.
    Not before (2), or Logs staging refuses to boot by design and ECS rolls
    the deploy back.
    (4) Confirm Monitoring player-activity is still INGESTING, not merely that
    no error appeared - a failed projector disables the consumer with one log
    line. Then re-probe the host from outside AWS and capture the refusal as
    this run's acceptance evidence.
