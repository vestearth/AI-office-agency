    at: '2026-06-29T04:11:36Z'
    reason: >-
      Claude advisory lane. Mobile/FE asked which endpoint is source of truth for
      the Quest page "Current Streak:" after QA saw missions/streak return
      current_streak=0 / is_broken=true. Root-caused a real divergence:
      GET /api/v1/missions/streak (MissionService.GetStreak) reads the DB
      (user_streaks) and recomputes is_broken from LastDate, but
      GET /api/v1/quest/overview (MissionService.GetProgress) read streak from the
      per-process in-memory map s.userStreaks only - never the DB even when repo
      is set - so a cold/different pod or a user who had not checked in this
      process lifetime showed streak 0 / not_started while the streak endpoint
      returned the real value. Fix in Games-Labs-Missions internal/services/
      mission_service.go: extracted streakFromDB(ctx, userID) (lock-free, DB read
      + UTC is_broken recompute, mirrors GetStreak), refactored GetStreak to use
      it, and made GetProgress prefer the persisted streak (read outside s.mu to
      avoid deadlock with GetStreak's lock and to keep the DB call off the mutex).
      go build ./..., go vet ./internal/services, and go test ./internal/services
      all pass. repo is a concrete *MissionRepository (not an interface) so no
      cheap DB-path unit test exists; correctness is by construction (identical
      DB call + is_broken logic as GetStreak). Real verification = compare
      overview items[key=streak].progress.current vs missions/streak on a
      deployed env with a populated user_streaks row. Left UNCOMMITTED for
      operator review + push.
  - phase: in_review -> in_review
