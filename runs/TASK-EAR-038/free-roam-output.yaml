summary: >
  Added optional ?month=YYYY-MM to GET /api/v1/admin/check-in/config and a new
  GET /api/v1/admin/check-in/campaigns list endpoint so the Backoffice Monthly
  board can render Last 12 / This / Next 12 months. Pure Go (handler + service +
  repo + route); NO proto / shared-lib change (these are manual mux.HandleFunc
  routes, not grpc-gateway). Browsing a non-current month with no campaign row
  returns a non-persisted default — no empty rows are created. Current-month
  path keeps its legacy auto-upsert behavior. Left UNCOMMITTED for operator.

endpoints:
  - method: GET
    path: /api/v1/admin/check-in/config
    change: "added optional ?month=YYYY-MM query param"
  - method: GET
    path: /api/v1/admin/check-in/campaigns
    change: "NEW — ?from=YYYY-MM&to=YYYY-MM (default current -12..+12), per-month summary rows"

files_changed:
  - path: internal/models/models.go
    what: "added CheckInCampaignSummary {month,status,daily_reward,milestone_count}"
  - path: internal/repositories/mission_repo.go
    what: "added ListCheckInCampaigns(ctx, from, to) — SELECT summary rows + enabled milestone_count, month BETWEEN from AND to, ORDER BY month ASC"
  - path: internal/services/check_in_calendar_service.go
    what: >
      added GetCheckInConfigForMonth(ctx, month) (GetCheckInConfig now delegates with ""),
      ListCheckInCampaigns(ctx, from, to), parseCheckInMonth validator (regexp + strict parse),
      currentCheckInMonth helper; non-current month w/ no row returns ephemeral default (no upsert).
      Added "regexp" import.
  - path: internal/handlers/adminmission/http/handler.go
    what: >
      HandleGetCheckInConfig now reads ?month= and maps ErrInvalidInput -> 400;
      added HandleListCheckInCampaigns (reads ?from/?to, ErrInvalidInput -> 400,
      envelope {status:success, campaigns:[...]}).
  - path: internal/routes/apiv1.go
    what: "registered GET /api/v1/admin/check-in/campaigns -> admin.Admin.HandleListCheckInCampaigns"

