next_action:
  agent: done
  description: >-
    Fix Monthly check-in "Daily Reward - Value Reward" not saving. Root cause
    (Claude advisory lane, confirmed via live PUT payload on staging QA): the
    admin GET getCheckInConfig returns camelCase (gRPC gateway protojson:
    dailyReward / priceLadder / maxRestoresPerMonth, int64 as string) while the
    entire check-in Backoffice surface reads/writes snake_case. Consequences:
    (1) cfg.daily_reward reads undefined -> Value Reward loads as 0; (2)
    cfg.restore.price_ladder reads undefined -> restore ladder mis-handled; (3)
    the loaded camelCase restore (maxRestoresPerMonth) is re-sent alongside the
    code's explicit snake max_restores_per_month -> protojson "duplicate field
    max_restores_per_month" -> gateway rejects the whole PUT (code 3) -> nothing
    saves. listCheckInCampaigns is unaffected because it is a Struct passthrough
    (snake). Plan: (A) FE fix in Games-Labs-backoffice
    app/composables/useAdminMissionApi.ts - normalize getCheckInConfig response
    to snake_case (accept both camel/snake) so all consumers (monthly edit,
    settings, board enrich) read correctly and never leak camelCase back into
    the PUT. (B) Backend contract fix in Games-Labs-Missions - make
    getCheckInConfig return snake_case consistently (Struct passthrough via the
    HTTP mux handler, mirroring ListCheckInCampaigns) so the admin check-in GET
    matches list + FE and future consumers do not hit the trap. Verify: FE
    typecheck 0 new errors; backend build + a repro unit test that the exact
    live PUT payload no longer duplicates; live QA save on 2026-07 persists the
    daily reward and reloads correctly.
