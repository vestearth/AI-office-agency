note_patch: |
  Add a section to `Knowledge Base/10 Projects/Games Labs Backoffice/Monitoring Read Model Boundary.md`:

  ## Report header totals (TASK-EAR-373) — review and release pending

  `ListReportsResponse.totals` is a report-specific oneof. Numeric measures that
  can be unavailable use proto3 optional presence so gateway `EmitUnpopulated`
  preserves unknown separately from zero. Game round counts aggregate the whole
  filtered result; Coin turnover and W/L do not combine currencies, and W/L
  remains absent when outcome or currency dimensions are incomplete. THB W/L
  remains absent while the Logs round projection has no THB conversion source.
  Package totals count filtered purchase events, compute distinct players over
  those events (never by summing per-package distinct counts), and sum paid THB
  only. Provider totals stay absent while the current Logs source has no provider
  aggregate projection. Backoffice binds the nine report header cards to their
  corresponding typed totals; deployed and rendered-page acceptance is pending.

  This implementation is in uncommitted TASK-EAR-373 worktrees. The release
  order remains shared-lib publication, gateway and Logs dependency bumps, then
  Backoffice rollout. Keep this note's freshness unknown until that chain and
  the rendered pages are rechecked.

  Related: [[20 Flows/Backoffice API Gap Inventory|Backoffice API Gap Inventory]]

