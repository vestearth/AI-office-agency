    reason: >-
      Opened at operator request out of TASK-EAR-371. Wiring the package
      report's header cards showed that a header figure cannot always be
      derived on the client: unique_players is a distinct count per package, so
      summing it across packages counts a player once per package they bought
      from. Measured on staging 2026-09-21 it sums to 74 where the real number
      of distinct buyers is 11, a 6.7x overcount, and TASK-EAR-371's
      acceptance criterion 2 had to be corrected because it recorded summing as
      the way to obtain all three package header figures. The card was left
      blank rather than filled with a wrong number. The additive figures have a
      quieter version of the same problem: ClampMonitoringPage caps a page at
      100 rows, so a client-side sum is exact only while the entity count stays
      under the cap, and the package page currently withholds its totals
      entirely past it. Scoped beyond the one card because nine header cards
      across game, provider and package are still blank for want of a
      server-computed figure. Numbered 373: 372 was the last taken. Claude
      opened the run and stops here per the post-EAR-337 lane rule. Claude
      advisory lane.
