    the grpc-gateway route-order trap; the backoffice dashboard therefore
    cannot be reading this RPC today. Also not exercised: the fail-closed
    path against a real Wallet outage (unit-tested only). Production NOT
    patched (270/306/307/318 all staging-only).
    FOLLOW-UPS, not folded in: (1) admin user summary route shadowing at
    the gateway; (2) drop user_profiles.lifetime_topup with its own
    migration once the read path has been live a while; (3) lifetime_ggr
    has the same no-writer shape (source is Game/ClickHouse, not Wallet);
    (4) monitoringpb lifetime_topup_thb has no backend and the report page
    is mock - wire it to the same Wallet endpoint.
