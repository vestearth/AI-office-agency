    image staging-sha-09d981a COMPLETED, ev-009): ListPlayers takes the
    page's values in one mux call, PlayerSummary takes the total, the
    repository no longer reads the dead column, and a Wallet error fails
    the request instead of rendering zeros. No migration; the column stays
    in place, dead, for a later drop.
    EVIDENCE: RED first (ev-001/002), GREEN incl. real PostgreSQL 16 test
    of the batched/total SQL (ev-003, ev-004), full readonly test/build/vet
    both repos (ev-005/006). LIVE ACCEPTANCE (ev-010): the identical admin
    list request that read lifetimeTopup 0 before deploy now reads 1063 for
    devtest, equal to /api/v1/users/me for the same player - list and
    detail agree.
    NOT verified live: PlayerSummary through the gateway, because
    GET /api/v1/admin/user/summary is shadowed by /api/v1/admin/user/{user_id}
