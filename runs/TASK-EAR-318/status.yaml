next_action:
  agent: dev
  description: >-
    user_profiles.lifetime_topup has NO writer anywhere in the workspace.
    Migration 010 (Games-Labs-User/migrations/010_user_profiles_lifetime_topup.sql)
    adds the column with DEFAULT 0 and the only other references are reads:
    profile.go:51 (GetByUserID), user.go:121 (PlayerSummary SUM) and
    user.go:205 (ListPlayers LEFT JOIN). A workspace-wide grep for
    lifetime_topup / LifetimeTopup with update|insert|set hits nothing outside
    the migration. lifetime_ggr (migration 009) has the same shape - no writer
    either - and should be confirmed and scoped in the same pass, not fixed by
    accident.
    WHAT IS WRONG TODAY: the admin player list column "Lifetime Top-up"
    (backoffice PlayersListTable.vue key lifetimeTopup, fed by
    adminuserhdl/grpc.go:123 from AdminPlayerRow.LifetimeTopup) and the
    dashboard PlayerSummary.LifetimeTopup (adminuserhdl/grpc.go:316
    LifetimeValue) read the stored column and therefore show 0 for every
    player. The single-user paths are now correct: TASK-EAR-307 made
    usersvc.GetProfile take the live sum from Wallet's SumLifetimeTopupMinor
    (THB major units; adminuserhdl/grpc.go:153 copies it onto the detail row),
    verified on staging 2026-09-04 as lifetimeTopup 0 -> 1063 for the devtest
    player. So the list and the detail page disagree for the same player.
    Do NOT re-add a per-row Wallet call on the list path - models/user.go:38
    deliberately keeps the list on the stored value for one-query pagination.
    DECIDE which is right before coding, and write the reason down:
    (a) make the column a maintained projection - write it whenever Wallet
        settles a top-up. Wallet already publishes on user.registered and
        Missions consumes player.activity; check whether a settled-deposit
        event exists (rabbitmq-event-review) or whether the User service
        should pull. The write must be idempotent per payment_transaction_id
        and must use the same THB-major definition EAR-307 fixed in
        Wallet/internal/repositories/payment.go SumLifetimeTopupTHB, or the
        list and detail will disagree again by a different amount; or
    (b) drop the stored column and derive the list/summary value from Wallet
        via one batched read (a ListLifetimeTopup-by-user-ids RPC would need a
        shared-lib change and its gateway bump - see the shared-lib
        publication gate EAR-306 went through); or
    (c) leave the column and label the list column as not available - only
        acceptable if product says the list does not need the number.
    Lean (a) with a one-off backfill from Wallet's payment_transactions for
    existing players, because the backoffice already renders the column and
    PlayerSummary sums it. Whatever ships: a backfill is a data migration on
    the User DB, so it goes through schema-change-needs-migration
    (idempotent, deploy order, rollback stated); the write path needs a
    regression test seen RED first; verify through the gateway admin list
    (/api/v1/admin/... players list) against the same devtest player that
    reads 1063 on /api/v1/users/me, and grep the raw body.
    Cross-service ownership question for microservice-boundary-review:
    Wallet owns the payment evidence, User owns the profile projection - the
    projection must never be the source of truth for money.
