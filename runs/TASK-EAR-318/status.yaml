next_action:
  agent: dev
  description: >-
    DECISION LOCKED 2026-09-04 by the operator after a grilling pass: option
    (b) - derive the list and summary values from Wallet at read time over
    the internal HTTP mux. Do NOT build a projection/event pipeline and do
    NOT backfill user_profiles.lifetime_topup.
    WHY (b), from source not assumption: Wallet publishes no domain event on
    deposit settlement (only admin audit events) and status=success is set at
    five separate points (ubit_deposit, stripe_callback x2,
    package_fulfillment x2), so option (a) would mean a new publisher choke
    point, a new exchange/queue, a new User consumer, a dedupe table and a
    backfill migration - and would still drift silently when a consumer is
    down, the exact failure shape this run is fixing. User and Wallet are
    separate databases, the admin list pages at <= 100 rows, the proto has no
    sort/filter on lifetime_topup, User already holds a Wallet mux client
    (WALLET_HTTP_ADDR, walletadt muxClient), and the mux lane needs no
    shared-lib/proto/gateway bump and is not reachable from the edge
    (settled-deposits answers 404 at the gateway).
    THE PROBLEM: user_profiles.lifetime_topup (migration 010) has no writer
    anywhere in the workspace - only reads at profile.go:51, user.go:121
    (PlayerSummary SUM) and user.go:205 (ListPlayers JOIN) - so the admin
    player list column and the dashboard summary show 0 for everyone, while
    the single-user path (GetProfile -> Wallet SumLifetimeTopupMinor, fixed
    in TASK-EAR-307) reads the real value: 1063 for devtest on staging.
    lifetime_ggr (migration 009) has the same no-writer shape.
    ONE DEFINITION, ONE QUERY: the number is the one EAR-307 fixed in
    Games-Labs-Wallet/internal/repositories/payment.go SumLifetimeTopupTHB -
    successful deposit/recharge/purchase rows in THB major units, THB rows by
    amount, other currencies only via the EAR-306 amount_thb_minor snapshot,
    unvalued rows contribute nothing. The batched read must reuse that SQL
    (extend it with user_id = ANY($1) GROUP BY user_id), never a second
    hand-written sum, or list and detail will disagree again.
    SCOPE:
    1. Wallet: add an internal mux endpoint next to /payments/*, e.g.
       POST /payments/lifetime-topup with {"user_ids": [...]} (bounded, <= 100
       ids, reject more) returning {user_id: amount_thb}, plus a no-ids
       variant or a second route for the grand total PlayerSummary needs
       (SUM over all users, one query). Same THB-major definition, same repo
       method family. No gateway binding, no proto change.
    2. User: ListPlayers and PlayerSummary stop reading
       user_profiles.lifetime_topup and call the mux once per page / once per
       summary. Fail closed and visibly: when Wallet is unreachable, omit or
       null the value (and log), never emit 0 - 0 is what this bug looked
       like. Keep the list at one DB query plus one Wallet call; no per-row
       calls (models/user.go:38 rule stands).
    3. Column: leave user_profiles.lifetime_topup in place this round, dead.
       Dropping it is a schema change with its own migration and rollback
       note; schedule it after the read path has been live for a while.
    4. Out of scope, recorded: lifetime_ggr has the same no-writer shape
       (source of GGR is Game/ClickHouse, not Wallet); monitoringpb
       PlayerReportSummary.lifetime_topup_thb has NO backend at all - the
       backoffice monitoring/report/player page is mock (SHARED_TOPUP_THB
       = 7090.05 hard-coded) and Logs service never touches the field. When
       that page is wired, it must call this same Wallet endpoint.
    ACCEPTED TRADEOFFS: no sort/filter by lifetime top-up on the admin list
    (none exists today); one extra internal HTTP call per admin list page;
    the column reads empty rather than 0 when Wallet is down.
    VERIFY: regression tests seen RED first on both repos (Wallet endpoint
    bounds/definition against a real PostgreSQL fixture as EAR-307 did with
    WALLET_REPO_TEST_DSN; User list/summary fail-closed on Wallet error);
    then through the gateway admin players list and /api/v1/admin/user/summary
    with a staff bearer, grep the raw body, and the devtest row must show
    the same 1063 that /api/v1/users/me returns for that player. Wallet
    deploys first, User second; rollback is revert User (Wallet endpoint is
    additive).
