    description: Added DailyActivityPoolEntry struct and DailyActivity.Pool field (mirrors WeeklyActivityPoolEntry).
  - path: Games-Labs-Missions/internal/repositories/daily_plan_repo.go
    action: modified
    description: Pool persist (delete+insert) inside SaveDailyPlanFull tx; new ListDailyActivityPoolEntries / ReplaceDailyActivityPoolEntries; isValidDailyPoolEntryType helper.
  - path: Games-Labs-Missions/internal/services/mission_service.go
    action: modified
    description: GetDailyActivity attaches the pool (best-effort) so GetDailyPlanDetail returns it.
  - path: Games-Labs-Missions/internal/handlers/adminmission/http/activities.go
    action: modified
    description: dailyActivityPoolEntryPayload + pool[] on dailyActivityPayload; mapped in dailyActivityPayloadToModel; emitted in dailyActivityResponse.
  - path: Games-Labs-Missions/internal/repositories/daily_plan_full_test.go
    action: modified
    description: Extended the SaveDailyPlanFull sqlmock test to assert the in-tx pool DELETE/INSERT for game+category+special_item.
  - path: Games-Labs-Missions/internal/repositories/daily_pool_test.go
    action: created
    description: Daily pool Replace round-trip + rejection tests (invalid type, empty ref, duplicate, special-item hyphen vs special_item).
  - path: ai-dev-office/runs/TASK-EAR-041/daily-pool-contract.md
    action: created
    description: FE handoff — per-activity pool shape in SaveDailyPlanFull request and GetDailyPlanDetail response, entry_type enum, examples, empty-pool behaviour.
  - path: ai-dev-office/runs/TASK-EAR-041/free-roam-output.yaml
    action: created
