evidence_refs: [ev-001, ev-002, ev-003, ev-004, ev-005]
blockers:
  - Merge to main and every promotion step (staging, prod) wait for Earth's explicit go-ahead.
  - The pre-existing migrations/TestGooseSQLFiles count failure on main (085 vs 84) is out of scope; it does not block deploys, because the deploy workflows run no tests.
  - Not verified without production DB access: EXPLAIN on production data, the size of quota_history, and the alert backlog that will be sent after the deploy.
