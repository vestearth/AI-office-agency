    reason: >-
      Opened after the operator challenged the TASK-EAR-214 diagnosis
      ("is it really the SG, or is it gRPC?"). Re-examination proved the
      operator's instinct right about the framing: the 503 is genuinely a
      TCP-level block, but the fix proposed in 214 (ask devops to open
      8088) treats the symptom. Comparing every service's
      ecs/task-definition.json showed Logs is the only one that declares
      no gRPC port mapping at all and serves gRPC from an HTTP-range port
      (8088, labelled appProtocol:http), while the SG's documented
      self-ingress range 50051-50058 is exactly the gRPC range every other
      service uses. Traced to a real code bug: configs/config.go tags
      GRPCPort as envconfig:"PORT" instead of "GRPC_PORT" (so it always
      mirrors Port), and cmd/main.go binds Server.Port rather than
      Server.GRPCPort — the platform-consistent design was written but
      never actually wired. Nobody hit it before because until
      TASK-EAR-207 no service had ever called Logs over gRPC. This route
      unblocks against the already-open SG rule with no devops ticket.
      TASK-EAR-214 deliberately left open as a fallback rather than
      cancelled, because the SG contents are inferred from
      ECS-CLOUD-MAP-STAGING-GUIDE.md and not verified against AWS (no CLI
      or credentials in this lane) — if 50058 also times out, the guide is
      stale and the SG edit is needed after all. Claude advisory lane.
