      and it failed on the very first click - Production Status toggle
      answered "Missing provider id -- reload the page and try again."
      Root cause, confirmed by reading the proto rather than guessing: GET
      /api/v1/admin/game/:id returns GetGameByIDResponse.Game
      (admingame.proto ~387-402), which has NO provider_id field in its
      definition - not a build gap, a contract gap. game.value.providerId could
      only ever be empty string from this endpoint, on any deployed version.
      This predates #70 entirely; the (demo) handlers never depended on it, so
      it was invisible until #70 made the first real call that needed it.
      Fix (#71): both call sites now source provider_id from
      providerApi.value.id, populated by this same page's existing
      loadProvider() call to GET /api/v1/admin/game/:id/provider
      (GetProviderByGameIDResponse.Provider, which DOES carry id) - already
      displayed on this page as "Provider ID :". No proto or backend change, no
      new fetch, no re-litigating the level-group-override or error-toast
      design from #70.
      Full suite 200/200, production build clean. Not click-through verified by
