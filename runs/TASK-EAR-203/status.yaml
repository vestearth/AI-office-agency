      Reading the save handler before wiring it revealed the hardcoded
      VIP1-8 list was not a truncated-but-harmless range - the watcher coerced
      ANY level outside it down to VIP2, including a real game's real level.
      Wiring the save button without fixing that display bug would have let a
      user open a VIP21 game, see "VIP2", and persist that false value for
      real on their very first save. Fixed by sourcing the option list from
      useAdminVipLevel().fetchActiveLevels() - an existing composable already
      used elsewhere in this app - and by always keeping the game's own
      current level in the list even if the catalog does not have it yet.
      Bet Limit: left out, as originally proposed, with the reason restated in
      the PR rather than silently dropped or silently expanded into.
      Both handlers were rewired to call PUT /api/v1/game/{id}
      (AdminGameService.UpdateGame, confirmed as a genuine partial update by
      reading Games-Labs-Game's repository Update method first - no backend or
      proto change needed), reload the game, and report the value the API
      actually returned rather than the optimistic local guess - the local ref
      that mirrors it only refreshes on Vue's next watcher flush, not
      synchronously after the reload's await, so reading the response directly
      was necessary for correctness, not style. Failures now show
      openAdminErrorToast (already used elsewhere in this app) and leave edit
      mode open instead of silently discarding the user's change. Saving VIP
      Level also detects the one case Games-Labs-Game's own Update already
      overrides - a game that belongs to a Level Group takes its level from the
      group, not the request - and reports that honestly instead of claiming
      the typed value was applied; that server behavior is pre-existing and was
      not changed here.
