notes: >-
  SMOKED 2026-09-11 — evidence in artifacts/smoke-2026-09-11.md. Prod build of
  main fc47166 on :3010, devtest login, QA player f737e6f3. Game sub-tabs
  observed live at 7 / 8 / 3 columns, so the Last played revert is confirmed
  rendering with real rows. Order No. + Order status, Special Pass Type +
  Duration, and Balance after all carry real values; Earned Detail and Avatar
  Type stay honest dashes. Zero application console errors.

  The N+1 could NOT be closed at runtime and this is a DATA gap, not a defect:
  a census of all 106 users on api-test-gateway found ZERO with any
  source=user_transfer wallet row, so fetchSendCoinRows cannot be driven past
  an empty list and batched-vs-serial is indistinguishable by request count.
  It stays proven structurally and by build only. To close it, make one coin
  transfer between two test players, then reload Send coin and confirm the
  actor lookup fires once per distinct counterparty rather than once per row.

  MERGED AND DEPLOYED 2026-09-11. Backoffice PR 128 merged as 0cd8618; the
  deploy run (34564175455) completed success and the image pin advanced to
  sha-0cd8618 in fc47166. Verified with `git merge-base --is-ancestor d6fdee2
  origin/main`, not the PR badge. Production now runs the reviewed version;
  only the runtime smoke is still open.

  History of the partial release below, kept because the trap is the lesson.
  PR 127 merged on
  2026-09-11 04:06Z carrying ONLY 4f44de4; its recorded headRefOid is
  4f44de4 and `git merge-base --is-ancestor d6fdee2 origin/main` fails, so the
  two review fixes never reached main even though they were pushed to the same
  branch. PR 127's own deploy run was cancelled by PR 126 merging 60 seconds
  later, and 126's run succeeded from 5162e75, which contains 4f44de4 — so for
  roughly three hours the UNFIXED version was live on k3s: Last played at 7
  columns and the per-row counterparty lookup. Reopened as Backoffice PR 128
  (d6fdee2 only, base main) and merged. This is the [[games-labs-deploy-topology-ecs-migration]]
  stacked/stale-head trap again: the PR badge said merged, the branch head on
  origin was d6fdee2, and main still had neither fix. Always settle it with
  merge-base, never the branch head or the badge.

  4f44de4 implemented scope A-E. An independent audit of that commit found two
  defects, both corrected in d6fdee2.

  (1) DESIGN REGRESSION, now reverted. 4f44de4 widened the Game tab's Last
  played sub-tab from 3 to 7 columns and deleted BOTH in-repo records of that
  table's design decision: the template comment naming Figma Variant3, and the
  guard test "last played keeps its designed three-column shape", whose
  assert.doesNotMatch(normalizeWinStats) was flipped to assert.match. Root
  cause is this run's own task.md: scope E ordered those columns without
  noticing they contradicted an approved design. The spec was wrong, the
  implementation followed it faithfully. Operator ruled revert; d6fdee2
  restores 3 columns, the Figma comment and the original assertion, and the
  test now records why the table must not be widened again.

  (2) N+1, now fixed. fetchSendCoinRows awaited resolveActorIdentity inside
  the row loop, so N distinct counterparties meant N sequential round trips
  against a fetch that pages up to 5,000 rows. d6fdee2 dedupes with a Set and
  fans out with Promise.all, matching resolveByAdminNames in
  useAdminPlayerAuditEvents. Best-effort contract unchanged: an unresolved
  name still falls back to the raw id.

  Also dropped a tautological assertion added in 4f44de4 whose greedy
  [\s\S]* span matched the next function's body and passed either way.

  Operator accepted the other two widened tables: Top Performance 4 to 7 and
  Frequently played 6 to 8. Only Last played was guarded as a fixed shape.

  Verified by re-running, not by reading the report: the three restored/added
  assertions were seen RED on the pre-fix tree; suite 558 pass / 0 fail;
  npx nuxt build clean; th/td/colspan aligned at 7/8/3. The new test file
  was also run against origin/main in a scratch worktree and failed 3 of 3,
  so RED-before-GREEN is established for the original commit too.

  NOT verified at runtime. No browser or staging smoke was run, so the N+1
  fix is proven structurally and by build, not by observed request counts.
