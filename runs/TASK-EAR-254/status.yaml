next_action:
  agent: dev
  description: >-
    CRITICAL, same class as TASK-EAR-191 but in a different service, and
    reachable by any authenticated player on staging today.
    POST /api/v1/transaction (paymentpb.PaymentService.CreateTransaction,
    Games-Labs-Wallet) accepts a client-controlled `is_demo` boolean
    (payment.proto CreateTransactionRequest field 13) that short-circuits
    payment entirely and grants the package rewards for free.
    PROVEN BY SOURCE TRACE, not yet by execution — reproduce it before
    fixing, and write the regression test RED first:
    paymenthdl/grpc.go:98-106 resolveIsDemo returns req.GetIsDemo()
    straight from the request body with no guard;
    paymentsvc/service.go:134 `if in.IsDemo { return
    s.createStripeDemoDeposit(ctx, in) }` (and :120 for the Ubit twin);
    paymentsvc/stripe_deposit.go:134 calls
    ppr.CreatePaymentWithPackageRewards, which reaches
    repositories/package_purchase_tx.go:39 applyPackageRewardsInTx ->
    TxCredit of pkg.Coin (and diamonds) into the caller's wallet.
    There is NO env flag, NO staff check, and NO demo-mode gate anywhere:
    an exhaustive grep for IsDemo/is_demo/DEMO across the repo's Go source,
    config/config.go and ecs/env.names finds only the plumbing above.
    The HTTP twin has the same hole via resolveHTTPDemo
    (paymenthdl/http.go:93,122 — accepts both `is_demo` and `isDemo`).
    Reachable publicly: the gateway registers PaymentService
    (api-gateway/gateway/grpc.go:92) so POST /api/v1/transaction is a
    normal player-token route.
    SECOND DEFECT, same endpoint, same class as TASK-EAR-180/182:
    paymenthdl/grpc.go:46-51 resolveUserID prefers the request BODY
    user_id over the gateway-set `userid` metadata (body wins). Identity
    on a money path must come from metadata only, never the body. Combined
    with is_demo this also lets a caller credit ANOTHER user's wallet.
    DECIDE AND WRITE DOWN: whether a demo/test purchase path should exist
    at all; if it must, it needs to be gated by an env flag that is off in
    every shared environment AND a staff check, not a request field.
    Note the operator's testers currently rely on shortcut payment paths,
    so removing this outright may need a sanctioned replacement — ask
    before deleting.
    Scope covers both the Stripe and Ubit demo branches and both the gRPC
    and HTTP handlers.
