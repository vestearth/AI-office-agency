        - Games-Labs-Missions/internal/repositories/mission_repo.go
        - Games-Labs-Missions/internal/services/weekly_match.go
      parallel_safe: false
    - order: 3
      id: parent-and-child-api-contract
      description: Build ordered capped child progress, completed/total parent progress, one parent claim/reward, and Quest Overview group mapping.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/models/models.go
        - Games-Labs-Missions/internal/services/weekly_service.go
        - Games-Labs-Missions/internal/services/quest_overview_service.go
      parallel_safe: false
    - order: 4
      id: docs-local-verification-and-review-handoff
      description: Document the contract and cutover, run focused and full checks, review migration rollback, and prepare the staging reviewer handoff.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/README.md
      parallel_safe: false
    - order: 5
      id: staging-deploy-and-authenticated-acceptance
      description: After review and merge to staging, deploy Missions and verify both raw gateway responses plus controlled non-promotional settled-round progression.
      agent: dev-2
      owned_files: []
      parallel_safe: false
  risks:
    - risk: Existing pooled progress cannot be split into per-game history because the application ledger does not store game_id.
      mitigation: Activate only for week_start >= 2026-08-24 and do not backfill older aggregate rows.
    - risk: Duplicate or reversed events could corrupt child completion.
      mitigation: Persist game identity on the new application rail and test duplicate, reverse, capped, and sibling cases.
    - risk: Per-game children could accidentally multiply rewards or claims.
      mitigation: Preserve one parent mission and claim record; omit child reward and claim fields and assert one Wallet credit.
    - risk: Older clients currently interpret Weekly progress and target as pooled turnover.
      mitigation: Keep changes additive where possible, use explicit units, coordinate Mobile, and verify raw edge responses before release.
    - risk: Category and mixed pools cannot be mapped safely to a finite list of concrete game children.
      mitigation: Keep those observed compatibility rows on legacy aggregate semantics and cover them with tests.
  estimated_complexity: high
