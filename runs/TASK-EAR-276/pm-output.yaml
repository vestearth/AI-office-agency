description: |
  Change schedule-generated Weekly game_turnover missions from one pooled
  turnover counter into one parent mission whose selected games each require
  the configured per-game turnover (currently 1,000). Parent progress becomes
  completed games over total games; ordered children expose per-game turnover
  for display and launch only. Reward, Collect, claim identity, and Wallet
  credit remain on the parent once. Gate the behavior to Bangkok week starts
  on or after 2026-08-24; do not infer per-game history from older aggregate
  rows. Category/mixed pools and fallback definitions remain legacy-compatible.
acceptance_criteria:
  - criterion: On or after the 2026-08-24 Bangkok week start, 1,000 turnover on one selected game completes only that child and cannot complete or substitute for a sibling.
  - criterion: Parent progress is completed games over total games with unit children and becomes claimable only after every selected game independently reaches 1,000.
  - criterion: GET /api/v1/missions/weekly returns ordered per-game children with game_id, capped current/target amount progress, and completion state, while keeping one parent reward and claim.
  - criterion: GET /api/v1/quest/overview returns the Weekly mission as kind group with the same parent aggregation and display/launch-only children.
  - criterion: Children expose no reward, claimable, claimed, or child claim route; one idempotent parent claim produces one Wallet credit.
  - criterion: Duplicate events do not double-count, and reversal updates the original game's progress and recomputes parent completion before claim.
  - criterion: Weekly completion-bonus counts and claim authorization use the new all-children-complete result.
  - criterion: Weeks before 2026-08-24, non-game Weekly conditions, category or mixed pools, and no-active-plan fallback behavior remain regression-covered and unchanged.
  - criterion: The additive migration applies to an existing schema and does not present historical aggregate progress as per-game progress.
  - criterion: Focused tests are recorded red before implementation and green after; full test, vet, readonly build, and diff checks pass.
  - criterion: Authenticated staging gateway responses prove both endpoint shapes, and controlled settled rounds prove sibling isolation and parent completion; production is not claimed verified.
plan:
  approach: |
    Preserve the existing single Weekly activity, mission id, reward, and claim
    boundary. Add a per-game persistence rail for concrete game-id pool entries,
    extend the event application/reversal path with game identity, and aggregate
    capped children into the parent at read time. Reuse the Weekly response in
    Quest Overview. Gate behavior by Bangkok week_start >= 2026-08-24 so an
    early deployment cannot change the active week. Keep legacy aggregate paths
    for non-target conditions and incompatible pool forms.
  subtasks:
    - order: 1
      id: red-contract-and-cutover-tests
      description: Add failing service, repository, and response-shape tests for sibling isolation, parent aggregation, one claim, reversals, and pre-cutover compatibility.
      agent: dev-2
      owned_files:
        - Games-Labs-Missions/internal/repositories/weekly_progress_test.go
        - Games-Labs-Missions/internal/services/weekly_service_test.go
        - Games-Labs-Missions/internal/services/weekly_pool_game_ids_test.go
        - Games-Labs-Missions/internal/services/quest_overview_service_test.go
      parallel_safe: false
    - order: 2
      id: per-game-persistence-and-event-path
      description: Add the migration and extend Weekly forward/reverse persistence with concrete game identity and the Bangkok cutover gate.
      agent: dev-2
      owned_files:
