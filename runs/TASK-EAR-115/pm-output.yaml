    queries: []
    relevant_symbols:
      - check_in_calendar_service.RestoreStreakWithResult
      - wallet.Client.RedeemPoints / Debit
    notes: Cause revealed by TASK-EAR-113 option 1 unmasking; verified points balance unity in Wallet (CreditPoints/DeductPoints).
