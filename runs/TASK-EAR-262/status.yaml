next_action:
  agent: dev
  description: >-
    CRITICAL. Games-Labs-Wallet's entire `walletpb` gRPC surface takes the
    subject `user_id` from the REQUEST BODY with no authorization at any
    layer, so any player with a valid token can mint currency into any
    account, at any amount.
    HANDLERS (internal/core/handlers/wallethdl/grpc.go): :86 AddDiamond,
    :154 DebitDiamond, :181 CreditDiamond, :205 ExchangeDiamondsToCoins,
    :235 RewardPackage, :265 RedeemPoints, :292 CreditPoints. Each reads
    req.GetUserId() and none consults gRPC metadata; the service layer adds
    nothing (walletsvc/service.go:121-320 validates only non-empty/positive).
    WHY IT IS REACHABLE: mounted at api-gateway gateway/grpc.go:91 and bound
    to /api/v1/wallet/* — OUTSIDE /api/v1/admin, so RequireAdminAPIAccess
    never fires (middleware/auth.go:189-193 short-circuits for any other
    prefix). All paths appear in the deployed staging swagger.
    WORST CASE FIRST: ExchangeDiamondsToCoins is not merely an IDOR — BOTH
    sides of the exchange are caller-supplied, so one diamond can be
    exchanged for an arbitrary number of coins. Fix that one first.
    ON PROD: `git show origin/prod:...wallethdl/grpc.go | grep -c
    "userID := req.GetUserId()"` returns 2, same as staging — this is not
    staging-only.
    THE CORRECT PATTERN IS 30 LINES AWAY: TransferCoin (grpc.go:119-125) in
    the same file already resolves the caller from metadata. Use it.
    DECIDE AND WRITE DOWN, per RPC, because these are not all the same:
    - Player-facing on the caller's OWN wallet (AddDiamond,
      ExchangeDiamondsToCoins, RedeemPoints, RefundPoints, DebitDiamond):
      resolve the subject from gateway metadata, ignore the body field, fail
      closed when absent — the TASK-EAR-254 rule.
    - Genuinely administrative (CreditDiamond, CreditPoints, RewardPackage):
      either move them under /api/v1/admin/* so the gateway gates them, or
      add auth.RequireStaffGRPC, mirroring orderhdl/grpc.go:239. Moving the
      binding is a shared-lib + gateway change — say which you chose and why.
    Keep the body field on the wire for client compatibility but make it
    inert, exactly as TASK-EAR-182 did for Order.
    Regression test seen RED first per handler, including a cross-user
    attempt and a missing-identity attempt. Verify cross-user denial live
    through api-gateway, not only in unit tests.
