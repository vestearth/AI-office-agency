      THE AGENT DEVIATED FROM MY BUCKETING ON TWO RPCs, AND IT WAS RIGHT.
      I had specified AddDiamond and ExchangeDiamondsToCoins as
      player-facing/self-scoped. The agent made both STAFF instead, with the
      argument that self-scoping does not fix an RPC that CREATES currency —
      it only changes whose wallet the attacker mints into. Self-scoped,
      ExchangeDiamondsToCoins still lets a player buy 1,000,000,000 coins
      with one diamond, because both sides of the rate are caller-supplied;
      the authoritative rate lives in Order (rate catalog + booster + coupon,
      persisted as exchange_coin_amount) and reaches Wallet over the internal
      HTTP mux, so there is no legitimate player caller. AddDiamond is an
      unpaid mint with no payment or order linkage and has ZERO callers
      anywhere in the workspace. Accepting the deviation.
      DebitDiamond and RedeemPoints stayed owner-scoped, correctly — they
      take value AWAY from the subject, so binding subject to caller is a
      complete fix.
      Staff gating is in-handler via auth.RequireStaffGRPC rather than by
      moving the binding to /api/v1/admin/*: the binding lives in shared-lib
      and would need an api-gateway bump to take effect, and a binding-only
      fix would leave the gRPC method ungated for anything reaching the port
      directly.
      🔴 DEPLOY BLOCKER, verified myself: Games-Labs-User calls this exact
      gRPC surface via internal/adapters/walletadt/adapter.go, which has NO
      metadata handling at all — grep for "metadata" in that file returns
      nothing, while its sibling gameadt/adapter.go:42-48 has
      forwardOutgoingContext doing precisely that copy. So after this fix,
      four User flows fail closed: display-name change and VIP purchase
      (DebitDiamond + CreditDiamond refund), and VIP level rewards
      (RewardPackage, CreditPoints). All four go over gRPC — the adapter's
      HTTP client is only used for the turnover read.
      I CORRECTED THE AGENT'S SEVERITY FRAMING. It reported that shipping
      alone "will lose players' money" because the player is debited before
      the refund. Reading the actual flows (usersvc/service.go:210-225 and
      :534-539), both are `if err := DebitDiamond(...); err != nil { return }`
      — the debit fails FIRST and the function returns early, so no debit
      happens and no refund is needed. The failure is closed, not lossy.
      This is feature breakage, not fund loss. Still a hard blocker, but the
      distinction matters for how urgently it is sequenced and for what is
      told to anyone on call.
      MY OWN VERIFICATION, not taken on report: go build, go vet and a
      cache-cleared go test ./... clean across 9 packages from the committed
      state. Then neutered resolveCallerID to return a fixed attacker id and
      confirmed the cross-user tests are not vacuous — they failed with
      'debit subject "attacker-any" is neither the victim nor the caller'.
      Tree restored clean.
      UNBLOCK CONDITION: migrate User's four calls to Wallet's internal HTTP
      mux, as Order and Missions already do (User already has
      WALLET_HTTP_ADDR wired). NOTE the mux has /wallets/debit,
      /wallets/credit and /wallets/reward-package but NO credit-points route
