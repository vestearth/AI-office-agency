next_action:
  agent: done
  description: >-
    Closed. TopupBonus no longer pays on a caller-supplied amount: the payout
    is priced off a settled deposit Wallet recorded, and one deposit pays once
    because the reservation is keyed on its payment_transaction_id rather than
    on an idempotency key the caller chooses.
    Shipped as Wallet #39 (49f80c4) then Missions #116 (aaf052a), in that
    order, plus follow-ups Missions #117 (a65900d, integral credit) and #118
    (81f1146, honest claim statuses). All deployed green to staging.
    PROVEN ON LIVE STAGING, not in stubs: a claim carrying topup_amount 999999
    credits nothing; a real THB 29 sandbox deposit credits exactly 2, and a
    replay under a different idempotency key returns already_claimed;
    /payments/settled-deposits answers 404 at the gateway while the two
    /payments paths the gateway does proxy answer 400 from Wallet's handlers,
    so the deposit read is not reachable from the edge.
    Full evidence, including the two attempts recorded as inconclusive and the
    reasoning behind choosing option (a'), is in
    runs/TASK-EAR-270/decision-memo.md sections 4, 7 and 8.
    Two follow-ups were split out rather than folded in: TASK-EAR-306 (deposit
    currency is unchecked, so a USD deposit pays the same bonus as the same
    number of THB) and TASK-EAR-307 (walletpb.SumLifetimeTopupMinor is declared
    but unimplemented, so Games-Labs-User's call returns Unimplemented today).
    Production is NOT patched. This task shipped to staging only.
