next_action:
  agent: dev
  description: >-
    CROSS-SERVICE CONTRACT DECISION, then a fix. Missions' TopupBonus pays a
    percentage of a top-up as Diamond, and takes the top-up amount FROM THE
    REQUEST BODY with nothing establishing that a top-up ever occurred.
    TASK-EAR-263 pass 2 bound the endpoint to the authenticated caller, so a
    player can no longer inflate someone else's bonus — but they can still
    inflate their OWN, without limit, with a caller-chosen idempotency key.
    It remains an unbounded faucet into the caller's own wallet.
    WHY IT WAS NOT FIXED IN TASK-EAR-263: no trustworthy server-side amount
    exists to replace the client's. The implementing agent investigated and
    recorded the finding as a doc comment at
    Games-Labs-Missions/internal/handlers/mission/http/mission.go:398-411 —
    read it first. In short: a real top-up is recorded in Games-Labs-Wallet's
    payment_transactions (type=deposit, status=success); Wallet exposes NO
    read API for it (walletpb.SumLifetimeTopupMinor is declared in the proto
    but unimplemented); Wallet publishes no deposit event; and the
    player.activity.v1 stream Missions consumes has no top-up event type.
    The agent was instructed to stop rather than invent a source, and did.
    That instruction stands for whoever picks this up.
    DECIDE FIRST, and write it down before coding — this is an ownership
    question, not a coding one:
    (a) Wallet exposes a read RPC for settled deposits in a window
        (implementing SumLifetimeTopupMinor, or a narrower
        SumSettledDepositsSince), and Missions calls it — mirrors how
        TASK-EAR-263 pass 1 fixed the mission boost gate against Missions'
        own turnover ledger; or
    (b) Wallet publishes a deposit-settled event and Missions consumes it
        into its own ledger — consistent with how player activity already
        flows; or
    (c) the bonus is granted BY Wallet at settlement time and Missions stops
        owning the payout at all — arguably the most honest boundary, since
        Wallet is where the evidence lives.
    Consider TASK-EAR-260's precedent: it made the package catalog the price
    authority rather than trusting the caller's amount. Same principle here —
    the server decides the amount, the client only asks.
    Whichever is chosen, the client-supplied topup_amount must become inert,
    kept on the wire for compatibility as TASK-EAR-182 and TASK-EAR-262 did.
    Regression test seen RED first, proving a fabricated amount no longer
    pays out. Verify through the gateway, not just the direct mux.
