- phase: pending -> done
  agent: debugger
  reason: >-
    Follow-up resolved. Game enrichment failed because gameadt.Adapter called
    AdminGameService.ListGames (which requires staff metadata role/userid/access/
    permissions) but did not forward the caller's incoming metadata to the
    outgoing gRPC call; gRPC does not auto-propagate, so Game returned
    MetaDataNotFound. Confirmed by probing GET /api/v1/admin/games via the gateway
    (metadata injected) -> 200 with games, vs provider's own call failing. Fix:
    forward incoming metadata to outgoing context in
    gameadt/adapter.go ListGamesByProviderID, with a propagation test. Shipped via
    PR #25 squash-merged to main (commit af896e2); CI Build+Test passed and
    SSH-deployed to VPS. Post-deploy verification: GET /api/v1/admin/provider now
    returns status 200 with populated totalGames (1up spin=17, Allforbet=23,
    GGSoft=24) and categories. Both the user-facing outage and the game-count
    regression are RESOLVED. Behaviour note: enrichment now also requires
    PERM_GAME_MANAGEMENT; callers without it see totalGames=0 gracefully. A
    service-to-service credential to decouple this is deferred. Verified via the
    Claude manual advisory lane (not a configured runner).
