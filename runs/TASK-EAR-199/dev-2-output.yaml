summary: |
  Implemented across five repositories behind the operator's publish gate: no
  downstream repository was touched until shared-lib was merged, and no local
  replace directive was used anywhere. All three Go consumers now pin one
  shared-lib version, v0.0.0-20260803091928-c60306c13db0 (c60306c), replacing
  the three divergent pseudo-versions they were on.

  What the change does. A game's status now travels with the level-group
  membership, so each caller decides for itself: staff surfaces keep showing a
  member that was deactivated after assignment, and user-api drops anything that
  is not active before the player ever sees it. Assigning a non-active game is
  refused at the source, inside the transaction, before the delete-then-insert
  that would otherwise move an existing mapping.

  Review round 1 returned one real defect in Backoffice #68, since fixed. The
  first pass declared gameStatus on the row type but the composable's normalizer
  never read it, and mapLevelRowsToPrivilegeGames took status from the picker
  catalog. Because that same commit filtered the catalog to active games, a
  deactivated member was absent from it, so the VIP Level Wizard labelled every
  stale member Unknown instead of Inactive, Pending or Maintain. My own test
  scanned source text and passed while the bug was live; the replacement imports
  the real functions and calls them, and it fails against the previous commit.
  The Group Edit page surface had been correct.

  The 1002 envelope was raised as a deviation and the reviewer accepted it as the
  correct contract. Follow-up applied: the test name no longer says 400, and the
  acceptance criterion in task.md now states 1002 so nobody "corrects" it back.

verification:
  - check: Assignment guard against real Postgres
    result: >-
      A throwaway container was used because "no row was written" is a claim
      about transaction behaviour that a stub cannot make. All three non-active
      states - pending, inactive, maintain - rejected, with the game's membership
      rows read before and after and compared field by field: unchanged, and
      still in the original group. Seen FAILING with the guard removed, then
      passing. The reviewer re-ran the same suite independently on Postgres 15.
  - check: Backoffice regression coverage after the review defect
    result: >-
      6 new behavioural tests importing the composable directly. Verified
      failing against the pre-fix commit via git stash, then passing. Full suite
      193/193, production Nuxt build clean.
  - check: Go repositories
    result: >-
      shared-lib, Game, api-gateway and User each pass tests, go vet, and
      go build -mod=readonly. Regeneration used buf generate --path scoped to the
      two protos rather than make buf, which cleans and regenerates every proto
      in the repo and would have buried the change in unrelated plugin churn.
  - check: Public response shape unchanged
    result: >-
      Handler test asserts the public payload's game_status stays empty, so the
      only difference a player sees is that non-active entries are absent.
  - check: Acceptance criterion 7 (staging)
    result: >-
      NOT VERIFIED. Game is merged and deployed to staging (run 30802267342);
      api-gateway, User and Backoffice are not deployed, and no authenticated
      endpoint proof exists yet. The VIP5 payload has not been re-read.

