    queries:
      - User GetProfile VIP level identity UUID eligibility proto
      - Backoffice Store Items VIP level selector level_id
    relevant_symbols:
      - Games-Labs-User/internal/core/handlers/userhdl/grpc.go:GetProfile
      - Games-Labs-User/internal/core/handlers/adminuserhdl/grpc.go:vipLevelToProto
      - Games-Labs-User/internal/models/user.go:LevelConfig
      - Games-Labs-backoffice/app/composables/useVipLevelAdminList.ts
    notes: Source confirms current VIP IDs are numeric strings while Order special-item level_id validation expects UUID.
blockers:
