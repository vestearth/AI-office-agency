summary: |
  Root cause confirmed: public VIP handlers performed a second catalog lookup
  after the service had already loaded the level configuration, discarded lookup
  errors, and returned empty UUIDs. GetProfile also treated missing levels and
  database failures identically.

  Fixed by carrying CatalogID directly through service result models, removing
  secondary handler lookups, and introducing a typed level-not-found sentinel.
  GetProfile returns an empty identity only for explicit not-found and propagates
  system failures. Generic handler failures map to internal status code 1000.

  Replaced SQL text inspection with an executable PostgreSQL regression test for
  deterministic/idempotent backfill, uniqueness, NOT NULL, create identity,
  repository update immutability, and trigger rejection.

  Verification passed: full User tests, readonly build, PostgreSQL 16 migration
  integration test, Backoffice production build, selector tests 8/8, diff checks,
  no replace directive, and task validation.
