summary: |
  Implemented the stable User-owned VIP catalog identity across persistence,
  service mappings, published contracts, and the Backoffice Store Item producer.
  The additive migration deterministically backfills a UUID from the numeric
  progression level, enforces uniqueness and immutability in PostgreSQL, and
  preserves the numeric level as the admin route/progression key. New and
  updated rows keep the same identity because the upsert never updates
  catalog_id.

  Bumped Games-Labs-User to the published TASK-EAR-111 shared-lib pseudo-version
  v0.0.0-20260713093515-91c6b7788cac and mapped catalog_id in profile, public VIP
  list/get/buy, and AdminUser list/get/create/update responses. Inactive levels
  retain their identity for existing references; missing levels return an empty
  identity. Backoffice continues to use numeric IDs for VIP administration, but
  active Store Avatar/Pass selectors display the level label and submit the
  catalog UUID to Order.

  Compatibility is additive: existing numeric routes and fields are unchanged.
  Rollout must deploy User before enabling the updated selectors, and rollback
  must preserve the new database column once Order records reference these UUIDs.
  Focused User tests, the User readonly build, the 8-case Backoffice Store Item
  test, the Nuxt production build, and both repository diff checks passed. The
  Backoffice route-name and large-chunk build warnings are pre-existing and
  non-blocking. Existing changes in useVipLevelGames.ts and the game-group edit
  page were outside this task and were preserved untouched.
