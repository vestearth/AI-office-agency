summary: |
  Fixed both pre-existing Games-Labs-backoffice test failures the operator
  flagged (adminFreeCoinManage, gameReportDetailAuth). Root causes were
  established via the debugging skill before this run opened; this run just
  applies the minimal fixes and verifies.

  1. tests/adminFreeCoinManage.test.mjs:86 asserted a
     'monitoring/reports/free-coins' mock key that commit cea652d
     deliberately removed (dedicated page app/pages/admin/monitoring/
     player-log/free-coin.vue already exists and is wired). Flipped the
     assertion from assert.match to assert.doesNotMatch — the test now
     verifies no catch-all mock exists for that path either, matching the
     established "dedicated page -> no mock" pattern used elsewhere in the
     same file (manage/payment-gateway, TASK-EAR-238).

  2. app/pages/admin/monitoring/report/game/[id].vue:334 rendered
     /svg/stat-360.svg on the "Total Game Round" stat card; the test (added
     in the same original commit a935377) expects /svg/stadia-controller.svg
     per Figma. Confirmed correct icon by cross-checking the analogous card
     in app/pages/admin/monitoring/report/game/index.vue, which already uses
     stadia-controller.svg for the same label. Swapped the icon path.

