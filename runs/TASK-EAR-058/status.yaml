      Claude advisory lane (session task_abd6c2b0). User reported a pre-existing
      stray literal NUL byte (0x00) inside the string literal
      `const FOREIGN_KEY = '<NUL>foreign:'` at
      Games-Labs-backoffice/app/pages/admin/manage/missions/daily/edit/[id].vue
      (line 121). Confirmed present on HEAD (NUL count 1), so it predates the
      fix/mission-total-reward-derived branch. The raw NUL made git classify
      the whole .vue as binary (`git diff` -> "Bin NNNN -> NNNN bytes"),
      silently hiding all future text diffs from reviewers.

      Fix: replaced the single literal 0x00 byte with the two-character JS
      escape `\0`, so the line reads `const FOREIGN_KEY = '\0foreign:'` --
      matching the sibling app/utils/dailyPlanBoardMap.ts which already uses the
      escape form. Checked the dependency first: both FOREIGN_KEY constants are
      module-private (not exported) and used only as an internal sentinel prefix
      (startsWith/slice on group keys). At runtime the escape and the literal
      NUL produce the byte-identical string (U+0000 + "foreign:"), so the fix is
      100% behavior-preserving; plain 'foreign:' was rejected because it would
      drop the sentinel and diverge from the sibling file.

      Verified: python NUL-byte count on the working file is now 0 (was 1); a
      NUL-stripped-HEAD vs working diff renders as plain text (no "Binary files
      differ"). `git diff` vs HEAD still prints binary only because the HEAD
      blob still holds the pre-existing NUL -- that resolves on commit.

      Surgical single-line edit; did NOT touch the concurrent reward-total WIP
      in the same working tree. This is the file the TASK-EAR-057 reviewer lane
      explicitly deferred to this session to avoid clobbering. Not committed
