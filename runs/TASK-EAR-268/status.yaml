    reason: >-
      Opened from TASK-EAR-257's audit (Tier E: FINDING-7, FINDING-9,
      FINDING-8, plus the DeleteUser observation) at operator request to
      triage findings into individual tasks.
      Grouped rather than split one-per-finding, unlike the Tier A/B/D
      findings, because none is a confirmed payout and each needs an
      investigation step before its severity is even known. Splitting
      unranked warnings into four runs would create the appearance of four
      tracked defects when what exists is four questions.
      The DeleteUser observation is deliberately called out FIRST in
      next_action despite being flagged as out of scope and non-money. An
      unauthenticated account-deletion binding, if that is what it is, is
      more serious than the three warnings it is filed with — and the audit
      only mentioned it in passing because it fell outside the money-path
      scope it had been given. Scope boundaries are how findings get lost;
      writing it into the action rather than leaving it as a footnote is the
      cheapest guard against that. Claude advisory lane.
