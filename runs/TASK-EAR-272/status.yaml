      WRONG. TASK-EAR-273 later found that Missions on prod points at staging's
      Cloud Map namespace — a live regression the sweep's own shape made
      invisible. A future run of this sweep should diff exported VALUES across
      environments, not just presence.
  - phase: pending -> pending
