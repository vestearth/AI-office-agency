    at: '2026-08-15'
    reason: >-
      Opened at operator request after the second instance of this class
      turned up by accident inside two days — the same way every money-path
      defect in TASK-EAR-257 was found.
      The pattern is worth stating plainly because it is what makes the class
      dangerous: build-env-json.sh renders a missing name as an empty string
      rather than failing, so a forgotten export produces a deploy that
      succeeds, logs nothing, and quietly disables a feature. Nobody notices
      until someone asks why win capture has no data, or why a wallet call
      returns not-configured.
      Assigned to devops rather than dev: the deliverable is a config audit,
      and the fixes are workflow changes. Marked parallel because it touches
      no application code and conflicts with nothing else in flight.
      Related lesson already recorded: ecs/env.names non-string values
      crash-loop the task on boot (loud, and therefore already caught),
      whereas string values that mean "off" fail silently. This sweep is
      specifically hunting the quiet ones. Claude advisory lane.
