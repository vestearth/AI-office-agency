next_action:
  agent: devops
  description: >-
    SWEEP FOR SILENTLY-DISABLED CONFIG. Every Games-Labs service renders its
    ECS task environment by feeding ecs/env.names through
    ecs/build-env-json.sh, which emits `{"name":X,"value":""}` for any name
    the workflow did not export. An empty value does not fail the deploy and
    does not log — it just silently turns the feature off. Two instances were
    found by accident in two days; find the rest before they are found the
    same way.
    THE TWO KNOWN INSTANCES, as the shape to look for:
    - Games-Labs-Provider: WIN_CAPTURE_PROVIDERS is in ecs/env.names but was
      never exported by prod.yml (staging.yml had it), so win capture has
      been OFF on production regardless of what EAR-192/194 shipped. Found
      during TASK-EAR-265. Fix in flight: Games-Labs-Provider#32.
    - Games-Labs-User: prod.yml exports NEITHER WALLET_HTTP_ADDR NOR
      WALLET_GRPC_ADDR, while staging.yml exports both — so
      walletadt.NewAdapter returns a nil adapter and this service's wallet
      calls are already non-functional on production. Found during
      TASK-EAR-271.
    METHOD, mechanical and cheap: for each repo with an ecs/ directory,
    diff the set of names in ecs/env.names against the names actually
    exported or set in the `env:` block of .github/workflows/prod.yml, and
    again for staging.yml. Report every name present in env.names but absent
    from a workflow. Do it per BRANCH — remember the workflow that runs on a
    push to prod is the copy on the prod branch, and TASK-EAR-192 found
    Provider's staging copy of prod.yml had drifted badly from prod's.
    RANK WHAT YOU FIND, do not just list it. For each gap say what the empty
    value actually does at runtime: silently off (WIN_CAPTURE_PROVIDERS),
    silently broken (WALLET_HTTP_ADDR), harmless because the accessor has a
    sensible default, or a boot crash. The recorded envconfig lesson matters
    here — a non-string field with an empty value fails to parse and
    crash-loops the task, which is loud; a string that means "off" is the
    dangerous quiet one.
    DELIVERABLE: runs/TASK-EAR-272/findings.md — a table per repo per
    environment, with the runtime consequence and a recommendation. Open
    follow-up tasks only for gaps that need a product or ops decision; fix
    the mechanical ones in one PR per repo.
    Do not change application code.
