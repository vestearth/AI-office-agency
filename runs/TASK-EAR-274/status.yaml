next_action:
  agent: dev
  description: >-
    Games-Labs-Provider connects to its database with TLS DISABLED, on
    production. config/config.go:211 hard-codes
    `q.Set("sslmode", "disable")` when building the DSN.
    TWO THINGS MAKE IT UNFIXABLE BY CONFIG ALONE:
    (1) prod.yml exports POSTGRES_SSLMODE, but that name is NOT in Provider's
    ecs/env.names, so build-env-json.sh never emits it — the same
    silently-dropped-export class as TASK-EAR-272's other findings.
    (2) Even if it were emitted, the accessor would ignore it: the value is
    hard-coded, not read from the environment.
    So this is a code change plus a config change, not a config change.
    ESTABLISH FIRST — it may be less severe than it reads: does the RDS
    instance ENFORCE TLS server-side (the `rds.force_ssl` parameter)? If it
    does, the connection is encrypted regardless of what the client asks for,
    and this becomes hygiene rather than exposure. If it does not, Provider's
    database traffic is in the clear inside the VPC. Ask devops; the answer
    changes the priority, not the fix.
    THE FIX: read sslmode from POSTGRES_SSLMODE with a default of `require`
    — matching what every other service's prod workflow already does — and
    add POSTGRES_SSLMODE to ecs/env.names so the export actually reaches the
    task. Keep `disable` available for local development.
    ⚠️ VERIFY THE CONNECTION STILL WORKS before merging. If the RDS instance
    or its certificate chain is not set up for the mode chosen, the service
    fails to connect and the deploy rolls back. Test on staging first with
    the same value prod will use, and check what the other services actually
    send — they already connect with `require`, which is the evidence that
    the mode works against this RDS.
    Regression test seen RED first for the accessor: an unset variable must
    default to `require`, not `disable`, so a forgotten export can never
    silently downgrade the connection again.
