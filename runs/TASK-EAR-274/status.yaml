    at: '2026-08-15'
    reason: >-
      FIXED. Branch fix/TASK-EAR-274-provider-sslmode, commit 728c5f3, PR
      https://github.com/SparqLab/Games-Labs-Provider/pull/33 targeting
      staging (the changed files are code plus env.names, not a prod-only
      workflow; prod.yml on the prod branch already exports correctly, but
      env.names must reach prod for the fix to take effect there).
      PostgresSSLMode() reads POSTGRES_SSLMODE, trims and lowercases, and
      returns "require" when empty; PostgreSQLDSN() interpolates it instead
      of the hard-coded literal; POSTGRES_SSLMODE added to ecs/env.names.
      The accessor guard is load-bearing rather than defensive padding, and
      the agent understood why without being told: build-env-json.sh renders
      an unresolved name as "", and envconfig's `default:` tag fires only
      when a variable is UNSET, never set-but-empty — so adding the name to
      env.names on a lane that does not export it would have produced
      `sslmode=`, a NEW failure. That is the recorded envconfig trap, applied
      correctly and covered by its own test.
      RED WAS THE RIGHT SHAPE: both faults visible in one run, and the second
      is what distinguishes this from an ordinary missing export — setting
      POSTGRES_SSLMODE=require explicitly was ALSO ignored, because the value
      was hard-coded. The agent rejected a compile-fail RED as too weak
      before writing that one.
      MY OWN VERIFICATION: build, vet and a cache-cleared go test ./... clean
      across 17 packages; the committed accessor and env.names entry read
      back from the commit and from the pushed remote; no hard-coded
      "disable" remains. Then restored `disable` as the fallback to prove the
      test is not vacuous — TestPostgresSSLMode_SetButEmptyDefaultsToRequire
      failed with 'got sslmode "disable", want "require"'. Tree restored.
      🔴 I ANSWERED THE QUESTION THE AGENT FLAGGED, AND THE ANSWER BREAKS ITS
      EVIDENCE. It argued that `require` is proven to work against this RDS
      because User, Wallet, Game and Logs all export
      ${POSTGRES_SSLMODE:-require}, while noting the argument only holds if
      the secret is unset. It is NOT unset: POSTGRES_SSLMODE exists as a
      PRODUCTION-ENVIRONMENT secret in all four of those repos (repo scope
      absent, production scope present — checked with gh). Its value is not
      readable, so we do not know which mode those services actually connect
      with. If it is "disable", all four are unencrypted too, not just
      Provider. That is now a question for devops and is written into the PR.
      COULD NOT DETERMINE, honestly reported rather than guessed: whether the
      RDS instance enforces TLS server-side (rds.force_ssl). It appears
      nowhere in the workspace, aws-deploy/ has no parameter-group content,
      and the aws CLI is unavailable. The agent's observation is worth
      keeping — if force_ssl were 1 the server would have rejected a
      plaintext connection and Provider could not have been running, so the
      fact that it runs is suggestive of 0. Suggestive, not proof, and it
      declined to claim otherwise.
      Neither open question changes the fix, only its urgency and what to
      watch on the first deploy: if the chosen mode is unsupported by the
      instance or its certificate chain, the service fails to connect and the
      deploy rolls back.
      FLAGGED, NOT FIXED: prod.yml on origin/main has no POSTGRES_SSLMODE at
      all while staging and prod both do, so a merge in the wrong direction
      could regress the export; Games-Labs-Order and Games-Labs-Auth have it
      in NEITHER env.names nor either workflow (same defect class, separate
      task); and Provider's own staging.yml still does not export it, which
      is correct via the accessor but less explicit than its siblings.
