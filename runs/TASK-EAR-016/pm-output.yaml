task:
  id: TASK-EAR-016
  title: Game Grouping Name — interim 5-language translate UI (FE-only)
  short_name: game-grouping-translate-ui
  parent: TASK-EAR-015
  epic: Backoffice multi-language content
  type: feature
  workstream: frontend
  priority: medium
  created_at: '2026-06-23'
scope:
  target_services:
    - service: Games-Labs-backoffice
      reason: Create Game Grouping name translate UI plus source-language save.
    - service: ai-dev-office
      reason: Track this follow-up as a PM task artifact.
  affected_files:
    - path: Games-Labs-backoffice/app/pages/admin/games/group/index.vue
      action: modify
      description: Group Name translate UI + source-language save in the Create Game Grouping modal.
    - path: ai-dev-office/runs/TASK-EAR-016/task.md
      action: create
      description: PM task scope, approved design, and acceptance criteria.
    - path: ai-dev-office/runs/TASK-EAR-016/status.yaml
