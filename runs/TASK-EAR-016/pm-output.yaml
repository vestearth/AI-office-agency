description: |
  Bring the translate UI (TASK-104 / TASK-EAR-015) to Create Game Grouping. Game
  Grouping has no Details/Conditions, only a group name, so the pattern applies to
  the name. The category backend stores name as a plain string, so this is
  frontend-only: full translate UI but persist only the source-language name.
acceptance_criteria:
  - criterion: Create Game Grouping shows the translate UI (selector, Group Name input, Translate, TH/EN/CN/FR/ES preview tabs, skeleton, note).
  - criterion: Translate calls POST /admin/translate with source_lang and fields.detail, reading res.fields.detail.
  - criterion: Submit persists only the source-language name into the existing name string; payload otherwise unchanged.
  - criterion: Required-name validation and submit-button disable reflect the source-language text.
  - criterion: npm run build passes in Games-Labs-backoffice.
plan:
  approach: |
    Mirror the TASK-EAR-015 pattern in games/group/index.vue, scoped to the Create
    Game Grouping name. Force-pick source language (per Figma placeholder). Send the
    name under the detail key. Save nameSaveText (source language) into the existing
    name string, marked with a TODO for the future localized payload.
  subtasks:
    - order: 1
      id: grouping-name-translate-ui
      description: Add state, UI, translate, reset, save, and validation wiring in games/group/index.vue.
      agent: dev
      owned_files:
        - Games-Labs-backoffice/app/pages/admin/games/group/index.vue
      parallel_safe: false
    - order: 2
      id: verify-and-summarize
      description: Run build verification and record any browser-smoke limitations.
      agent: dev
      owned_files:
        - ai-dev-office/runs/TASK-EAR-016/task.md
        - ai-dev-office/runs/TASK-EAR-016/status.yaml
      parallel_safe: false
  risks:
    - risk: Translate handler only accepts detail/condition field keys.
      mitigation: Send the name under the detail key and read res.fields.detail; no backend change.
  estimated_complexity: low
assignment:
  primary: dev
  parallel: false
  reason: Focused single-file frontend change mirroring the approved TASK-EAR-015 pattern.
summary: |
  Created TASK-EAR-016 to track the Create Game Grouping name translate UI.
  Frontend-only; persists source-language name only until the category backend
  supports localized storage.
