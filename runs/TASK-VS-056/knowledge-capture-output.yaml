  A. Durable knowledge, and where df03458 already put it
  1. Recurrence classification. Prod logs 2026-10-28 04:00Z to 10-30 22:46Z, every
     page read. All 17 post-rollout deadlines are the platform-wide one-day bucket
     `no_closed_days`, `filter_keys=[status,from,to]`, from slip-admin
     ReportSlipVerified. The 4 scoped errors came before VS-053; their task streams
     stopped at 04:23Z during the PR106 rollout. Lives in: hub "Classification"
     table; Review Queue status bullet; Project Map bullet. (ev-001)
  2. Cause. `adminVerificationCount` floors `to` to its Bangkok day, so a one-day
     filter has end == from and falls back to `no_closed_days`. The rollup gate in
     `adminVerificationCountSQL` required a scoped filter. That gate was a VS-053
     scope choice, not a correctness limit: migration 065's trigger keeps every hour
     exact from `covered_from` onward, and the table has an (hour) index. Lives in:
     hub "Cause". (task.md "Classification")
  3. Fix and tests. slip-api PR #113 drops the scope condition (fix e9c7497, main
     55260b8). The regression failed before the fix (`CountAll = 1; want 6 from
     rollup`) and passes after it. Platform parity holds across coverage
     none/full/partial/after. The full suite with a real Postgres,
     build -mod=readonly and vet pass on e9c7497. Lives in: hub "Fix and
     verification". (ev-002, ev-003, ev-008, ev-009, ev-010)
  4. Read-only prod plan for one platform-wide verified day. covered_from was
     2026-09-25 03:00Z. 25 rollup rows stand for 387,804 verifications. New SQL:
     635 buffers / 10.4 ms. Old SQL: 14,674 buffers / 180 ms at a quiet hour, with
     13,935 heap fetches. Both returned 387,804 in one statement. Lives in: hub.
     (ev-011)
  5. Staging. 2aa8738 runs as slip-api-staging:169 with a clean boot. DB parity held
     on 7 of 7 days. The main -> staging step was pushed directly, not through a PR.
     Lives in: hub "Staging". (ev-013)
  6. Prod. PR #114 deployed 7b24f3b as slip-api-production:127. Env and secrets are
     unchanged from :126, the rollback revision. In 12-min windows, 5xx went from
     3.29% to 1.30%, all baseline 502 bank-verifier errors. 0 admin 5xx, no new
     ERROR kinds. Lives in: hub "Prod" and "Current state"; Review Queue; Project
     Map. (ev-018)
  7. Still open. Open-ended counts are still raw. Days before covered_from are raw.
