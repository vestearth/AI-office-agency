  Draft for `Knowledge Base/Inbox.md` > Capture Queue:

    ### 2026-10-31 — Remote calls in evidence scripts stalled (CloudWatch, ECS Exec, git)

    - TASK-VS-056's post-deploy check failed twice on CloudWatch `filter-log-events`
      with `InvalidSignatureException: Signature expired`. In the first failure the
      request was signed at 14:22:30Z and AWS evaluated it at 14:37:32Z. In the
      second it was signed at 14:53:26Z and evaluated at 15:08:28Z. Each time that
      was about 15 min after signing, 10 min past the 5-min window. The local clock
      was correct (sntp offset 0.05 s). Read this error as a stalled call, not as
      clock skew or missing credentials.
    - One staging read-only psql session over ECS Exec hung about 11 h, was killed,
      and left no record. Another (ev-012) ended after its first result with
      "Cannot perform start session: EOF". `git fetch` timed out after 836 s (ev-017).
    - What the task scripts do now:
      - `cwf-retry.sh` passes `--cli-connect-timeout 10 --cli-read-timeout 90` on each
        call and makes up to 4 attempts per page, with paging unchanged.
      - `prod-readonly-psql.py` caps the ECS Exec subprocess at 240 s and prints
        `psql_exit=<rc>` before it exits. ev-013 has that line; ev-011 and ev-012 do
        not. Whether it was added because of the cut-off output is not recorded.
      - `prod-promotion-check.sh` no longer runs `git fetch`; it says to fetch before
        the run.
    - Not proven: the retry path never ran in the passing check (ev-018), and why the
      calls stalled is unknown.
    - Next: port the per-call timeout and bounded retry into the canonical
      `ai-skills/skills/cloudwatch-log-evidence/references/cwf.sh`, which has
      neither today. Also add one line on this error to that skill's SKILL.md. Then
      close this item, or promote it if a stall happens again with the fix in place.
