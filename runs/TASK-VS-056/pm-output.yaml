  target_services:
    - service: slip-api
      reason: Owns GET /v1/admin/verifications CountAll / adminVerificationCountSQL and the 10s adminCountBudget
    - service: slip-admin
      reason: Read-only — identify which Report UI filters produce the failing COUNT shapes
    - service: knowledge-base
      reason: Operator asked to record lineage, current state, and planned adjustment (hub note + Review Queue + Project Map)
