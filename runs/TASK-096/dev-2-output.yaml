task:
  id: TASK-096
  title: Add Check-In Day Reward Claim Endpoint
  status: done
  agent: dev-2
summary: |
  Implemented the direct Games-Labs-Missions check-in day reward claim runtime.
  The new HTTP endpoint is POST /api/v1/missions/check-in/days/{day}/claim.
  It claims the daily reward for a completed check-in day, including restored
  days, and keeps restore separate from reward credit.
completed:
  - Added PM task artifacts for TASK-096.
  - Added shared-lib proto contract for ClaimCheckInDay and calendar day claim fields, then regenerated shared-lib artifacts with make buf.
  - Added check_in_day_claims migration.
  - Added repository methods for durable day claim insert/list/delete.
  - Added calendar day claim_status and claimed_at model/service behavior.
  - Added MissionService.ClaimCheckInDay with durable duplicate protection, wallet credit, and rollback on wallet credit failure.
  - Added direct Missions HTTP handler and route for POST /api/v1/missions/check-in/days/{day}/claim.
  - Added focused service, repository, and HTTP tests.
  - Updated Missions README and both Postman collection copies.
