    at: '2026-09-08'
    reason: >-
      Operator chose the distinct-code option over reusing Forbidden 1001, so
      the shared-lib publish cycle is in scope. Gate 1 delivered as commit
      4298969 on task/TASK-EAR-333-guest-diamond-error-codes, PR 69 against
      main.
      SHIPPED TWO CODES, NOT THE ONE THE TASK SPECIFIED, and the second is the
      important one: 5035 OrderGuestDiamondRedeemNotAllowed at 403 for the
      policy refusal, and 5036 OrderUserServiceUnavailable at 503 for "the
      account type could not be determined". The task's own fail-closed
      requirement is unsatisfiable with a single code — refusing a lookup
      failure under the guest code reproduces exactly the Games-Labs-Game
      defect where an unset USER_API_URL made every level-gated launch return
      4009, the same code a real denial returns. 503 rather than 500 so a
      client retries and an operator reads it as a dependency problem.
      5035 sits in the Forbidden family beside OrderCatalogItemIneligible
      because it is a POLICY refusal, not a payment problem — the player may
      hold plenty of diamonds — and keeping it away from 6014 is what lets a
      client distinguish the two.
      Tests RED first and assert more than the values: the pair must not share
      a code, must not share an HTTP status, and must not collide with
      InsufficientDiamondBalance, InsufficientPoints or
      OrderCatalogItemIneligible. Values were read back from the BUILT package
      rather than from source: code=5035 http=403, code=5036 http=503.
      ZERO proto files changed, so no wire contract moved and no gateway gate
      is needed — this epic stays at four gates rather than 329's six.
      Noted, not fixed: shared-lib/.claude/worktrees/bold-mclaren-980045, left
      by the merged TASK-EAR-330 session, makes buf breaking report bogus
      already-defined symbols for protoc-gen-openapiv2. It is git-ignored so it
      cannot be committed, but it will misread as a breaking change until
      pruned. It belongs to another session's workspace, so it was flagged
      rather than removed.
  - phase: created -> pending
    agent: pm
    at: '2026-09-07'
    reason: >-
      Opened at operator request after TASK-EAR-329 shipped Diamond redemption
      and its staging verification exposed that NO guest rule exists anywhere.
      A guest is only a naming convention in Auth; user_profiles.source is
      persisted and already read into models.UserProfile, but appears on no
      proto and is read as a gate by no service; RedeemRedemptionItem has no
      user-level gating at all, unlike CreateRewardOrder beside it. The deposit
      path is ungated too, so guests can already buy diamonds — which the
      operator's decision deliberately keeps.
      The operator chose option 2 of three: not blocking top-up (too broad) and
      not hiding DIAMOND items from the catalogue, since hiding is not a
      control while the redeem endpoint stays directly callable.
      SCOPE IS SMALLER THAN IT LOOKS, and the reason is worth recording: Order
      reaches User over User's INTERNAL HTTP MUX (GET /users/{id}/stats),
      not gRPC, so the account type rides an existing response. No proto, no
      gateway gate, no migration. The only cross-repo publish is a single error
      code, and the task states the cheaper Forbidden-1001 fallback so the
      operator can decline to pay for it.
      The subtle requirement is the failure mode: a lookup failure must fail
      CLOSED on this money path but must NOT be reported as "you are a guest".
      Games-Labs-Game already lived the inverse — an unset USER_API_URL made
      every level-gated launch return 4009, the same code as a real denial, so
      a misconfiguration was indistinguishable from policy. Three outcomes, not
      two, and USER_API_URL must be verified on the Order task before deploy.
