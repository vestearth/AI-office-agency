      SHIPPED TWO FIELDS, NOT ONE, for a reason found by reading the code
      rather than the task: GetLevelProgress returns level 1 on pgx.ErrNoRows,
      and profiles are created ONLY from the RabbitMQ user.registered consumer.
      So a user whose registration event never arrived reads as a perfectly
      ordinary level-1 account, and a naive source == "" check in Order would
      wave them through the diamond gate. GetAccountSource is therefore
      deliberately STRICTER than the method beside it and reports found=false
      instead of inventing a default. A row that exists with a blank source is
      found=TRUE — the row is real, the value merely unset, which is a
      different fact Order gets to act on.
      Boundary call recorded: User reports the FACT, Order owns the POLICY.
      Deriving an is_guest boolean here would have put "who may redeem in
      diamonds" in the wrong service.
      A lookup failure is logged and reported as unknown rather than failing
      the whole call, so a level display never breaks because of it. The strict
      read is attached by an optional-interface upgrade in the two
      constructors rather than by widening signatures — the concrete statsRepo
      already satisfies it, so production picks it up and no existing caller or
      test changed. An implementation without it leaves the source unknown,
      which is the safe direction.
      A test asserts account_source appears on NO protobuf message; leaking
      guest status to every profile reader would repeat the VIP-inactive leak
      on GetProfile.
      OPEN INPUT FOR GATE 3: what a blank source means. Every Auth path
      publishes register/social/guest, so blanks can only be rows predating
      that. Census query is in next_action. Treating blank as unknown blocks
      real accounts if blanks are common; treating it as non-guest lets a
      legacy guest through if any exist.
