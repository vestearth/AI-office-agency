    at: '2026-07-30'
    reason: >-
      Opened at operator request out of a three-way audit of
      admin/manage/player (list / edit / Detail), each page read in full by a
      separate reviewer, with the backend side cross-checked separately
      against the shared-lib admin protos.
      Headline of that audit: the WIRING is genuinely finished — all 5 write
      buttons on the edit page issue real mutations, all 4 delegated panels do
      real reads with loading/error states, and the list page is entirely
      mock-free with real server-side paging/search/date filtering. So this
      task is deliberately NOT more wiring; it fixes the layer above it,
      where a rejected call can still present as success.
      Grouped 3 findings into one run because they are one defect — the UI
      asserting success it has not verified — on the same two money/account
      paths, and each has a correct pattern already present a few lines away
      (assertEnvelopeOK at edit/[id].vue:492-497 is used on 2 of 5 writes;
      openAdminErrorToast exists with a doc comment saying to use it for
      failures and is used in 6 other files but never here).
      Every line number in task.md was verified in source rather than taken
      from the audit reports. Enumerating the toast sites myself changed the
      count from the reported 8 to 9.
      Resolved one judgment call in the spec so the implementer cannot get it
      wrong: three of the failure branches are the `else` of
      `if (failed.length === 0)` over a multi-item loop, so they also fire on
      PARTIAL success. Specified error-toast anyway (the message already
      carries "Updated 4/5") and explicitly forbade adding a 'warning'
      variant, since AdminToastVariant is a two-member union and
      AdminSuccessToast branches on a single isError boolean — a third state
      would touch the shared component for every unrelated caller.
      Part 3 is the most serious of the three and was confirmed line by line:
      watch(player) seeds walletValues from mockPlayerDetail().wallet
      (diamond 56 / point 90 / coin 90054), neither GET-failure branch clears
      it, and the button is disabled only on walletSavePending — so a wallet
      GET failure leaves an operator able to Save fabricated numbers into a
      real wallet. Also folded in that walletBalanceResourceId resolves the
      PATCH path segment through the mock module, working only because
      mock.ts:217 echoes the route id (mock.ts:216 says so itself).
      Deliberately scoped OUT, with reasons recorded in task.md so they are
      not silently dropped: the Detail-page pagination mis-wiring (real bug,
      different file/cause), the Audit Log modal (blocked backend-first — no
      admin audit-log endpoint exists in ANY proto; /api/v1/logs is the
      Games-Labs-Logs ingest service), the Detail page's much wider silent
      mock-fallback surface, and every field that is mock because no backend
      exists at all (Device/IP, coin aggregates, Lifetime GGR, Top
      Performance win stats, referral code).
      Also recorded but not actioned: lifetime_topup has TWO
      implementations — the admin detail path computes it live from Wallet
      SumLifetimeTopup via GetProfile, while the list page reads a
      never-written column and is therefore always 0. That is a backend
      inconsistency, and the naive fix would be N+1 Wallet RPCs per list row,
      so it needs its own decision rather than riding along here. This one
      corrected a contradiction between two of the audit reports.
      Claude advisory lane.
