      TopupBonus now pays into the caller's own wallet, which turns a theft into
      self-enrichment without fixing the fabricated amount. STILL OWED: runtime
      proof through the gateway, not the Missions mux — the mux is not the
      public contract, and the gRPC bridge only forwards Authorization, X-User-
      ID and role, so anything header-based must be proven on the real edge.
      Prod is deferred.
