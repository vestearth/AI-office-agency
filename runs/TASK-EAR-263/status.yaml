next_action:
  agent: dev
  description: >-
    CRITICAL. Games-Labs-Missions ignores the trusted identity the gRPC
    bridge already hands it, across 16 gateway-reachable money paths, and two
    of those also take the PAYOUT AMOUNT from the request body.
    SPLIT THIS INTO TWO PASSES — they are different problems and bundling
    them would bury the worse one.
    PASS 1, do first, the amount problem:
    - TopupBonus (http/mission.go:366-396) reads user_id AND topup_amount
      from the body, and services/mission_service.go:528-560 credits
      `topupAmount * bonusPercent/100` as DIAMOND with no check that a top-up
      ever happened, no server-side amount, and no cap. idempotency_key is
      caller-chosen (mission.go:381-384), so it is repeatable at will.
    - ClaimMissionBoost (http/mission.go:311-341) is the same shape with a
      client-supplied `turnover`.
    These need a SERVER-SIDE source for the amount — the identity fix alone
    does not close them. Establish where a real top-up is recorded (Wallet
    payment_transactions or the Order flow) and derive the bonus from it, the
    same way TASK-EAR-260 made the package catalog the price authority.
    PASS 2, the identity problem, 14 handlers:
    ClaimDaily :50, ClaimDailyCompletionBonus :82, ClaimDailyGroup :109,
    CheckIn :141, ClaimCheckInMilestone :180, ClaimCheckInDay :215,
    FirstRegister :252, WatchAd :283, ClaimMonthlyReward :407,
    CheckInStreak :448, RestoreStreak :475, JoinTournament :526 (all
    http/mission.go); Purchase store.go:108, BuyPass :144, Exchange :243,
    ExchangeCustom :278. Each takes user_id from the body with no comparison
    against the trusted header — cross-user reward theft and cross-user spend.
    THE FIX IS ALREADY WRITTEN IN THIS REPO, TWICE OVER:
    httpx.HeadersFromGRPC (internal/httpx/bridge.go:44-64) ALREADY sets
    X-User-ID from trusted gRPC metadata on every bridged call, and
    store.go:183-204 (BuyAvatar) already implements the correct
    header-first + mismatch-403 pattern. Apply that pattern; do not invent a
    new one.
    ⚠️ BRIDGE CAVEAT, learned the hard way in TASK-EAR-191: HeadersFromGRPC
    forwards ONLY Authorization, X-User-ID and role. If any part of your fix
    depends on a different header arriving, it will silently never arrive
    through the gateway. X-User-ID is fine — anything else is not.
    Regression test seen RED first per handler, including a cross-user
    attempt. Verify through the gateway, not just the direct mux — the two
    behave differently here, which is the whole reason this class survives.
