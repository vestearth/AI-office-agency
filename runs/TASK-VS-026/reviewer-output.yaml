artifacts:
  - path: slip-api/internal/core/service/reports_summary.go
    issues:
      - line: 25-28
        severity: error
        description: >-
          The cached path never reaches the prod caller that most likely produces
          "GET /v1/admin/verifications -> 500 count verifications: ... timeout" at 10s
          (verification-evidence.md: 3 failures, latest 10-15 10:43 ICT, the same minute as
          the bank-flow transfer failures on the same SlipsHub page). slip-admin prod
          SlipsManage.vue:83-100 (loadStats) and 150-160 (load) never send from/to and fire
          the page plus one request per status chip at once (261-263, and on filter change
          at 102). With no `from`, line 26 routes them to the unbounded CountAll as before.
          Fix either way: (a) cover the unbounded-start platform-wide case (e.g. all-history
          closed days through the existing status_counts.v1 store, with a decided lower bound
          and cold-fill plan and no new schema without a separate migration decision), or a
          client default range (slip-admin product decision); or (b) reclassify the finding
          as partial (ReportSlipVerified ranges only; SlipsManage unbounded counts open) and
          ask the one operator question the task allows. Either way add a regression for the
          real request shape (no from/to, optional status).
      - line: 25-26
        severity: warning
        description: >-
          Eligibility is an exclusion list (MerchantID, BranchID, BranchIDs, Channel). Correct
          today (prepareAdminVerificationFilter sets no RequestID/Search; adminVerificationWhere
          filters on nothing else), but a future filter field would silently add platform-wide
          closed-day totals to a filtered count. Use a positive check (filter equals a copy
          keeping only Status/From/To/Limit/Offset) or a test that breaks when HistoryFilter
          gains a field.
      - line: 24-26
        severity: suggestion
        description: >-
          A date-only `from` (YYYY-MM-DD) parses as UTC midnight (reports.go:1263-1275) =
          07:00 ICT, so it never qualifies. slip-admin sends ICT timestamps, but API callers
          with dates get no benefit; document or parse in Bangkok time.
      - line: 44
        severity: warning
        description: >-
          On a cold store the list count runs closedDayCounts for up to 93 days while holding
          closedDaysMu (ignores context) across AdminStatusCountsByDay with a max(timeout, 30s)
          query timeout (repositories/verification.go:460), above the 20s WriteTimeout
          (cmd/main.go:275). A `from` older than the warm window can hold 30s instead of failing
          at 10s and block summary/daily/list callers on the mutex. Add a cold-fill test, cap
          the fill (fall back to CountAll when the missing range exceeds the warm window), or
          state that the migration-058 shared store bounds this in practice.
      - line: 157
        severity: suggestion
        description: >-
          closedDayCounts wraps errors as "admin verification summary: ...", so list and daily
          failures would log under the summary's text; the aws-tracking census groups by this
          text. Use a neutral wrap such as "closed day counts".
  - path: slip-api/internal/core/service/reports.go
    issues:
      - line: 138-183
        severity: suggestion
        description: >-
          Daily logic correct (closed days cached, open days live, 7 buckets kept, Other
          unchanged). (1) Lines 148-161 release the lock inside closedDayCounts and re-take it
          to read s.closedDays, safe only because entries are never evicted; return per-day
          counts instead. (2) AdminDailyCounts has no production caller left
          (ports/repositories.go:75, repositories/verification.go:411-445,
          repositories/memory.go:215); remove or deprecate in a follow-up.
      - line: 117
        severity: suggestion
        description: >-
          Response fields and pagination unchanged (TotalItems = closed + live; Items/HasMore
          from ListAll). Totals and page come from different moments, as before.
  - path: slip-api/internal/core/service/reports_summary_test.go
    issues:
      - line: 64-171
        severity: suggestion
        description: >-
          Good coverage of statuses, scoped fallbacks, partial start, wide range, exact/.999/
          future/omitted end and midnight grace. Missing: the prod Slips page shape (no
          from/to) documenting the chosen outcome, and a cold-store list test.
  - path: slip-api/internal/core/service/reports_usage_test.go
    issues: []
  - path: slip-api/internal/core/service/reports_day_store_test.go
    issues: []
  - path: runs/TASK-VS-026/investigation.md
    issues:
      - line: 13
        severity: warning
        description: >-
          The "Admin list COUNT timeouts" row reads as a confirmed defect with the fix
          implemented, but no check shows which client request shape fails. Only
          ReportSlipVerified reaches the cached path among platform-wide prod callers;
          SlipsManage (no from/to) and UsersManage (merchant-scoped) keep the original query.
          Mark it partial or unproven until the shape is settled.
