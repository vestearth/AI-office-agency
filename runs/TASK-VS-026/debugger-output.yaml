    action: modified
    description: Reuse existing closed-day counts for list totals and daily buckets.
  - path: slip-api/internal/core/service/reports_summary.go
    action: modified
    description: Preserve scoped fallbacks and the exact inclusive end on live-tail counts.
  - path: slip-api/internal/core/service/reports_summary_test.go
