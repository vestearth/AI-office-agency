diagnosis:
  root_cause: The transfer page wrapped its WITH query under an outer SELECT/ORDER
    BY/LIMIT; PostgreSQL required a Sort before LIMIT, and unqualified id resolved
    to its text projection. Local plan regression fails before and passes after the
    rewrite. Admin daily/list counts also bypassed existing closed-day storage; the
    completed fix covers actual no-date SlipsManage requests through all-history warm-up
    plus an exact live tail. Cold or busy caches retain the original exact COUNT fallback.
  affected_files:
  - path: slip-api/internal/repositories/bank_flows.go
