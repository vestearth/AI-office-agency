note_patch: |
  ## Query-path and all-history coverage, 2026-10-15

  TASK-VS-026 separates the transfer total from the page query. Sharing closed-day
  totals (VS-024/025) does not remove a Sort required by the transfer SQL. The
  page previously placed its WITH query inside a subquery and ordered the outer
  result; unqualified id also resolved to the text projection. Keep projection,
  ordering and LIMIT at the WITH query level, ordering the input UUID, to permit
  the existing created_at/id indexes to return the first page directly.
  PostgreSQL 18.3 regressions verify no Sort and 50 scanned rows for a synthetic
  month while preserving filters, pagination and tied-timestamp ordering.

  Global slip history has a different coverage requirement from a month summary:
  SlipsManage sends no dates and concurrently requests the page and status chips.
  Preserve its all-history meaning rather than silently narrowing it to a month.
  Discover the earliest verification via the existing date index and warm shared
  status_counts.v1 days in seven-day batches. Counts combine a complete closed-day
  prefix with an exact inclusive live tail. Missing old history, a busy writer,
  or non-global filters keep the original exact COUNT path. Midnight grace and
  existing closed-day invalidation assumptions still apply.

  PR 66 merged to main and PR 67 promoted to staging. The operator then
  explicitly authorized production; PR 68 promoted tested staging to prod
  at d35af57. Workflow 38696406338 succeeded and ECS production89 completed
  rollout healthy 3/3, pending 0. All three warm-ups succeeded: 3757/19/18 ms.
  Authenticated production checks exercised global history4,182,525 with
  correct status sums, seven daily buckets, month bank-flow3.32 million rows
  (first and second 50-row pages), seven-day1.829 million, and outgoing SCB.
  Bounded logs14:07:16-14:16:05 Bangkok show all17 report requests HTTP200,
  zero ERROR entries including timeout/53300. Observed transfer durations
  1.200-1.367s, list/count2-797ms and daily341ms are request observations,
  not percentiles or a performance guarantee for every filter/load.
  RDS connections peaked134 during overlap and returned68 near baseline65.
  No live bank call, data repair or unrelated schema/config change occurred.

  Later observation must be retained separately: an extended watch through14:33
  found one new general-list COUNT timeout at14:20:32, 10,001ms, on production89
  after successful warm-ups. There were two ERROR lines for that one request.
  In the same post-rollout window,65 list,8 transfer and3 daily requests returned
  HTTP200. TASK-VS-027 investigates the remaining COUNT failure; its actual
  filters and cache/fallback path are unknown because logs do not record them.
  The operator's slips/KBANK page URL is context, not the failed API request.
  SlipsHub lazy-mounts visited tabs; a fresh KBANK page uses bank-flow endpoints.
  This recurrence prevents a claim that all COUNT paths are fixed, without
  invalidating the earlier dated acceptance or proving a transfer regression.

  Apply alongside
   the pending TASK-VS-024/025 captures; retain their dated production observations and append this new dated acceptance instead of overwriting historical evidence. Correct the moved frontend source path to
  slip-admin/app/features/slips/ui/KbankFlowSummary.vue.

