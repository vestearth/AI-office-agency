note_patch: |
  ## Query-path and all-history coverage, 2026-10-15

  TASK-VS-026 separates the transfer total from the page query. Sharing closed-day
  totals (VS-024/025) does not remove a Sort required by the transfer SQL. The
  page previously placed its WITH query inside a subquery and ordered the outer
  result; unqualified id also resolved to the text projection. Keep projection,
  ordering and LIMIT at the WITH query level, ordering the input UUID, to permit
  the existing created_at/id indexes to return the first page directly.
  PostgreSQL 18.3 regressions verify no Sort and 50 scanned rows for a synthetic
  month while preserving filters, pagination and tied-timestamp ordering.

  Global slip history has a different coverage requirement from a month summary:
  SlipsManage sends no dates and concurrently requests the page and status chips.
  Preserve its all-history meaning rather than silently narrowing it to a month.
  Discover the earliest verification via the existing date index and warm shared
  status_counts.v1 days in seven-day batches. Counts combine a complete closed-day
  prefix with an exact inclusive live tail. Missing old history, a busy writer,
  or non-global filters keep the original exact COUNT path. Midnight grace and
  existing closed-day invalidation assumptions still apply.

  PR 66 merged to main and PR 67 promoted to staging. Authenticated staging UI
  checks and bounded logs show list/status counts, seven daily buckets, and
  month/seven-day/filtered bank-flow transfers working. This is staging acceptance
  on a small dataset, not production latency acceptance or a production incident
  closure. Production rollout remains outside this task's current authorization.

  Apply alongside the pending TASK-VS-024/025 captures; retain their dated
  production observations rather than presenting this staging-only fix as live
  in production. Correct the moved frontend source path to
  slip-admin/app/features/slips/ui/KbankFlowSummary.vue.

