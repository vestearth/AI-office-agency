      Manage broken, mid => both, max => Username broken). Fix: opaque
      bg-background-50 (card surface) on the sticky end th in both tables, plus
      shell rounded-t-r20 so rows cannot bleed into the top corners. Evidence:
      magenta-marker probe at x3 zoom showed the bleed and its removal at all
      three scroll positions; focused test 2/2 PASS; full suite 413/414 with
      the one failure (backofficeUiFixes "Add Avatar") reproduced on a stashed
      tree => pre-existing, unrelated.
