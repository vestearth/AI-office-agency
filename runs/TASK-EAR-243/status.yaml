    at: '2026-08-09'
    reason: >-
      Iteration 4 — same mechanism one layer down, on the header hairline.
      shadow-[0_1px_0_...] is an outset shadow painted 1px BELOW each cell box,
      so the end cells' background could not mask it; the middle header cells
      scrolling underneath drew a straight line across the capsule's rounded
      ends, reproducing the identical three-state pattern. Switched every
      header hairline in both tables to inset (shadow-[inset_0_-1px_0_...]) so
