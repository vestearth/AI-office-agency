summary: |
  Players list Username/Manage header looked radius-unlocked: outer
  overflow-hidden rounded shell only clipped the top corners, while
  border-collapse (Tailwind preflight) prevented th border-radius from
  painting the bottom corners. Fixed PlayersListTable with
  border-separate + explicit tl/bl and tr/br r24 on end header cells.
  admin/games Game List thead was not sticky; added sticky top-0 on all
  th plus the same border-separate / end-radius pattern.
decision:
  action: fix
  details: |
    Minimal two-file UI fix + focused source contract test.
    No API/layout/column changes. Operator should smoke scroll on
    /admin/manage/player and /admin/games before commit/PR.
  sub_tasks: []
