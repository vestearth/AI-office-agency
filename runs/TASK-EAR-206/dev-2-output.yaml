summary: |
  Implemented Event SPEND_PROP progress (TASK-EAR-206 option 1). Kept per-user
  resolve + resolved_special_item. On spend.settled Diamond store purchases,
  ApplyEventSpendDelta credits joined SPEND_PROP events whose locked selection
