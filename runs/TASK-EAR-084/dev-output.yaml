summary: |
  Implemented TASK-EAR-084 Round 2 Option 1 in Games-Labs-Order only.

  recoverExchangeOrder still recovers only durable StatusFailed exchange orders.
  Fixed-package recovery is unchanged: it recomputes the deterministic package
  coin reward from PackageSnapshot, replays Wallet with order:<orderID>, settles
  through the status-guarded failed -> fulfilled compare-and-set, and returns a
  spent-only Replayed response.

  Custom failed exchange recovery now stops before any live-rate pricing or
  wallet movement. After unmarshalling PackageSnapshot, code_name == "custom"
  returns errormsg.ErrorInvalidRequest("custom exchange order requires manual
  recovery because its coin amount is not persisted"). It does not call
  priceCustomExchange, ExchangeDiamondsToCoins, or settlement.
