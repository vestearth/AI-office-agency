    reason: >-
      Split out of TASK-EAR-289 under TASK-EAR-284 decision D6, which asked
      that publisher work be divided by readiness rather than by domain.
      TASK-EAR-289 bundled Game with Missions. Game already publishes
      player.activity and needs a small additive change; Missions does not
      publish it at all and carries a design problem none of the other five
      publisher tasks have — it is the only service that would publish the
      stream it already consumes, so a mission-progress event would re-enter
      its own matcher. Keeping the two together would have hidden a real
      design question inside a task whose other half is routine.
      Measured rather than assumed before splitting: Missions has five
      non-test references to PlayerActivityEvent and every one is a read.
      It does publish admin_action already, so this is adding a stream to an
      existing lane, not standing up publishing from scratch — the same
      correction that applies to TASK-EAR-287.
