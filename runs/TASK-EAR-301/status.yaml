  description: >-
    Publish post-commit mission events for the monitoring projection. Split out
    of TASK-EAR-289 by TASK-EAR-284 decision D6; see task.md.
    RESOLVE THE LOOP RISK BEFORE WRITING CODE. Missions is currently a
    player.activity CONSUMER — all five non-test references are reads
    (internal/services/activity_match.go, weekly_match.go, and the daily
    activity consumer). If it publishes onto the same stream it consumes, a
    mission-progress event re-enters its own matcher. Choose a separate
    routing key the matcher does not bind, or filter by source_service on the
    consume side, or another separation the design justifies — and prove it
    with a test that publishes a mission event and asserts the matcher does
    NOT process it. That test is the acceptance criterion that matters here;
    the rest is routine.
    The RabbitMQ wiring already exists — Missions publishes admin_action from
    internal/handlers/adminmission/grpc/audit.go — so reuse that lane rather
    than standing up a second publisher path.
    The mission Player Log page is the most complex of the eight: it renders
    THREE distinct row types (daily/weekly with subtasks, monthly with streak
    and check-in counts, event with a progress title), so the contract must
    distinguish them rather than flatten them. Do not publish an actor; the
    admin-driven case arrives from AdminActionEvent and the projection reads
    both streams.
