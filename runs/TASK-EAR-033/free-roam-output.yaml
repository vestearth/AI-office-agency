# ───────────────────────── Lane B / B2 (frontend wiring) ─────────────────────────
b2_frontend:
  summary: |
    Wired the Daily + Settings mission admin pages to the B1 live endpoints in
    Games-Labs-backoffice (Nuxt3/Vue3/TS), mirroring the Lane A weekly wiring
    style exactly. Left UNCOMMITTED (advisory lane).
  files_changed:
    - app/composables/useAdminMissionApi.ts   # +DailyPlan/DailyPlanDetail/DailyPlanFullPayload types; getDailyPlanDetail/saveDailyPlanFull/listDailyPlansBoard; getMissionConfig/updateMissionConfig
    - app/pages/admin/manage/missions/daily/edit/[id].vue  # onMounted getDailyPlanDetail -> form; onUpdate -> SaveDailyPlanFull round-trip; mock fallback on fetch error
    - app/pages/admin/manage/missions/index.vue            # DAILY tab -> listDailyPlansBoard() split past/today/upcoming (mirrors weekly tab); mock seed fallback
    - app/pages/admin/manage/missions/edit/index.vue       # Schedule tab Value Bonus+Currency <-> mission_config completion-bonus triplet (GET onMounted / PUT on update)
  daily_load_to_form:   # GetDailyPlanDetail data -> DailyMissionPlanDay
    id: data.plan.id
    date: data.plan.plan_date
    time: data.plan.plan_time
    weekday: data.plan.title || data.group.name
    status: data.plan.status (ongoing->today, past->past, else upcoming)
    tasks: data.activities[] -> DailyMissionTask {id,name,typeLabel(condition_type),pool=[],minValue=threshold+unit,subReward=reward.amount,subRewardUnit=reward.currency}
    totalReward: data.group.reward.amount (fallback sum of activity rewards)
    totalRewardUnit: data.group.reward.currency
    bonus: data.bonus.reward.amount -> store.bonus; data.bonus.reward.currency -> bonusCurrency
  daily_form_to_payload:  # SaveDailyPlanFull body
    plan: { id: loadedPlanId||daily-<rowId>, plan_date: store.date(ISO, today fallback), plan_time: store.time HH:MM, title: store.weekday, active: true }
    group: { id: <planId>-grp, name: store.weekday, reward: {amount: store.totalReward, currency: COIN/DIAMOND}, active: true }
    activities: structured editor tasks -> {id,name,condition_type,threshold,game_type/spend_currency,reward,sort_order=index,active}; game_turnover(pool) deferred -> skipped (no daily pool)
    bonus: { enabled: store.bonus>0, reward: {amount: store.bonus, currency: from bonusCurrency} }
  settings_config_mapping:  # GET/PUT /api/v1/admin/missions/config (PUT per contract)
    daily_completion_bonus_enabled:  bonusEnabled (&& valueBonus>0 on save)
    daily_completion_bonus_reward:   scheduleStore.valueBonus
    daily_completion_bonus_currency: scheduleStore.currency (Point/Coin->COIN, Diamond->DIAMOND)
    note: Mission-template tab + day-selection/time-settings have NO config contract -> left preview-only/mock. Same triplet shared with Daily page bonus editor (one mission_config singleton).
  pool_mismatch_honored: DailyMissionTask.pool[] always [] for daily (no daily_activity_pool_entries table); not fabricated; UI degrades gracefully (board summary + form tasks render with empty pool).
  unsatisfied_contract_fields:
    - daily_mission_daily_cap: present in contract MissionConfig but no FE control exists for it on the Settings page; not surfaced (no field to bind).
    - group.icon_key/image_url/deeplink/cta + activity media/scope fields: not in the DailyMissionPlanDay/Task form model; not sent (parity with weekly wiring).
  typecheck:
    command: npx nuxi typecheck
    baseline_errors: 30   # pre-existing, unrelated files (matches Lane A)
    after_errors: 30      # zero new errors in the 4 touched files
  committed: false        # advisory lane — operator commits
