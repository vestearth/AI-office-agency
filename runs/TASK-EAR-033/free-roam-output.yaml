---
summary: |
  Lane B / B1 (backend contract) complete. Added admin orchestration endpoints
  so the Backoffice Daily mission page can load and atomically save a day plan in
  its own DailyMissionPlanDay mental model, mirroring the weekly /full pattern
  exactly.

  New: GetDailyPlanDetail (GET /api/v1/admin/daily/plans/{plan_id}) and
  SaveDailyPlanFull (POST /api/v1/admin/daily/plans/full), plus the supporting
  daily-plan board CRUD (list/upsert/update/activate/deactivate/delete).
  SaveDailyPlanFull persists tasks + group + ordered membership + plan +
  completion bonus in ONE transaction (atomic, rolls back on any error).

  Reuse decision: daily_activities / daily_activity_groups /
  daily_activity_group_members already exist and persist, but had NO calendar
  anchor. The FE day model needs weekday/date/status, exactly what weekly_plans
  gives weeks. So a minimal new table daily_plans (migration 034) was added,
  mirroring 029_create_weekly_plans.sql but anchored on plan_date DATE (+ a
  display-only plan_time) instead of week_start. Status (past/ongoing/upcoming)
  is derived at read time, never stored. The daily completion bonus reuses the
  existing mission_config.daily_completion_bonus_* columns (migration 021) — no
  new bonus storage.

  Settings/Default: verified (read-only) that GET/PUT
  /api/v1/admin/missions/config (the mission_config singleton) is sufficient.
  No new config endpoints added. Field mapping documented for B2; the daily
  completion bonus triplet is shared between the Daily page's bonus editor and
  the Settings page.

  One shape mismatch vs weekly flagged for B2: weekly activities carry a
  random-selection pool[]; daily activities have no pool table, so DailyMissionTask.pool
  is always empty for daily. Not added (out of scope / absent from daily schema).

  Stack gotchas honored: SaveDailyPlanFull/Update use PUT-or-POST (full save
  binds POST at the gateway, handler also accepts PUT; plan update is PUT);
  reward is always {amount,currency} (never a bare number) to avoid the gateway
  DiscardUnknown _1-suffix drop.

  Proto: added 8 daily plan RPCs to shared-lib adminmission.proto and
  regenerated via `make buf` (buf format + buf generate, local plugins). The
  api-gateway needs NO code change — it auto-registers the new RPCs through the
  existing RegisterAdminMissionsServiceHandlerFromEndpoint.

  Verification: shared-lib `go build ./...` passes. Games-Labs-Missions builds
  with the pinned remote shared-lib AND (via a temporary, now-reverted local
  replace) against the regenerated shared-lib; `go vet ./internal/...` clean;
  tests pass for repositories, services, models, handlers/adminmission/http
  (incl. new atomic-tx + rollback tests + DeriveDailyPlanStatus test). api-gateway
  also compiles against the regenerated shared-lib (temp replace, reverted).

  Left UNCOMMITTED per Claude advisory lane. Operator must: (1) commit shared-lib
  + tag/publish, (2) bump Games-Labs-Missions and api-gateway go.mod to the new
  shared-lib pseudo-version, (3) run migration 034, (4) commit Missions. B2 (FE)
  depends on this contract (runs/TASK-EAR-033/daily-admin-contract.md).
blockers: []
decision:
  action: fix
  details: >-
    Add daily plan-board orchestration (GetDailyPlanDetail + atomic
    SaveDailyPlanFull) + minimal daily_plans calendar-anchor table, mirroring
    weekly. Reuse existing daily activities/groups/members CRUD and the
    mission_config completion-bonus singleton. Confirm Settings rides existing
    mission_config GET/PUT — no new config endpoints.
