next_action:
  agent: dev
  description: >-
    UNBLOCKS TASK-EAR-262 — do this first, then 262 can merge. Move
    Games-Labs-User's four wallet calls off Wallet's player-facing gRPC
    surface and onto Wallet's internal HTTP mux, as Order and Missions
    already do.
    WHY: TASK-EAR-262 makes walletpb's gRPC handlers resolve identity from
    gateway metadata (owner-scoped) or require staff. Games-Labs-User calls
    that surface via internal/adapters/walletadt/adapter.go, which has NO
    metadata handling at all — grep for "metadata" in that file returns
    nothing, while its sibling gameadt/adapter.go:42-48 has
    forwardOutgoingContext doing exactly that copy. So the moment 262 ships,
    User's calls arrive with no identity and fail closed.
    THE FOUR CALLS, all in internal/core/services/usersvc/service.go:
    - DebitDiamond — display-name change (~:210), VIP purchase (~:534)
    - CreditDiamond — refund compensation (~:219, :224, :539)
    - RewardPackage — VIP level reward (~:466)
    - CreditPoints — VIP level reward (~:480)
    SEVERITY IS FEATURE BREAKAGE, NOT FUND LOSS — I verified this rather
    than taking the implementing agent's word. Both flows are
    `if err := DebitDiamond(...); err != nil { return err }`, so the debit
    fails FIRST and the function returns early: nothing is debited and no
    refund is owed. What breaks is display-name change, VIP purchase and VIP
    level rewards. Say that accurately to anyone on call; the earlier
    "players will lose money" framing was wrong.
    THE FIX: route those four through Wallet's internal HTTP mux. User
    already has WALLET_HTTP_ADDR wired, and the mux is the lane Order and
    Missions use for exactly this.
    ⚠️ GAP TO CLOSE AS PART OF THIS: the mux has /wallets/debit,
    /wallets/credit and /wallets/reward-package but NO credit-points route.
    Add it, matching the existing handlers' shape and error contract.
    EXPLICITLY REJECTED ALTERNATIVE, do not revisit without a reason:
    forwarding the player's metadata from User. It would fail the staff check
    anyway on the mint RPCs, and it would reintroduce exactly the defect
    class TASK-EAR-262 removes — a caller-supplied identity deciding whose
    wallet moves.
    Regression test seen RED first per call path. Verify the four User flows
    end to end against a Wallet build that INCLUDES TASK-EAR-262, not against
    current staging — testing against the unfixed Wallet would pass for the
    wrong reason.
