next_action:
  agent: reviewer
  description: >-
    PHASE 1 IMPLEMENTED — Games-Labs-Logs#3 (d91a26e) targets staging.
    Three things shipped: (1) the consumer now supervises its own
    connection — capped exponential backoff 1s..30s honouring ctx, plus
    NotifyClose so a dropped connection is detected with a reason instead
    of inferred from a silently closed delivery channel; previously any
    dial/channel/consume failure or channel close ended the goroutine for
    good, silently, because main starts it once with a bare `go`.
    (2) insert-failure requeues are now bounded per delivery (keyed on
    request id, message id as fallback) then dropped — Nack(false, true)
    used to requeue forever, making a poison payload a hot loop.
    (3) retention, which did not exist in any form: a batched pruner over
    logs / provider_inbound_events / provider_outbound_events driven by
    LOGS_RETENTION_DAYS (default 30, <=0 disables), _INTERVAL (6h) and
    _BATCH_SIZE (5000), all added to ecs/env.names so the values actually
    reach the task. Batched DELETE was chosen over declarative
    partitioning deliberately — the tables hold live data and this service
    replays every migration on every boot, so an in-place conversion is a
    risky boot-time operation; the reasoning is in the code and
    partitioning is worth its own task with a maintenance window. No
    migration was needed because the created_at indexes already exist.
    Also added the repo's first tests (6, via a narrow execer interface so
    the batching loop runs without a database) and rewrote the README,
    which still described a health-only service and had nearly caused this
    working pipeline to be rebuilt.
    AFTER MERGE: confirm from the deploy that the consumer logs a clean
    start, then re-run the two count/max queries and check for rows newer
    than 2026-07-27. Note the reconnect fix does not prove the gap was
    caused by the reconnect bug — that still needs Provider traffic and
    the Logs task logs for 07-27..07-31.
    PHASE 2 (admin action audit) has not started: schema + async ingestion
    + instrumenting admin write paths (e-voucher grant, status reset, VIP
    level set at minimum). An admin write must never fail or slow because
    Logs is unavailable. Reuse this phase's pruner and repository seam.
