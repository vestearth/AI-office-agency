    async ingestion + instrumenting admin write paths (e-voucher grant,
    status reset, VIP level set at minimum). An admin write must never
    fail or slow because Logs is down.
    Any new migration must be idempotent — Logs replays every file on boot.
    READ THE CORRECTION at the top of task.md before anything else. This
    file was first written claiming player.activity.v1 is persisted nowhere
    and that this is why the Player Detail Game tab has no data. Both are
    false: round_lifecycles (Games-Labs-Game, migrations 007+021) already
