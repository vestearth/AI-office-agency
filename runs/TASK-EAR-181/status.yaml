    at: '2026-07-31'
    reason: >-
      Operator merged and deployed all three PRs; verified the outcome from
      the API rather than assuming, and the Logs deploy had FAILED — ECS's
      circuit breaker rolled it back after 18 minutes ("Deployment not found
      after stabilization"), leaving staging on the previous image. shared-lib
      and User were green.
      Root cause was mine: ecs/build-env-json.sh injects EVERY name listed in
      ecs/env.names into the task definition, with an EMPTY value for any the
      workflow does not define. The retention variables were the first
      non-string envconfig fields in this service, so envconfig failed to parse
      "" into an int, config.New() log.Fatalf'd, and the container exited
      before serving. Every pre-existing variable there is a string, which
      tolerates empty — that is why the trap had never fired.
      Reproduced the crash locally against the real config package BEFORE
      fixing, then made the fields strings parsed in their accessors with
      defaults on empty or malformed input, keeping 0 meaningful (it disables
      pruning). 4 regression tests. Games-Labs-Logs#4 -> staging (61d210d2).
      GENERALISES: adding any non-string env var to an ecs/env.names file will
      kill that container on deploy unless the workflow also sets a value —
      true for all eight other services, worth remembering.
      Also confirmed shared-lib#33 merged as a merge commit, not a squash, so
      b3198f8 is an ancestor of main and the pins in Logs and User are valid
      rather than orphaned. Claude advisory lane.
