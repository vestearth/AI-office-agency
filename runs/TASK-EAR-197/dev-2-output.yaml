summary: |
  Root cause confirmed in source and fixed in Games-Labs-User only.

  GetVipLevel reaches configured VIP games through the game-api admin RPC
  GetLevelGameGroupByLevel, which is staff-gated by
  auth.RequireStaffGRPC(ctx, PERM_GAME_MANAGEMENT). The adapter used
  forwardOutgoingContext, so an authenticated player's own metadata (role=user)
  was copied onto that call; the staff gate rejected it, the adapter turned the
  non-200 status into an error, and GetVipLevel discarded that error under
  `if err == nil`. The public response therefore stayed HTTP 200 with
  data.games: [] — indistinguishable from a level with no configured games.
  The trusted fallback identity in forwardOutgoingContext only applies when the
  incoming context has no metadata, which is exactly the case an authenticated
  request is not.

  Two scoped changes:
  1. gameadt: new private internalGameAdminContext used by GetLevelGamesByLevel
     alone. It sends role=admin, userid=user-api, access=internal,
     permissions=GAME_MANAGEMENT (the permission this RPC declares) and never
     forwards caller metadata. forwardOutgoingContext and every other adapter
     method are untouched, so the admin lane still travels with the caller's own
     staff identity.
  2. usersvc.GetVipLevel now returns the adapter error instead of swallowing it.
     A level whose configured games cannot be read is no longer reported as a
     level without games. The Game RPC's staff authorization is unchanged.

  Deliberately unchanged: s.game == nil (GAME_API_URL unset) still yields a
  successful detail with no games. That is a boot-time configuration state,
  logged by cmd/main.go, not a runtime failure; staging has GAME_API_URL set
  (.github/workflows/staging.yml:106), so it is not the observed cause.

  Behavior change to flag for review: a game-api outage now fails the whole
  public VIP detail response (errormsg.ServiceErrorStatus -> code 1000) where it
  previously degraded to an empty games list. That is what the task asked for,
  but it moves a partial-render into a screen-level error for mobile.

