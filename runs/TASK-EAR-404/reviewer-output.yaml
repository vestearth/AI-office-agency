blockers:
  - Start-here must use a validated, operator-reviewable target Git repository instead of the multi-repository workspace root.
  - Claude/Codex usability must include login/adapter probing; login failure cannot remain a post-launch generic failure only.
  - Claude needs restricted stream-json execution and Codex needs JSONL without bypassing the Git repository check.
  - cursor-agent --trust and unrelated durable-history/knowledge work must not be treated as TASK-EAR-404 acceptance.
  - Native Windows task opening/process-tree behavior and the open-task portability fix still require Windows evidence.
  - The full server suite must pass; ev-005 currently records 2 failures out of 246 tests.
