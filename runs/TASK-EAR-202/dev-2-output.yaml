summary: |
  Gates 2–3 complete after shared-lib publish
  v0.0.0-20260803133159-d38e2646c33c (merge d38e264 / PR #36).

  Gate 2 (Games-Labs-Missions, from staging): bumped shared-lib; added
  Server.ClaimWeeklyCompletionBonus bridging to
  HTTP.Weekly.ClaimWeeklyCompletionBonus with POST
  /api/v1/missions/claim-weekly-completion-bonus and StructToJSONBody;
  extended weekly_bridge_test.go with body passthrough coverage. No
  business-logic, Daily, or replace changes.

  Gate 3 (api-gateway, from staging): same shared-lib pin; added
  gateway/missions_routes_test.go proving the Weekly POST resolves on a
  grpc-gateway mux (adminwallet_routes_test pattern); added Postman
  "Claim weekly completion bonus" with user_id-only body and
  credited/already_claimed/incomplete notes. Did not modify gateway/grpc.go.

  Gate 4 (deploy/smoke/live wallet QA) not executed — needs operator
  authorization. Consumers committed and PRs opened to staging.

