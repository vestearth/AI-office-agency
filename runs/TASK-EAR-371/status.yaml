  - phase: pending -> pending
    agent: pm
    at: '2026-09-21'
    reason: >-
      Split out of TASK-EAR-370 track B at operator request because this slice
      is unusually well bounded and directly visible: the source events are
      already in ClickHouse, no contract changes, and the result lands on a
      page that ships today. Verified live on staging 2026-09-21 that
      store.purchase.settled carries userId, store.purchaseId, store.packageId,
      store.packageName, store.storeType, store.amountPaid, store.currency,
      store.complimentary and the coin and diamond asset amounts, so every
      figure the package report renders is derivable - 128 such events exist on
      staging. Recorded constraints: the events table has a 365-day TTL so any
      published total is a rolling 12-month figure and must not be presented as
      lifetime; currency is per row so THB rows must not be summed with others;
      and complimentary and non-order store types need an explicit rule before
      they reach a revenue figure. Numbered 371: 370 was the last taken. Claude
      opened the run and stops here per the post-EAR-337 lane rule. Claude
      advisory lane.
  - phase: pending -> in_review
    agent: dev
    at: '2026-09-21'
    reason: >-
      Implemented in Games-Labs-Logs PR #36 on
      task/TASK-EAR-371-package-measures, based on origin/staging. Approach
      changed from this run's recommendation: the paid amount is read with
      JSONExtract rather than added as typed columns with a backfill, because
      the same reader already does exactly that for package_name, it needs no
      migration, and it works on all history. Rules locked and covered by
      tests: a complimentary grant counts as a purchase but never as revenue;
      total_purchase sums THB rows only; a package mixing currencies reports an
      empty currency rather than claiming one; only created_at is sortable; a
      reader without the projection returns Unavailable rather than an empty
      list. Three findings came out of running it rather than reading it.
      First, the monitoring_player_events DDL cannot create on ClickHouse 23.8
      or 24.8 - a DateTime64 TTL expression is rejected with code 450 - so a
      fresh environment cannot boot and every internal/monitoring integration
      test has been failing at setup; fixed with toDateTime() in the same PR,
      which the PR offers to split out. Second, if(uniqExact(currency) = 1,...)
      is rejected by ClickHouse as an aggregate inside an aggregate; it
      compiles and would pass a mocked test, and was caught only against a real
      server. Third, this repo's main no longer contains the monitoring code at
      all - staging and prod are the live branches - and the working checkout
      sat on another lane's task/TASK-EAR-200 branch, so the work was moved
      onto origin/staging without touching that lane. Evidence: full suite
      green against a real ClickHouse 23.8 on a database created from scratch,
      including the three integration tests that could not run before.
      Behaviour against staging's own data is unverified until this deploys.
  - phase: in_review
    agent: dev
    at: '2026-09-21'
    reason: >-
      Split the ClickHouse TTL DDL fix out of PR #36 into its own PR #37 at
      operator request, since it is unrelated to the measures and unblocks the
      whole internal/monitoring package. Proved it both ways on a database
