  tests: pass
  details: >-
    go build ./... exit 0. go test ./... -count=1 -> 11 packages ok, exit 0,
    no failures; the new suites (3 model subtests, 3 repo sqlmock tests, 6
    service spend-prop tests) all pass. Determinism spot-check: the previously
    flaky TestEventServiceListEventsReturnsActiveAndUpcomingBuildsStatus ran
    12/12 green with -count=1. go vet ./internal/models ./internal/repositories
    ./internal/services exit 0. gofmt -l flags one file
    (internal/services/event_service.go) — cosmetic field-alignment only,
    non-blocking and not CI-gated.
findings:
  - id: AC1
    criterion: Contract decision recorded and promoted to a knowledge-base ADR if durable.
    result: pass
    blocking: false
    note: >-
      ADR-0008 "Event Spend Prop Randomly-by-System Resolution" committed to
      knowledge-base (5cae0c5); the locked B-hybrid decision is also captured in
      runs/TASK-EAR-071/task.md and pm-output.yaml. ADR matches the code as
      built.
  - id: AC2
    criterion: >-
      Sentinel resolves at runtime to exactly one concrete item from {Special
      Item, Special Pass, Limited Avatar}, excluding the sentinel.
    result: pass
    blocking: false
    note: >-
      models.SpecialItemCandidates() expands the sentinel/empty to
      DefaultSpecialItemCandidates and a concrete value to a single-entry pool;
      resolveSpendPropSelection picks uniformly via the pickIndex seam.
      TestSpendProp_SentinelExcludedFromResolution asserts every pick index
      yields a concrete item, never the sentinel; model
      TestDefaultSpecialItemCandidates_ExcludesSentinel guards the invariant.
      Candidate set equals Backoffice dailyMissionSpecialItemOptions
      (app/data/mock.ts:1247) minus the sentinel, same order.
  - id: AC3
    criterion: >-
      Persisted per user per surface, stable on re-read (no re-roll), and
      independent across daily/weekly/event.
    result: pass
    blocking: false
    note: >-
      Ledger PK (surface, scope_id, user_id); ResolveSpecialItemSelection's
      ON CONFLICT DO UPDATE SET resolved_ref =
      mission_special_item_selections.resolved_ref RETURNING resolved_ref
      returns the pre-existing ref on conflict (immutable) and converges under
      concurrent first-touch. TestSpendProp_JoinResolvesImmutableAndSurfaces
      (re-roll cannot change the stored/surfaced value),
      _CrossSurfaceIndependence (a seeded daily selection under the same
      scope_id+user does not leak into the event roll and is not mutated),
      _PerUserSelection, and repo TestResolveSpecialItemSelection_
      ConflictReturnsExisting all cover this.
  - id: AC4
    criterion: Concrete (non-random) selections behave as a fixed single value.
    result: pass
    blocking: false
    note: >-
      SpecialItemCandidates("Limited Avatar") is a single-entry pool;
      TestSpendProp_ConcreteCategoryResolvesToItself confirms pass-through
      regardless of pickIndex.
  - id: AC5
    criterion: Migrations additive and reversible; existing daily/weekly pool tables untouched.
    result: pass
    blocking: false
    note: >-
      migration 042 is CREATE TABLE/INDEX IF NOT EXISTS only, correct next
      number (041 is prior), no ALTER/DROP against existing tables. The runner
      (migrations/run.go) is forward-only (embed + sort-by-name + Exec once, no
      down files), so "reversible" reads as additive/non-destructive/idempotent,
      which holds. No migration-count assertion tests exist to update.
  - id: AC6
    criterion: Tests cover sentinel exclusion, per-user stability, cross-surface independence.
    result: pass
    blocking: false
    note: >-
      Covered by the model, repo (sqlmock), and service spend-prop suites listed
      above; 12 new tests total. Repo tests assert the exact upsert SQL shape and
      the conflict-returns-existing immutability.
  - id: AC7
    criterion: go build ./... and go test ./... pass in Games-Labs-Missions.
    result: pass
    blocking: false
    note: >-
      Verified locally: build exit 0; full suite green with -count=1 (not
      cached); deterministic on the previously-flaky test (12/12).
  - id: CODE-1
    area: internal/services/event_service.go (EventService struct, ~line 65)
    severity: suggestion
    blocking: false
    note: >-
      gofmt -l flags this file: inserting the pickIndex field with a doc comment
      broke the gofmt alignment group for the preceding wallet/repo/now fields.
      Cosmetic only; go vet passes and no CI job runs gofmt (staging.yml /
      deploy.yml are build+deploy only). Recommend a trivial `gofmt -w
      internal/services/event_service.go` follow-up so the branch is gofmt-clean,
      but this does not block approval or the staging promotion.
  - id: CODE-2
    area: internal/services/event_service.go (resolveSpendPropSelection / pick)
    severity: suggestion
    blocking: false
    note: >-
      Belt-and-braces observation (not a defect): there are two independent
      guards against rand.Intn(0) — SpecialItemCandidates never returns an empty
      slice, and resolveSpendPropSelection early-returns on len(candidates)==0.
      Uniform pick via injected pickIndex (rand.Intn in prod) is correct;
      s.pick() also nil-guards to rand.Intn. No change requested.
  - id: CODE-3
    area: internal/services/event_service.go (GetEvent detail surfacing)
    severity: info
    blocking: false
    note: >-
      GetEvent's resolve-on-read fallback (when joined but no ledger row, e.g. a
      user who joined before this feature shipped) issues the same immutable
      upsert, so a late first read still cannot re-roll a genuinely
      already-resolved user. Gating on HasJoinedMissionEvent rather than
      card.Joined is correct: spend-prop events are config-only and never set
      card.Joined. Pre-join returns empty (TestSpendProp_NoResolutionBeforeJoin).
  - id: CODE-4
    area: internal/services/event_service.go (JoinMissionEvent fail-closed)
    severity: info
    blocking: false
    note: >-
      A resolution error fails the join (fail-closed). Acceptable for a
      reward-integrity path — better to fail the join than to admit a user with
      no locked reward — and resolution runs only after a successful
      s.repo.JoinMissionEvent, and no-ops for non-spend-prop events. Accepted.
  - id: FLAKE-1
    area: internal/services/event_service_test.go (fakeEventRepo.ListMissionEvents)
    severity: info
    blocking: false
    note: >-
      The flake fix is genuine and test-only. listConfigs delegates to
      repo.ListMissionEvents WITHOUT re-sorting when a repo is present, trusting
      the real query's ORDER BY sort_order, start_at, id (event_repo.go:25). The
      old fake iterated a Go map, so resp.Events[0] (asserted == "event-active")
      was nondeterministic. The fix sorts the fake by the same key; confirmed
      12/12 deterministic on HEAD. No production code involved.
