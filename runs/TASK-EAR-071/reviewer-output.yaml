summary: |
  Reviewer lane (Claude advisory) for TASK-EAR-071: Event Spend Prop "Randomly
  by System" per-user resolution on Games-Labs-Missions
  feature/TASK-EAR-071-event-spend-prop-random (commit aa520f8, branched from
  staging). Reviewed the full staging...HEAD diff, ADR-0008, and the dev
  handoff; ran go build ./... (pass) and go test ./... -count=1 (11 packages ok,
  exit 0, deterministic). All seven acceptance criteria are met. The immutable
  upsert (INSERT ... ON CONFLICT DO UPDATE SET resolved_ref =
  mission_special_item_selections.resolved_ref RETURNING resolved_ref) correctly
  returns the pre-existing ref on conflict, so the roll is immutable and
  concurrent first-touches converge on one value; the DO UPDATE (vs DO NOTHING)
  is deliberate so RETURNING always yields a row. Lazy-on-join resolution
  fail-closes (a resolution error fails the join) which is acceptable for a
  reward-integrity path, and it no-ops for non-spend-prop events via
  SpendPropSpecialItemCategory() returning isSpendProp=false. GetEvent gates the
  resolved item on HasJoinedMissionEvent (not card.Joined) — correct, because
  spend-prop events are config-only and never populate card.Joined; pre-join
  returns empty, and the resolve-on-read fallback stays immutable through the
  same upsert. The pickIndex seam is uniform and rand.Intn(0) is unreachable
  (candidates always >= 1). Both new interface methods are implemented by the
  real *MissionRepository (build proves satisfaction) and by BOTH test fakes
  (configEventRepo, fakeEventRepo). DefaultSpecialItemCandidates {Special Item,
  Special Pass, Limited Avatar} exactly equals the Backoffice
  dailyMissionSpecialItemOptions (app/data/mock.ts:1247) minus the sentinel,
  same order. Migration 042 is additive/idempotent (CREATE TABLE/INDEX IF NOT
  EXISTS), correct composite PK (surface, scope_id, user_id) + user index, and
  touches no existing table; the runner (migrations/run.go) is forward-only, so
  "reversible" reads as non-destructive, which holds. The pre-existing flake fix
  is genuine and test-only: listConfigs delegates to repo.ListMissionEvents
  without re-sorting when a repo is present, so the old map-iterating fake made
  resp.Events[0] nondeterministic; the fix sorts the fake to mirror the real
  query's ORDER BY sort_order, start_at, id (event_repo.go:25) — confirmed
  deterministic 12/12 on HEAD. Scope discipline is clean: only resolution +
  surfacing are wired, spend-progress accumulation is left untouched (no
  half-wiring). One NON-BLOCKING nit: gofmt -l flags internal/services/
  event_service.go (struct-field alignment in EventService broken by the
  pickIndex comment); not CI-gated (staging/deploy workflows run no gofmt/vet/
  test), so it does not block, but a clean branch should run gofmt -w.
  Verdict: approved.
review_verdict: approved
