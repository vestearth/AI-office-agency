      Scope came in at three endpoints but only three of the four listed
      holes needed code. UpdateOrderStatus is now staff-gated
      (auth.RequireStaffGRPC with PERM_ORDER_MANAGEMENT), GetOrder is
      owner-scoped, and CreateOrder/ValidateCoupon take identity from
      callerUUID(ctx) instead of the request body — matching the
      ListOrders pattern TASK-EAR-180 established, with the user_id field
      left on the wire for client compatibility.
      RedeemRedemptionItem needed NO change: already fixed by ba7e48d
      (2026-08-12), incidental to unrelated redemption-eligibility work,
      after TASK-EAR-180's findings.md was written. Verified by git
      blame/git log -S rather than trusting the stale findings line — the
      same "re-verify before scoping" lesson that re-scoped TASK-EAR-179.
      Worth someone confirming it was intentional, since its commit
      message cited no EAR- task.
      Staff-vs-owner call on UpdateOrderStatus, recorded as a doc comment
      at grpc.go:223-237 as the task required: staff-only, not
      owner-scoped. Payment confirmation already has its own owner-scoped
      RPC (ConfirmPayment, TASK-EAR-185) and fulfilment is service-driven,
      so a player has no self-service reason to set status directly; the
      reachable states include StatusRefunded, which publishes a
      spend-reverse event, so a player setting it could fabricate a refund
      — worse than the IDOR itself. A player token is rejected even
      against their own order.
      Verification: regression tests seen RED first for all four handlers
      (8 failing assertions), GREEN after — 10 tests pass. I re-ran the
      suite myself rather than accepting the report: go build, go vet, and
      go test ./... all clean. Also independently checked the
      cross-service risk the report did not raise, since CreateOrder and
      ValidateCoupon changed whose identity they trust: no other service
      calls these three RPCs (Missions talks to WebOrderService for
      catalog reads; Wallet's orderadt calls only GetOrderPackage), and
      admin uses the separate adminorderpb, so the GetOrder owner check
      does not affect backoffice.
      Four pre-existing ValidateCoupon tests in coupon_contract_test.go
      were updated to inject identity via metadata — their old form
      asserted the exact defect being closed. No test weakened or skipped.
      STILL OPEN: live cross-user denial through api-gateway on staging,
      which the acceptance criteria require and unit tests do not satisfy.
