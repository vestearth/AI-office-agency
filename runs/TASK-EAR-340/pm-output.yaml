task:
  id: TASK-EAR-340
  title: Player list Lifetime GGR tooltip
  short_name: player-list-ggr-tooltip
  parent: TASK-EAR-320
  type: feature
  workstream: frontend
  priority: medium
  created_at: '2026-09-09'

scope:
  target_services:
    - service: Games-Labs-backoffice
      reason: The live admin player list is the only surface that shows the Game-backed GGR number under the Figma label Lifetime GGR.
  affected_files:
    - path: Games-Labs-backoffice/app/components/PlayersListTable.vue
      action: modify
      description: Keep the Lifetime GGR label; add an info control with a captured-rounds-only hint.
    - path: Games-Labs-backoffice/tests/playersGamesTableHeadUi.test.mjs
