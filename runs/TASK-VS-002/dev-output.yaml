summary: |
  Implemented a Redis-backed rolling 60-second live KBank verification attempt
  budget in slip-system, enforced immediately before every outbound verify HTTP
  request including retries and post-401 attempts. Redis failure stops live
  verification attempts. slip-api queue workers now honor gRPC RetryInfo and
  synchronous callers receive Retry-After. OAuth requests remain outside this
  verification budget pending bank contract confirmation. No new Go dependency,
  protobuf change, migration, or deployment was made. Commits ed2415c
  (slip-api) and 12ee5bb (slip-system) were pushed and PRs opened to staging.
