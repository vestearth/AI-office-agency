      Requested and received a composition breakdown (condition_type x
      is-a-game-child x touched-again-after-creation) rather than generalizing
      from the 20-row sample. Result: 328 of 352 Daily orphans (93%) are
      TURNOVER_GAME children - 284 touched again after creation, 44 written
      once and immediately orphaned. The admin-deselection pattern this run
      opened with accounts for only 12 rows (SPEND_DIAMOND_AMOUNT, both
      sub-buckets). 3 rows carry a NULL condition_type - noted as a minor,
      unrelated anomaly, not chased further.
      Traced the actual driver in source before writing anything up.
      selectGameIDsForPeriod (schedule_generator.go:94) is NOT random - it
      ranks the active game pool by sha256(periodKey + gameID) and takes the
      top `total`, so a fixed pool and a fixed Total Game always select the
      same games for a given date; nothing rotates on its own. But
      RegenerateDailyDue (schedule_generator.go:586) reruns this for every
      future date, every time it runs, against whatever the CURRENT Total Game
      and active-game pool are. When either changes - an admin edits Total
      Game, or a game is activated/deactivated in the Game service catalog -
      the ranking shifts for every future date simultaneously on the next
      pass, and daily_activities rows being permanently undeletable means
      every game that falls out of the new top-`total` becomes a permanent
      orphan at that instant. This matches the observed per-date timestamp
      clusters exactly, and explains the 284-vs-44 split as "how many
      regeneration cycles a game's ranking survived before falling out."
      This is a materially different conclusion from what was reported to the
      operator one turn earlier (Total-Game-reduction as a discrete admin
      event) - corrected before writing it into task.md rather than left
      standing, once the deterministic-not-random nature of the ranking
      function was actually checked instead of assumed from the earlier g4-g14
      pattern alone.
