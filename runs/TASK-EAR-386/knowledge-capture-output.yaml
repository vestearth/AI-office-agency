note_patch: |
  The monitoring Mission Monthly tab is backed by GET /api/v1/admin/monthly/report
  (shared-lib PR 91, Missions PR 136, api-gateway PR 87, Backoffice PR 167).
  Rows are check-in campaigns. monthly_challenges remains a per-player record
  and is not this board. Months with no campaign are absent. completed_players
  is unset when the campaign has no enabled milestone, and the tab shows a dash
  there. Empty complete ledger totals are zero. An authenticated admin-dev read
  on 2026-10-09 matched the API, including October 2026 as -/0 and a header of
  -/11 because one campaign had no milestone. Monthly player detail is not part
  of this read.
