  description: >-
    Wire the grant_pass and complete_mission scopes of the player audit
    modal to GET /api/v1/admin/audit-events, reusing TASK-EAR-208's
    composable. Every field shape in task.md was observed in a real
    staging row, not inferred. Two traps recorded there: expires_at is a
    Unix epoch integer, not RFC3339, so the FE must format it; and
    pass_name can legitimately be absent for legacy pass slugs, in which
    case render a dash and never fall back to pass_type, which would show
    a slug as if it were a product name. The mission scope renders
    after.mission_title when present, otherwise a label for
    mission_scope — daily_all, turnover_streak and monthly_challenge have
    no title and never will, because they are not individual missions.
    E-Voucher is deliberately excluded, blocked on TASK-EAR-221. Preserve
    the designed UX, data source only. PR only, no merge — backoffice main
    merge is a real deploy.
