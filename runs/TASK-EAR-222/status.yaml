    reason: >-
      Delivered as PR #78. Two findings worth keeping. First, a trap the
      spec did not have: `actions` must be sent as REPEATED query params —
      the comma-joined form returns total 0 silently, with no error, which
      would have looked like "this player has no rows". Second, the smoke
      earned its place as an acceptance criterion by catching a bug the 37
      new unit tests could not: `items.map(normalizePassAuditRow)` passes
      the array as map's third argument, which landed in the normalizer's
      `now` parameter, so `epoch * 1000 - array` was NaN and EVERY
      Remaining cell silently rendered a dash. Unit tests missed it
      because they call with explicit arity. Fixed at the call site and
      guarded inside the normalizer, with a regression test — coordinator
      read both halves of that fix in the diff. Operator reviewed the two
      judgement calls the agent raised and chose to keep both current
      behaviours; see next_action. Claude advisory lane.
