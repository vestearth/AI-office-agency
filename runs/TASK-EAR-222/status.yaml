      Opened after TASK-EAR-219's enrichment merged, deployed, and was
      verified live on staging. Scoped to two of the three scopes on
      purpose: the same verification proved Order's publisher is disabled
      on staging, so the E-Voucher scope has no data to build against and
      would have meant guessing at shapes nobody has seen — it waits on
      TASK-EAR-221. Writing this run against observed rows rather than
