summary: |
  Implemented TASK-EAR-116: validate configured wallet currencies at save so a value the
  wallet can't handle can no longer be persisted (the class behind the restore-Point bug).
    - Generalized validEventCurrency -> validWalletCurrency (case-insensitive COIN/DIAMOND/POINT).
    - UpdateCheckInConfig validates restore + daily + milestone reward currencies (ErrInvalidInput).
    - Added MissionService.ValidateConfigCurrencies for the 5 global reward currencies; called it
      in both admin settings handlers (handler.go HandleUpdateConfig + activities.go) before
      UpdateConfig, returning HTTP 400 on an unsupported value.
  Validate-only; POINT stays valid (restore via redeem, rewards via Credit); THB/typos now fail
  fast at save. Events gain case-insensitive validation with no valid input newly rejected.
