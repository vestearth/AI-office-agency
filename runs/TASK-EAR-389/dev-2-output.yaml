summary: |
  Added an Order-owned, paginated player promotion read over coupon_usages and
  bound the Backoffice Promotion tab to it. The additive AdminOrder RPC returns
  ledger identity, status, timestamps, and granted discount; current catalog
  names, percentages, limits, and special-item names are supplementary and can
  change or disappear. Default statuses are consumed and refunded. Coupon type,
  status, search, and inclusive creation-time range filters run in Order so
  totals match pagination. The existing Order management staff gate protects
  the RPC; invalid user UUIDs return status 1002.

  Migration 046 adds a user/created_at index with IF NOT EXISTS and ran twice
  against real Postgres. A non-concurrent index fits the existing boot migration
  runner, though its lock duration should be assessed at rollout. The UI keeps
  the existing two table layouts, uses the ledger's granted discount for Value,
  clears stale rows on reload, and shows an empty table for an empty history.
  Generated protobuf, gateway, and Swagger artifacts were refreshed.

  Verification: shared-lib contract test ev-019; Order full go test ./... ev-020;
  real Postgres player isolation, status, filter, catalog, and migration replay
  ev-015; gateway route coexistence/query test ev-021; Backoffice focused tests
  ev-022 and build ev-018. The broad Backoffice suite had 728/731 passes
  (ev-002), with three existing monitoringReportsApi assertions against
  unchanged Provider and player-list files. Repository-wide buf lint still
  reports longstanding naming/layout violations (ev-014), with no diagnostic
  against the new RPC or messages. All four diff checks passed (ev-023..026).
  Builds used a temporary Go workspace pointing at the unpublished shared-lib
  tree; no consumer module version was changed before publication.
