summary: |
  Implemented the two password-flow XPINEXT email designs in Games-Labs-Auth.
  Self-service reset OTP now sends multipart text/HTML with username, responsive
  layout, and safe optional branding/footer configuration. A password-changed
  confirmation is sent only after session revocation, password persistence, and
  reset-record consumption complete.

  Confirmation delivery is intentionally best-effort: SMTP failure is logged
  without email, username, OTP, token, or password and cannot make a committed
  password reset appear to have failed. Admin reset-link and public API behavior
  remain unchanged.

