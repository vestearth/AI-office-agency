summary: |
  TASK-EAR-279 records Stripe capture when package fulfillment fails.
  failStripeFulfillment now writes payment_status=paid with
  fulfillment_status=failed and does not set internal status=success, so
  ClaimPaymentFulfillment can still re-claim on a retried paid webhook.
  Three regression tests were seen failing on origin/staging (payment_status
  stayed pending; CanApplyStripeFailureOrExpiry stayed true) then passing
  after the one-field fix. PR #26 targets staging. No proto, shared-lib,
  api-gateway, or Android change. No production claim.
artifacts:
  - path: Games-Labs-Wallet/internal/core/services/paymentsvc/stripe_callback.go
    action: modified
    description: Set PaymentStatus paid on fulfillment failure after Stripe capture
  - path: Games-Labs-Wallet/internal/core/services/paymentsvc/stripe_status_test.go
    action: modified
    description: Red-then-green tests for paid/failed, retry grant-once, late expiry
  - path: Games-Labs-Wallet/internal/core/services/paymentsvc/stripe_price_authority_test.go
    action: modified
    description: Test order adapter can mark the package inactive mid-checkout
