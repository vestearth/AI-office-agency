next_action:
  agent: done
  description: >-
    Closed on staging 2026-09-04. INVESTIGATION (decided before coding): the
    RPC was needed, not dead. usersvc.GetProfile calls wallet.SumLifetimeTopup
    and swallows the error, so Unimplemented left the mobile profile
    (GET /api/v1/users/me, userpb lifetime_topup) and the admin player detail
    on user_profiles.lifetime_topup, a column migration 010 added and nothing
    ever writes - silently 0 for every player. Live baseline proved it:
    devtest, who has settled deposits, read lifetimeTopup 0 (ev-002).
    DEFINITION: successful deposit/recharge/purchase rows (the proto
    comment's set; only deposit is written today) in THB major units - THB
    rows by amount, non-THB rows only through the EAR-306 persisted THB
    snapshot, unvalued rows contribute nothing. The RPC name says Minor; the
    field is a double and the only consumer stores it in a NUMERIC(20,4)
    major column, so major units are returned and the misnomer is recorded,
    not renamed (no shared-lib change). AUTHZ mirrors ListSettledDeposits
    (gateway-set identity) plus staff with USER_MANAGEMENT for the admin
    detail path; the User adapter now forwards incoming metadata and invents
    none.
    SHIPPED: Wallet PR 43 (merge d7d5f2b, Deploy STAGING 33888217989 success,
    ECS td:66 image staging-sha-d7d5f2b COMPLETED, ev-007), then User PR 22
    (merge 445b4a4, Deploy STAGING 33888784230 success, ECS td:53 image
    staging-sha-445b4a4 COMPLETED, ev-008). RED seen first (ev-003 User
    regression, ev-004 Wallet vet), GREEN incl. a real PostgreSQL 16 SQL test
    through pgx, full readonly test/build/vet on both repos (ev-005, ev-006).
    LIVE ACCEPTANCE through the gateway (ev-009): the identical request that
    read lifetimeTopup 0 before deploy (ev-002) now reads 1063 with HTTP 200,
    same player, same bearer.
    NOT verified: the 1063 figure against the staging database rows (no DB
    access; the SQL is proven on a fixture, the live number is only proven
    non-zero and stable), the admin player-detail read of another user (route
    not exercised), and USD rows on staging (none exist). Production is NOT
    patched. FOLLOW-UP worth its own run: user_profiles.lifetime_topup has no
    writer, so PlayerSummary and the admin list still show 0 - either backfill
    from Wallet or drop the stored column.
