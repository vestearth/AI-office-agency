note_patch: |
  Add a dated Mission detail subsection after the report read-model boundary:

  On 2026-09-30 the operator chose to keep daily/weekly Mission detail grouped
  by plan, one paged row per player with the plan's activities nested. The
  Backoffice route carries a plan ID. Logs' existing report drill-down is keyed
  by one mission ID and returns one event per row, so it cannot supply the
  designed plan-player table or a correct server total. Missions owns the
  plan, per-player progress and claim data. The staff-only plan-player contract
  merged in shared-lib PR #84. Missions PR #133 and gateway PR #80 merged and
  deployed to staging; Backoffice PR #161 merged and its image was pinned on
  main. Authenticated admin-dev reads confirmed daily and weekly plan-player
  rows, nested activities, claim dashes, and the partial-data notice. Daily
  claim amounts and plan
  bonus attribution remain unknown in the current ledgers and the API flags
  partial data. The frontend displays missing claims as dashes rather than
  using configured rewards.

  The weekly Sep 7-13 list inferred 3 participants from per-mission counts,
  while the plan-player detail returned 6 distinct users. Backoffice PR #162
  removed inferred plan-level completed/participant totals and retained the
  per-mission counts. It merged and deployed; authenticated admin-dev reload
  showed the weekly plan totals as unknown (-/-).

  Revisions: shared-lib 4066910ded9d879d09a52a6af1c6741be0dd585f;
  Missions f53dc4433e56da1a640c2227454d31b4292eb5a5; gateway
