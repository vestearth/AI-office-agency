history:
  - phase: assigned
    agent: dev
    at: '2026-09-22'
    reason: >-
      Recon done before any code. All seven report/*/[id].vue routes except
      player carry a hardcoded catalog keyed by id plus a hardcoded row list;
      player was already blanked honestly and is not in scope. Every detail
      table opens with Username / Player ID / VIP Level, and a live read of
      /admin/monitoring/player-logs/store shows userName and playerId do come
      back resolved while VIP level is on no event at all, so VIP is the one
      column that cannot be filled from this contract.
  - phase: assigned
    agent: dev
    at: '2026-09-22'
    reason: >-
      Package slice complete end to end and read on admin-dev after each
      deploy. Logs PR #45 fills ListReportDrilldown for the package report,
      reusing the report's own WHERE builder with the package pinned so the
      drill-down cannot disagree with the aggregate above it; backoffice PR
      #151 replaces the page's hardcoded catalog of nine packages and eight
      invented purchases with the Order catalog, the package report measures
      and the drill-down rows, server-paged. PR #152 then fixed a defect the
      live page exposed: the Discount % column printed a bare 2.9 for a
      purchase discounted 2.90 off 29.00, which reads as 2.9 percent when the
      real discount is 10 percent - a discount line carries only type and
      amount, the contract has no percentage at all, and the old mapping also
      read a label field that does not exist. Verified live: the meta card
      matches the catalog field for field, the three cards match the package
      report exactly at 113.10 / 13 / 7, paging shows 10 of 13 from the server,
      VIP reads "-" on every row, purchases written before the currency
      snapshot show "-" for currency, gateway and assets rather than borrowing
      the package's own, and the coupon row now reads Discount : 10 % with
      29 - 2.9 = 26.1. One defect found in passing and left to its own run:
      formatVipLevel in websiteOrderPackages renders a VIP level of 0 as "0+"
      although the package editor writes 0 to mean All, so the website shop
      package list shows a gate that does not exist.
  - phase: assigned
    agent: dev
    at: '2026-09-22'
    reason: >-
      Redemption detail done in backoffice PR #154 with follow-up #155, both
      read on admin-dev after deploy. The finding that mattered came before any
      code: Order already owns this page end to end. Its redeemers endpoint,
      built for the Tracking manage modal in TASK-EAR-241, returns the voucher
      code, points spent, redeem date, shipping address, contact email, shipped
      date and tracking number, while the redemption events in Logs carry none
      of those by design - so no Logs work was needed at all and only the
      distinct-player count comes from the report. The tracking field kept its
      designed edit affordance and now posts to the same batch endpoint the
      Manage page uses. Operator decision recorded: VIP Level shows the
      player's level today with the heading labelled (Current), on this page
      and on the package page, because no redeem or purchase record keeps the
      level it happened at. Two defects of my own making were found by reading
      the deployed page: the brand and tag lookups read data/items when those
      endpoints answer under redemptions and tags, which blanked Brand and
      every Collection Tag - the list page had already solved it, and writing a
      second reader instead of reusing indexByID is what caused it; and the
      package Discount % column printed a discount amount under a percent
      heading. Verified live afterwards: the voucher page shows TOPS with tags
      Gadget and COFFEE, quota 11/11, server paging 10 of 11 and real VIP
      levels beside real codes; the gift page shows 9 of 9 rows with per-redeem
      address, email, price 1,440, shipped dates and tracking numbers where
      recorded and "-" where not, Unique Players 1 from the report. Not a
      defect: Unique Players reads "-" on the older voucher because its redeems
      predate the projection's retention window, which is the null-not-zero
      rule working. Still unverified: the tracking-number write path has not
      been exercised against staging, because doing so writes real admin data.
  - phase: assigned
    agent: dev
    at: '2026-09-23'
    reason: >-
      Special-item slice done end to end: Logs PR #46 publishes the
      special-item drill-down, backoffice PR #156 drives the detail page from
      Order's catalog, the special-item report and the drill-down, and PR #157
      fixes three defects the deployed pages exposed. Missions was checked
      first and cannot answer this page - its admin ListStorePurchases filters
      by user and item type only - so the drill-down is the right source here,
      unlike redemption. The page was written from the proto while the admin-dev
      session was expired; once the operator logged the browser pane back in,
      the live payload confirmed every assumed field (profileUrl,
      localizedDescription, passType, currency) and exposed what the proto
      could not: passType is stored as a slug, so the detail chip and the list
      page's Pass Type column printed point_multiplier and level_access (the
      list-page half shipped in #146); the list Detail column printed a
      multiplier as a bare 1.5 and a Level Access range as raw ids; and a
      removed item's detail header was its UUID. All three now go through the
      helpers the Manage page already uses (normalizePassType,
      formatPassDetailLabel) and the name the purchase events recorded.
      Verified live after deploy: the pass list reads Point Multiplier / Point
      x 1.5 and Level Access Pass; the pass detail chip reads Point
      Multiplier; the Tiger avatar shows its profile image, the Cartoon
      collection and 2,495.00 Diamond over 5 purchases at 499; the removed
      Phoenix Empress item is headed by its name with 600.00 / 1 and its one
      real purchase. Left as is on purpose: Golden Pass stores two level ids
      that exist in /admin/levels neither as id nor as catalogId, so they
      still print raw - the Manage page's resolver falls back the same way,
      and that is a data problem on that pass.
