summary: >-
  2026-10-25 UpSlip production incident. A high-volume branch (5G, code 783601)
  ran out of quota. Its first 403 "no active package" came at 06:12:15Z. The
  renewal purchase returned 201 at 10:24:58Z, and the first verify 200 came at
  10:25:01Z, so the outage lasted about 4h13m (ev-011). Renewal from
  app.up-slip.com was blocked because the package detail, overview and
  API-channel reads returned 500. Their usage aggregation over raw
  `verifications` (UsageByUser, 3 s repository timeout) timed out, and the
  service treated that as fatal. The slip-front-end renew modal renders only
  when the package detail has loaded (PackagePage.vue:1942). Two slip-api
  hotfixes made usage fail-soft on those views: #86 (Usage) and #89 (overview
  recent list, whose COUNT has a 10 s floor). Evidence: RED ev-001/ev-007,
  GREEN ev-002/ev-008, prod ev-006/ev-010. The note also records triage facts.
  First, the access-log `event` is a per-route name: merchant reads and the
  purchase log empty `merchant_id`, while `slip_verify` events carry it.
  Second, `vestearth` is denied Logs Insights StartQuery and
