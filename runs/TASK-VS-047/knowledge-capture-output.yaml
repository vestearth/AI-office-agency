  # VerifySlip — Usage Timeouts Blocked Package Renewal (2026-10-25)

  > From **TASK-VS-047**, 2026-10-25. The fix is in `slip-api`, and the
  > dependency is in `slip-front-end`. A high-volume merchant's quota ran out.
  > The merchant could not renew, because the read endpoints behind the renew
  > screens 500'd on a usage-aggregation timeout. Before repeating a number,
  > recheck `origin/prod`, the ECS task definition and the logs. Items marked
  > *(task record)* come from `task.md` with no ev record behind them.

  ## Timeline (UTC, with Bangkok time)

  | UTC | Bangkok | What | Evidence |
  | --- | --- | --- | --- |
  | 06:12:15 | 13:12 | First **403 "no active package"** on `POST /v1/slips/verify` for branch 5G (`816d9bc9…`, code 783601, Enterprise API, 320,000 quota). | ev-011 (first match in a 06:00–07:30Z search) |
  | 08:02–09:52 | 15:02–16:52 | Every merchant read on `branch-packages/{id}`, `branches/{id}/overview`, `channels/api` and `dashboard/summary*` returned 500 after about 3.0–3.7 s. | ev-004 |
  | 10:17–10:22 | 17:17–17:22 | Fix 1 (#86) on prod. Package detail returned **200** in about 3,020 ms and `channels/api` **200** in about 6,430 ms. Overview was **still 500**, now after about 16,0xx ms. | ev-006 |
  | 10:24:58 | 17:24:58 | The merchant renewed: `POST /v1/packages/purchase` returned **201** in 85 ms from 27.130.63.68. | ev-011 |
  | 10:25:01 | 17:25:01 | First verify **200** for the branch (the first after 10:24:57Z). | ev-011 |
  | 16:13:28 | 23:13:28 | Fix 2 (#89) on prod. Overview returned **200** in 16,030 ms. | ev-010 |

  **Outage on the branch: about 4h13m**, from the first 403 to the first 200
  after renewal (06:12:15 → 10:25:01Z, ev-011). The census showing the
  verifies in between were 403 is a *(task record)*. Renewal came about
  3 minutes after fix 1 reached prod, and the purchase itself answered in
  85 ms (ev-011).

  ## Root cause

  - Three merchant reads call `reports.Usage`, which runs
    `verificationRepository.UsageByUser`:
    - `GET /v1/merchants/{m}/branch-packages/{id}` (`GetPackage`)
    - `.../branches/{id}/overview` (`Overview`)
    - `.../branches/{id}/channels/{api|line}` (`GetChannel`)
  - `UsageByUser` is a `GROUP BY day, status, channel, outcome_reason` over
    the raw `verifications` rows in the range, under the repository
    `queryTimeout` of 3 s (`slip-api/cmd/main.go:83`). On a branch writing
    about 590k rows/day *(task record)*, the query cannot finish in time.
  - Before #86, any Usage error other than forbidden was returned to the
    caller, so the whole view failed with 500 `branch request failed`. RED:
    `usage: usage verifications: context deadline exceeded` (ev-001).
  - The overview's recent-5 list goes through `reports.ListVerifications`,
    which also runs `CountByUser`: a `COUNT(*)` over the whole range with a
    **10 s timeout floor** (`slip-api/internal/repositories/verification.go`,
    `CountByUser`). Overview therefore costs 3 + 3 + 10 ≈ 16 s, which is
    under the HTTP `WriteTimeout` of 20 s (`cmd/main.go:276`). RED: ev-007.
    Observed on prod: ev-006 and ev-010.
  - Indexes 061–063 (`verifications_{branch,merchant,channel}_status`) were
    already in the migration set (file list in ev-005), and the usage query
    still timed out on prod (ev-006). So the TASK-VS-027 indexes do not
    solve this query.
  - This was not a database-wide overload. Other merchants' overview answered
    in 40–80 ms, and RDS CPU stayed at 6–9 % *(task record)*.
  - Why the package stopped *(inferred by the task from code, not checked
    against the ledger)*: `renewal_failed` is only recorded on
    `ErrInsufficientBalance`, so auto-renew likely lacked credit at 13:12.

  ## The front-end turns a usage outage into a renewal outage

  - `slip-front-end/app/features/packages/ui/PackagePage.vue` loads
    `selectedDetail` via `useAsyncData` → `packageApi.getMerchantBranchPackage`,
    which is the package-detail endpoint above.
  - The renew modal ("ต่ออายุแพ็กเกจเดิม") renders its content only behind
    `v-if="selected && selectedDetail && canRenewNow()"` (line 1942). When the
    detail 500s, the `UModal` opens with no content. That is the empty dark
    overlay ("ค้าง") the merchant reported.
  - On the branch page, the subscription id also comes from the failing reads
    *(task record)*.
  - The result: a read-only usage chart blocked the only self-service path to
    paying and restoring service.

  ## Rule adopted: usage is fail-soft on views that gate renewal

  - **Scope.** `slip-api/internal/core/service/branch.go` sends every
    `reports.Usage` error, and the overview `ListVerifications` error, to
    `logUsageUnavailable`. The view then keeps its empty default. The views
    are `package_detail`, `overview_month`, `overview_week`,
    `overview_recent`, `api_channel_today|week|month` and
    `line_channel_month`.
  - **Forbidden.** `ErrForbidden` stays silent, as before.
  - **What stays fatal.** Errors in the data the action itself needs are still
    returned: the package, the branch, and the credit balance
    (`get credit balance`). Only the aggregates degrade.
  - **Signal.** WARN `msg="branch usage unavailable"` with `view`, `branch_id`
    and `error`. It carries no `merchant_id`, `path` or `request_id`
    (ev-006, ev-010).
  - **Tests.** `internal/core/service/branch_usage_degrade_test.go`:
    - Get/Overview/API/LINE `...LoadsWhenUsageTimesOut`
    - `TestOverviewLoadsWhenRecentVerificationsTimeOut`

    Each test asserts that the view loads and that the failure is logged.
    RED on untouched `origin/main`: ev-001 and ev-007. GREEN: ev-002 and
    ev-008.
  - **Caveat: unknown renders as zero.** The degraded view returns zero
    usage (the tests assert `want 0 when usage is unavailable` and month
    total 0). The API has no "unavailable" flag, so the merchant sees 0
    instead of `—`. That is acceptable for a hotfix but conflicts with
    [[40 Lessons/Report Totals Need The Whole Filtered Set — Unknown Is Not Zero|Unknown Is Not Zero]].
  - **Caveat: latency.** Fail-soft does not make the view fast. Each
    timed-out query still waits its full timeout: detail about 3 s, API
    channel about 6.4 s, overview about 16 s (ev-006, ev-010).
  - **Caveat: client aborts still log 500.** If the client gives up during
    that wait, the request still logs a 500. At 10:22:38Z, after
    `usage verifications: context canceled`, `channels/api` logged 500 at
    5,918 ms and overview at 5,048 ms (ev-006). A post-fix 5xx census
    therefore includes abandoned requests.

  ## Log shape and tool access for triage (`/ecs/slip-api-production`)

  - **Access log.** Every request logs `msg="http request completed"`. The
    `event` field is a **route name**, not a constant. It comes from
    `eventName()` in `slip-api/internal/handler/middleware/audit.go`:
    - `/v1/merchants/...` → `merchant`
    - any path containing `/bank-accounts` → `bank_accounts`
    - `/v1/slips/verify` → `slip_verify`
    - `/v1/slips/decode` → `slip_decode`
    - unmatched routes, such as `/v1/packages/purchase` and
      `/v1/branch-packages/{id}`, → the default `http_request`

    The purchase was observed as `event: http_request` (ev-011). A filter on
    `event = "http_request"` misses every merchant read, and a filter on
    `event = "merchant"` misses the purchase call.
  - **Which events carry the ids.**
    - `slip_verify` events carry `merchant_id` and `branch_id` (ev-011), so
      `$.branch_id` filters work for verifies.
    - Merchant-route and `http_request` access logs carry `merchant_id: ""`
      and `branch_id: ""` (ev-004, ev-006, ev-010, ev-011). Filter those on
      `$.path` instead, because the merchant id is in the path:
      `{ $.status >= 500 && $.path = "/v1/merchants/<id>/*" }`.
  - **Joining the fail-soft WARN.** The WARN line has no path. Join it to the
    request by `branch_id` plus time, or by `logStreamName` (the ECS task),
    as ev-006 and ev-010 do.
  - **Use `filter-log-events`.** Use
    `aws logs filter-log-events --profile vestearth --region ap-southeast-1`
    with a JSON `--filter-pattern`, plus `--max-items 1` to find a
    first/next event (ev-004, ev-006, ev-010, ev-011).
  - **Logs Insights is denied.** `vestearth` cannot use Logs Insights:
    `start-query` returns `AccessDeniedException` (ev-012, 2026-10-25).
  - **Performance Insights is unavailable twice over:**
    - `pi:DescribeDimensionKeys` returns `AccessDeniedException` (no
      identity-based policy);
    - `upslip-postgres-prod` has `PerformanceInsightsEnabled: False`
      (ev-012).

    Granting the IAM action alone would not produce query-level data.
  - **`rds describe-db-instances` works.** In the same check it **succeeded**
    for `vestearth` (ev-012).

  ## Test trap (history): `go test ./...` was red on slip-api `main`, 2026-10-22 → 2026-10-25

  - **What failed.** `slip-api/migrations/run_test.go:41` hard-coded
    `len(sqlFiles) != 63` while `main` had 64 files, the last being
    `064_user_session_version.sql`. `TestGooseSQLFiles` failed on untouched
    `origin/main` `3a00e07` (ev-005) and on both fix branches (ev-003,
    ev-009).
  - **Cause (ev-014).** `7cc0e51` (watcharapol-spl, 2026-10-22,
    "feat(auth): implement logout functionality and session management")
    added `migrations/060_user_session_version.sql`. That took the tree to
    64 `.sql` files while `run_test.go` still expected 63.
  - **The rename came later.** `2e303ea` (watcharapol-spl, 2026-10-22,
    "feat(branch): add methods to unlink LINE connectors by kind and
    channel") only renamed `060_user_session_version.sql` →
    `064_user_session_version.sql`. It did not touch `run_test.go` (ev-013).
  - **Recurring pattern.** The same drift happened earlier at `ff900dc`
    (watcharapol-spl, 2026-10-15): 60 `.sql` files against an expected 59.
    A later commit fixed it; by `ee932d6` the count matched again at 62/62
    (ev-014). A new migration that doesn't bump the hard-coded count is a
    recurring way for `main` to go red.
  - **Resolved.** `5fc45b3` (TASK-VS-048, merged in SparqLab/slip-api#92) set
    the expectation to 65, matching 65 files (ev-014).
  - **Still pending.** Open PR SparqLab/slip-api#85 has renumbered its
    migration to 066 on its branch and is not merged (TASK-VS-048
    status.yaml). Whichever migration lands next must bump the count again.
  - **If it reappears,** prove the failure on untouched `main`, as ev-005
    does, rather than assuming it is pre-existing.
  - **Why nobody noticed.** slip-api's workflows run only on push:
    `deploy.yml` on `staging` and `deploy-production.yml` on `prod`. There is
    no `pull_request` trigger and no `go test` step, so PRs show zero checks
    and a red `main` stays invisible.

  ## Changes shipped *(task record; the prod behaviour is in ev-006 and ev-010)*

  | Fix | Promotion chain | Prod task definition | Rollback |
  | --- | --- | --- | --- |
  | 1. Usage non-fatal at 7 call sites | #86 main `36c1e8a` → #87 staging `4b0793a` → #88 prod `f106243`; run `40183682573` | `slip-api-production:109`, rollout complete 10:21:11Z | `:108` |
  | 2. Overview recent list non-fatal | #89 main `6362929` → #90 staging `9f17c06` → #91 prod `a60568d`; run `40207835692` | `slip-api-production:110`, rollout complete 15:48:26Z | `:109` |

  Each promotion PR carried only the two hotfix files, and prod kept its
  prod-only task-definition file. Staging was deployed, but the changed
  endpoints were not exercised there, because that needs a merchant JWT.

