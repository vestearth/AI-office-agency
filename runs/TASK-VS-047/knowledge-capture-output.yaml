  # P4 — gated promotion candidate (route through knowledge-promote; do not apply on this capture alone)

  Proposed target: `Knowledge Base/40 Lessons/A Read That Gates An Action Must Not Fail On Its Optional Aggregates.md`

  - **Reuse pressure:** the same pattern has appeared twice in VerifySlip,
    which is the Promotion Rule's "used twice in the same project":
    - TASK-VS-012: the admin Overview fired 15 requests in one `Promise.all`,
      so one 500 hid every KPI. The fix kept each successful KPI and shows `—`
      for failed sources.
    - TASK-VS-047: the usage aggregates 500'd the package detail that gates
      renewal.
  - **Draft rule:** on a view the user must load to take an action (renew,
    pay, configure), classify every dependency as *required for the action*
    or *informational aggregate*.
    - Required errors stay fatal.
    - Aggregate errors degrade: log once with the view name, and return an
      explicit "unavailable" marker rather than 0 (VS-012 got this right with
      `—`; VS-047's hotfix still renders 0).
    - Give each aggregate its own timeout well under the HTTP write timeout.
      The degraded view still waits for every timeout in sequence.
    - On the client, never gate the action UI on the aggregate-bearing
      response alone. Fall back to the list row.
  - **Evidence:** TASK-VS-047 ev-001, ev-002, ev-006, ev-007, ev-010;
    `ai-dev-office/runs/TASK-VS-012/status.yaml`;
    `slip-admin/app/features/overview/ui/OverviewDashboard.vue`. The VS-012
    facts come from the existing Slip Time Zone note; I did not re-check
    them in this capture.
  - **Tension to resolve at promotion:** this rule adds an action-gating case
    to [[40 Lessons/A Parser That Returns Empty On Error Makes Failure Look Like Absence|A Parser That Returns Empty On Error]],
    where empty-on-error is safe only on pure display paths. Decide whether
    the two notes merge or cross-link.
