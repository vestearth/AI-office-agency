assumptions:
  - >-
    In orders-catalog mode Orders is authoritative for custom-exchange validation
    and pricing (priceCustomExchange: amount>0, Min/Max, hard cap, overflow), so the
    Missions pre-gate live-rate fetch is redundant there and is removed. Removing it
    is what lets a replay always reach Orders and fail safe to already_claimed even
    when the live exchange.custom rate was deleted or its MaxValue lowered below the
    original amount.
  - >-
    The legacy direct-wallet path (USE_ORDERS_CATALOG=false, local only) still fetches
    the live rate and keeps the full Min/Max/hard-cap/rounding validation incl. the F3
    overflow guard, because no Orders service owns pricing there.
  - >-
    On first fulfillment the response Rate now comes straight from ordersRes.Rate (no
    local rateRef fallback), since there is no local rate read on the orders-catalog
    path. Orders returns the applied rate on first fulfillment; on replay Rate is unset
    and the fail-safe returns already_claimed regardless.
  - >-
    The integration-tagged tests need a live Postgres (ORDER_TEST_DATABASE_URL) to
    execute; the round-5 acceptance requires only that they COMPILE. They now compile
    and skip cleanly without the env var. No live DB was available in this run.
  - >-
    integrationWallet was missing BOTH GetActiveRateByKey and RefundPoints from
    ports.WalletAdapter (Go reports one missing method at a time); both were added so
    the stub satisfies the interface.
