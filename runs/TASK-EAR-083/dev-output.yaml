summary: |
  Round 5 (final convergence): closed the two round-4 adversarial findings — the
  Missions [high] replay-ordering bug and the Order [medium] integration test.
  F1/F2/F3/F4 and the first-fulfillment F5 path stay closed; the fixed-package/tier
  path is behaviorally unchanged.

  Missions [high] — delegate to Orders BEFORE the live-rate gate.
  CreateCustomExchange fetched + validated the live exchange.custom Wallet rate
  (numerator/denominator, hard cap, MinValue, MaxValue, rounding) at ~L643-676
  BEFORE the `if s.useOrdersCatalog` branch. So a same-idempotency-key replay of an
  already-fulfilled order was rejected (rate-not-found / Wallet degraded / admin
  lowered MaxValue below the original amount) instead of returning already_claimed —
  defeating the round-4 replay guarantee under a normal admin action. Orders already
  validates + prices on the first call (priceCustomExchange enforces amount>0,
  Min/Max, hard cap, overflow), so the Missions pre-gate was redundant in
  orders-catalog mode.

  Restructure. CreateCustomExchange now, up front, only rejects userID=="" ||
  diamonds<=0 (cheap transport-level). In orders-catalog mode
  (useOrdersCatalog && orderClient != nil) it does NOT fetch/validate the live
  Wallet rate: it resolves the custom package (resolveCustomExchangePackageID) and
  calls CreateCustomExchangeOrder FIRST, letting Orders distinguish first
  fulfillment from replay and own validation/pricing. First fulfillment builds the
  response + PurchaseHistory from the Orders-authoritative amounts
  (SpentDiamonds/CreditedCoin/Rate from ordersRes; the local rateRef fallback is
  gone since there is no local read on this path). Replay keeps the round-4
  fail-safe: ordersRes==nil || ordersRes.Replayed || ordersRes.CreditedCoin<=0 →
  return already_claimed with ErrAlreadyClaimed reporting only the authoritative
  SpentDiamonds, no fabricated amount, no extra history row. The Wallet rate fetch +
  Min/Max/hard-cap/rounding (incl. the F3 overflow guard in applyRateRounding) now
  live ONLY in the legacy direct-wallet path (USE_ORDERS_CATALOG=false), which keeps
  full pricing because there is no Orders service to own it there. F1/F2 not
  regressed (still delegate-only, no direct-wallet strand in orders-catalog mode);
  F4 untouched.

  New Missions test TestStoreServiceCreateCustomExchangeOrdersModeReplayRateRemoved:
  the Wallet rate is 404 for the entire test; first call fulfills via Orders (500),
  the same-key replay (Orders returns replayed:true, credited_coin:0) returns
  already_claimed with credited_coin=0 and authoritative SpentDiamonds=50, the live
  Wallet rate is never consulted (asserted 0 hits — proving the delegate-first
  ordering), and no second history row is appended (still 1 row, GotCoin 500). The
  round-4 fail-safe test, the round-3 drift test and the F1/F2 delegate test all
  still pass.

  Order [medium] — fix the integration-tagged exchange test. exchange_test.go
  (build tag "integration", excluded from the default suite) no longer compiled:
  CreateExchangeOrder returns *models.ExchangeOrderResult (not *models.Order), and
  integrationWallet did not implement ports.WalletAdapter (missing GetActiveRateByKey
  and RefundPoints). Added both to the stub — GetActiveRateByKey is backed by a rate
  map (setRate helper); an unset key returns a not-found (nil, nil) that the
  fixed-package tier flow tolerates (falls back to package RewardCoins).
  The exchange test now unwraps res.Order, asserts the first fulfillment is not
  Replayed and reports spent=25/credited=550, and asserts the idempotent replay is
  Replayed=true with credited_coin=0 and authoritative spent=25. Verified: go test
  -tags integration ./tests/integration COMPILES and the three integration tests
  SKIP without ORDER_TEST_DATABASE_URL (they need a live Postgres to execute);
  go vet -tags integration passes clean.
