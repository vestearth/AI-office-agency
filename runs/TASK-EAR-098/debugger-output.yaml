  UpdateSpecialItem existed at both service and handler layers, but tests exercised
  only CreateSpecialItem. Added service tests proving normalized approved fields
  reach persistence and invalid UUID/sale-window writes do not persist. Added
  handler tests proving protobuf request/response mapping and invalid-request
  status propagation. Focused tests, both repository test suites, readonly builds,
  diff checks and task validation pass. Fix commit 121be80 was pushed to Order PR 11.
