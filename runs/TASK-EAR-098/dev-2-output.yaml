summary: |
  Implemented and published the TASK-EAR-098 Store Items backend across the
  Order and API Gateway repositories. Both consumers use shared-lib
  v0.0.0-20260712221916-26afe576d8e4 with no local replace directive.

  Order now implements Admin Get/List/Create/Update mapping, persistence and
  validation for the approved Store Items contract. Migration 025 makes Pass
  collection optional and persists localized descriptions, pass subtype,
  detail bounds and supported game UUIDs. The protected special-item upload
  path reuses the existing staff permission, 5 MB and MIME-sniffing controls.

  Commits and PRs:
  - Games-Labs-Order fc041cd, PR https://github.com/SparqLab/Games-Labs-Order/pull/11
  - api-gateway fc21bd3, PR https://github.com/SparqLab/api-gateway/pull/12

  Verification passed in both repositories: repo-wide Go tests, readonly
  builds, gofmt and git diff checks. Focused Order tests cover service
  validation, repository mappings, Admin handlers/uploads and unchanged
  unpaginated Website special-item behavior.
