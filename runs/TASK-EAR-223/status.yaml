    and sendVia has no source anywhere in Order. The format trap to watch
    is that valid_until is an RFC3339 string while grant_pass's expires_at
    is a Unix epoch integer — same modal, two encodings, so the
    grant_pass formatter must not be reused unchanged. Render only the end
    date for the available column rather than inventing a range start.
    PR only, no merge.
