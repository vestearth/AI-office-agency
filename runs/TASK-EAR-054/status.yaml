next_action:
  agent: free-roam
  description: >-
    Harden the mission_config full-row write against lost updates and hydration
    failure. UpdateMissionConfig rewrites the WHOLE mission_config row from an
    in-memory s.config, and the config PUT paths (UpdateConfig, ApplyDailyCompletionBonusPatches;
    reached by /admin/missions/config, /admin/config, and /admin/missions/boost/config)
    hydrate s.config OUTSIDE the mutex before merging. This leaves two residuals for
    the NON-schedule fields (bonuses, boost, daily/monthly/watch-ad rewards): (1)
    concurrent config PUTs can lose updates — both read the same DB snapshot before
    Lock, second overwrites first; (2) hydration read errors are ignored (fail-open),
    so a failed read persists cached/empty defaults and clobbers the row. Fix by
    moving to targeted per-field SQL updates (like GoldenPass / the EAR-053 schedule
    path) OR a transactional read-modify-write with a row lock, and fail closed on a
    hydration read error. schedule_config is already immune (EAR-053 decoupled it to a
    targeted atomic update). Multi-instance safety also argues for DB-side atomicity.
