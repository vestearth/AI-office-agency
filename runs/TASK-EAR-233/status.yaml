    reason: >-
      Opened after a read-only survey of the rate-limiting gap, which
      reframed the operator's concern. The starting point was the admin
      password-reset endpoint, but that is staff-gated and now audited, so
      abusing it presupposes a compromised staff account. The survey found
      the unauthenticated player auth surface is the real exposure —
      /api/v1/auth/ is a PREFIX skip in the gateway — and that OTP
      verification has no attempt counter and does not invalidate on a
      wrong guess, which coordinator confirmed by reading both migrations
      and finding no attempts column in either.
      The operator confirmed Cloudflare rate limiting is enabled, which
      DROPPED the gateway limiter rewrite from scope entirely — a
      meaningful saving. It deliberately does not close this run's issues:
      the OTP gap is a logic defect that survives any per-IP limit when an
      attacker spreads across addresses, and a per-email cooldown cannot
      be expressed as a per-IP rule at all. Recording that reasoning
      because "Cloudflare handles rate limiting" is exactly the sentence
      that would otherwise close this ticket wrongly.
      Two lower-priority findings split into TASK-EAR-234 rather than
      bundled: gin's proxy trust is never configured so c.ClientIP() is
      attacker-controlled, and the unwired middleware has a sync.Once
      singleton that makes per-route limits impossible. Claude advisory
      lane.
