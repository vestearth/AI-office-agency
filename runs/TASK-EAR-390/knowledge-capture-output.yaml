note_patch: |
  Add this section to Monitoring Read Model Boundary after review and release:

  ## Per-player provider attribution (TASK-EAR-390)

  Game publishes the catalog provider UUID on settled, outcome-updated, and
  reversed round events. Logs keeps that ID on the latest round outcome and
  groups one player's unreversed rounds by captured UUID. A provider with no
  captured rounds is absent. Older rounds with no provider ID count as
  `unattributed_rounds`; the catalog supplies display names only and never
  manufactures rows. No backfill was approved.

  Round currency remains unstamped in this task. A provider group containing
  a blank currency has no Coin turnover or W/L value; the Backoffice renders
  `-`, while its captured round count remains available. Real per-round
  currency belongs to TASK-EAR-405. The code and disposable ClickHouse test
  establish this local behavior; shared-lib publication, consumer version
  bumps, deployment, and an authenticated admin-dev comparison remain separate
  gates before describing it as live.

  Game round lifecycle storage still lacks a provider snapshot. A correction
  or explicit replay of an old round resolves the game's current catalog
  provider. Review this assumption if games can change provider ownership.

  Related: [[10 Projects/Games Labs Game/Turnover vs W-L — Gameplay Round Definitions|Turnover vs W-L — Gameplay Round Definitions]]

