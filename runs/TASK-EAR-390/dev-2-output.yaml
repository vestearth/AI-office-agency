blockers:
  - >-
    The shared-lib contract is uncommitted and unpublished; the shared_lib_publication
    gate cannot pass in this read-only .git runner. Publish it first, then bump
    shared-lib pins in Game, Logs, and api-gateway. Go tests currently require
    the temporary local go.work overlay.
  - >-
    authenticated_staging remains pending. Deploy the compatible service order
    and compare one player's admin-dev Provider tab with the API; no live
    acceptance claim is made here.
  - >-
    Currency stays blank by operator decision; only round counts show for those
    groups. TASK-EAR-405 must supply a proven per-round currency before Coin
    turnover and W/L can appear. No provider backfill was run.
  - >-
    Game does not persist provider_id on round_lifecycles. A later correction
    or explicit replay resolves the game's current catalog provider; a game
    reassignment could change attribution of an older round. Review whether
    provider ownership is immutable or requires a persisted event-time snapshot.
  - >-
    Repository-wide buf lint fails on existing package layout/version rules
    (ev-010). Pinned TypeScript checking fails in unrelated Backoffice files
    with no diagnostics in this task's changed files (ev-013); the production
    build and focused tests pass.
