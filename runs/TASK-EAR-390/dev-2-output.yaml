summary: |
  Implemented local, uncommitted provider attribution across the five scoped repositories.
  shared-lib adds PlayerActivityEvent.provider_id and the staff-only
  ListPlayerReportProviders RPC with optional Coin measures. Game carries the
  resolved catalog provider UUID on settled, outcome_updated, and reversed
  round events; a stored-game retry re-reads that game's provider. A reverse
  resolves its provider before mutating the round. Game does not stamp currency.
  Logs expands monitoring_round_outcomes on boot, projects provider_id, and
  groups one player's latest unreversed rounds by captured UUID. Blank IDs are
  counted as unattributed_rounds; blank currency leaves Coin turnover and W/L
  absent. Backoffice replaces the unavailable Provider tab and mock rows with
  the Logs read, resolves names from the admin provider catalog, and shows
  round counts while absent measures remain dashes. The gateway route is covered
  by its generated-contract route test.
  Tradeoffs: no historical provider backfill or currency inference; THB remains
  absent. Consumer modules remain on their published shared-lib pins until the
  new contract is published, so local Go verification used a temporary go.work.
  Rollout order is shared-lib publication, consumer bumps, Logs schema/read,
  Game producer and gateway, Backoffice, then authenticated admin-dev comparison.
  Local checks passed: focused Go and Backoffice tests, real ClickHouse 24.8
  integration, and Nuxt production build. Repo-wide buf lint and TypeScript
  checking still report pre-existing violations outside changed files.
