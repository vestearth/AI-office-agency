summary: |
  Stopped before implementation at the operator's explicit COIN precondition.
  Game's SettleRoundRequest handler and RoundLifecycle carry no currency, and
  settledRoundLifecycle validates no wallet rail. Provider's Sigma ArcadeSettle
  calls Game SettleRound after walletOp, but walletOp only returns a balance and
  defaults the request currency to THB; no COIN wallet settlement occurs there.
  Provider's GGSoft path also forwards currencies other than THB unchanged to
  Wallet and can call SettleRound at round end. Therefore the current source
  cannot establish that every settled round, including arcade/promotional
  cases, is COIN. Stamping COIN would make non-COIN or unverified turnover look
  authoritative in the Game and Provider reports. The compatible choice is to
  keep currency absent until the source rail is identified; the operator must
  resolve that contract before this task can implement provider turnover.
  No source, contract, dependency, UI, or task gate changed. The scoped service
  working trees had unrelated pre-existing edits, which were left untouched.
  Evidence ev-003 (TASK-EAR-390) passed the focused Sigma settlement test;
  ev-002 failed only because the default Go build cache was sandboxed.
