blockers:
  - >-
    Currency precondition failed: Game has no round currency field or guard;
    Sigma settles arcade rounds without a COIN wallet transaction and defaults
    its balance currency to THB. GGSoft can pass through non-THB currencies.
    Decide how a round's actual wallet currency is proven and propagated, or
    which unverified round paths must keep currency absent, before coding.
  - >-
    shared-lib is unpublished and the shared_lib_publication gate is pending.
    Consumer bumps must wait for its publication. The authenticated_staging
    gate also remains pending and requires a deployed admin-dev read.
