    reason: >-
      Raised from the knowledge-base Review Queue critical item opened
      2026-07-25 (audit
      ai-dev-office/knowledge-reviews/20260725T024746Z-games-labs-backoffice-missions-auth-warning-triage.yaml).
      Backoffice nuxt.config.ts committed a literal fallback bearer under
      runtimeConfig.public.apiBearer. Because public runtime config is compiled
      into the client bundle, that credential is delivered to every visitor and
      grants API Gateway access without login. Rotation was rejected as a fix:
      any replacement placed in public runtime config is equally public, and
      NUXT_PUBLIC_API_BEARER was never wired into any workflow, so the committed
      literal is what shipped in every build. The fallback is therefore removed
      outright and the header path fails closed.
