    "Used" = total_redeemed (== quota_used today; both increment together on
    redeem). If the two ever diverge, the UI shows total_redeemed and falls back
    to quota_used.
  - >-
    E-Voucher total_quota shown in edit is the code-derived total (from
    redemption_item_codes via syncRedemptionItemTotalQuota), read off the loaded
    API item, not from the editable daily/player quota inputs.
  - >-
    Player quota controls are config-only until TASK-EAR-087 ships redeem-time
    enforcement; the UI must not imply the limits are enforced (an explicit code
    NOTE states this). PM/operator policy per AC #8 was to build the UX now and
    open the backend follow-up.
  - >-
    The Gift edit inline quota block (Basic tab) is out of affected_files and was
    left unchanged to avoid Gift rework; the shared create modal alignment does
    affect Gift create, which is the intended AC #7 shared-control consistency.
  - >-
    Changes were left uncommitted on the backoffice `main` working tree (only the
    two target files are dirty); branching/commit/merge is the operator lane, per
    prior redemption tasks. Nothing pushed.
