note_patch: |
  ## Inbox capture — TASK-EAR-420 Point Earned history contract (2026-11-02)

  Suggest-only. Do not treat this as a published lesson until a human promotes it.

  - `GET /api/v1/wallet/{user_id}` and `GET /wallets/point-history` are the wallet proto bindings on api-gateway's shared-lib pin `5498b9aae154`. The gateway mounts grpc-gateway only at `/api/v1/*`, so `/api/v1/wallet/point-history` is a wallet lookup for user id `point-history`.
  - The approved public earned-history route is `GET /api/v1/wallet/points/history`, bound to the authenticated caller, with an earned-reason allowlist. Decisions: `ai-dev-office/runs/TASK-EAR-420/contract-review.md`.
  - `POST /wallets/credit` for POINT writes `reference_id` into `wallet_points_ledger.reason` and discards the metadata that holds the semantic reason (`check_in_day`, `daily_mission`, and the rest). The TASK-EAR-159 EarnedReasons list is the intended vocabulary, not the rows that path writes today.
  - Missing historical titles stay empty. Do not reconstruct Daily Login day or VIP level from idempotency keys.
  - Point spends stay on `GET /api/v1/my-redemption-items`. Empty redemption `price_currency` means POINT.

  Source: shared-lib pin `5498b9aae154` wallet.proto; Games-Labs-Wallet `wallet_handler.go` `ledgerSource`; `walletsvc/service.go` POINT branch of `Credit`.
  Related: [[Wallet Currency Contract And Error Masking — Debit Is Coin-Diamond Only, Points Spend Via Redeem, Surface The Real Error]]
