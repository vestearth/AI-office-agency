    at: '2026-07-02'
    reason: >-
      Claude advisory lane (operator: earth). Bug reported on
      admin/manage/missions/daily/edit/<id> (Next 7 Days plan): (1) changing the
      Category Turnover "Game Category" dropdown did not persist across reload;
      (2) selecting "All" returned POST /api/v1/admin/daily/plans/full 400.
      Root cause (verified against Games-Labs-Missions): the FE toApiActivities()
      for category_turnover (a) sent game_type='' for "All", which the daily
      validator rejects (mission_service.go:1923 game_type is required when
      condition_type=TURNOVER_GAME_TYPE), and (b) preserved the verbatim loaded
      pool while updating game_type — and toFormTask() reads the category from
      pool[0] before game_type on reload, so the stale pool masked the new
      category (the runtime matcher ignores the pool for TURNOVER_GAME_TYPE;
      activity_match.go:38 matches on game_type only). Fix on branch
      fix/EAR-061-daily-category-turnover in Games-Labs-backoffice:
      app/pages/admin/manage/missions/daily/edit/[id].vue — category_turnover
      now maps "All"/empty-token to TURNOVER_AMOUNT (any-game), and non-All
      categories send an empty pool so game_type is the single source of truth on
      round-trip. Product decision (operator): "All" == Any Game. NOT merged.
