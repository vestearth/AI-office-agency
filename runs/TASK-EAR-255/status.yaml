next_action:
  agent: dev
  description: >-
    Expose device info for Player Detail. Games-Labs-Auth already CAPTURES
    the data and has no way to read it back: auth_devices holds
    device_id/device_type/last_login_at, one row per user
    (migrations/001_create_auth_tables.sql:18-26 plus the later
    one_row_per_user migration), written by UpsertAuthDevice
    (internal/core/repositories/auth.go:501). There is no repository read
    method, no handler, and no proto RPC — the table is write-only today.
    Add the read path: repository method, admin handler, admin proto RPC
    with its HTTP annotation, and confirm the gateway binding, because a
    mux-only admin route 404s through api-gateway.
    Backoffice's Player Detail already renders Serial Device from a mock
    literal (Detail/[id].vue, mock.ts:205); wire it data-source-only and
    preserve the approved UX per the TASK-EAR-134 header comment.
    ALSO IN SCOPE NOW (added 2026-08-13): blank or remove the Device
    panel's IP Address row. TASK-EAR-256 was closed WON'T DO — the operator
    decided player IP will not be collected at all — so sessions.ip_address
    stays permanently NULL and that field can never be backed. Backoffice
    currently renders a mock 192.168.1.1 (app/data/mock.ts:204) on every
    real player, which is now permanent fabricated data: the same hazard
    TASK-EAR-144 was opened for and the coin aggregates were blanked for in
    TASK-EAR-179. Use the same blankBackedFields pattern that run
    established, and preserve the approved layout — data source only.
    Net effect on the Device panel: Serial Device becomes real, IP Address
    becomes a blank. Say so in the PR so it does not read as a regression.
