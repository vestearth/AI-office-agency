  # ADR-VS-0002 Merchant Usage Reads From A Trigger-Maintained Hourly Rollup

  - Status: Proposed. The design shipped in TASK-VS-048; this ADR is not yet accepted.
  - Scope: VerifySlip (`slip-api`)
  - Date: 2026-10-25 (memo and review); prod 2026-10-26 ICT

  ## Context

  Merchant usage and dashboard reads aggregated raw `verifications` over their whole range.
  One branch writes about 590k rows a day, so 30-day reads exceeded the 3 s repository
  timeout and returned 500 or empty usage. The readers mix UTC days, Bangkok days and Bangkok
  months, and dashboard ranges are not day-aligned (the default `to` is now).

  ## Decision

  - Keep an hourly rollup `verification_usage_hourly`, keyed by owner, merchant, branch,
    UTC hour, channel, status and outcome_reason, with a count and an amount sum.
  - Maintain it with an AFTER INSERT/DELETE/UPDATE-OF row trigger on `verifications`.
  - Track coverage with a single `covered_from` watermark.
  - Rebuild history with an hour-by-hour backfill under an advisory lock, one REPEATABLE READ
    step at a time, after a 5-minute quiet window.
  - Readers take whole covered hours from the rollup and the edges from raw rows, so results
    equal the raw query exactly.

  ## Alternatives rejected

  - **A′: the same rollup, filled by a periodic job.**
    - It has no write-path cost.
    - But readers still scan the open hours raw: up to about 1h05m, or 25–50k rows on the
      busiest branch, and that grows with volume. A stalled job brings the timeouts back.
    - Rows changed after their hour was rolled drift silently (the caveat of migration 058's
      closed-day cache).
    - It needs a permanent leader.
    - The reviewer proposed a forward-filling job; the trigger was kept.
  - **B: a covering index**, `(branch_id, created_at) INCLUDE (status, channel,
    outcome_reason, amount)`.
    - It is still O(rows): about 17M entries per 30-day read, roughly 2 s or more per query
      even index-only, and overview runs three of them.
    - Recent pages are not all-visible, so heap fetches remain. Insert-autovacuum tuning was
      deferred in TASK-VS-030.
    - It would be a 19th index on a table over 5 GB with heavy inserts, plus a long
      CONCURRENTLY build.
    - It misses the 3 s budget and gets worse every day.
  - **C: overview skips the total COUNT.** It saves 10 s of about 16 s on one page and fixes
    nothing else. Not implemented; it stays a fallback if A is rolled back.
  - **A 058-style closed-day read-through cache** still reads the whole open day raw, up to
    590k rows here.

  ## Consequences

  - **Gains:**
    - Reads are exact and O(hours) at any branch volume, and freshness needs no job.
    - On prod (47-minute windows):
      - verify p50 went from 195 ms to 194 ms, and p99 from 740 ms to 661 ms;
      - there were 0 5xx;
      - RDS WriteLatency did not change during the backfill.
    - Merchant pages dropped from 3–16 s (or 500) to 20–209 ms; the first dashboard load
      took 454–461 ms.
  - **Costs:**
    - Every counted write upserts a small hot row.
    - Local pgbench, single client: +~25 µs per insert.
    - Local pgbench, worst case of 8 clients on one key: 9.5–10k TPS fell to 2.2–5.5k TPS.
      Early rounds were noisy. That rate is about 1000× prod's per-branch rate, and in prod
      the `branch_packages` row lock already serializes those writers.
    - The one-off backfill read cold history: ReadIOPS went from about 15 to 981 at peak, for
      about 15 minutes.
    - A backfill step that is skipped on 40001/23505 logs nothing, so a stalled backfill is
      silent until that is logged.
    - Writes that bypass the trigger (TRUNCATE, a disabled trigger, replica role) drift.
      Repair by raising `covered_from`.
    - Future UPDATEs of counted columns, and bulk data fixes, pay the trigger and take the
      shared advisory lock.
  - **Rollback:** an app rollback leaves the trigger running, so rolling forward needs no new
    backfill. A schema rollback is `goose down` of 065.

