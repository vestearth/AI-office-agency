  ## Rollback and repair

  - **App rollback:** return to `slip-api-production:110`.
    - Old code never reads the rollup.
    - **The trigger stays and keeps the rollup current**, so rolling forward again needs no
      new backfill.
  - **Schema rollback:** `goose down` one version. It drops the trigger, the function and
    both tables under `lock_timeout = 1s`, because `DROP TRIGGER` takes ACCESS EXCLUSIVE. New
    code then reads raw.
  - **Repair:** set `covered_from` higher, to a whole hour. The backfill rebuilds everything
    below it.
  - **Not counted by the trigger:** TRUNCATE, a disabled trigger, and
    `session_replication_role = replica`. After any of these, raise `covered_from` above the
    affected hours.

  ## Constraints for future changes

  - A new app UPDATE of a counted column fires the trigger and takes the shared advisory
    lock. The counted columns are `status`, `outcome_reason`, `channel`, `amount`,
    `created_at` and the three ids. Today the only app UPDATE (`idempotency_key`) is outside
    that list.
  - A bulk data fix on `verifications` pays the PL/pgSQL trigger for every row and waits for
    any running backfill step.
  - A new usage reader must use `usageRowsSQL`, or the same edge splitting. A raw GROUP BY
    over a long range brings the timeouts back.
  - On the write path, `SaveWithQuota` locks `branch_packages`, then `verifications`, then
    the rollup row. Keep that order: it is why the trigger cannot deadlock.

  ## Open / not covered

  - **Open question: backfill end state (ev-009, ev-013).**
    - **What is known:**
      - The last backfill log is `paused` at `covered_from` `2026-09-25T03:00Z`, at
        20:17:51Z, with no progress in the next 37 minutes (ev-009).
      - Prod logged 13,974 verify-200 lines between 2026-09-22T07:38Z and
        2026-09-24T09:10Z (ev-013), all before `covered_from`. Merchant `6f798b3c` sent
        13,827 of them; that is the 2026-09-24 load test in
        [[10 Projects/VerifySlip/Verify Capacity 600-1200 Per Minute — 2026-09-24|Verify Capacity 600–1200 Per Minute]].
    - **Two explanations remain:**
      - those rows were deleted from `verifications`, which no record says happened; or
      - the step for `[2026-09-24T09:00Z, 2026-09-25T03:00Z)` returns zero silently on
        every retry (case 1 or 5 above).
    - **Readers stay exact either way:** hours below `covered_from` are read from raw
      `verifications`. ev-013 counts log lines, not rows, and the row count was not queried.
    - **To close it:** run the two read-only queries above. Do not describe history as fully
      covered until the second query returns NULL.
    - **Follow-up:** log when a backfill step is skipped for 40001/23505, so a stalled
      backfill shows in the logs instead of looking like completion.
  - The `/v1/admin/verifications` count (13 × 500 at 10 s) and the email-alert and
    daily-digest timeouts belong to separate tasks.
  - The validity of `verifications_created_id_idx` was not queried on prod. The migration
    succeeded, which needed that index for the MAX.
  - On staging, the endpoints and the trigger under real inserts were not exercised. There
    was no merchant traffic and no staging merchant JWT.

