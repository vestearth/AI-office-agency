  # VerifySlip — Merchant Usage Hourly Rollup (2026-10-26)

  > From **TASK-VS-048**. slip-api merchant usage and dashboard reads sum an hourly rollup
  > instead of scanning raw `verifications`. This has been on prod since
  > `slip-api-production:111` (`production-sha-32cd203`), 2026-10-26 02:47 ICT
  > (2026-10-25 19:47Z). Times below are UTC. Recheck `origin/prod` and the live task
  > definition before repeating any number here. **The backfill end state is an open
  > question** (see Open).

  ## Why

  - Branch `816d9bc9-…` (merchant `84006774-…`) writes about 590k verifications a day
    (about 400 a minute), so a 30-day window is about 17M rows.
  - Seven readers in `internal/repositories/verification.go` aggregated raw rows over the
    whole range: `UsageByUser`, `MonthlyUsageByUser`, `CountByUser`,
    `MerchantDashboardSlips`, `MerchantDashboardDaily`, `MerchantDashboardBranchCounts` and
    `MerchantDashboardBreakdown`.
    - Most of them exceeded the 3 s repository `queryTimeout`.
    - `CountByUser` exceeded its 10 s floor.
  - Prod effect, from a 24 h census to 2026-10-25 about 16:30Z:
    - `/v1/usage`, `/v1/usage/monthly` and `/v1/merchants/{id}/dashboard/summary*` returned
      500 at about 3.0 s.
    - Overview, channels/api and branch-packages/{id} showed empty usage (the TASK-VS-047
      fallback). Overview took about 16 s.

  ## Design

  The decision and the rejected alternatives are in the ADR-VS-0002 proposal.

  - **`verification_usage_hourly`**
    - Primary key `(user_id, merchant_id, branch_id, hour, channel, status, outcome_reason)`.
    - Counters `verification_count` and `amount_total`. `amount_total` sums only `amount`
      values that parse as numbers.
    - `fillfactor = 70`, plus an index on `hour`.
    - No foreign keys: they would add KEY SHARE locks to every verify.
  - **`verification_usage_hourly_state`**: a single row holding `covered_from`, the first UTC
    hour from which the rollup holds every row. A CHECK keeps it on a whole hour.
  - **Trigger:** `verification_usage_hourly_sync` runs `verification_usage_hourly_apply()`.
    - It fires `AFTER INSERT OR DELETE OR UPDATE OF user_id, merchant_id, branch_id,
      created_at, channel, status, outcome_reason, amount`, once per row.
    - The rollup hour is `date_trunc('hour', created_at, 'UTC')`.
  - **Why hours:** readers mix UTC days, Bangkok days and Bangkok months. Both zones are
    whole-hour offsets with no DST, so every bucket is a union of UTC hours. A daily rollup
    keyed on one zone could not answer the other.
  - **Readers** (`usageRowsSQL` / `splitUsageRange` in `verification_usage_hourly.go`):
    - Whole covered hours come from the rollup.
    - Raw `verifications` answers the rest: the edges before the first and after the last
      whole hour, anything below `covered_from`, and any hour that holds a dashboard window
      edge.
    - Results equal the old SQL: 18/18 oracle cases (ev-005). So reads stay exact wherever
      `covered_from` sits.
    - If the state table is missing (42P01) or has no row, coverage is zero and every read is
      raw, as before the change.
  - **Migration 065 seed:** `covered_from = GREATEST(current hour, hour of MAX(created_at)) +
    1 h`, set under `lock_timeout = 1s` and `statement_timeout = 1s`. If it cannot get the
    lock within 1 s, the boot fails and ECS retries it.

  ## Backfill

  - `runUsageRollupBackfillLoop` in `cmd/main.go` runs in every API task and calls
    `BackfillUsageHour`.
  - Each step:
    1. Takes `pg_try_advisory_xact_lock(hashtext('verification-usage-hourly-backfill'))` in a
       lock-only transaction.
    2. Opens one REPEATABLE READ transaction and finds the newest verification below
       `covered_from`. Its hour is `h`.
    3. Skips the step unless `h + 1h + 5 min <= now`. This is the 5-minute quiet window.
    4. Deletes rollup rows in `[h, covered_from)`.
    5. Inserts the raw aggregate for that range.
    6. Sets `covered_from = h`.
  - Empty gaps are skipped in one step.
  - **Tasks take turns.** Only the task holding the lock steps, and the others try again once
    a minute. A racing insert (40001 or 23505) is treated as "not this time".
  - **Data fixes:** a trigger UPDATE or DELETE takes the same advisory lock **shared**, so a
    data fix and a backfill step exclude each other. Review found the double count this
    prevents. RED: ev-004. Regression test: `TestBackfillUsageHourDoesNotRaceDataFixes`.
  - **Env:**
    - `USAGE_BACKFILL_ENABLED` (default `true`). `false` stops the loop. Coverage stays where
      it is, and reads stay exact but read more raw.
    - `USAGE_BACKFILL_PAUSE` (default `1s`) between steps that advance.

  ### Reading the backfill logs (`/ecs/slip-api-*`)

  - `verification usage backfill progress` (Info) is logged every 24 hours **this task**
    rebuilt, with `hours_rebuilt` and `covered_from`.
  - `verification usage backfill paused` means a step did nothing after this task had rebuilt
    at least one hour. It resets this task's `hours_rebuilt` to 0. **"paused" does not mean
    "done".**
  - `verification usage backfill step failed; retrying` (Warn) is logged only for errors other
    than 40001/23505. The next try comes a minute later.
  - `hours_rebuilt` counts per task and resets on every pause, so do not add it up across log
    streams. `covered_from` is the global progress.
  - **Worked example (ev-009):** three task streams interleave. At 20:12:55Z one task logs
    `progress` at 96 hours and then `paused` at 96 a second later, while another task
    continues from there.
  - **Silence is not completion.** `BackfillUsageHour` returns zero with **no log line** in
    five cases:
    1. the lock was not won;
    2. there is no state row;
    3. no row is below `covered_from` (`newest == nil`, the only case that means done);
    4. the hour is too recent;
    5. a 40001 or 23505 error.
  - **Authoritative state** (read-only):
    - `SELECT covered_from FROM verification_usage_hourly_state;`
    - `SELECT MAX(created_at) FROM verifications WHERE created_at < '<covered_from>';`

    NULL from the second query means history is covered.
  - **First step timing:** the first step can start only 5 minutes after the cutover hour ends.
    - On prod: migration at 19:47:37Z, so `covered_from` started at 20:00Z, and the first
      step ran just after 20:05:00Z for hour 19:00Z.
    - The first log line, at 20:05:30Z, already shows 24 rebuilt hours.
    - Worst case: about 65 minutes after the migration, when a deploy lands just after the
      hour.

