  # Parallel Migrations Claiming One Number — The Later One Renumbers Upward

  ## Rule

  - When two migrations claim the same number, the one already on `main` keeps it.
  - The later one renumbers to the next free number above everything on `main` and above
    everything applied on any environment.
  - It bumps any file-count pin in the same commit.
  - Operator decision for slip-api, 2026-10-25: "Merge #92 first; #85 must renumber its
    migration to 066 and set TestGooseSQLFiles to 66 before it merges."

  ## Why it matters (depends on the runner)

  - **Versioned goose Provider (slip-api).**
    - `migrations/run.go` builds `goose.NewProvider` (v3.24.3) without
      `WithAllowOutofOrder`.
    - Two files with one version make `NewProvider` fail with `found duplicate migration
      version`, and `cmd/main.go` exits with `log.Fatalf("migrations: …")`. Every new task
      then fails to boot.
    - A lower number that arrives after a higher one is already applied fails with `missing
      (out-of-order) migration`.
    - So renumber **upward**.
  - **Git does not flag it.** Two different file names with one number merge with no
    conflict.
  - **slip-api has no CI on pull requests.** Its only workflows run on pushes to `staging`
    and `prod`, and they do not run `go test`. So `TestGooseSQLFiles`, the file-count test,
    is the only guard, and it runs only when a developer runs it locally.
  - **The count pin itself drifts.** Per TASK-VS-047 ev-014, it was stale after two migration
    commits:
    - `ff900dc` (2026-10-15): 60 files, the test expected 59.
    - `7cc0e51` (2026-10-22): 64 files, the test expected 63.

    A failing count is therefore not a reliable collision signal.
  - **Replay-all runners (Games Labs Missions and Game).** Both files run by filename, so a
    duplicate number does not crash. Missions renamed its duplicate anyway, to avoid
    confusion.

  ## Worked cases (slip-api, four days apart)

  1. **`060`, 2026-10-22** (TASK-VS-047 ev-013 and ev-014).
     - Commit `7cc0e51` added `migrations/060_user_session_version.sql` while
       `060_package_popular_highest_descriptions.sql` already existed.
     - It left `TestGooseSQLFiles` expecting 63 with 64 files in the tree.
     - Later that day `2e303ea` renamed the file to `064_user_session_version.sql`. That moved
       it upward, past 061–063, which were already on `main`.
  2. **`065`, 2026-10-25** (TASK-VS-048).
     - PR #92 (`065_verification_usage_hourly.sql`) and the open PR #85 both used `065`.
     - #92 merged first.
     - On #85's branch, `0adf9ad` merged `main` and `d80825e` renamed the file to
       `066_admin_day_aggregate_invalidations.sql` (SQL unchanged), with `TestGooseSQLFiles`
       set to 66.
     - On a throwaway `postgres:18.3`, the migrations and repositories packages passed (56
       tests), and `goose_db_version` shows 64, 65 and 66 applied in order.
     - #85 is mergeable and not merged.

  ## Check before merging a migration PR

  - List `migrations/` on `origin/main`, `origin/staging` and `origin/prod` for the number.
  - Look for open PRs that add the same prefix.
  - After a rebase, run `go test ./migrations/` locally. No CI will run it.
  - A possible stronger guard, not implemented: a DB-less test that fails on duplicate
    numeric prefixes, so it does not depend on a hand-maintained count.

