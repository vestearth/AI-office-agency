summary: |
  Implemented TASK-EAR-082 backend and frontend support for Monthly check-in
  future-month default templates.

  Backend adds mission_config.check_in_template, reads it through MissionConfig,
  persists it with a targeted writer, seeds unconfigured future month reads from
  the template without creating campaign rows, and backfills the template from
  the current active campaign when unset. Both admin config handlers now accept
  check_in_template patches.

  Frontend adds check-in template API support, a pure template-to-month summary
  helper, Setting Default -> Monthly template save/load, and Monthly board
  synthesis for absent future months with Configured/Default source badges.
