  - phase: in_review -> in_review
    agent: reviewer
    at: '2026-07-29'
    reason: >-
      Codex review (knowledge-reviews/20260729T072642Z-...) flagged that
      unrecognized categories are warning-and-skip while config-save
      regeneration is best-effort, so an operator could get a successful
      save while a generated mission silently disappears. I initially
      doubted the stronger half of that claim and traced it instead of
      dismissing it — the review was RIGHT and worse than stated:
      resolveSelectedDefaults treats a missing defaults entry as "not
      configured" and continues, which can empty `resolved`, which makes
      BuildDaily/WeeklyInputForDate return ok=false, which
      RegenerateDaily/WeeklyDue interprets as "nothing scheduled anymore"
      and DELETES the existing schedule-generated plan (daily
      schedule_generator.go:604-614, weekly ~:678-684). Since that path
      runs on every config PUT and only logs failures, saving a config with
      an unrecognized category could silently destroy existing future
      plans and still return success — a data-loss regression introduced by
      my own first-round fix, not a pre-existing one. Fixed by making the
      rejection explicit data (new RejectedDefaults map) that
      resolveSelectedDefaults converts into an ErrInvalidInput, so it
      travels the pre-existing err!=nil path (log + skip the date, delete
      nothing) rather than the ok=false path — reusing the distinction the
      regenerate loops already made instead of adding a new one. Verified
      myself, not on the implementer's report: confirmed the rejected check
      sits BEFORE the absent-entry skip (:195), re-ran build/vet/full
      suite, and ran the new regression tests uncached — including sqlmock
      tests asserting no DELETE is issued for daily and weekly. Residual
      open question left to the operator (not silently decided): whether
      to ALSO reject at config-save time so the operator sees the error in
      the UI; the data-loss risk is closed either way.
