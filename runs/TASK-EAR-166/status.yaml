      by executing both mappings over every canonical code and label form:
      SLOT is the ONLY one of the five whose canonical code (SLOTS)
      differs from the singular label the switch expects, so the canonical
      code itself breaks while CRASH/ARCADE/MINIGAME/CARD round-trip
      cleanly — which is exactly why the single real offending staging row
      is SLOTS, and why this stayed invisible. The epic's original
      SLOT-vs-SLOTS mismatch was relocated into the generator, not
      eliminated. Scoped to include the ownership split (Game treats
      categories as admin-extensible rows per migration 030; Missions
      hardcodes five) since otherwise a sixth category silently
      reintroduces the same bug. Claude advisory lane.
