summary: |
  Finished the remaining TASK-EAR-345 slices after the User/Wallet/Game stamp PRs.
  Game now fans vip_level.changed and succeeded user.vip_level.set to every ECS
  replica through an exclusive auto-delete queue, and caches gameplay.coin_thb
  from Wallet GetRateCatalog on the existing gRPC target (not HTTP :8080).
  shared-lib adds optional GameplayLogDetail vip_level and win_loss_thb.
  Logs maps those from the stored payload (THB presence is the JSON key).
  Backoffice shows them; absent stays dash. Logs/gateway still need a published
  shared-lib pin before Logs #28 can merge.
