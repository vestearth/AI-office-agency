summary: |
  Added mock-only Weekly and Monthly "Setting Default" pages mirroring the daily
  Settings UX (Mission + Schedule tabs, snapshot/rollback edit, useAdminSaveFeedback).
  Extended app/data/mock.ts with weekly/monthly default-mission and schedule seeds shaped
  from TASK-105 ui-reference captures. Generalized the missions board "Setting Default"
  button in index.vue to route daily -> /missions/edit, weekly -> /weekly/settings,
  monthly -> /monthly/settings. No API/backend calls; TODO(api) seams left for Claude.
  Monthly Mission tab uses Daily Reward + Bonus Reward (per monthly edit reference)
  rather than the four condition-type tabs used by daily/weekly.
artifacts:
  - path: Games-Labs-backoffice/app/data/mock.ts
    action: modified
    description: >-
      Weekly/monthly default-mission and schedule types + mocks
      (mockWeeklyDefaultMissions, mockWeeklyMissionSchedule,
      mockMonthlyDefaultMission, mockMonthlyMissionSchedule, option arrays).
  - path: Games-Labs-backoffice/app/pages/admin/manage/missions/weekly/settings.vue
    action: created
    description: >-
      Weekly Setting Default page — Mission tab (DefaultMissionForm) + Schedule tab
      (weekday start/end, value bonus, mission selection). Route
      /admin/manage/missions/weekly/settings.
  - path: Games-Labs-backoffice/app/pages/admin/manage/missions/monthly/settings.vue
    action: created
    description: >-
      Monthly Setting Default page — Mission tab (daily + bonus rewards) + Schedule tab
      (day-of-month start/end times). Route /admin/manage/missions/monthly/settings.
  - path: Games-Labs-backoffice/app/pages/admin/manage/missions/index.vue
    action: modified
    description: >-
      "Setting Default" button now renders for daily, weekly, and monthly; goSetting()
      routes to the correct settings page per tab.
