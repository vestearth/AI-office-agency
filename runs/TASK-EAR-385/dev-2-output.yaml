summary: |
  shared-lib PR #89 is merged into main as 16b09af4c4fa9e8a3cdde5928779df0493cf3696.
  Published v0.0.0-20261008012017-16b09af4c4fa was downloaded and pinned in Game
  and gateway with matching go.mod/go.sum and no replace. TASK-EAR-384 preserved.
  Game owns game_favorites via 033 migration plus embedded boot registration.
  Set/clear locks the game row before checking relation existence and validating
  a new save, serializing concurrent absent/present writes. Provider validation
  runs only for new saves; mutation has a five-second deadline. This coarse lock
  serializes different users on the same game and its latency under live provider
  load is not verified. Count/page use one repeatable-read snapshot.
  Favorites retains unavailable/locked saved games with explicit playability;
  lookup failures surface errors. New saves require active game/provider and
  honor trusted provider scope, but do not require level access or grant access.
  Six public shared Game response paths use caller-scoped batch enrichment.
  Frequently/Last paths are self-only before querying; missing, partial and
  duplicate identity metadata fail. Gateway production middleware strips spoofed
  identity, enforces auth and preserves JSON boolean presence.
  GetGameByID previously inherited UnimplementedGameServiceServer; implemented
  its existing service lookup and enrichment. New real-Postgres integration
  exposed nullable image_url scan failures in affected detail/catalog/history
  queries (ev-015); minimal COALESCE fix passed (ev-017 and final suites).
  Existing service test stub gained explicit favorites methods without weakening
  or removing tests. Existing Postman content was preserved exactly; five new
  requests and Mobile handoff added.
  Operator merged Game PR #45 as 902054b263e945fae2ca65be4e941146813649c7 and gateway PR #85 as 51b5ae2f767cbd83cdba217607b9e66c3f34cbe9. Successful staging workflows and healthy matching Game :77 / gateway :127 verified in ev-035. Real admin-account smoke passed 107 checks including six-path favorite propagation, set/clear/repeat, real re-login persistence, paging/errors/auth/forged metadata (ev-032); original state restored. New save on an existing inactive game rejected 4007 with no persisted relation (ev-034). No existing level-locked fixture for this account. Task remains in_review for independent sign-off and two ordinary-player / saved-unavailable lifecycle acceptance.
