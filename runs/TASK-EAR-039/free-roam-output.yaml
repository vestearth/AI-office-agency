files_changed:
  - path: app/pages/admin/manage/missions/monthly/settings.vue
    changes:
      - "Imported useAdminMissionApi + CheckInConfig type; instantiated api; added DailyMissionCurrency type import."
      - "Added campaignMonth ref ('' until a live config loads)."
      - "Added currencyToApi / apiToCurrency converters (Diamond<->DIAMOND, Coin/Point->COIN, else Coin)."
