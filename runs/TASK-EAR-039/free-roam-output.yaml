mapping_implemented:
  daily_reward:
    "store.dailyReward + store.dailyRewardCurrency": "daily_reward { amount, currency }"
  milestones:
    "store.bonusRewards[] {day, value, currency}": "milestones[] { day, reward:{amount,currency}, enabled:true } — day mapped directly (plain integer, no EOM label on this page)"
  currency_conversion:
    to_api: "Diamond -> DIAMOND; Coin and Point -> COIN"
    from_api: "DIAMOND -> Diamond; else Coin"
  campaign: "month = campaignMonth, status:'active', timezone:'Asia/Bangkok'"

