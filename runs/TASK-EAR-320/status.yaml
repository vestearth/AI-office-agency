next_action:
  agent: dev
  description: >-
    user_profiles.lifetime_ggr has NO writer. Migration 009
    (Games-Labs-User/migrations/009_user_profiles_lifetime_ggr.sql) adds the
    column BIGINT DEFAULT 0 and every other reference is a read: profile.go
    (GetByUserID), user.go ListPlayers JOIN, userhdl/grpc.go:67 (mobile
    GetProfile userpb.lifetime_ggr), adminuserhdl/grpc.go:124 (admin list
    item) and :154 (admin detail). Same shape as TASK-EAR-318's
    lifetime_topup, but NO service exposes a lifetime GGR anywhere: a
    word-boundary grep for "ggr" across Game, Logs, Provider, Wallet and
    shared-lib finds only these User/proto fields ("aggregate" matches are
    false positives - do not repeat that mistake). So the admin player list
    column "Lifetime GGR" (backoffice PlayersListTable.vue key lifetimeGgr),
    the admin detail and the mobile profile all show 0 for every player on
    staging today.
    WHERE THE NUMBER CAN COME FROM (verified in source): Games-Labs-Game
    Postgres round_lifecycles has per-round user_id, settled_at,
    settled_amount (migration 021: authoritative gameplay turnover at
    settlement, NULL when the turnover.settled rail was skipped) and
    win_amount (migration 032: gross round payout >= 0, NULL = not
    captured; indexed by user_id). Per-player GGR = SUM(settled_amount) -
    SUM(win_amount) over settled rounds. Two honesty limits that must be
    surfaced, not hidden: win_amount exists only for providers in
    WIN_CAPTURE_PROVIDERS (win-capture Phase B, staging since 2026-08-01;
    check the live env before assuming) and only for rounds since capture
    started, so this is "GGR since win capture, captured providers only",
    not lifetime; and both columns are DOUBLE while userpb.lifetime_ggr is
    int64 (monitoringpb carries lifetime_ggr_coin/lifetime_ggr_thb as
    double) - pick the unit (coin) and the rounding once and write it down.
    Logs/ClickHouse is NOT a better source: its report RPCs return
    PartialData=true with reason "not authoritative" and it has no per-player
    GGR read.
    DECIDE BEFORE CODING, with the reason written down, and apply the
    TASK-EAR-318 lesson - read-through beat projection because the source
    already exists and a projection drifts silently:
    (a) projection: Game publishes player.activity.v1 per settled round
        (shared-lib/events/player_activity.go carries SettledAmount; check
        whether WinLossAmount/win is on the event - the settle path comment
        says WinLossTHB stays empty) and User would consume it, keyed by
        round_id for idempotency. Needs a new User consumer, a dedupe table,
        and cannot backfill rounds that settled before the consumer existed
        without reading Game's table anyway. Not recommended.
    (b) read-through from Game: add an S2S RPC to admingamepb (e.g.
        ListPlayerGGR(user_ids <= 100) -> {user_id: ggr_coin} plus an
        all-players total) backed by one GROUP BY over round_lifecycles
        WHERE win_amount IS NOT NULL, NO http binding (S2S only; api-gateway
        needs no bump because the wire surface is unchanged, but User and
        Game need the shared-lib bump). User already holds a Game gRPC lane
        (gameadt, GAME_API_URL, forwardOutgoingContext with staff metadata),
        so wire ListPlayers/PlayerSummary/GetProfile to it exactly as
        EAR-318 did with Wallet: one call per page, fail closed on error
        (never 0), repository stops reading the dead column.
        RECOMMENDED.
    (c) drop the column and the fields: only if product says GGR is not
        wanted on these screens; note userpb.lifetime_ggr is a mobile-facing
        field, so removing it is a client contract change.
    PRODUCT QUESTION TO SETTLE FIRST (blocks (b) for the mobile path only):
    userpb.GetProfile exposes lifetime_ggr to the player on /api/v1/users/me.
    Showing a player their own lifetime house edge is a product decision;
    admin surfaces are not in doubt. Until answered, wire the admin list and
    detail and leave the mobile field at 0 with that stated, or get the
    answer and wire all three.
    SWEEP: this closes the second of two no-writer columns from migrations
    009/010. Grep user_profiles for any other DEFAULT-only column with no
    writer before closing, so a third one is not found by accident later.
    VERIFY: regression tests seen RED first (Game repo SQL against a real
    PostgreSQL fixture with captured and uncaptured rounds, as EAR-307/318
    did with WALLET_REPO_TEST_DSN; User list/summary/detail fail-closed);
    then through the gateway with a staff bearer: /api/v1/admin/user?search=
    <devtest> must show a non-zero lifetimeGgr for a player with captured
    rounds and the admin detail must show the same number; grep raw bodies.
    Deploy Game first (RPC is additive), User second. Prod not in scope.
