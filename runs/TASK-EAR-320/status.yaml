  description: >-
    Closed on staging 2026-09-05, admin surfaces only (operator decision:
    wire admin first; the mobile GetProfile lifetime_ggr stays 0 and is
    recorded as an open product question). PROBLEM: user_profiles
    .lifetime_ggr (migration 009) has no writer, so the admin player list
    column, the admin detail and the mobile profile showed 0 for everyone;
    no service computed GGR at all. SOURCE: Game Postgres round_lifecycles
    (settled_amount, win_amount, reversed_at).
    SHIPPED, option (b) read-through like TASK-EAR-318: shared-lib PR 66
    (merge 608e403, module v0.0.0-20260904165347-608e403d46b9) adds S2S
    AdminGameService.ListPlayerGGR with NO http binding (api-gateway
    untouched, buf breaking passes, ev-001). Game PR 34 (merge 5ec8915,
    Deploy STAGING 33897890440 success, ECS image staging-sha-5ec8915
    COMPLETED, ev-012) implements it: GGR = ROUND(SUM(settled_amount) -
    SUM(win_amount)) over non-reversed rounds WITH a captured win_amount,
    whole coin, house-positive; uncaptured rounds contribute nothing;
    staff USER_MANAGEMENT or GAME_MANAGEMENT; ids <= 100. User PR 24
    (merge cc0918e, Deploy STAGING 33898358998 success, ECS image
    staging-sha-cc0918e COMPLETED, ev-013): ListPlayers takes the page's
    GGR in one Game call, admin GetUser takes the same read, both fail the
    request on a Game error, repository stops reading the dead column on
    the list path; GetProfile untouched.
    EVIDENCE: RED first on Game (ev-002) and User (ev-007), GREEN incl.
    real PostgreSQL 16 through Game's boot migration sequence (ev-003),
    full suites Game (ev-005; ev-004 failed only because the goose-lane
    tests parse GAME_TEST_DATABASE_URL as a URL and a keyword/value DSN was
    passed - migrations untouched) and User (ev-010). LIVE (ev-011 -> ev-014),
    same requests, staff bearer: admin list lifetimeGgr "0" -> "3133391"
    for devtest, admin detail "0" -> "3133391" (list and detail agree),
    lifetimeTopup unchanged at 1063; mobile /users/me still lifetimeGgr
    "0" as intended. devtest has captured rounds (player-activity shows
    e.g. Seraph 59/59 captured), so the non-zero is real, not a fixture.
    Note for BO/mobile: int64 fields arrive as JSON strings ("3133391").
    NOT verified: the 3,133,391 figure against Game's database rows (no DB
    access; the SQL is proven on a fixture, the live number is proven
    non-zero and consistent across two surfaces), and the fail-closed path
    against a real Game outage (unit only). Production NOT patched.
    HONESTY LIMIT, must reach product/BO: the column now means "GGR since
    win capture, captured providers only" (WIN_CAPTURE_PROVIDERS), not
    lifetime; the label in the backoffice still says Lifetime GGR.
    SWEEP of user_profiles columns added by migrations (write statements in
    User non-test Go): user_profiles.display_name_change_count write-statements=0; user_profiles.exp write-statements=7; user_profiles.level write-statements=15; user_profiles.lifetime_ggr write-statements=0; user_profiles.lifetime_topup write-statements=0. a line-based grep also reported
    display_name_change_count as 0, but profile.go:115 increments it in a
    multi-line UPDATE, so lifetime_topup and lifetime_ggr were the only
    writer-less columns; level/exp/display_name_change_count have writers.
    FOLLOW-UPS, not folded in: mobile lifetime_ggr product decision; drop
    both dead columns with their own migration after prod; the backoffice
    "Lifetime GGR" label vs the captured-only definition.
