summary: |
  Implemented option 2 (TASK-EAR-114): Games-Labs-Wallet Credit/Debit HTTP handlers now
  return a semantic status for typed errors instead of a blanket 400. Added
  walletServiceHTTPStatus(err) in internal/core/handlers/wallethdl/wallet_handler.go and
  wired the Credit and Debit service-error branches to it:
    - typed MetaError -> errormsg.HTTPStatusFromError (insufficient diamond 6014 -> 402,
      insufficient coin 6002 -> 409)
    - non-MetaError service error -> 400 (unchanged)
    - input-validation 400s (invalid JSON / bad currency / non-positive amount) unchanged.
  Matches the redeem handler precedent (already 402 for InsufficientPoints) and lets the
  Missions client (option 1 / TASK-EAR-113) map insufficient balance by status code
  instead of the "insufficient" body-text heuristic.
