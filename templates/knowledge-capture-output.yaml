note_patch: |
  # Status File Locking

  ## Problem
  Concurrent status/meta writes can lose events.

  ## Decision
  Serialize status/meta writes behind a per-task flock.

  ## Evidence
  concurrent-status-writes.sh preserved 40/40 events.

