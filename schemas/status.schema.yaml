# NOT loaded at runtime. The canonical runtime validator is validate-yaml.rb
# (rules are hardcoded in Ruby); this schema is documentation/tooling only.
# tests/integration/schema-validator-parity.sh keeps the two in sync. (S7)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sparqlab.local/ai-dev-office/schemas/status.schema.yaml"
title: AI Dev Office Status Schema
description: >
  Validation schema for `runs/<task-id>/status.yaml`. This captures task state,
  assignment, iteration tracking, and transition history used by the workflow.
type: object
additionalProperties: false
required:
  - task_id
  - phase
  - iteration
  - current_agent
properties:
  task_id:
    type: string
    pattern: "^TASK(?:-[A-Z][A-Z0-9]*)?-[0-9]+$"
  phase:
    type: string
    enum:
      - pending
      - blocked
      - assigned
      - assigned_parallel
      - review
      - in_review
      - debugging
      - debugging_complete
      - devops_needed
      - devops_complete
      - escalated
      - free_roam_complete
      - validation_failed
      - done
      - aborted
  state:
    type: string
    enum:
      - pending
      - blocked
      - assigned
      - assigned_parallel
      - review
      - in_review
      - debugging
      - debugging_complete
      - devops_needed
      - devops_complete
      - escalated
      - free_roam_complete
      - validation_failed
      - done
      - aborted
  iteration:
    type: integer
    minimum: 0
  free_roam_entries:
    type: integer
    minimum: 0
    description: Completed free-roam passes (non-resettable). Drives the free-roam halt guard.
  validation_failed_retries:
    type: integer
    minimum: 0
    description: Times the task entered validation_failed (non-resettable). Drives the validation-failed halt guard.
  last_synced_output:
    type: object
    description: Fingerprint of the last agent output synced (M2 idempotency guard).
    additionalProperties: true
  current_agent:
    anyOf:
      - type: "null"
      - type: string
        enum:
          - pm
          - dev
          - dev-2
          - reviewer
          - debugger
          - devops
          - free-roam
          - done
  assignment:
    type: object
    additionalProperties: false
    required:
      - primary
      - parallel
    properties:
      primary:
        type: string
        enum:
          - pm
          - dev
          - dev-2
          - reviewer
          - debugger
          - devops
          - free-roam
      parallel:
        type: boolean
  created_at:
    type: string
  updated_at:
    type: string
  # Idempotency marker for driver-side decision reconcile: the decided_at of the
  # most recent human decision already applied to this task's workflow.
  decision_applied_at:
    type: string
  ready:
    type: boolean
  blocked_on:
    type: array
    items:
      type: string
      pattern: "^TASK(?:-[A-Z][A-Z0-9]*)?-[0-9]+$"
  waiting_for:
    type: array
    items:
      type: string
  branches:
    type: object
    description: >
      Optional Phase 1C branch state. A blocked branch does not block a ready
      sibling. All declared branches must be done or na before task done.
      Written through scripts/update-task-branch.rb; branch state does not
      select a runner or authorize an action.
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-z0-9_]*$"
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - state
        - actor
        - reason
        - updated_at
      properties:
        state:
          type: string
          enum:
            - ready
            - blocked
            - done
            - na
        actor:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        updated_at:
          type: string
          minLength: 1
        waiting_for:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              state:
                const: blocked
          then:
            required:
              - waiting_for
          else:
            not:
              required:
                - waiting_for
  completion_gates:
    type: object
    description: >
      Optional (issue #28, Phase 1A). Declared completion gates. A gate that is
      present is required: the task cannot transition to `done` while any gate
      is `pending`. `pass` and `na` require actor, reason and updated_at.
      `evidence_refs` are optional; when present each id must resolve in the
      task's evidence.yaml. Written only through scripts/update-completion-gate.rb.
      Phase 1A does not verify actor identity or independence.
    propertyNames:
      pattern: "^[a-z][a-z0-9_]*$"
    additionalProperties:
      type: object
      required:
        - status
      allOf:
        - if:
            required:
              - status
            properties:
              status:
                enum:
                  - pass
                  - na
          then:
            required:
              - actor
              - reason
              - updated_at
            properties:
              actor:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 1
              updated_at:
                type: string
                minLength: 1
      properties:
        status:
          type: string
          enum:
            - pending
            - pass
            - na
        actor:
          type: string
        reason:
          type: string
        updated_at:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
            pattern: "^ev-[0-9]{3,}$"
        requires_authorization:
          type: string
          enum:
            - deploy_staging
            - deploy_production
            - production_data_mutation
            - production_backfill
            - live_load
            - external_side_effect
          description: >
            Set only at declare; immutable; preserved on every transition. Binds
            the gate to an authorization (issue #28, Phase 1B.1).
        authorization_refs:
          type: array
          items:
            type: string
            pattern: "^authz-[0-9]{3,}$"
        authorization_through:
          type: string
          pattern: "^authz-[0-9]{3,}$"
          description: >
            The authorization ledger's high-water id observed when the gate was
            passed (append-order snapshot). Absent on na.
  handoff:
    type: object
    additionalProperties: false
    required:
      - from
      - to
      - artifact
    properties:
      from:
        type: string
        enum:
          - pm
          - dev
          - dev-2
          - reviewer
          - debugger
          - devops
          - free-roam
          - done
          - orchestrator
      to:
        type: string
        enum:
          - pm
          - dev
          - dev-2
          - reviewer
          - debugger
          - devops
          - free-roam
          - done
      artifact:
        type: string
  history:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - phase
        - agent
        - reason
      properties:
        phase:
          type: string
          description: Human-readable transition string such as `pending -> review`.
        agent:
          type: string
          enum:
            - pm
            - dev
            - dev-2
            - reviewer
            - debugger
            - devops
            - free-roam
            - orchestrator
        reason:
          type: string
        at:
          type: string
          description: ISO-8601 UTC timestamp of the transition (N1; present on newer entries only).
  pm_output:
    type: object
  dev_output:
    type: object
  reviewer_output:
    type: object
  debugger_output:
    type: object
  devops_output:
    type: object
  free_roam_output:
    type: object
  planner_output:
    type: object
  tester_output:
    type: object
