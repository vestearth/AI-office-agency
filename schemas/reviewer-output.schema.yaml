# NOT loaded at runtime. The canonical runtime validator is validate-yaml.rb
# (rules are hardcoded in Ruby); this schema is documentation/tooling only.
# tests/integration/schema-validator-parity.sh keeps the two in sync. (S7)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sparqlab.local/ai-dev-office/schemas/reviewer-output.schema.yaml"
title: AI Dev Office Reviewer Output Schema
description: >
  Agent-specific schema for `reviewer-output.yaml`. Extends the base handoff
  contract with review verdict and build/test verification.
type: object
allOf:
  - $ref: "./agent-output.schema.yaml"
required:
  - review_verdict
  - build_check
properties:
  review_verdict:
    type: string
    enum:
      - approved
      - changes_requested
      - escalate
      - infra_failure
  risk_level:
    description: >
      Review depth the change was reviewed at, from the deterministic path rules
      in office.config.yaml (reviewer.risk_rules). Optional: outputs written
      before issue #12 carry no risk_level and stay valid. When present it may
      exceed the computed level but never fall below it.
    type: string
    enum:
      - high
      - medium
      - low
  independent_review:
    description: >
      Evidence that the reviewer inspected the artifacts BEFORE consuming the
      developer's rationale (agents/reviewer.md, Review Order). Optional for
      backward compatibility.
    type: object
    additionalProperties: false
    required:
      - preliminary_assessment
    properties:
      preliminary_assessment:
        type: string
      rationale_reviewed_after:
        type: boolean
      assessment_changed:
        type: boolean
  build_check:
    type: object
    additionalProperties: false
    required:
      - compile
      - tests
      - details
    properties:
      compile:
        type: string
        enum:
          - pass
          - fail
          - skipped
      tests:
        type: string
        enum:
          - pass
          - fail
          - skipped
      details:
        type: string
  transition:
    type: object
    additionalProperties: false
    required:
      - from_phase
      - to_phase
    properties:
      from_phase:
        type: string
        enum:
          - review
          - in_review
      to_phase:
        type: string
        enum:
          - done
          - debugging
          - escalated
          - devops_needed
