# NOT loaded at runtime. The canonical runtime validator is validate-yaml.rb
# (rules are hardcoded in Ruby); this schema is documentation/tooling only.
# tests/integration/schema-validator-parity.sh keeps the two in sync. (S7)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sparqlab.local/ai-dev-office/schemas/meta.schema.yaml"
title: AI Dev Office Meta Schema
description: >
  Validation schema for `runs/<task-id>/meta.yaml`. This captures orchestration
  events such as prompt assembly, runner completion, loop-guard escalation, and
  future runner-switch logs.
type: object
additionalProperties: false
required:
  - task_id
  - events
properties:
  task_id:
    type: string
    pattern: "^TASK(?:-[A-Z][A-Z0-9]*)?-[0-9]+$"
  updated_at:
    type: string
  events:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - type
        - agent
        - details
        - timestamp
      properties:
        type:
          type: string
          minLength: 1
        agent:
          type: string
          enum:
            - pm
            - dev
            - dev-2
            - reviewer
            - debugger
            - devops
            - free-roam
            - done
        details:
          type: string
          minLength: 1
        timestamp:
          type: string
        run_id:
          description: >
            Run that emitted this event (see run-record.schema.yaml). Absent on
            events logged outside a dispatch and on events predating run
            identity, so consumers must tolerate null.
          oneOf:
            - type: "null"
            - type: string
              pattern: "^run-[0-9]{8}T[0-9]{6}Z-TASK(?:-[A-Z][A-Z0-9]*)?-[0-9]+-(pm|dev-2|dev|reviewer|debugger|devops|free-roam)-[0-9a-z]{6}$"