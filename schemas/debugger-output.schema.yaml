# NOT loaded at runtime. The canonical runtime validator is validate-yaml.rb
# (rules are hardcoded in Ruby); this schema is documentation/tooling only.
# tests/integration/schema-validator-parity.sh keeps the two in sync. (S7)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sparqlab.local/ai-dev-office/schemas/debugger-output.schema.yaml"
title: AI Dev Office Debugger Output Schema
description: >
  Agent-specific schema for `debugger-output.yaml`. Extends the base handoff
  contract with root-cause diagnosis metadata.
type: object
allOf:
  - $ref: "./agent-output.schema.yaml"
required:
  - diagnosis
properties:
  diagnosis:
    type: object
    additionalProperties: false
    required:
      - root_cause
      - affected_files
      - confidence
    properties:
      root_cause:
        type: string
      affected_files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - lines
          properties:
            path:
              type: string
            lines:
              anyOf:
                - type: string
                - type: integer
      confidence:
        type: string
        enum:
          - high
          - medium
          - low
      defect_class:
        description: >
          Primary class of the defect (issue #58, docs/workflow-learning.md).
          Optional: diagnoses written before it carry none and stay valid.
        type: string
        enum:
          - missing_tests
          - silent_fallback
          - logic_error
          - regression
          - idempotency
          - wrong_target
          - contract_break
          - stale_context
          - data_migration
          - config_or_environment
          - other
