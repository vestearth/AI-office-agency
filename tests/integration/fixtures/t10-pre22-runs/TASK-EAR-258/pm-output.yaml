  risks:
    - risk: Consumer work can compile locally against uncommitted shared-lib changes but fail in CI or deployment.
      mitigation: Publish shared-lib first, record the pseudo-version, use GOWORK=off for consumer verification, and reject local replace directives as release evidence.
    - risk: The current Order, gateway, and Backoffice checkouts are on unrelated branches with potentially valuable work.
      mitigation: Inspect repo-local status and isolate TASK-EAR-258 work in dedicated branches or worktrees without resetting or overwriting existing changes.
    - risk: Enforcing non-empty code_name in the backend would break updates from old clients and legacy rows.
      mitigation: Keep the protobuf field additive and optional, store an empty legacy default, and leave E-Voucher required-field UX enforcement in Backoffice unless a separate compatibility decision is approved.
    - risk: Adding code_name to a shared response but mapping it only in the admin handler creates inconsistent item shapes across endpoints.
      mitigation: Update and test both admin and regular RedemptionItem mappers that emit orderpb.RedemptionItem.
    - risk: Generated artifacts can drift from their proto sources.
