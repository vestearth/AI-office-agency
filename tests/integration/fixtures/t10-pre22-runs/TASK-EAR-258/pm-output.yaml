description: |
  Persist the Backoffice E-Voucher Code Name end to end. The current Backoffice
  already requires and sends code_name on create/update and hydrates either
  codeName or code_name on edit. The committed shared contract and Order
  persistence path omit the field, so the value is discarded and cannot return
  after reload.

  Add code_name to the admin create/update requests and shared RedemptionItem
  response as additive protobuf fields, regenerate artifacts, publish shared-lib,
  and then adopt that version in Order and api-gateway. Add an Order migration,
  model, repository, and handler mapping so create/update/detail/list round trips
  preserve the value. Historical rows must remain valid with an empty value;
  backend handling must not reject unrelated updates to legacy rows solely
  because Code Name was never stored.

  Current workspace evidence shows uncommitted shared-lib TASK-EAR-258 contract
  work already exists. Preserve and verify that work rather than recreating it.
  The Order, gateway, and Backoffice checkouts are on unrelated branches, so
  implementation must isolate their existing work before editing.
acceptance_criteria:
  - criterion: CreateRedemptionItemRequest code_name=26, UpdateRedemptionItemRequest code_name=27, and orderpb.RedemptionItem code_name=35 are additive and do not change or reuse existing field numbers.
  - criterion: Protobuf Go, Swagger JSON, and embedded Swagger artifacts are regenerated from source and contain the canonical JSON field codeName.
  - criterion: A forward migration adds redemption_items.code_name as non-null text with an empty default, preserving all legacy rows without fabricated backfill values.
  - criterion: Admin create and update requests map the trimmed Code Name through the Order model and persist it in redemption_items.code_name.
  - criterion: Admin list/detail and all mapped shared RedemptionItem responses return the persisted codeName value; legacy rows return an empty value.
  - criterion: Updating unrelated fields on a legacy row succeeds when code_name is empty; the backend does not introduce a new mandatory-field rejection for existing clients.
  - criterion: Creating an E-Voucher with Code Name, saving, reopening Edit, changing the value, saving again, and reloading shows the exact latest persisted value.
  - criterion: Backoffice regression tests prove the existing create payload, detail hydration, and update payload use the supported Code Name field without changing Gift behavior.
  - criterion: Games-Labs-Order and api-gateway consume the published shared-lib pseudo-version with matching go.mod/go.sum and no committed local replace directive.
  - criterion: Focused shared-lib generation/build checks, Order tests, gateway build/tests, and Backoffice tests/typecheck pass; authenticated runtime Save/reload evidence is reported separately from source verification.
