    (internal/core/repositories/auth.go around :230), so every row is
    NULL. Backoffice renders a mock 192.168.1.1 for it today
    (Detail/[id].vue, mock.ts:204).
    Two parts, in order: (1) write ip_address on session creation, taken
    from the request — behind api-gateway the direct RemoteAddr is the
    gateway, so decide and write down how the client IP is derived
    (X-Forwarded-For handling, and which proxy hops are trusted; do not
