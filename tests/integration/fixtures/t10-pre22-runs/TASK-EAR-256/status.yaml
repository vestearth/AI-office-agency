    admin read path as TASK-EAR-255's device info.
    Historical rows stay NULL — the UI must render a blank, not a zero or
    a fabricated value.
    PRIVACY: an IP is personal data. Confirm with the operator that it
    should be stored and shown to admins, and for how long, before
    building the capture side.
