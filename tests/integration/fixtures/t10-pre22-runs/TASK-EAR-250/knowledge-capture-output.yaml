  Knowledge Base/40 Lessons/Every Name In ecs-env.names Is Injected — Non-String Env Vars Kill The Container On Deploy.md
summary: >-
  ECS environment promotion is one three-part contract: config type,
  ecs/env.names, and the current prod-owned workflow export; a set-but-empty
  non-string value defeats envconfig defaults and can crash the container.
