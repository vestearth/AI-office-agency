note_patch: |-
  Record the 2026-08-14 production recurrence: GRPC_PORT was listed in
  ecs/env.names but absent from the prod-only ECS workflow export, so the
  renderer injected an empty string and envconfig failed to parse the int64
  field. Add the successful PR #12 / cc37814 / run 31779732613 recovery and the
  rule to compare config type, env.names, and the current prod workflow after
