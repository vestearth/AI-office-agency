office:
  name: AI Dev Office
  version: "2.0"

agents:
  - id: pm
    prompt: agents/pm.md
    description: Creates tasks, plans implementation, and assigns work to Dev agents
  - id: dev
    prompt: agents/dev.md
    description: Writes and modifies code based on task requirements
  - id: dev-2
    prompt: agents/dev-2.md
    description: Senior Dev for complex, cross-cutting, or multi-service implementations
  - id: reviewer
    prompt: agents/reviewer.md
    description: Reviews code quality, runs tests, and approves or rejects changes
  - id: debugger
    prompt: agents/debugger.md
    description: Investigates root causes of failures and fixes them
  - id: devops
    prompt: agents/devops.md
    description: Manages Docker, CI/CD, deployment, and infrastructure concerns
  - id: free-roam
    prompt: agents/free-roam.md
    description: Senior-level agent that handles ambiguous, complex, or stuck situations

default_workflow: workflows/hybrid-default.yaml

runner_selector:
  priority:
    - codex           # 1st: Codex CLI
    - cursor-agent    # 2nd: Cursor CLI Agent
    - cursor          # 3rd: Cursor IDE (interactive)
  config_dir: runners/
  auto_switch: true
  trigger_patterns:
    - "insufficient_quota"
    - "quota exceeded"
    - "rate limit"
    - "unauthorized"
    - "invalid api key"
    - "token expired"
  retry_before_switch: 2
  log_switch_reason: true

handoff_contract:
  required_fields:
    - summary
    - artifacts
    - next_action
    - blockers
  state_files:
    task: task.md
    status: status.yaml
    meta: meta.yaml

state_model:
  source_of_truth: status.yaml
  audit_log: meta.yaml
  phase_state_must_match: true
  phases:
    - pending
    - blocked
    - assigned
    - assigned_parallel
    - review
    - in_review
    - debugging
    - debugging_complete
    - devops_needed
    - devops_complete
    - escalated
    - free_roam_complete
    - validation_failed
    - done
    - aborted
  reviewer_queue_phase: in_review

dependency_policy:
  machine_readable_fields:
    blocked_on: status.yaml
    waiting_for: status.yaml
    ready: status.yaml
  blocked_dispatch_guard: true
  enforce_current_agent_route: true
  auto_reconcile_before_dispatch: true
  unblock_when_upstream_phase: done
  on_unblock:
    clear_waiting_for: true
    set_ready: true
    route_from_assignment_primary: true

dependency_guard:
  enabled: true
  script: scripts/check-service-dependencies.sh

context_provider:
  enabled: true
  provider: socraticode
  mode: optional
  policy: recorded
  fallback: repo_search
  roles:
    - pm
    - dev
    - dev-2
    - reviewer
    - debugger
    - free-roam

loop_guard:
  max_iterations: 8
  escalate_to: free-roam
  # Times a task may hit validation_failed before run-agent.sh hard-halts it
  # (status_value validation_failed_retries, checked at dispatch). Undocumented
  # here historically (the code default of 3 was the only source); named
  # explicitly now because execution_budget (below) reads the SAME key rather
  # than duplicating it under a different name.
  validation_failed_retry_limit: 3

# #16: non-progress detection, layered on top of (not instead of) loop_guard
# above. scripts/execution-budget.rb is the classifier; see
# docs/execution-budget.md for the full signal list and the "why not a new
# validation-failure key" rationale.
execution_budget:
  enabled: true
  # Logged meta.yaml actions allowed since the last evidence.yaml append
  # before a task is flagged as making no evidence-backed progress.
  max_no_progress_actions: 12
  # Routing target when any signal fires. Only "escalate" is implemented today
  # (routes to the existing `escalated` phase, current_agent free-roam, exactly
  # like the free-roam/max_iterations halts above) — kept as an explicit key
  # rather than a hardcoded constant so a future outcome does not need a new
  # key, only a new value here.
  on_exhausted: escalate

# Independent, evidence-first, risk-based review (docs/reviewer-policy.md).
# Read by validate-yaml.rb and run-agent.sh through scripts/review-gate.rb.
reviewer:
  evidence_policy:
    # warn_only = a missing/stale evidence backing is RECORDED in the run
    #             history but never blocks a verdict. Default, because the
    #             office has no historical evidence records — `required` on day
    #             one would reject every run.
    # required  = an `approved` verdict needs resolvable, in-sync evidence.
    # Flip here, in office.config.local.yaml, or via OFFICE_EVIDENCE_POLICY_MODE.
    mode: warn_only
  # Deterministic path rules, not model judgment. Every trigger is evaluated and
  # the HIGHEST matched level wins; patterns are File.fnmatch globs matched
  # case-insensitively against the normalized artifact path.
  risk_rules:
    default_level: low
    triggers:
      - label: auth
        level: high
        patterns:
          - "**/*auth*/**"
          - "**/*auth*"
          - "**/*token*"
          - "**/*session*"
          - "**/*permission*"
      - label: payment
        level: high
        patterns:
          - "**/*wallet*/**"
          - "**/*wallet*"
          - "**/*payment*/**"
          - "**/*payment*"
          - "**/*billing*/**"
          - "**/*billing*"
          - "**/*payout*"
          - "**/order/**"
          - "**/orders/**"
      - label: public_api_contract
        level: high
        patterns:
          - "**/*.proto"
          - "**/*.pb.go"
          - "**/*.pb.gw.go"
          - "**/api/**"
          - "**/openapi*"
          - "**/swagger*"
      - label: migration
        level: high
        patterns:
          - "**/migrations/**"
          - "**/migrate/**"
          - "**/*.sql"
      - label: ci_workflow
        level: high
        patterns:
          - ".github/workflows/**"
          - "**/.github/workflows/**"
      - label: secrets_config
        level: high
        patterns:
          - "**/.env*"
          - "**/*secret*/**"
          - "**/*secret*"
          - "**/*credential*"
          - "**/*.tfvars"
          - "**/env.names"
      - label: agent_instructions
        level: high
        patterns:
          - "agents/*.md"
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
          - "office.config.yaml"
          - "**/office.config.yaml"
      - label: infrastructure
        level: medium
        patterns:
          - "**/Dockerfile*"
          - "**/*.tf"
          - "**/k8s/**"
          - "**/kustomization.yaml"
          - "**/docker-compose*"
      - label: dependencies
        level: medium
        patterns:
          - "**/go.mod"
          - "**/go.sum"
          - "**/package.json"
          - "**/package-lock.json"
          - "**/Gemfile*"
  # The depth a level selects. `low` requires nothing beyond the base contract,
  # so a docs-only change never pays high-risk cost.
  risk_depth:
    high:
      require_evidence: true
      required_checks: [compile, tests]
    medium:
      require_evidence: true
      required_checks: [compile]
    low:
      require_evidence: false
      required_checks: []

# Task ownership and execution leases (docs/task-ownership.md). One mutable
# owner per task, keyed to the ambient run_id and fenced by a monotonic epoch,
# so a run that lost its lease cannot overwrite the new owner's status.
# A malformed value here REFUSES ownership rather than defaulting silently —
# a silently-defaulted lease is a silently-disabled mutual exclusion.
ownership:
  # Master switch. false disables acquisition AND the fence for anything the
  # driver runs (run-agent.sh exports AI_DEV_OFFICE_OWNERSHIP=off when it sees
  # this), and waiving a live lease is warned about loudly. A status writer
  # invoked outside a dispatch stays armed regardless — it fails safe.
  enabled: true
  # Lease length for one dispatch. 1800s covers a long agent run with margin;
  # the fence self-renews an expired-but-unclaimed lease on every status write,
  # so a slow run never loses its own task — only an explicit reclaim by another
  # run after this window can take it.
  lease_seconds: 1800
  # How often a live dispatch renews its lease in the background. Must be well
  # under lease_seconds so a slow run is never reclaimable while it is alive.
  renew_interval_seconds: 300
  # Cross-task worktree exclusivity: refuse a second mutable execution in a
  # worktree another task already holds. OFF by default and deliberately so —
  # the harness cannot detect which checkout an agent will edit (the cwd probe
  # answers "the office directory" for every task), so enabling this without
  # supplying a real per-task worktree via AI_DEV_OFFICE_WORKTREE serializes
  # the entire office to one task at a time. See docs/task-ownership.md.
  worktree_exclusive: false
  allow_shared_worktree: false

# ── Task input integrity (docs/task-input-integrity.md, issue #22) ───────────
# The reviewer (and every other role) runs as `codex --ask-for-approval never
# exec` with file_write:true and shell_exec:true — nothing on disk stops it
# from rewriting the record it is judged against. This block names the files
# that must survive a dispatch's runner subprocess unmodified (or, for
# append-only ledgers, unmodified except for new entries), so a mismatch is a
# hard, recorded failure instead of a silently-trusted "gaps=0". The whole
# block is protected in scripts/resolve-office-config.rb PROTECTED_PATHS —
# same reasoning as `ownership.enabled`: turning this off is a silent
# weakening, not a fail-closed kill switch, so a gitignored local overlay must
# not be able to touch it.
task_input_integrity:
  enabled: true
  # Byte-identical before/after the runner subprocess. Every file here already
  # has one legitimate writer that runs OUTSIDE this window (see the doc for
  # the per-file argument). Deliberately excludes ownership.yaml: its own
  # epoch-fencing mechanism (docs/task-ownership.md) already protects it, and
  # its background lease-renewer legitimately rewrites it INSIDE this exact
  # window, which would make a naive freeze a false positive on every run
  # longer than renew_interval_seconds.
  frozen_files:
    - status.yaml
    - meta.yaml
    - preflight.yaml
    - evidence-freshness.yaml
    - gateway-events.yaml
  # Append-only ledgers: existing entries must survive verbatim and in the
  # same order; new entries appended DURING this dispatch (e.g. a dev or
  # reviewer recording its own build evidence mid-run via
  # scripts/record-evidence.sh) are legitimate and not a violation.
  append_only_files:
    - path: evidence.yaml
      entries_key: evidence
  # <role>-output.yaml for every role EXCEPT the one currently dispatching —
  # its own output path is legitimately writable; every other role's output is
  # exactly the "upstream record" the four proven escapes rewrote or deleted.
  protect_role_outputs: true
  # runs/<task>/run-records/*.yaml other than the current dispatch's own
  # run_id.yaml. Existence-only (no content hashing): a task accumulates one
  # record per dispatch over its whole life, and content-hashing that
  # unbounded set on every single run would violate the "current relevant
  # files, not all history ever" performance rule. Existence-only still
  # catches the escape-1 shape (silently deleting a prior run's record) at
  # O(current file count) cost; a same-length rewrite of an old record's
  # content is out of scope here (see the doc's "what this does not defend
  # against" section).
  protect_run_records: true

# Policy preflight (docs/policy-preflight.md). A deterministic gate that resolves
# repository policy BEFORE externally-sourced work can trigger a privileged
# dispatch. Free-form external text is CONTEXT, never AUTHORITY: nothing written
# inside an issue, a comment, or a webhook body can raise its own trust, lower a
# sensitivity, grant an approval, or reach any key below. The gate is opt-in — it
# engages only when a caller declares an external source (env
# AI_DEV_OFFICE_INPUT_SOURCE), so an operator-created task is unaffected.
preflight:
  enabled: true
  # Trust attaches to the ORIGIN of an input, never to its content. Any source
  # not listed here — including one this file has never heard of — is untrusted.
  trusted_sources:
    - operator
    - local
  # Role -> the capability a dispatch of that role may exercise. The caller
  # declares the role; a role with no entry here has no known capability and is
  # denied. `auto` is deliberately absent: an external caller must name a
  # concrete role rather than hand the whole pipeline to unreviewed input.
  role_actions:
    pm: comment
    reviewer: read
    dev: mutate_repo
    dev-2: mutate_repo
    debugger: mutate_repo
    devops: deploy
    free-roam: mutate_repo
  default_sensitivity: normal
  # Untrusted work that declares no path scope has an unbounded blast radius, so
  # it is rated at the top of the scale instead of at the default.
  undeclared_scope_sensitivity: critical
  # Same trigger shape as reviewer.risk_rules (#12): glob patterns -> a level,
  # highest level among the matches wins, no match -> default_sensitivity. Kept
  # under its own key so the two rule sets stay separable until they are
  # reconciled onto one classifier (docs/policy-preflight.md, "Convergence").
  sensitivity_rules:
    - level: critical
      description: CI/CD execution surface
      paths:
        - ".github/workflows/**"
        - "**/.github/workflows/**"
    - level: critical
      description: agent and system instructions
      paths:
        - "agents/**"
        - "**/agents/**/*.md"
        - "workflows/**"
        - "**/workflows/**/*.md"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - ".claude/**"
        - "**/.claude/**"
        - ".cursor/**"
        - "**/.cursor/**"
    - level: critical
      description: MCP and plugin configuration
      paths:
        - "**/.mcp.json"
        - "**/mcp*.json"
        - "**/plugins/**"
    - level: critical
      description: secret and credential handling
      paths:
        - "**/.env"
        - "**/.env.*"
        - "**/secrets/**"
        - "**/*.pem"
        - "**/*.key"
    - level: critical
      description: migrations and destructive database operations
      paths:
        - "**/migrations/**"
        - "**/migrate/**"
        - "**/*.sql"
    - level: critical
      description: auth, payment, and security-sensitive code
      paths:
        - "**/auth/**"
        - "**/authz/**"
        - "**/payment/**"
        - "**/payments/**"
        - "**/wallet/**"
        - "**/security/**"
    - level: sensitive
      description: Docker, build, and release configuration
      paths:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/docker-compose*.yml"
        - "**/docker-compose*.yaml"
        - "**/Makefile"
        - ".github/**"
        - "**/.github/**"
        - "**/go.mod"
        - "**/go.sum"
        - "**/package.json"
        - "**/*.lock"
    - level: sensitive
      description: office policy and harness surface
      paths:
        - "**/office.config*.yaml"
        - "**/office.team.yaml"
        - "**/run-agent.sh"
        - "**/validate-yaml.rb"
        - "scripts/**"
        - "schemas/**"
        # a nested install of this framework inside a target project
        - "**/ai-dev-office/**"
    - level: sensitive
      description: public API contract
      paths:
        - "**/*.proto"
        - "**/openapi*.yaml"
        - "**/openapi*.json"
        - "**/swagger*.yaml"
        - "**/swagger*.json"
  # (input trust x sensitivity x action) -> outcome. This table IS the policy:
  # every cell is written down and reviewable rather than inferred at runtime.
  # A lookup that misses at any level — unknown trust, unknown action, unknown
  # sensitivity, or an absent cell — resolves to `deny`, never to allow.
  decision_matrix:
    untrusted:
      read:        {normal: allow,                   sensitive: allow,                   critical: allow}
      comment:     {normal: allow,                   sensitive: allow,                   critical: allow_with_deep_review}
      mutate_repo: {normal: allow_with_deep_review,  sensitive: require_human_approval,  critical: deny}
      execute:     {normal: require_human_approval,  sensitive: deny,                    critical: deny}
      deploy:      {normal: deny,                    sensitive: deny,                    critical: deny}
    trusted:
      read:        {normal: allow,                   sensitive: allow,                   critical: allow}
      comment:     {normal: allow,                   sensitive: allow,                   critical: allow}
      mutate_repo: {normal: allow,                   sensitive: allow_with_deep_review,  critical: require_human_approval}
      execute:     {normal: allow,                   sensitive: allow_with_deep_review,  critical: require_human_approval}
      deploy:      {normal: allow_with_deep_review,  sensitive: require_human_approval,  critical: require_human_approval}

# Event-driven agent gateway (docs/event-gateway.md, issue #19). Normalizes an
# already-received GitHub/CI/tester event into the internal envelope, resolves
# it to a TASK-* id, and enqueues a normal `run-agent.sh` dispatch — composing
# #17 preflight and #14 ownership rather than building a parallel path.
#
# `commands` is the ENTIRE recognized command grammar: the first line of an
# event body must match one of these literal strings byte-for-byte (no case
# fold, no argument parsing, no fuzzy match) to resolve to anything at all. The
# value is the ROLE that command dispatches as; the ACTION that role may
# exercise still comes only from preflight.role_actions (#17) — the gateway
# never declares its own action or path scope, so nothing in an event body can
# widen either. See docs/event-gateway.md for the full grammar and the
# identity-resolution rule.
gateway:
  enabled: true
  commands:
    "/agent investigate": debugger
    "/agent revise": dev
    "/agent validate": reviewer
    "/agent review": reviewer
    "/agent triage": pm

# Multi-user git mode (docs/multi-user-git.md). When enabled, run-agent.sh
# pulls --rebase before intake/dispatch and commits+pushes runs/<TASK-ID>
# (plus office.team.yaml) after every agent step — replacing the manual sync
# ritual. Both hooks soft-fail offline. Flip per-machine in
# office.config.local.yaml or via env OFFICE_GIT_SYNC=1/0.
git_sync:
  enabled: false
